worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  charset utf-8;

  log_format structured escape=json '{'
    '"time":"$time_iso8601",'
    '"remote":"$remote_addr",'
    '"request_id":"$request_id",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"duration":$request_time'
  '}';
  access_log /dev/stdout structured;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  keepalive_requests 500;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 15s;
  client_max_body_size 64k;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  map $sent_http_content_type $content_security_policy {
    default "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
    "text/html" "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'none'; upgrade-insecure-requests";
  }

  server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy $content_security_policy always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), web-share=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      add_header Cache-Control "no-store" always;
      return 200 "ok\n";
    }

    location = /index.html {
      add_header Cache-Control "no-store, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'none'; upgrade-insecure-requests" always;
      try_files $uri =404;
    }

    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location ~ ^/(?:asset-manifest\.json|release-metadata\.json|SHA256SUMS)$ {
      add_header Cache-Control "no-store, max-age=0" always;
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-store, max-age=0" always;
      try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }
  }
}
