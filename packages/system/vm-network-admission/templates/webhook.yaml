apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: vm-network-admission
  annotations:
    cert-manager.io/inject-ca-from: {{ printf "%s/%s" .Release.Namespace "vm-network-admission-serving-cert" | quote }}
webhooks:
  - name: vmnetwork-safety.infrastructure.cozystack.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 5
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: vm-network-admission
        path: /validate-vmnetwork
        port: 443
    rules:
      - operations: ["CREATE", "UPDATE", "DELETE"]
        apiGroups: ["apps.cozystack.io"]
        apiVersions: ["v1alpha1"]
        resources: ["vmnetworks"]
        scope: Namespaced
