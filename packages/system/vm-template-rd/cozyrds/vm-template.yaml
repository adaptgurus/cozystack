apiVersion: cozystack.io/v1alpha1
kind: ApplicationDefinition
metadata:
  name: vm-template
spec:
  application:
    kind: VMTemplate
    singular: vmtemplate
    plural: vmtemplates
    openAPISchema: |-
      {"title":"Chart Values","type":"object","required":["sourceVM"],"properties":{"sourceVM":{"description":"Tenant-local Cozystack VMInstance to capture. The source must be halted and have no active VMI.","type":"string","minLength":1,"maxLength":63,"x-cozystack-options":{"source":"vminstance"}},"mode":{"description":"Copy keeps the source VMInstance. Convert retires it only after the template is verified Ready and the source UID/generation still match preflight.","type":"string","default":"Copy","enum":["Copy","Convert"]},"excludeOpticalMedia":{"description":"Reusable templates always exclude installer, VirtIO-driver, rescue and other CD/DVD media before becoming Ready.","type":"boolean","default":true,"enum":[true]},"description":{"description":"Optional human-readable template description.","type":"string","default":"","maxLength":512}}}
  release:
    prefix: vm-template-
    labels:
      sharding.fluxcd.io/key: tenants
    chartRef:
      kind: ExternalArtifact
      name: cozystack-vm-template-application-kubevirt-vm-template
      namespace: cozy-system
  dashboard:
    category: IaaS
    singular: VM Template
    plural: VM Templates
    description: Reusable tenant virtual-machine templates with safe Copy and Convert workflows
    weight: 51
    tags:
      - compute
      - virtual-machine
      - template
    icon: 
    keysOrder: [["apiVersion"],["appVersion"],["kind"],["metadata"],["metadata","name"],["spec","sourceVM"],["spec","mode"],["spec","excludeOpticalMedia"],["spec","description"]]
  secrets:
    exclude: []
    include: []
