cilium:
  kubeProxyReplacement: true
  # LayerSentry HCI uses Cilium's eBPF datapath for service translation and
  # SNAT/masquerading. Keep the kernel netfilter compatibility substrate, but
  # do not make normal pod/service traffic depend on kube-proxy/iptables.
  bpf:
    masquerade: true
    # Cilium 1.19 defaults this to false. Pin it explicitly so direct-routing
    # deployments use the eBPF host-routing path when the kernel supports it.
    hostLegacyRouting: false
  # Upstream cilium with hostFirewall enabled and the IPv6 datapath disabled
  # (ipv6.enabled=false, the default here) drops ALL node IPv6 before any
  # policy evaluation ("Unsupported L3 protocol", DROP_UNKNOWN_L3 in
  # bpf/bpf_host.c), breaking ICMPv6 Neighbor Discovery and BGP unnumbered on
  # IPv6/L3 fabrics. The cozystack cilium image carries a BPF patch
  # (images/cilium/patches/) that passes IPv6 to the kernel stack instead.
  # Consequence: Cilium host policies apply to IPv4 only; node IPv6 is not
  # filtered by Cilium.
  hostFirewall:
    enabled: true
  hubble:
    enabled: false
  externalIPs:
    enabled: true
  nodePort:
    enabled: true
  loadBalancer:
    algorithm: maglev
    serviceTopology: true
  ipam:
    mode: "kubernetes"
  image:
    repository: ghcr.io/cozystack/cozystack/cilium
    tag: v1.6.2
    digest: "sha256:136a7dfff4d6adcd448424c2354144160028a8e96eb6558b917fd3ee6d7b39fe"
  envoy:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
  gatewayAPI:
    enabled: true
  rollOutCiliumPods: true
  operator:
    rollOutPods: true
    replicas: 1
