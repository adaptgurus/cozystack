apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vm-template-controller
rules:
- apiGroups: ["virtualization.cozystack.io"]
  resources: ["vmtemplateoperations"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["virtualization.cozystack.io"]
  resources: ["vmtemplateoperations/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["virtualization.cozystack.io"]
  resources: ["vmtemplateoperations/finalizers"]
  verbs: ["update", "patch"]
- apiGroups: ["apps.cozystack.io"]
  resources: ["vminstances"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: ["kubevirt.io"]
  resources: ["virtualmachines", "virtualmachineinstances"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["kubevirt.io"]
  resources: ["kubevirts"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["template.kubevirt.io"]
  resources: ["virtualmachinetemplaterequests"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["template.kubevirt.io"]
  resources: ["virtualmachinetemplates"]
  verbs: ["get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vm-template-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vm-template-controller
subjects:
- kind: ServiceAccount
  name: vm-template-controller
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vm-template-controller-leader-election
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vm-template-controller-leader-election
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vm-template-controller-leader-election
subjects:
- kind: ServiceAccount
  name: vm-template-controller
  namespace: {{ .Release.Namespace }}
