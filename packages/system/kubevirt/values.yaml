# CPU oversubscription ratio. When set, propagates to
# spec.configuration.developerConfiguration.cpuAllocationRatio on the
# KubeVirt CR. Driven by .Values.resources.cpuAllocationRatio at the
# platform level.
# cpuAllocationRatio: 10

# Feature gates appended after the static defaults
# (HotplugVolumes/ExpandDisks/LiveMigration/AutoResourceLimitsGate/CPUManager/GPU/VMExport
# plus Snapshot/Template when vmTemplates.enabled=true). VMPersistentState is
# a static HCI default because persistent vTPM/UEFI backend state must survive
# virt-launcher and worker-node replacement.
# Empty by default. Filled by the platform with "HostDevices" when the
# gpu-operator package is enabled with the passthrough variant — the
# admission webhook rejects spec.template.spec.domain.devices.hostDevices
# without that gate even with the GPU gate on, since current KubeVirt
# splits them.
extraFeatureGates: []

# StorageClass used by KubeVirt for per-VM backend state PVCs (persistent vTPM
# and, when enabled in future, persistent UEFI/NVRAM). Each VM receives its own
# backend state; the storage is shared across the cluster through LINSTOR/DRBD,
# not shared between different guests. This preserves VM identity while
# allowing restart on a surviving node after host failure.
vmStateStorageClass: replicated

# Native KubeVirt VM template foundation. Cozystack v1.6 ships KubeVirt v1.8.4,
# where template.kubevirt.io/v1alpha1 is available behind the Snapshot and
# Template feature gates. Keep this capability explicit because the upstream
# Template API is Alpha in v1.8.x. The Cozystack HCI product layer MUST still
# validate Tenant ownership, source VM state, snapshot capability, optical
# media, secrets/generalization and clone ownership before exposing
# Convert-to-Template / Clone-from-Template workflows.
vmTemplates:
  enabled: true

# NetworkAttachmentDefinition name in the cozy-kubevirt namespace to use for
# KubeVirt live-migration transport. Empty keeps KubeVirt on its normal pod
# network. The referenced NAD must provide routable cluster-wide IPs on every
# migration-capable node; NetworkFabric readiness alone does not satisfy that
# requirement. The HCI NetworkFabric controller will only publish/select a
# managed migration NAD after physical topology and IPAM readiness are proven.
migrationNetwork: ""

# Permitted host devices the KubeVirt admission webhook accepts under
# spec.template.spec.domain.devices.hostDevices / gpus on a VirtualMachine.
# Empty by default — leaves the CR's permittedHostDevices unset.
#
# Filled by the platform with NVIDIA PCI vendor:device → resourceName
# pairs (vendor 10DE) when gpu-operator runs in vfio passthrough mode,
# and with mediatedDevices entries when it runs in vGPU mode.
# externalResourceProvider: true is required because the resource names
# are published by gpu-operator's nvidia-sandbox-device-plugin DaemonSet,
# not by KubeVirt itself.
#
# Shape (subset of kubevirt.io/v1 PermittedHostDevices):
#   pciHostDevices:
#   - pciVendorSelector: "10DE:2335"
#     resourceName: nvidia.com/GH100_H200_SXM_141GB
#     externalResourceProvider: true
#   mediatedDevices:
#   - mdevNameSelector: NVIDIA L40S-24Q
#     resourceName: nvidia.com/L40S-24Q
permittedHostDevices: {}

# mediatedDevicesConfiguration for vGPU. Filled by the platform when the
# gpu-operator package runs in vGPU mode; empty otherwise.
#
# Shape (subset of kubevirt.io/v1 MediatedDevicesConfiguration):
#   mediatedDeviceTypes:
#   - nvidia-740   # L40S-24Q
#   nodeMediatedDeviceTypes:
#   - nodeSelector:
#       nvidia.com/gpu.product: NVIDIA-L40S
#     mediatedDeviceTypes:
#     - nvidia-740
mediatedDevicesConfiguration: {}
