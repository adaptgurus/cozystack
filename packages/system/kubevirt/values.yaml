# CPU oversubscription ratio. When set, propagates to
# spec.configuration.developerConfiguration.cpuAllocationRatio on the
# KubeVirt CR. Driven by .Values.resources.cpuAllocationRatio at the
# platform level.
# cpuAllocationRatio: 10

# Feature gates appended after the static KubeVirt v1.8.4 non-GA gates
# (HotplugVolumes/ExpandDisks/CPUManager/VMExport).
#
# GA gates such as LiveMigration, AutoResourceLimitsGate and GPU MUST NOT be
# added here: KubeVirt v1.8.4 treats GA features as always enabled and the
# corresponding feature-gate names as obsolete/redundant.
#
# Empty by default. Filled by the platform with "HostDevices" when the
# gpu-operator package is enabled with the passthrough variant — HostDevices
# remains Alpha in KubeVirt v1.8.4, so passthrough must remain covered by the
# real-lab certification gate.
extraFeatureGates: []

# Explicitly disabled non-GA feature gates. KubeVirt v1.8 keeps Beta features
# disabled by default, but this field exists so future upgrades (notably v1.9+
# where Beta defaults change) can fail closed instead of silently enabling an
# unvalidated capability. A gate must never appear in both this list and
# extraFeatureGates.
disabledFeatureGates: []

# Cluster-wide live-migration limits. These intentionally match KubeVirt's
# documented v1.8 defaults so the chart makes the production envelope explicit
# without silently changing established migration throughput. The template
# separately hard-codes the safety controls disableTLS=false,
# allowAutoConverge=false, allowPostCopy=false, allowWorkloadDisruption=false,
# and unsafeMigrationOverride=false.
migrations:
  parallelMigrationsPerCluster: 5
  parallelOutboundMigrationsPerNode: 2
  bandwidthPerMigration: 64Mi
  completionTimeoutPerGiB: 800
  progressTimeout: 150

# Permitted host devices the KubeVirt admission webhook accepts under
# spec.template.spec.domain.devices.hostDevices / gpus on a VirtualMachine.
# Empty by default — leaves the CR's permittedHostDevices unset.
#
# Filled by the platform with NVIDIA PCI vendor:device → resourceName
# pairs (vendor 10DE) when gpu-operator runs in vfio passthrough mode,
# and with mediatedDevices entries when it runs in vGPU mode.
# externalResourceProvider: true is required because the resource names
# are published by gpu-operator's nvidia-sandbox-device-plugin DaemonSet,
# not by KubeVirt itself.
#
# Shape (subset of kubevirt.io/v1 PermittedHostDevices):
#   pciHostDevices:
#   - pciVendorSelector: "10DE:2335"
#     resourceName: nvidia.com/GH100_H200_SXM_141GB
#     externalResourceProvider: true
#   mediatedDevices:
#   - mdevNameSelector: NVIDIA L40S-24Q
#     resourceName: nvidia.com/L40S-24Q
permittedHostDevices: {}

# mediatedDevicesConfiguration for vGPU. Filled by the platform when the
# gpu-operator package runs in vGPU mode; empty otherwise.
#
# Shape (subset of kubevirt.io/v1 MediatedDevicesConfiguration):
#   mediatedDeviceTypes:
#   - nvidia-740   # L40S-24Q
#   nodeMediatedDeviceTypes:
#   - nodeSelector:
#       nvidia.com/gpu.product: NVIDIA-L40S
#     mediatedDeviceTypes:
#     - nvidia-740
mediatedDevicesConfiguration: {}
