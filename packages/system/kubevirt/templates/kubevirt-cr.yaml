---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: cozy-kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    commonInstancetypesDeployment:
      enabled: false
    {{- with .Values.vmStateStorageClass }}
    # Persistent vTPM/UEFI state belongs to an individual VM, but its backend
    # PVC must be reachable from every virtualization node. The HCI default is
    # the 3-way LINSTOR/DRBD replicated StorageClass.
    vmStateStorageClass: {{ . | quote }}
    {{- end }}
    {{- if .Values.vmTemplates.enabled }}
    # KubeVirt v1.8.x ships the native VirtualMachineTemplate API behind the
    # Snapshot + Template feature gates. Keep the virt-template deployment
    # explicitly enabled so the HCI product can expose a Proxmox-style
    # Convert-to-Template workflow without inventing a parallel disk/template
    # format. The product layer still performs tenant, storage-snapshot and VM
    # state preflight before creating VirtualMachineTemplateRequests.
    virtTemplateDeployment:
      enabled: true
    {{- end }}
    developerConfiguration:
      {{- if .Values.cpuAllocationRatio }}
      cpuAllocationRatio: {{ .Values.cpuAllocationRatio }}
      {{- end }}
      featureGates:
      - DeclarativeHotplugVolumes
      - ExpandDisks
      - LiveMigration
      - AutoResourceLimitsGate
      - CPUManager
      - GPU
      - VMExport
      - VMPersistentState
      {{- if .Values.vmTemplates.enabled }}
      - Snapshot
      - Template
      {{- end }}
      {{- range .Values.extraFeatureGates }}
      - {{ . }}
      {{- end }}
    {{- with .Values.permittedHostDevices }}
    permittedHostDevices:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.mediatedDevicesConfiguration }}
    mediatedDevicesConfiguration:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.migrationNetwork }}
    migrations:
      network: {{ . | quote }}
    {{- end }}
    evictionStrategy: LiveMigrate
    virtualMachineOptions:
      disableSerialConsoleLog: {}
    vmRolloutStrategy: LiveUpdate
  workloadUpdateStrategy:
    workloadUpdateMethods:
    - LiveMigrate
    - Evict
    batchEvictionInterval: 1m
    batchEvictionSize: 10
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
  monitorNamespace: tenant-root
