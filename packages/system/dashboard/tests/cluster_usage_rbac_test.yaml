suite: dashboard cluster-usage and storage-management RBAC
templates:
  - templates/clusterrole-cluster-usage.yaml
  - templates/clusterrolebinding-cluster-usage.yaml

release:
  name: dashboard
  namespace: cozy-dashboard

# Capacity pages are restricted to cozystack-cluster-admin and use a single
# read-only ClusterRole. In addition to node/pod utilisation, Storage Management
# needs cluster-wide PV/PVC/StorageClass/snapshot reads plus GET-only access to
# the certified LayerSentry storage, storage-backend and network inventory
# ConfigMaps. No storage or network mutation verb belongs here.

tests:
  - it: ClusterRole exists and grants nodes/pods get/list/watch
    template: templates/clusterrole-cluster-usage.yaml
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: apiVersion
          value: rbac.authorization.k8s.io/v1
      - equal:
          path: metadata.name
          value: cozystack-dashboard-cluster-usage
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["nodes", "pods"]
            verbs: ["get", "list", "watch"]

  - it: ClusterRole grants read-only PV and PVC visibility
    template: templates/clusterrole-cluster-usage.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["persistentvolumes", "persistentvolumeclaims"]
            verbs: ["get", "list", "watch"]

  - it: ClusterRole grants read-only StorageClass visibility
    template: templates/clusterrole-cluster-usage.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["storage.k8s.io"]
            resources: ["storageclasses"]
            verbs: ["get", "list", "watch"]

  - it: ClusterRole grants read-only VolumeSnapshot visibility
    template: templates/clusterrole-cluster-usage.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["snapshot.storage.k8s.io"]
            resources: ["volumesnapshots"]
            verbs: ["get", "list", "watch"]

  - it: ClusterRole can only get the certified LayerSentry inventory ConfigMaps
    template: templates/clusterrole-cluster-usage.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["configmaps"]
            resourceNames: ["layersentry-storage-inventory", "layersentry-storage-backend-inventory", "layersentry-network-inventory"]
            verbs: ["get"]

  - it: ClusterRole grants metrics.k8s.io nodes get/list
    template: templates/clusterrole-cluster-usage.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["metrics.k8s.io"]
            resources: ["nodes"]
            verbs: ["get", "list"]

  - it: ClusterRoleBinding binds the role to cozystack-cluster-admin group
    template: templates/clusterrolebinding-cluster-usage.yaml
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: apiVersion
          value: rbac.authorization.k8s.io/v1
      - equal:
          path: metadata.name
          value: cozystack-dashboard-cluster-usage
      - equal:
          path: roleRef.kind
          value: ClusterRole
      - equal:
          path: roleRef.name
          value: cozystack-dashboard-cluster-usage
      - equal:
          path: subjects[0].kind
          value: Group
      - equal:
          path: subjects[0].name
          value: cozystack-cluster-admin
      - equal:
          path: subjects[0].apiGroup
          value: rbac.authorization.k8s.io

  - it: each template renders exactly one document
    asserts:
      - template: templates/clusterrole-cluster-usage.yaml
        hasDocuments:
          count: 1
      - template: templates/clusterrolebinding-cluster-usage.yaml
        hasDocuments:
          count: 1
