{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: linstor-gateway
  labels:
    {{- include "linstor-gateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "linstor-gateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
{{- end }}
