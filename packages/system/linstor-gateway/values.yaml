enabled: false

replicas: 2

image:
  repository: ghcr.io/cozystack/cozystack/linstor-gateway
  tag: v2.3.0
  pullPolicy: IfNotPresent

linstor:
  # Cozystack LINSTOR exposes an mTLS REST endpoint. Reuse the client
  # certificate bundle already generated by the linstor package rather than
  # weakening TLS verification for Gateway.
  controllers:
    - https://linstor-controller.cozy-linstor.svc:3371
  clientSecret: linstor-client-tls

gateway:
  listenAddress: ":8337"
  corsAllowedOrigins: []
  tokenSecret:
    name: ""
    key: token

service:
  type: ClusterIP
  port: 8337

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL
