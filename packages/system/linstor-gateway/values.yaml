# The Gateway REST control plane is part of the LayerSentry storage fabric and
# must be available whenever this chart is installed. Protocol provisioning
# remains independently fail-closed in the GUI until agent prerequisites are
# certified; enabling the stateless server does not initialize or modify disks.
enabled: true

replicas: 2

image:
  repository: ghcr.io/cozystack/cozystack/linstor-gateway
  tag: v2.3.0
  pullPolicy: IfNotPresent

linstor:
  # Cozystack LINSTOR exposes an mTLS REST endpoint. Reuse the client
  # certificate bundle already generated by the linstor package rather than
  # weakening TLS verification for Gateway.
  controllers:
    - https://linstor-controller.cozy-linstor.svc:3371
  clientSecret: linstor-client-tls

gateway:
  listenAddress: ":8337"
  corsAllowedOrigins: []
  # LINSTOR Gateway v2.3 supports token_file. Keep credentials exclusively in
  # a Secret; never place bearer tokens in values or a ConfigMap. mTLS remains
  # the baseline when no API token is configured.
  tokenSecret:
    name: ""
    key: token

service:
  type: ClusterIP
  port: 8337

availability:
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL
