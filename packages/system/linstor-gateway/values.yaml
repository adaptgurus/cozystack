enabled: false

replicas: 2

image:
  repository: ghcr.io/cozystack/cozystack/linstor-gateway
  tag: v2.3.0
  pullPolicy: IfNotPresent

gateway:
  listenAddress: ":8337"
  controllers:
    - linstor-controller.cozy-linstor.svc:3370
  corsAllowedOrigins: []
  tokenSecret:
    name: ""
    key: token

service:
  type: ClusterIP
  port: 8337

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL
