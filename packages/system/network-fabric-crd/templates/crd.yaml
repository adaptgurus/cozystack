apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: networkfabrics.infrastructure.cozystack.io
spec:
  group: infrastructure.cozystack.io
  scope: Cluster
  names:
    plural: networkfabrics
    singular: networkfabric
    kind: NetworkFabric
    shortNames:
      - netfabric
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Observed
          type: integer
          jsonPath: .status.observedGeneration
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - provider
                - nodeSelector
                - protectedManagementInterfaces
                - networks
              properties:
                provider:
                  type: string
                  enum: [talos]
                  description: Node network authority. v1alpha1 supports Talos only.
                nodeSelector:
                  type: object
                  minProperties: 1
                  additionalProperties:
                    type: string
                  description: Explicit Kubernetes node labels selecting the dedicated nodes/node pool managed by this fabric. Empty selectors are rejected to prevent cluster-wide mutation.
                protectedManagementInterfaces:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
                    maxLength: 15
                  description: Interfaces whose management connectivity must remain reachable before and after every node change.
                rollout:
                  type: object
                  properties:
                    maxUnavailable:
                      type: integer
                      minimum: 1
                      maximum: 1
                      default: 1
                  description: Safety rollout policy. v1alpha1 intentionally allows only one node at a time.
                networks:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, uplink, vlan, bridge]
                    x-kubernetes-validations:
                      - rule: "self.bridge != self.uplink"
                        message: bridge must differ from uplink; fabric changes are additive
                      - rule: "self.vlan == 0 ? !has(self.vlanInterface) || self.vlanInterface == '' : has(self.vlanInterface) && self.vlanInterface != ''"
                        message: vlanInterface is required for tagged VLANs and must be empty for native VLAN 0
                    properties:
                      name:
                        type: string
                        minLength: 1
                      uplink:
                        type: string
                        minLength: 1
                        maxLength: 15
                      vlan:
                        type: integer
                        minimum: 0
                        maximum: 4094
                      vlanInterface:
                        type: string
                        maxLength: 15
                      bridge:
                        type: string
                        minLength: 1
                        maxLength: 15
                      mtu:
                        type: integer
                        minimum: 0
                        maximum: 9216
                        default: 0
                        x-kubernetes-validations:
                          - rule: "self == 0 || self >= 576"
                            message: mtu must be 0 or between 576 and 9216
                      migration:
                        type: boolean
                        default: false
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                phase:
                  type: string
                  enum: [Pending, Reconciling, Ready, Degraded, RollingBack, Failed]
                activeNode:
                  type: string
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [lastTransitionTime, message, reason, status, type]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", Unknown]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                nodes:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, phase]
                    properties:
                      name:
                        type: string
                      phase:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastAppliedRevision:
                        type: string
                      managementReachable:
                        type: boolean
                      message:
                        type: string
                      lastVerifiedAt:
                        type: string
                      rollbackState:
                        type: string
                      appliedNetworks:
                        type: array
                        x-kubernetes-list-type: map
                        x-kubernetes-list-map-keys: [name]
                        items:
                          type: object
                          required: [name, uplink, vlan, bridge]
                          properties:
                            name:
                              type: string
                            uplink:
                              type: string
                            vlan:
                              type: integer
                            vlanInterface:
                              type: string
                            bridge:
                              type: string
                            mtu:
                              type: integer
                            migration:
                              type: boolean
                migration:
                  type: object
                  properties:
                    configured:
                      type: boolean
                    network:
                      type: string
                    bridge:
                      type: string
                    readyNodes:
                      type: array
                      items:
                        type: string
                    unavailableNodes:
                      type: array
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name, reason]
                        properties:
                          name:
                            type: string
                          reason:
                            type: string
