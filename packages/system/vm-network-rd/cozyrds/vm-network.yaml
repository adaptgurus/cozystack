kind: ApplicationDefinition
metadata:
  name: vm-network
spec:
  application:
    kind: VMNetwork
    singular: vmnetwork
    plural: vmnetworks
    openAPISchema: |-
      {"title":"Chart Values","type":"object","properties":{"bridge":{"description":"Linux bridge on KubeVirt-capable nodes that carries this external VM network.","type":"string","default":"","minLength":1},"vlan":{"description":"802.1Q VLAN ID. Use 0 for an untagged/native network. Tagging is performed by the Talos VLAN interface below the Linux bridge, never by bridge CNI.","type":"integer","default":0,"maximum":4094,"minimum":0},"mtu":{"description":"Interface MTU. Use 0 to inherit/default; otherwise use 576-9216.","type":"integer","default":0,"maximum":9216,"minimum":0,"x-kubernetes-validations":[{"rule":"self == 0 || self >= 576","message":"mtu must be 0 or between 576 and 9216"}]},"fabricRef":{"description":"Optional cluster NetworkFabric backing this tenant network. Set together with fabricNetwork for verified node placement.","type":"string","default":""},"fabricNetwork":{"description":"Network name inside fabricRef. Set together with fabricRef.","type":"string","default":""},"description":{"description":"Human-readable description of the physical VM network.","type":"string","default":""},"promiscMode":{"description":"Enable promiscuous mode on the bridge CNI interface.","type":"boolean","default":false},"macspoofchk":{"description":"Enable MAC spoof checking when supported by the bridge CNI.","type":"boolean","default":false},"hairpinMode":{"description":"Enable bridge hairpin mode for this network.","type":"boolean","default":false}},"x-kubernetes-validations":[{"rule":"(self.fabricRef == \"\" && self.fabricNetwork == \"\") || (self.fabricRef != \"\" && self.fabricNetwork != \"\")","message":"fabricRef and fabricNetwork must be set together"}]}
