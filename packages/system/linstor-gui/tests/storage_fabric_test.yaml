suite: LayerSentry Storage Fabric GUI
templates:
  - templates/deployment.yaml
  - templates/configmap-nginx.yaml
  - templates/configmap-storage-fabric.yaml
  - templates/configmap-storage-fabric-wizard.yaml

tests:
  - it: mounts the Storage Fabric console and wizard into the hardened GUI pod
    template: templates/deployment.yaml
    release:
      name: linstor-gui
      namespace: cozy-linstor
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: storage-fabric-ui
            configMap:
              name: linstor-gui-storage-fabric
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: storage-fabric-ui
            mountPath: /usr/share/nginx/html/storage-fabric/index.html
            subPath: index.html
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: storage-fabric-wizard
            configMap:
              name: linstor-gui-storage-fabric-wizard
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: storage-fabric-wizard
            mountPath: /usr/share/nginx/html/storage-fabric/wizard.js
            subPath: wizard.js
            readOnly: true

  - it: exposes Gateway through a same-origin proxy and blocks mutations by default
    template: templates/configmap-nginx.yaml
    release:
      name: linstor-gui
      namespace: cozy-linstor
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "location \\^~ /gateway/"
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "proxy_pass http://linstor-gateway.cozy-linstor.svc:8337/"
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "ProvisioningLocked"
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "GET\\|HEAD\\|OPTIONS"

  - it: keeps mutations locked when only administrative opt-in is enabled
    template: templates/configmap-nginx.yaml
    release:
      name: linstor-gui
      namespace: cozy-linstor
    set:
      gateway.provisioningEnabled: true
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "ProvisioningLocked"

  - it: unlocks Gateway writes only after all certifications and requires the wizard header
    template: templates/configmap-nginx.yaml
    release:
      name: linstor-gui
      namespace: cozy-linstor
    set:
      gateway.provisioningEnabled: true
      gateway.safety.persistentDiskIdentityCertified: true
      gateway.safety.agentDataPlaneCertified: true
      gateway.safety.certificationReference: TEST-CERT-1
    asserts:
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: "ProvisioningLocked"
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "ProvisioningConfirmationRequired"
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "POST\\|PUT\\|PATCH\\|DELETE"

  - it: renders a self-contained dashboard with all Gateway discovery endpoints
    template: templates/configmap-storage-fabric.yaml
    release:
      name: linstor-gui
      namespace: cozy-linstor
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["index.html"]
          pattern: "LayerSentry Storage Fabric"
      - matchRegex:
          path: data["index.html"]
          pattern: "/gateway/api/v2/status"
      - matchRegex:
          path: data["index.html"]
          pattern: "/gateway/api/v2/iscsi"
      - matchRegex:
          path: data["index.html"]
          pattern: "/gateway/api/v2/nfs"
      - matchRegex:
          path: data["index.html"]
          pattern: "/gateway/api/v2/nvme-of"

  - it: renders all three guided provisioning endpoints
    template: templates/configmap-storage-fabric-wizard.yaml
    release:
      name: linstor-gui
      namespace: cozy-linstor
    asserts:
      - matchRegex:
          path: data["wizard.js"]
          pattern: "Create iSCSI target"
      - matchRegex:
          path: data["wizard.js"]
          pattern: "Create NFS export"
      - matchRegex:
          path: data["wizard.js"]
          pattern: "Create NVMe/TCP target"
      - matchRegex:
          path: data["wizard.js"]
          pattern: "X-LayerSentry-Provisioning"
