networkFabricController:
  image: "ghcr.io/cozystack/cozystack/network-fabric-controller:v1.6.2"
  replicas: 2
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"
  healthRequeue: "2m"
  talosTryTimeout: "2m"
  # Operator-only exact comma-separated <fabric>/<node> targets. Keep empty
  # during normal operation. Wildcards are rejected by the controller.
  orphanedNodeCleanupAllowlist: ""
  talosconfig:
    secretName: network-fabric-talosconfig
    key: talosconfig
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi
