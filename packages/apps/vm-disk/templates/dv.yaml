{{- $existingDV := lookup "cdi.kubevirt.io/v1beta1" "DataVolume" .Release.Namespace .Release.Name }}
{{- $platformISO := hasKey .Values.source "iso" }}
{{- $isOptical := or .Values.optical $platformISO }}
{{- $logicalDiskName := trimPrefix "vm-disk-" .Release.Name }}
{{- $resourceFamily := $logicalDiskName }}
{{- $resourceRole := "standalone-disk" }}
{{- if hasSuffix "osdisk" $logicalDiskName }}
{{- $resourceFamily = trimSuffix "osdisk" $logicalDiskName }}
{{- $resourceRole = "osdisk" }}
{{- else if regexMatch "datadisk[0-9]*$" $logicalDiskName }}
{{- $resourceFamily = regexReplaceAll "datadisk[0-9]*$" $logicalDiskName "" }}
{{- $resourceRole = "datadisk" }}
{{- end }}
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  annotations:
    hci.cozystack.io/logical-name: {{ $logicalDiskName | quote }}
    {{- if hasKey .Values.source "upload" }}
    cdi.kubevirt.io/storage.bind.immediate.requested: ""
    {{- end }}
    vm-disk.cozystack.io/optical: {{ $isOptical | quote }}
    {{- if $isOptical }}
    vm-disk.cozystack.io/media-scope: {{ ternary "platform" "tenant" $platformISO | quote }}
    {{- with .Values.displayName }}
    vm-disk.cozystack.io/display-name: {{ . | quote }}
    {{- end }}
    {{- with .Values.mediaCategory }}
    vm-disk.cozystack.io/media-category: {{ . | quote }}
    {{- end }}
    {{- with .Values.osFamily }}
    vm-disk.cozystack.io/os-family: {{ . | quote }}
    {{- end }}
    {{- with .Values.osName }}
    vm-disk.cozystack.io/os-name: {{ . | quote }}
    {{- end }}
    {{- with .Values.osVersion }}
    vm-disk.cozystack.io/os-version: {{ . | quote }}
    {{- end }}
    {{- with .Values.architecture }}
    vm-disk.cozystack.io/architecture: {{ . | quote }}
    {{- end }}
    {{- with .Values.description }}
    vm-disk.cozystack.io/description: {{ . | quote }}
    {{- end }}
    {{- end }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    hci.cozystack.io/resource-family: {{ $resourceFamily | quote }}
    hci.cozystack.io/resource-role: {{ $resourceRole | quote }}
  name: {{ .Release.Name }}
spec:
  {{- if $existingDV }}
    {{- toYaml $existingDV.spec | nindent 2 }}
  {{- else }}
  contentType: kubevirt
  {{- if .Values.source }}
  {{- if gt (len .Values.source) 1 }}
    {{- fail "Exactly one type of source is expected!" }}
  {{- end }}
  source:
    {{- if hasKey .Values.source "image" }}
    pvc:
      name: vm-default-images-{{ required "A valid .Values.source.image.name entry required!" .Values.source.image.name }}
      namespace: cozy-public
    {{- else if hasKey .Values.source "iso" }}
    pvc:
      name: vm-default-isos-{{ required "A valid .Values.source.iso.name entry required!" .Values.source.iso.name }}
      namespace: cozy-public
    {{- else if hasKey .Values.source "http" }}
    http:
      url: {{ required "A valid .Values.source.http.url entry required!" .Values.source.http.url }}
    {{- else if hasKey .Values.source "upload" }}
    upload: {}
    {{- else if hasKey .Values.source "disk" }}
    pvc:
      name: vm-disk-{{ required "A valid .Values.source.disk.name entry required!" .Values.source.disk.name }}
      namespace: {{ $.Release.Namespace }}
    {{- end }}
  {{- else }}
  source:
    blank: {}
  {{- end }}
  storage:
    resources:
      requests:
        storage: {{ .Values.storage }}
    {{- with .Values.storageClass }}
    storageClassName: {{ . }}
    {{- end }}
  {{- end }}
