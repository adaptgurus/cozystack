suite: vm-disk OS resource family naming

templates:
  - templates/dv.yaml

release:
  name: vm-disk-windows10osdisk
  namespace: tenant-test

set:
  storage: 32Gi
  storageClass: replicated

tests:
  - it: identifies windows10osdisk as the windows10 OS disk
    asserts:
      - equal:
          path: metadata.labels["hci.cozystack.io/resource-family"]
          value: windows10
      - equal:
          path: metadata.labels["hci.cozystack.io/resource-role"]
          value: osdisk
      - equal:
          path: metadata.annotations["hci.cozystack.io/logical-name"]
          value: windows10osdisk
