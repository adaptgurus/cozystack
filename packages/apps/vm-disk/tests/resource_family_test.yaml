suite: vm-disk resource family naming

templates:
  - templates/dv.yaml

set:
  storage: 32Gi
  storageClass: replicated

tests:
  - it: identifies windows10osdisk as the windows10 OS disk
    release:
      name: vm-disk-windows10osdisk
      namespace: tenant-test
    asserts:
      - equal:
          path: metadata.labels["hci.cozystack.io/resource-family"]
          value: windows10
      - equal:
          path: metadata.labels["hci.cozystack.io/resource-role"]
          value: osdisk
      - equal:
          path: metadata.annotations["hci.cozystack.io/logical-name"]
          value: windows10osdisk

  - it: identifies windows10datadisk as the first windows10 data disk
    release:
      name: vm-disk-windows10datadisk
      namespace: tenant-test
    asserts:
      - equal:
          path: metadata.labels["hci.cozystack.io/resource-family"]
          value: windows10
      - equal:
          path: metadata.labels["hci.cozystack.io/resource-role"]
          value: datadisk
      - equal:
          path: metadata.annotations["hci.cozystack.io/logical-name"]
          value: windows10datadisk

  - it: identifies numbered data disks without changing the VM family
    release:
      name: vm-disk-windows10datadisk2
      namespace: tenant-test
    asserts:
      - equal:
          path: metadata.labels["hci.cozystack.io/resource-family"]
          value: windows10
      - equal:
          path: metadata.labels["hci.cozystack.io/resource-role"]
          value: datadisk
      - equal:
          path: metadata.annotations["hci.cozystack.io/logical-name"]
          value: windows10datadisk2
