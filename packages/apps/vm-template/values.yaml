##
## @section VM template capture
##

## @enum {string} VMTemplateMode - Template capture transaction mode.
## @value Copy - Keep the source VMInstance after a verified reusable template is Ready.
## @value Convert - Retire the source VMInstance only after capture, sanitation and source identity revalidation succeed.

## @param {string} sourceVM - Tenant-local Cozystack VMInstance to capture. The source must be halted and have no active VMI.
## @minLength 1
## @maxLength 63
## @x-cozystack-options {source: vminstance}
sourceVM: ""

## @param {VMTemplateMode} mode - Copy keeps the source VMInstance. Convert retires it only after the sanitized template is verified Ready and the source UID/generation still match preflight.
mode: Copy

## @param {bool} excludeOpticalMedia - Exclude installer, VirtIO-driver, rescue and other optical VMDisk attachments from the reusable template. Production template capture requires this to remain enabled.
excludeOpticalMedia: true

## @param {string} description - Optional human-readable template description.
## @maxLength 512
description: ""
