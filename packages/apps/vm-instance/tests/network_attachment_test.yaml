suite: vm-instance external network rendering

release:
  name: test-vm
  namespace: tenant-test
templates:
  - templates/vm.yaml
set:
  fullnameOverride: test-vm
  instanceType: ""
  instanceProfile: ""
  cloudInitSeed: network-test
  resources:
    cpu: 2
    sockets: 1
    memory: 2Gi
  disks: []
tests:
  - it: preserves the default pod network and names the first VM NIC from the VM family
    set:
      networks:
        - name: prod-vlan120
    asserts:
      - equal:
          path: spec.template.spec.domain.devices.interfaces[0].name
          value: default
      - equal:
          path: spec.template.spec.domain.devices.interfaces[1].name
          value: test-vmnic
      - equal:
          path: spec.template.spec.networks[0].name
          value: default
      - equal:
          path: spec.template.spec.networks[1].name
          value: test-vmnic
      - equal:
          path: spec.template.spec.networks[1].multus.networkName
          value: tenant-test/prod-vlan120

  - it: numbers later VM NICs while keeping backing VMNetworks independent
    set:
      networks:
        - name: prod-vlan120
        - name: backup-vlan130
    asserts:
      - equal:
          path: spec.template.spec.domain.devices.interfaces[1].name
          value: test-vmnic
      - equal:
          path: spec.template.spec.domain.devices.interfaces[2].name
          value: test-vmnic2
      - equal:
          path: spec.template.spec.networks[1].name
          value: test-vmnic
      - equal:
          path: spec.template.spec.networks[2].name
          value: test-vmnic2
      - equal:
          path: spec.template.spec.networks[1].multus.networkName
          value: tenant-test/prod-vlan120
      - equal:
          path: spec.template.spec.networks[2].multus.networkName
          value: tenant-test/backup-vlan130
