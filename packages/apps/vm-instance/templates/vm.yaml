{{- if and .Values.instanceType (not (lookup "instancetype.kubevirt.io/v1beta1" "VirtualMachineClusterInstancetype" "" .Values.instanceType)) }}
{{-   fail (printf "Specified instanceType does not exist in the cluster: %s" .Values.instanceType) }}
{{- end }}
{{- if and .Values.instanceProfile (not (lookup "instancetype.kubevirt.io/v1beta1" "VirtualMachineClusterPreference" "" .Values.instanceProfile)) }}
{{-   fail (printf "Specified instanceProfile does not exist in the cluster: %s" .Values.instanceProfile) }}
{{- end }}
{{- if and (not .Values.instanceType) (not (and .Values.resources .Values.resources.cpu .Values.resources.sockets .Values.resources.memory)) }}
{{-   fail "Either instanceType or resources (cpu, sockets, memory) must be specified" }}
{{- end }}
{{- if and .Values.cloudInit .Values.cloudInitSecretRef }}
{{-   fail "cloudInit and cloudInitSecretRef are mutually exclusive" }}
{{- end }}
{{- $seenDisks := dict }}
{{- range $disk := .Values.disks }}
{{-   if hasKey $seenDisks $disk.name }}
{{-     fail (printf "Duplicate disk attachment: %s" $disk.name) }}
{{-   end }}
{{-   $_ := set $seenDisks $disk.name true }}
{{- end }}
{{- $seenCDROMs := dict }}
{{- $seenMedia := dict }}
{{- range $cdrom := .Values.cdroms }}
{{-   if hasKey $seenCDROMs $cdrom.name }}
{{-     fail (printf "Duplicate CD-ROM slot: %s" $cdrom.name) }}
{{-   end }}
{{-   $_ := set $seenCDROMs $cdrom.name true }}
{{-   if $cdrom.media }}
{{-     if hasKey $seenDisks $cdrom.media }}
{{-       fail (printf "VMDisk %s cannot be attached as both a disk and CD-ROM media" $cdrom.media) }}
{{-     end }}
{{-     if hasKey $seenMedia $cdrom.media }}
{{-       fail (printf "Duplicate CD-ROM media attachment: %s" $cdrom.media) }}
{{-     end }}
{{-     $_ := set $seenMedia $cdrom.media true }}
{{-   end }}
{{- end }}
{{- $networks := .Values.networks | default .Values.subnets }}
{{- $cdromCount := len .Values.cdroms }}
{{- $logicalVMName := include "virtual-machine.logicalName" . }}
{{- $securityGroupName := include "virtual-machine.securityGroupName" . }}
{{- $cloudInitSecretName := printf "%s-cloud-init" (include "virtual-machine.fullname" .) }}
{{- if .Values.cloudInitSecretRef }}
{{- $cloudInitSecretName = .Values.cloudInitSecretRef }}
{{- end }}

apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: {{ include "virtual-machine.fullname" . }}
  annotations:
    hci.cozystack.io/logical-name: {{ $logicalVMName | quote }}
    hci.cozystack.io/security-group: {{ $securityGroupName | quote }}
  labels:
    {{- include "virtual-machine.labels" . | nindent 4 }}
    hci.cozystack.io/resource-role: "vm"
spec:
  {{- if hasKey .Values "runStrategy" }}
  runStrategy: {{ .Values.runStrategy }}
  {{- else }}
  runStrategy: {{ ternary "Always" "Halted" (.Values.running | default true) }}
  {{- end }}
  {{- with .Values.instanceType }}
  instancetype:
    kind: VirtualMachineClusterInstancetype
    name: {{ . }}
    {{- end }}
  {{- with .Values.instanceProfile }}
  preference:
    kind: VirtualMachineClusterPreference
    name: {{ . }}
    {{- end }}
  template:
    metadata:
      annotations:
        kubevirt.io/allow-pod-bridge-network-live-migration: "true"
        hci.cozystack.io/logical-name: {{ $logicalVMName | quote }}
        hci.cozystack.io/security-group: {{ $securityGroupName | quote }}
        {{- $ovnIPName := printf "%s.%s" (include "virtual-machine.fullname" .) .Release.Namespace }}
        {{- $ovnIP := lookup "kubeovn.io/v1" "IP" "" $ovnIPName }}
        {{- if $ovnIP }}
        ovn.kubernetes.io/mac_address: {{ $ovnIP.spec.macAddress | quote }}
        ovn.kubernetes.io/ip_address: {{ $ovnIP.spec.ipAddress | quote }}
        {{- end }}
      labels:
        {{- include "virtual-machine.labels" . | nindent 8 }}
        hci.cozystack.io/resource-role: "vm-runtime"
    spec:
      domain:
        {{- $domainRes := include "virtual-machine.domainResources" . | fromJson -}}
        {{- with $domainRes.cpu }}
        cpu: {{- . | toYaml | nindent 10 }}
        {{- end }}
        {{- with $domainRes.resources }}
        resources: {{- . | toYaml | nindent 10 }}
        {{- end }}
        firmware:
          uuid: {{ include "virtual-machine.stableUuid" . }}
        devices:
          {{- if .Values.gpus }}
          gpus:
          {{- range $i, $gpu := .Values.gpus }}
          - name: gpu{{ add $i 1 }}
            deviceName: {{ $gpu.name }}
          {{- end }}
          {{- end }}
          {{- if .Values.tpm.enabled }}
          # Each guest receives its own vTPM identity. With persistent=true,
          # KubeVirt stores that state in the cluster VM-state StorageClass so
          # the same VM can restart on another node without losing TPM state.
          tpm:
            persistent: {{ .Values.tpm.persistent }}
          {{- end }}
          disks:
          {{- range $i, $cdrom := .Values.cdroms }}
          - name: cdrom-{{ $cdrom.name }}
            {{- if $cdrom.media }}
            {{- $dv := lookup "cdi.kubevirt.io/v1beta1" "DataVolume" $.Release.Namespace (printf "vm-disk-%s" $cdrom.media) }}
            {{- if not $dv }}
            {{-   fail (printf "Specified CD-ROM media does not exist in cluster: %s" $cdrom.media) }}
            {{- end }}
            {{- $isOptical := and (hasKey $dv.metadata.annotations "vm-disk.cozystack.io/optical") (eq (index $dv.metadata.annotations "vm-disk.cozystack.io/optical") "true") }}
            {{- if not $isOptical }}
            {{-   fail (printf "VMDisk %s is not marked as optical media" $cdrom.media) }}
            {{- end }}
            {{- end }}
            cdrom:
              bus: sata
              readonly: true
            bootOrder: {{ add $i 1 }}
          {{- end }}
          {{- range $i, $disk := .Values.disks }}
          - name: disk-{{ $disk.name }}
            {{- $dv := lookup "cdi.kubevirt.io/v1beta1" "DataVolume" $.Release.Namespace (printf "vm-disk-%s" $disk.name) }}
            {{- if $dv }}
            {{- $isOptical := and (hasKey $dv.metadata.annotations "vm-disk.cozystack.io/optical") (eq (index $dv.metadata.annotations "vm-disk.cozystack.io/optical") "true") }}
            {{- if and $isOptical $disk.bus (ne $disk.bus "sata") }}
            {{-   fail (printf "Optical disk %s requires the sata bus" $disk.name) }}
            {{- end }}
            {{- if $isOptical }}
            cdrom:
              bus: sata
              readonly: true
            {{- else if $disk.bus }}
            disk:
              bus: {{ $disk.bus }}
            {{- else }}
            disk: {}
            {{- end }}
            bootOrder: {{ add (add $i 1) $cdromCount }}
            {{- else }}
            {{-   fail (printf "Specified disk not exists in cluster: %s" .name) }}
            {{- end }}
          {{- end }}
          {{- if or .Values.cloudInit .Values.cloudInitSecretRef .Values.sshKeys }}
          - name: cloudinitdisk
            disk: {}
          {{- end }}
          interfaces:
          - name: default
            bridge: {}
          {{- range $i, $net := $networks }}
          - name: {{ include "virtual-machine.nicName" (dict "root" $ "index" $i) }}
            bridge: {}
          {{- end }}
        machine:
          type: ""
      {{- with .Values.sshKeys }}
      accessCredentials:
      - sshPublicKey:
          source:
            secret:
              secretName: {{ include "virtual-machine.fullname" $ }}-ssh-keys
          propagationMethod:
            noCloud: {}
      {{- end }}
      terminationGracePeriodSeconds: 30

      {{- include "virtual-machine.hciNodeAffinity" . | nindent 6 }}

      volumes:
      {{- range $cdrom := .Values.cdroms }}
      {{- if $cdrom.media }}
      - name: cdrom-{{ $cdrom.name }}
        dataVolume:
          name: vm-disk-{{ $cdrom.media }}
      {{- end }}
      {{- end }}
      {{- range .Values.disks }}
      - name: disk-{{ .name }}
        dataVolume:
          name: vm-disk-{{ .name }}
      {{- end }}
      {{- if or .Values.cloudInit .Values.cloudInitSecretRef .Values.sshKeys }}
      - name: cloudinitdisk
        cloudInitNoCloud:
          secretRef:
            name: {{ $cloudInitSecretName }}
      {{- end }}
      networks:
      - name: default
        pod: {}
      {{- range $i, $net := $networks }}
      - name: {{ include "virtual-machine.nicName" (dict "root" $ "index" $i) }}
        multus:
          networkName: {{ $.Release.Namespace }}/{{ $net.name }}
      {{- end }}