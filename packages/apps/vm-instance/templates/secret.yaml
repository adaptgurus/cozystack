{{- $logicalVMName := include "virtual-machine.logicalName" . -}}
{{- $securityGroupName := include "virtual-machine.securityGroupName" . -}}
{{- if .Values.sshKeys }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "virtual-machine.fullname" $ }}-ssh-keys
  labels:
    hci.cozystack.io/resource-family: {{ $logicalVMName | quote }}
    hci.cozystack.io/resource-role: "security"
  annotations:
    hci.cozystack.io/logical-name: {{ $securityGroupName | quote }}
    hci.cozystack.io/security-component: "ssh-keys"
stringData:
  {{- range $k, $v := .Values.sshKeys }}
  key{{ $k }}: {{ quote $v }} 
  {{- end }}
{{- end }}
{{- if and (not .Values.cloudInitSecretRef) (or .Values.cloudInit .Values.sshKeys) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "virtual-machine.fullname" . }}-cloud-init
  labels:
    hci.cozystack.io/resource-family: {{ $logicalVMName | quote }}
    hci.cozystack.io/resource-role: "security"
  annotations:
    hci.cozystack.io/logical-name: {{ $securityGroupName | quote }}
    hci.cozystack.io/security-component: "cloud-init"
stringData:
  userdata: |
    {{- if .Values.cloudInit }}
    {{-   .Values.cloudInit | nindent 4 }}
    {{- else if and (.Values.sshKeys) (not .Values.cloudInit) }}
    {{- /*
      We usually provide ssh keys in cloud-init metadata, because userdata it not typed and can be used for any purpose.
      However, if user provides ssh keys but not cloud-init, we still need to provide a minimal cloud-init config to avoid errors.
    */}}
    #cloud-config
    ssh_authorized_keys:
      {{- range .Values.sshKeys }}
      - {{ quote . }} 
      {{- end }}
    {{- end }}
{{- end }}
