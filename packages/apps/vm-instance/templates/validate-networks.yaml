{{- $networks := .Values.networks | default .Values.subnets -}}
{{- $seenNetworks := dict -}}
{{/* Validate request shape before doing any API lookups so duplicate/empty input
     is reported deterministically and cannot be masked by lookup failures. */}}
{{- range $net := $networks -}}
{{-   if not $net.name -}}
{{-     fail "Network attachment name must not be empty" -}}
{{-   end -}}
{{-   if hasKey $seenNetworks $net.name -}}
{{-     fail (printf "Duplicate network attachment: %s" $net.name) -}}
{{-   end -}}
{{-   $_ := set $seenNetworks $net.name true -}}
{{- end -}}
{{/* Fail closed after local validation: every referenced NAD must exist in the
     authoritative VM tenant namespace. */}}
{{- range $net := $networks -}}
{{-   $nad := lookup "k8s.cni.cncf.io/v1" "NetworkAttachmentDefinition" $.Release.Namespace $net.name -}}
{{-   if not $nad -}}
{{-     fail (printf "Specified network does not exist in tenant namespace %s: %s" $.Release.Namespace $net.name) -}}
{{-   end -}}
{{- end -}}
