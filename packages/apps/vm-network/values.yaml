##
## @section External VM network
##

## @param {string} bridge - Linux bridge on KubeVirt-capable nodes that carries this external VM network.
## @minLength 1
bridge: ""

## @param {int} vlan - 802.1Q VLAN ID. Use 0 for an untagged/native network. Tagging is performed by the Talos VLAN interface below the Linux bridge, never by bridge CNI.
## @minimum 0
## @maximum 4094
vlan: 0

## @param {int} mtu - Interface MTU. Use 0 to inherit/default; otherwise use 576-9216.
## @minimum 0
## @maximum 9216
mtu: 0

## @param {string} fabricRef - Optional cluster NetworkFabric backing this tenant network. Set together with fabricNetwork for verified node placement.
fabricRef: ""

## @param {string} fabricNetwork - Network name inside fabricRef. Set together with fabricRef.
fabricNetwork: ""

## @param {string} description - Human-readable description of the physical VM network.
description: ""

## @param {bool} promiscMode - Enable promiscuous mode on the bridge CNI interface.
promiscMode: false

## @param {bool} macspoofchk - Enable MAC spoof checking when supported by the bridge CNI.
macspoofchk: false

## @param {bool} hairpinMode - Enable bridge hairpin mode for this network.
hairpinMode: false
