# LayerSentry universal HCI/dHCI Talos runtime defaults.
#
# The image provides capability only. Array-specific WWID/WWN/NQN policy,
# storage ownership, VLANs, firewall policy and destructive actions belong to
# LayerSentry/site reconciliation and must never be inferred from /dev/sdX.
version: v1alpha1
machine:
  kernel:
    modules:
      - name: dm_multipath
      - name: dm_round-robin
      # Load rebuilt external modules as an image-integrity/ABI gate. Loading
      # ZFS itself is safe because LayerSentry removes the upstream auto-import
      # service; pool import/export remains controller-owned.
      - name: drbd
      - name: zfs
      - name: nfsd
      # Stock Talos v1.13.6 disables CONFIG_INFINIBAND_ISER. LayerSentry builds
      # the exact kernel with CONFIG_INFINIBAND_ISER=m and packages ib_iser.
      - name: ib_iser
---
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: multipathd
configFiles:
  - mountPath: /etc/multipath.conf
    content: |
      defaults {
          # Stable SAN identity is WWID-based; never invent friendly sdX-like
          # aliases. `find_multipaths yes` also avoids claiming ordinary local
          # single-path disks merely because multipathd is installed.
          user_friendly_names no
          find_multipaths yes
      }

# Deliberately no NetworkDefaultActionConfig is embedded here. The universal
# ISO must not hard-code an open host firewall or block storage fabrics. Talos
# defaults plus LayerSentry/Cilium/site policy own ingress/egress enforcement.
