# LayerSentry HCI Talos runtime defaults.
#
# This configuration is embedded into LayerSentry boot/install assets by
# hack/gen-profiles.sh. Keep array-specific WWID/product overrides outside this
# generic image policy; controllers or site machine-config patches can add them.
version: v1alpha1
machine:
  kernel:
    modules:
      - name: dm_multipath
      - name: dm_round-robin
      - name: nfsd
      # Stock Talos v1.13.6 disables CONFIG_INFINIBAND_ISER. The LayerSentry
      # kernel build enables it as a module and explicitly packages ib_iser in
      # the Talos initramfs module allow-list.
      - name: ib_iser
---
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: multipathd
configFiles:
  - mountPath: /etc/multipath.conf
    content: |
      defaults {
          user_friendly_names no
          find_multipaths yes
          path_selector "round-robin 0"
      }
---
# LayerSentry deliberately does not impose an OS-level ingress firewall in the
# generic HCI image. Talos' default ingress action is accept; pin it explicitly
# so storage traffic such as NFS, iSCSI, iSER and NVMe-oF is not blocked. The
# kernel netfilter/conntrack substrate is retained for Kubernetes/Cilium
# compatibility; normal LayerSentry Kubernetes datapath policy is Cilium/eBPF.
apiVersion: v1alpha1
kind: NetworkDefaultActionConfig
ingress: accept
