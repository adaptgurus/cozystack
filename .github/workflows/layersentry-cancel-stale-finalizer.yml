name: LayerSentry Cancel Stale Finalizer

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - .github/workflows/layersentry-cancel-stale-finalizer.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    name: Cancel superseded self-hosted workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_RUN_IDS: "33612319426 33612661957 33612996056 33615648828"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel stale or superseded runs if still active
        shell: bash
        run: |
          set -Eeuo pipefail
          for run_id in ${TARGET_RUN_IDS}; do
            api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            payload=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api")
            status=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$payload")
            conclusion=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")' <<<"$payload")
            echo "run_id=$run_id status=$status conclusion=$conclusion"
            case "$status" in
              queued|in_progress|waiting|pending|requested)
                curl -fsSL -X POST \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "$api/cancel"
                echo "Cancellation requested for run ${run_id}."
                ;;
              completed)
                echo "Run ${run_id} is already completed."
                ;;
              *)
                echo "Unexpected run status for ${run_id}: $status" >&2
                exit 1
                ;;
            esac
          done

      - name: Wait for every superseded run to release the runner
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 90); do
            remaining=0
            for run_id in ${TARGET_RUN_IDS}; do
              api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
              payload=$(curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$api")
              status=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$payload")
              conclusion=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")' <<<"$payload")
              echo "attempt=$attempt run_id=$run_id status=$status conclusion=$conclusion"
              if [[ "$status" != completed ]]; then
                remaining=$((remaining + 1))
              fi
            done
            if [[ "$remaining" -eq 0 ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for superseded workflows to release the runner." >&2
          exit 1
