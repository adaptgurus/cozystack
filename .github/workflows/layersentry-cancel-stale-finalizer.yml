name: LayerSentry Cancel Stale Finalizer

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - .github/workflows/layersentry-cancel-stale-finalizer.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    name: Cancel superseded self-hosted finalizer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_RUN_ID: "33612319426"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel the stale finalizer if it is still active
        shell: bash
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}"
          status=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          echo "target_run_status=$status"
          case "$status" in
            queued|in_progress|waiting|pending|requested)
              curl -fsSL -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$api/cancel"
              echo "Cancellation requested for run ${TARGET_RUN_ID}."
              ;;
            completed)
              echo "Run ${TARGET_RUN_ID} is already completed; no cancellation required."
              ;;
            *)
              echo "Unexpected run status: $status" >&2
              exit 1
              ;;
          esac

      - name: Wait for the self-hosted runner slot to be released
        shell: bash
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}"
          for attempt in $(seq 1 30); do
            payload=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api")
            status=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$payload")
            conclusion=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")' <<<"$payload")
            echo "attempt=$attempt status=$status conclusion=$conclusion"
            if [[ "$status" == completed ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for stale finalizer cancellation." >&2
          exit 1
