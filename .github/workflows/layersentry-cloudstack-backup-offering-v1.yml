name: LayerSentry CloudStack Backup Offering v1

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - hack/layersentry/cloudstack-backup-offering-v1-requests/*.json

permissions:
  contents: read

concurrency:
  group: layersentry-live-environment
  cancel-in-progress: false

jobs:
  import-offering:
    name: Import exact native NAS backup offering
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    env:
      CLOUDSTACK_API_ENDPOINT: http://10.10.10.14:8080/client/api
      CLOUDSTACK_API_KEY: ${{ secrets.LAYERSENTRY_CLOUDSTACK_API_KEY }}
      CLOUDSTACK_SECRET_KEY: ${{ secrets.LAYERSENTRY_CLOUDSTACK_SECRET_KEY }}

    steps:
      - name: Check out exact request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Import and reconcile exact backup offering
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $expectedZoneId='929d1f2c-d629-41ed-96b4-6c48a288d056'
          $expectedZoneName='dc'
          $expectedRepositoryId='47515ccf-16a6-455d-aac4-634911c72936'
          $expectedRepositoryName='layersentry-dc-backup-r0'
          $expectedOfferingName='layersentry-dc-nas-adhoc-r0'
          $expectedDescription='LayerSentry native NAS backup offering for deterministic recovery validation'
          $expectedProvider='nas'
          $endpoint=[Uri]$env:CLOUDSTACK_API_ENDPOINT
          if([string]::IsNullOrWhiteSpace($env:CLOUDSTACK_API_KEY) -or [string]::IsNullOrWhiteSpace($env:CLOUDSTACK_SECRET_KEY)){throw 'Scoped CloudStack API credentials are unavailable.'}
          if($endpoint.AbsoluteUri -cne 'http://10.10.10.14:8080/client/api'){throw 'CloudStack endpoint binding mismatch.'}

          $evidence=Join-Path $env:RUNNER_TEMP "layersentry-backup-offering-v1-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if(Test-Path -LiteralPath $evidence){Remove-Item -LiteralPath $evidence -Recurse -Force}
          New-Item -Path $evidence -ItemType Directory -Force|Out-Null
          @('LAYERSENTRY_BACKUP_OFFERING_V1_STARTED',"RUN_ID=$env:GITHUB_RUN_ID","COMMIT=$env:GITHUB_SHA","ZONE_ID=$expectedZoneId","REPOSITORY_ID=$expectedRepositoryId","REPOSITORY_NAME=$expectedRepositoryName","OFFERING_NAME=$expectedOfferingName")|Set-Content -LiteralPath (Join-Path $evidence 'started.txt') -Encoding UTF8

          [string[]]$changed=@(@(git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA -- 'hack/layersentry/cloudstack-backup-offering-v1-requests/*.json')|ForEach-Object{[string]$_}|Where-Object{-not [string]::IsNullOrWhiteSpace($_)})
          if($LASTEXITCODE -ne 0 -or $changed.Count -ne 1){throw 'Expected exactly one backup offering request.'}
          $request=Get-Content -LiteralPath $changed[0].Trim() -Raw -Encoding UTF8|ConvertFrom-Json
          if([string]$request.operation -cne 'IMPORT_LAYERSENTRY_NAS_BACKUP_OFFERING_V1' -or [string]$request.authorization -cne 'USER_AUTHORIZED_DISPOSABLE_LAB_BACKUP_OFFERING'){throw 'Backup offering request authorization mismatch.'}
          if([string]$request.zoneId -cne $expectedZoneId -or [string]$request.repositoryId -cne $expectedRepositoryId -or [string]$request.repositoryName -cne $expectedRepositoryName -or [string]$request.name -cne $expectedOfferingName -or [string]$request.description -cne $expectedDescription -or -not [bool]$request.allowUserDrivenBackups){throw 'Backup offering request binding mismatch.'}

          function Enc([string]$v){return [Uri]::EscapeDataString($v).Replace('%7E','~')}
          function Invoke-CS([string]$command,[hashtable]$parameters=@{}){
            $allowed=@('listZones','listConfigurations','listBackupRepositories','listBackupProviderOfferings','listBackupOfferings','importBackupOffering')
            if($command -notin $allowed){throw "Command not allow-listed: $command"}
            $q=[ordered]@{apikey=$env:CLOUDSTACK_API_KEY;command=$command;response='json'}
            foreach($n in $parameters.Keys){$q[[string]$n]=[string]$parameters[$n]}
            $pairs=@($q.GetEnumerator()|Sort-Object{([string]$_.Key).ToLowerInvariant()}|ForEach-Object{'{0}={1}' -f (Enc([string]$_.Key)),(Enc([string]$_.Value))})
            $canonical=(($pairs -join '&').ToLowerInvariant())
            $h=New-Object System.Security.Cryptography.HMACSHA1
            try{$h.Key=[Text.Encoding]::UTF8.GetBytes($env:CLOUDSTACK_SECRET_KEY);$sig=[Convert]::ToBase64String($h.ComputeHash([Text.Encoding]::UTF8.GetBytes($canonical)))}finally{$h.Dispose()}
            $uri='{0}?{1}&signature={2}' -f $endpoint.AbsoluteUri,($pairs -join '&'),(Enc $sig)
            return Invoke-RestMethod -Uri $uri -Method Get -TimeoutSec 45 -MaximumRedirection 0 -ErrorAction Stop
          }
          function Payload([object]$r,[string]$c){$n="$($c.ToLowerInvariant())response";$p=$r.PSObject.Properties[$n];if($null -eq $p){throw "Missing response payload $n"};return $p.Value}
          function Rows([object]$p,[string]$n){$x=$p.PSObject.Properties[$n];if($null -eq $x -or $null -eq $x.Value){return @()};return @($x.Value|Where-Object{$null -ne $_})}
          function Config([string]$name,[string]$zone=''){$a=@{name=$name;listall='true'};if($zone){$a.zoneid=$zone};$r=@(Rows (Payload (Invoke-CS 'listConfigurations' $a) 'listConfigurations') 'configuration'|Where-Object{[string]$_.name -ceq $name});if($r.Count -ne 1){throw "Configuration $name not unique"};return [string]$r[0].value}
          function Get-Repositories(){return @(Rows (Payload (Invoke-CS 'listBackupRepositories' @{zoneid=$expectedZoneId;page='1';pagesize='100'}) 'listBackupRepositories') 'backuprepository'|Where-Object{$null -ne $_ -and $null -ne $_.PSObject.Properties['id'] -and $null -ne $_.PSObject.Properties['name']})}
          function Get-Offerings(){return @(Rows (Payload (Invoke-CS 'listBackupOfferings' @{zoneid=$expectedZoneId;page='1';pagesize='100'}) 'listBackupOfferings') 'backupoffering'|Where-Object{$null -ne $_ -and $null -ne $_.PSObject.Properties['id'] -and $null -ne $_.PSObject.Properties['name']})}
          function Find-Exact([object[]]$rows){return @($rows|Where-Object{$null -ne $_ -and $null -ne $_.PSObject.Properties['name'] -and $null -ne $_.PSObject.Properties['externalid'] -and $null -ne $_.PSObject.Properties['zoneid'] -and [string]$_.name -ceq $expectedOfferingName -and [string]$_.externalid -ceq $expectedRepositoryName -and [string]$_.zoneid -ceq $expectedZoneId})}

          $zones=@(Rows (Payload (Invoke-CS 'listZones' @{id=$expectedZoneId;listall='true'}) 'listZones') 'zone')
          if($zones.Count -ne 1 -or [string]$zones[0].name -cne $expectedZoneName -or [string]$zones[0].allocationstate -cne 'Enabled'){throw 'Exact DC Zone is not Enabled.'}
          if((Config 'backup.framework.enabled') -cne 'true' -or (Config 'backup.framework.enabled' $expectedZoneId) -cne 'true' -or (Config 'backup.framework.provider.plugin') -cne $expectedProvider){throw 'NAS B&R framework is not reconciled.'}

          $repositories=@(Get-Repositories)
          $repository=@($repositories|Where-Object{[string]$_.id -ceq $expectedRepositoryId -and [string]$_.name -ceq $expectedRepositoryName -and [string]$_.zoneid -ceq $expectedZoneId -and [string]$_.provider -ceq $expectedProvider})
          if($repository.Count -ne 1){throw 'Exact NAS backup repository is not uniquely reconciled.'}
          if([bool]$repository[0].crosszoneinstancecreation){throw 'Repository unexpectedly allows cross-Zone instance creation.'}

          $providerOfferings=Payload (Invoke-CS 'listBackupProviderOfferings' @{zoneid=$expectedZoneId;page='1';pagesize='100'}) 'listBackupProviderOfferings'
          $providerOfferings|ConvertTo-Json -Depth 10|Set-Content -LiteralPath (Join-Path $evidence 'provider-offerings.json') -Encoding UTF8

          $before=@(Get-Offerings)
          $before|ConvertTo-Json -Depth 8|Set-Content -LiteralPath (Join-Path $evidence 'offerings-pre.json') -Encoding UTF8
          $exact=@(Find-Exact $before)
          $mutationSubmitted=$false
          if($exact.Count -eq 0){
            $conflicts=@($before|Where-Object{($null -ne $_.PSObject.Properties['name'] -and [string]$_.name -ceq $expectedOfferingName) -or ($null -ne $_.PSObject.Properties['externalid'] -and [string]$_.externalid -ceq $expectedRepositoryName)})
            if($conflicts.Count -gt 0){throw 'A conflicting backup offering already uses the requested name or repository external ID.'}
            $mutationSubmitted=$true
            try{
              $response=Invoke-CS 'importBackupOffering' @{name=$expectedOfferingName;description=$expectedDescription;externalid=$expectedRepositoryName;zoneid=$expectedZoneId;allowuserdrivenbackups='true'}
              $response|ConvertTo-Json -Depth 10|Set-Content -LiteralPath (Join-Path $evidence 'import-response.json') -Encoding UTF8
            }catch{
              $_.Exception.Message|Set-Content -LiteralPath (Join-Path $evidence 'import-error.txt') -Encoding UTF8
              Start-Sleep -Seconds 2
            }
            $exact=@(Find-Exact @(Get-Offerings))
            if($exact.Count -ne 1){throw 'Backup offering mutation was submitted but exact offering did not reconcile uniquely; do not retry without fresh state reconciliation.'}
          }elseif($exact.Count -ne 1){throw 'Exact backup offering is not unique.'}

          $after=@(Get-Offerings)
          $after|ConvertTo-Json -Depth 8|Set-Content -LiteralPath (Join-Path $evidence 'offerings-post.json') -Encoding UTF8
          $exact=@(Find-Exact $after)
          if($exact.Count -ne 1){throw 'Exact backup offering missing after reconciliation.'}
          $offering=$exact[0]
          if(-not [bool]$offering.allowuserdrivenbackups -or [string]$offering.provider -cne $expectedProvider -or [bool]$offering.crosszoneinstancecreation){throw 'Backup offering properties mismatch after reconciliation.'}
          @('LAYERSENTRY_BACKUP_OFFERING_V1_COMPLETE',"RUN_ID=$env:GITHUB_RUN_ID","COMMIT=$env:GITHUB_SHA","MUTATION_SUBMITTED=$mutationSubmitted","OFFERING_ID=$($offering.id)","NAME=$($offering.name)","EXTERNAL_ID=$($offering.externalid)","PROVIDER=$($offering.provider)","ZONE_ID=$($offering.zoneid)","ALLOW_USER_DRIVEN=$($offering.allowuserdrivenbackups)","CROSS_ZONE=$($offering.crosszoneinstancecreation)")|Set-Content -LiteralPath (Join-Path $evidence 'summary.txt') -Encoding UTF8

      - name: Upload backup offering evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layersentry-backup-offering-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\layersentry-backup-offering-v1-${{ github.run_id }}-${{ github.run_attempt }}\**
          if-no-files-found: error
          retention-days: 30
