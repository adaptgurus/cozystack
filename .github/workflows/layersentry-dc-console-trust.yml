name: LayerSentry DC Console Host Trust

on:
  push:
    branches: [codex/dr-dc-trust]
    paths: [hack/layersentry/dc-console-trust-actions/*.json]
  workflow_dispatch:
    inputs:
      phase:
        description: Observe, authenticate at the observed root login, or prove the public host key
        required: true
        type: choice
        default: Observe
        options: [Observe, Login, Verify]

permissions:
  contents: read

concurrency:
  group: layersentry-live-environment
  cancel-in-progress: false

jobs:
  trust:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Checkout bounded exact-VM trust code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Bind the explicitly selected console phase
        id: request
        shell: powershell
        env:
          DISPATCH_PHASE: ${{ inputs.phase }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne 'adaptgurus/cozystack' -or $env:GITHUB_REF -notin @('refs/heads/codex/dr-dc-trust','refs/heads/ops/layersentry-hyperv-inventory')) { throw 'Repository/ref binding failed.' }
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $files = @(git diff-tree --no-commit-id --name-only --diff-filter=A -r $env:GITHUB_SHA -- hack/layersentry/dc-console-trust-actions | Where-Object { $_ -cmatch '^hack/layersentry/dc-console-trust-actions/[a-z0-9-]+\.json$' })
            if ($LASTEXITCODE -ne 0 -or $files.Count -ne 1) { throw 'Exactly one new immutable phase request is required.' }
            $request = Get-Content -LiteralPath $files[0] -Raw | ConvertFrom-Json
            $fields = @($request.PSObject.Properties.Name | Sort-Object)
            if (($fields -join ',') -cne 'authorization,phase,schema,target,vmId' -or $request.schema -ne 1 -or $request.target -cne '10.10.10.14' -or $request.vmId -cne '29ba176b-b81a-4f47-8f51-ecec869f247f') { throw 'Phase request binding failed.' }
            $phase = [string]$request.phase
            if ($request.authorization -cne ('DC-CONSOLE-' + $phase.ToUpperInvariant())) { throw 'Explicit phase authorization mismatch.' }
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $phase = $env:DISPATCH_PHASE }
          else { throw 'Unsupported event.' }
          if ($phase -cnotin @('Observe','Login','Verify')) { throw 'Unsupported console phase.' }
          "phase=$phase" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Run explicit console phase without SSH authentication
        shell: powershell
        env:
          TRUST_PHASE: ${{ steps.request.outputs.phase }}
          DC_HOST: ${{ secrets.LAYERSENTRY_ROCKY_R0_HOST }}
          DC_USER: ${{ secrets.LAYERSENTRY_ROCKY_R0_USERNAME }}
          DC_PASSWORD: ${{ secrets.LAYERSENTRY_ROCKY_R0_PASSWORD }}
        run: |
          if ($env:GITHUB_REPOSITORY -cne 'adaptgurus/cozystack') { throw 'Repository mismatch.' }
          & hack/layersentry/invoke-dc-console-trust.ps1 -Phase $env:TRUST_PHASE
      - name: Upload sanitized phase summary and verified public-key evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layersentry-dc-console-trust-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/layersentry-dc-trust-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
