name: LayerSentry Dashboard OIDC Live Fix No Checkout

on:
  push:
    branches:
      - layersentry-platform
    paths:
      - .github/workflows/layersentry-dashboard-oidc-live-fix-no-checkout.yml
  workflow_dispatch:

concurrency:
  group: layersentry-dashboard-oidc-live-fix
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: powershell

jobs:
  fix-dashboard-oidc-live:
    name: Repair live dashboard OIDC session on TESTSER
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    env:
      KUBECONFIG: C:\hci-state\cozystack-hci-lab\kubeconfig
      KUBECTL: C:\hci-tools\kubectl.exe
      GUI_USERNAME: layersentry-admin
    steps:
      - name: Verify backend tenant and current auth drift
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:KUBECTL get nodes
          if ($LASTEXITCODE -ne 0) { throw 'cluster access failed' }
          $tenant = & $env:KUBECTL get tenant layersentry -n tenant-root -o json | ConvertFrom-Json
          $ns = & $env:KUBECTL get ns tenant-layersentry -o json | ConvertFrom-Json
          if (-not $tenant.status.ready -or $ns.status.phase -ne 'Active') { throw 'existing layersentry tenant backend is not healthy' }
          $d = & $env:KUBECTL -n cozy-dashboard get deploy incloud-web-gatekeeper -o json | ConvertFrom-Json
          $proxy = @($d.spec.template.spec.containers) | Where-Object { $_.name -eq 'auth-proxy' } | Select-Object -First 1
          if (-not $proxy) { throw 'auth-proxy missing' }
          $scope = @($proxy.args) | Where-Object { $_ -like '--scope=*' }
          $client = & $env:KUBECTL -n cozy-dashboard get keycloakclient.v1.edp.epam.com dashboard-client -o json | ConvertFrom-Json
          Write-Host "PRE_FIX tenant=layersentry ready=$($tenant.status.ready) namespace=$($ns.status.phase)"
          Write-Host "PRE_FIX liveScope=$scope"
          Write-Host "PRE_FIX defaultScopes=$([string]::Join(',', @($client.spec.defaultClientScopes))) optionalScopes=$([string]::Join(',', @($client.spec.optionalClientScopes))) clientStatus=$($client.status.value)"

      - name: Align live dashboard Keycloak client and oauth2 proxy
        run: |
          $ErrorActionPreference = 'Stop'
          $client = & $env:KUBECTL -n cozy-dashboard get keycloakclient.v1.edp.epam.com dashboard-client -o json | ConvertFrom-Json
          if ('groups' -notin @($client.spec.defaultClientScopes)) { throw 'dashboard client missing groups scope' }
          if ('kubernetes-client' -notin @($client.spec.defaultClientScopes)) { throw 'dashboard client missing kubernetes-client scope' }
          $clientPatch = @{ spec = @{ optionalClientScopes = @() } } | ConvertTo-Json -Compress -Depth 5
          & $env:KUBECTL -n cozy-dashboard patch keycloakclient.v1.edp.epam.com dashboard-client --type=merge -p $clientPatch | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'failed to remove dashboard offline_access optional scope' }

          $d = & $env:KUBECTL -n cozy-dashboard get deploy incloud-web-gatekeeper -o json | ConvertFrom-Json
          $ci = -1
          for ($i=0; $i -lt @($d.spec.template.spec.containers).Count; $i++) {
            if ($d.spec.template.spec.containers[$i].name -eq 'auth-proxy') { $ci = $i; break }
          }
          if ($ci -lt 0) { throw 'auth-proxy container missing' }
          $ai = -1
          for ($i=0; $i -lt @($d.spec.template.spec.containers[$ci].args).Count; $i++) {
            if ([string]$d.spec.template.spec.containers[$ci].args[$i] -like '--scope=*') { $ai = $i; break }
          }
          if ($ai -lt 0) { throw 'oauth2-proxy scope arg missing' }
          $jsonPatch = @(@{ op='replace'; path="/spec/template/spec/containers/$ci/args/$ai"; value='--scope=openid email profile' }) | ConvertTo-Json -Compress
          & $env:KUBECTL -n cozy-dashboard patch deployment incloud-web-gatekeeper --type=json -p $jsonPatch | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'failed to align live oauth2-proxy scope' }
          Write-Host 'LIVE_SCOPE_ALIGNMENT=PASS scope=openid-email-profile'

      - name: Invalidate all stale dashboard browser sessions
        run: |
          $ErrorActionPreference = 'Stop'
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $bytes = New-Object byte[] 16
          $rng.GetBytes($bytes)
          $alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789'
          $b = New-Object System.Text.StringBuilder
          foreach ($x in $bytes) { [void]$b.Append($alphabet[$x % $alphabet.Length]) }
          $cookieSecret = $b.ToString()
          Write-Output "::add-mask::$cookieSecret"
          $cookieB64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($cookieSecret))
          Write-Output "::add-mask::$cookieB64"
          $patch = @{ data = @{ cookieSecret = $cookieB64 } } | ConvertTo-Json -Compress -Depth 4
          & $env:KUBECTL -n cozy-dashboard patch secret dashboard-auth-config --type=merge -p $patch | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'failed to rotate dashboard cookie secret' }
          & $env:KUBECTL -n cozy-dashboard rollout restart deployment/incloud-web-gatekeeper | Out-Null
          & $env:KUBECTL -n cozy-dashboard rollout status deployment/incloud-web-gatekeeper --timeout=180s
          if ($LASTEXITCODE -ne 0) { throw 'gatekeeper rollout failed' }
          Write-Host 'DASHBOARD_SESSION_INVALIDATION=PASS'

      - name: Mint fresh dashboard identity and verify Kubernetes APIs
        run: |
          $ErrorActionPreference = 'Stop'
          function Decode-JwtPayload([string]$jwt) {
            $parts = $jwt.Split('.')
            if ($parts.Count -lt 2) { throw 'bad JWT' }
            $p = $parts[1].Replace('-','+').Replace('_','/')
            switch ($p.Length % 4) { 2 { $p += '==' }; 3 { $p += '=' } }
            return ([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($p)) | ConvertFrom-Json)
          }
          $passwordB64 = (& $env:KUBECTL -n cozy-system get secret layersentry-gui-admin-password -o jsonpath='{.data.password}' | Out-String).Trim()
          $clientSecretB64 = (& $env:KUBECTL -n cozy-dashboard get secret dashboard-client -o jsonpath='{.data.client-secret-key}' | Out-String).Trim()
          if (-not $passwordB64 -or -not $clientSecretB64) { throw 'required credential key missing' }
          Write-Output "::add-mask::$passwordB64"
          Write-Output "::add-mask::$clientSecretB64"
          $password = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($passwordB64))
          $clientSecret = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($clientSecretB64))
          Write-Output "::add-mask::$password"
          Write-Output "::add-mask::$clientSecret"
          $hostName = (& $env:KUBECTL -n cozy-keycloak get ingress -o json | ConvertFrom-Json).items | ForEach-Object { $_.spec.rules[0].host } | Where-Object { $_ -like 'keycloak.*' } | Select-Object -First 1
          if (-not $hostName) { throw 'Keycloak ingress missing' }
          $tokenUrl = "https://$hostName/realms/cozy/protocol/openid-connect/token"
          $outFile = Join-Path $env:RUNNER_TEMP 'layersentry-dashboard-postfix-token.json'
          $http = (& curl.exe -k -sS -o $outFile -w '%{http_code}' -X POST $tokenUrl --data-urlencode 'grant_type=password' --data-urlencode 'client_id=dashboard' --data-urlencode "client_secret=$clientSecret" --data-urlencode "username=$env:GUI_USERNAME" --data-urlencode "password=$password" --data-urlencode 'scope=openid email profile' | Out-String).Trim()
          $r = Get-Content $outFile -Raw | ConvertFrom-Json
          if ($http -ne '200' -or -not $r.id_token) { throw "fresh dashboard token mint failed HTTP=$http error=$($r.error)" }
          Write-Output "::add-mask::$($r.id_token)"
          if ($r.access_token) { Write-Output "::add-mask::$($r.access_token)" }
          if ($r.refresh_token) { Write-Output "::add-mask::$($r.refresh_token)" }
          $claims = Decode-JwtPayload $r.id_token
          if ('kubernetes' -notin @($claims.aud)) { throw 'fresh ID token lacks kubernetes audience' }
          if ('cozystack-cluster-admin' -notin @($claims.groups)) { throw 'fresh ID token lacks cluster admin group' }
          if ($claims.preferred_username -ne $env:GUI_USERNAME) { throw 'fresh ID token username mismatch' }

          $tn = @(& $env:KUBECTL --token=$($r.id_token) get --raw '/apis/core.cozystack.io/v1alpha1/tenantnamespaces' 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "TenantNamespaces API rejected fresh dashboard token: $($tn -join ' | ')" }
          $tenantList = $tn -join "`n" | ConvertFrom-Json
          $names = @($tenantList.items) | ForEach-Object { $_.metadata.name }
          Write-Host "TENANTNAMESPACES_API=PASS items=$([string]::Join(',', $names))"

          $plan = @(& $env:KUBECTL --token=$($r.id_token) get --raw '/apis/apiextensions.k8s.io/v1/customresourcedefinitions/plans.backups.cozystack.io' 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Plan CRD API rejected fresh dashboard token: $($plan -join ' | ')" }
          $planObj = $plan -join "`n" | ConvertFrom-Json
          if (-not $planObj.spec.versions) { throw 'Plan CRD schema response invalid' }
          Write-Host 'PLAN_CRD_API=PASS'
          Write-Host "FRESH_DASHBOARD_ID_TOKEN=PASS issuer=$($claims.iss) audience=kubernetes group=cozystack-cluster-admin user=$($claims.preferred_username)"

      - name: Verify final live state and no immediate reconciliation rollback
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Sleep -Seconds 15
          $d = & $env:KUBECTL -n cozy-dashboard get deploy incloud-web-gatekeeper -o json | ConvertFrom-Json
          $proxy = @($d.spec.template.spec.containers) | Where-Object { $_.name -eq 'auth-proxy' } | Select-Object -First 1
          $scope = @($proxy.args) | Where-Object { $_ -like '--scope=*' }
          if ($scope -ne '--scope=openid email profile') { throw "live scope reverted unexpectedly: $scope" }
          $client = & $env:KUBECTL -n cozy-dashboard get keycloakclient.v1.edp.epam.com dashboard-client -o json | ConvertFrom-Json
          Write-Host "POST_FIX liveScope=$scope"
          Write-Host "POST_FIX defaultScopes=$([string]::Join(',', @($client.spec.defaultClientScopes))) optionalScopes=$([string]::Join(',', @($client.spec.optionalClientScopes))) clientStatus=$($client.status.value)"
          & $env:KUBECTL -n cozy-dashboard get pods -l 'app.kubernetes.io/name=gatekeeper,app.kubernetes.io/instance=incloud-web' -o wide
          Write-Host 'FINAL_DASHBOARD_OIDC_FIX=PASS'
