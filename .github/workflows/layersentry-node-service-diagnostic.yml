name: LayerSentry Join Node Service Diagnostic

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - hack/layersentry/node-diagnostic-requests/*.json
      - .github/workflows/layersentry-node-service-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: layersentry-node-service-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    name: Inspect sen2 and sen3 join services over protected SSH
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 12

    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validate request and inspect nodes
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          [string[]]$requests = @(
            @(git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA -- 'hack/layersentry/node-diagnostic-requests/*.json') |
              ForEach-Object { [string]$_ } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )
          if ($LASTEXITCODE -ne 0) {
            throw "git diff-tree failed with exit code $LASTEXITCODE"
          }
          if ($requests.Count -ne 1) {
            throw "Expected exactly one node-diagnostic request; found $($requests.Count)."
          }
          $requestPath = ([string]$requests[0]).Trim()
          $request = Get-Content -LiteralPath $requestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$request.operation -ne 'READ_ONLY_JOIN_NODE_DIAGNOSTIC') {
            throw "Unsupported diagnostic operation: $($request.operation)"
          }
          if ([string]$request.authorization -ne 'USER_GRANTED_FULL_POWERSHELL_AND_INSTALL_PERMISSION') {
            throw 'The request is missing the user authorization marker.'
          }
          if ([bool]$request.writeCredentialValuesToEvidence) {
            throw 'Credential values must not be written to evidence.'
          }
          [string[]]$addresses = @($request.addresses | ForEach-Object { [string]$_ })
          if ($addresses.Count -ne 2 -or $addresses -notcontains '10.10.10.12' -or $addresses -notcontains '10.10.10.13') {
            throw 'Diagnostic addresses must be exactly 10.10.10.12 and 10.10.10.13.'
          }

          $credentialPath = 'C:\ProgramData\LayerSentry\bootstrap-credentials.json'
          if (-not (Test-Path -LiteralPath $credentialPath -PathType Leaf)) {
            throw "Protected credential file is missing: $credentialPath"
          }
          $credentials = Get-Content -LiteralPath $credentialPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $nodePassword = [string]$credentials.nodePassword
          if ([string]::IsNullOrWhiteSpace($nodePassword)) {
            throw 'Protected node password is missing.'
          }
          $secretValues = @(
            [string]$credentials.nodePassword,
            [string]$credentials.clusterToken,
            [string]$credentials.adminPassword
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }

          $ssh = Get-Command -Name 'ssh.exe' -ErrorAction Stop
          $outputRoot = Join-Path $env:RUNNER_TEMP 'layersentry-node-service-diagnostic'
          if (Test-Path -LiteralPath $outputRoot) {
            Remove-Item -LiteralPath $outputRoot -Recurse -Force
          }
          New-Item -Path $outputRoot -ItemType Directory -Force | Out-Null

          $secureRoot = Join-Path $env:RUNNER_TEMP ('layersentry-node-diagnostic-secure-' + [Guid]::NewGuid().ToString('N'))
          New-Item -Path $secureRoot -ItemType Directory -Force | Out-Null
          try {
            $acl = New-Object System.Security.AccessControl.DirectorySecurity
            $acl.SetAccessRuleProtection($true, $false)
            $inheritance = [System.Security.AccessControl.InheritanceFlags]'ContainerInherit, ObjectInherit'
            $propagation = [System.Security.AccessControl.PropagationFlags]::None
            $allow = [System.Security.AccessControl.AccessControlType]::Allow
            $fullControl = [System.Security.AccessControl.FileSystemRights]::FullControl
            foreach ($identity in @('NT AUTHORITY\SYSTEM', 'BUILTIN\Administrators')) {
              $rule = New-Object System.Security.AccessControl.FileSystemAccessRule(
                $identity, $fullControl, $inheritance, $propagation, $allow
              )
              [void]$acl.AddAccessRule($rule)
            }
            Set-Acl -LiteralPath $secureRoot -AclObject $acl

            $passwordPath = Join-Path $secureRoot 'node-password.txt'
            $askPassPath = Join-Path $secureRoot 'askpass.cmd'
            [System.IO.File]::WriteAllText(
              $passwordPath,
              $nodePassword + "`r`n",
              (New-Object System.Text.UTF8Encoding($false))
            )
            [System.IO.File]::WriteAllText(
              $askPassPath,
              "@echo off`r`ntype `"$passwordPath`"`r`n",
              (New-Object System.Text.UTF8Encoding($false))
            )

            $oldAskPass = $env:SSH_ASKPASS
            $oldRequire = $env:SSH_ASKPASS_REQUIRE
            $oldDisplay = $env:DISPLAY
            $env:SSH_ASKPASS = $askPassPath
            $env:SSH_ASKPASS_REQUIRE = 'force'
            $env:DISPLAY = 'LayerSentry'

            $summary = @()
            foreach ($address in $addresses) {
              $remotePath = Join-Path $secureRoot ($address.Replace('.', '-') + '.sh')
              $stdoutPath = Join-Path $secureRoot ($address.Replace('.', '-') + '.stdout.txt')
              $stderrPath = Join-Path $secureRoot ($address.Replace('.', '-') + '.stderr.txt')
              $remoteScript = @'
set +e
printf '%s\n' '=== identity ==='
hostname
(date -u --iso-8601=seconds 2>/dev/null || date -u)
uname -a
printf '%s\n' '=== service states ==='
for svc in rancherd rke2-server rke2-agent kubelet; do
  printf '%s\n' "--- $svc ---"
  systemctl is-enabled "$svc" 2>&1 || true
  systemctl is-active "$svc" 2>&1 || true
  systemctl show "$svc" --property=LoadState,ActiveState,SubState,Result,ExecMainStatus,ExecMainCode,NRestarts --no-pager 2>&1 || true
done
printf '%s\n' '=== matching units ==='
systemctl list-units --type=service --all --no-pager 2>&1 | grep -Ei 'rancher|rke2|kubelet|containerd' || true
printf '%s\n' '=== listeners ==='
ss -lntp 2>/dev/null | grep -E ':(22|6443|9345|10250)([[:space:]]|$)' || true
printf '%s\n' '=== processes ==='
ps -ef | grep -E '[r]ancherd|[r]ke2|[k]ubelet|[c]ontainerd' || true
printf '%s\n' '=== filesystem metadata ==='
ls -ld /etc/rancher /etc/rancher/rke2 /var/lib/rancher /var/lib/rancher/rke2 2>&1 || true
find /etc/rancher/rke2 -maxdepth 1 -type f -printf '%M %u:%g %s %TY-%Tm-%TdT%TH:%TM:%TS %p\n' 2>/dev/null || true
printf '%s\n' '=== recent rancherd/rke2 journal ==='
if sudo -n true >/dev/null 2>&1; then
  sudo -n journalctl -u rancherd -u rke2-server -u rke2-agent --since '-35 minutes' -n 320 --no-pager 2>&1 || true
else
  journalctl -u rancherd -u rke2-server -u rke2-agent --since '-35 minutes' -n 120 --no-pager 2>&1 || true
fi
'@
              $remoteScript = ($remoteScript -replace "`r`n", "`n").TrimStart([char]0xFEFF)
              [System.IO.File]::WriteAllText(
                $remotePath,
                $remoteScript,
                (New-Object System.Text.UTF8Encoding($false))
              )

              $arguments = @(
                '-T',
                '-o', 'StrictHostKeyChecking=no',
                '-o', 'UserKnownHostsFile=NUL',
                '-o', 'PreferredAuthentications=password,keyboard-interactive',
                '-o', 'PubkeyAuthentication=no',
                '-o', 'NumberOfPasswordPrompts=1',
                '-o', 'ConnectTimeout=15',
                "rancher@$address",
                'bash', '-s'
              )
              $process = Start-Process `
                -FilePath $ssh.Source `
                -ArgumentList $arguments `
                -NoNewWindow `
                -Wait `
                -PassThru `
                -RedirectStandardInput $remotePath `
                -RedirectStandardOutput $stdoutPath `
                -RedirectStandardError $stderrPath

              $combined = [string](Get-Content -LiteralPath $stdoutPath -Raw -ErrorAction SilentlyContinue) +
                "`n=== ssh stderr ===`n" +
                [string](Get-Content -LiteralPath $stderrPath -Raw -ErrorAction SilentlyContinue)
              foreach ($secret in $secretValues) {
                $combined = $combined.Replace($secret, '[REDACTED]')
              }
              $combined = [regex]::Replace(
                $combined,
                '(?i)K10[a-z0-9]{20,}::server:[a-z0-9]{20,}',
                '[REDACTED-RKE2-TOKEN]'
              )
              $combined = [regex]::Replace(
                $combined,
                '(?im)^([[:space:]]*(token|password)[[:space:]]*[:=][[:space:]]*).+$',
                '$1[REDACTED]'
              )
              $safePath = Join-Path $outputRoot ($address.Replace('.', '-') + '.txt')
              Set-Content -LiteralPath $safePath -Value $combined -Encoding UTF8

              $summary += [ordered]@{
                address = $address
                sshExitCode = $process.ExitCode
                tcp9345Mentioned = ($combined -match ':9345')
                tcp10250Mentioned = ($combined -match ':10250')
                rancherdActive = ($combined -match '(?ms)--- rancherd ---.*?\r?\nactive\r?\n')
                rke2ServerActive = ($combined -match '(?ms)--- rke2-server ---.*?\r?\nactive\r?\n')
                rke2AgentActive = ($combined -match '(?ms)--- rke2-agent ---.*?\r?\nactive\r?\n')
              }
            }
            $summary | ConvertTo-Json -Depth 8 |
              Set-Content -LiteralPath (Join-Path $outputRoot 'summary.json') -Encoding UTF8
            $summary | Format-Table -AutoSize | Out-String -Width 240 | Write-Host
          }
          finally {
            $env:SSH_ASKPASS = $oldAskPass
            $env:SSH_ASKPASS_REQUIRE = $oldRequire
            $env:DISPLAY = $oldDisplay
            if (Test-Path -LiteralPath $secureRoot) {
              Remove-Item -LiteralPath $secureRoot -Recurse -Force -ErrorAction SilentlyContinue
            }
            $nodePassword = $null
            $credentials = $null
          }

      - name: Upload sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layersentry-node-service-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}\layersentry-node-service-diagnostic
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
