name: LayerSentry Repair sen2 Agent Service Conflict

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - hack/layersentry/sen2-service-repair-requests/*.json

permissions:
  contents: read

concurrency:
  group: layersentry-sen2-agent-service-conflict-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Disable stale sen2 server loop and prove sustained three-node health
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 55

    steps:
      - name: Checkout exact repair source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Select request and validate PowerShell sources
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [string[]]$requests = @(
            @(git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA -- 'hack/layersentry/sen2-service-repair-requests/*.json') |
              ForEach-Object { [string]$_ } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )
          if ($LASTEXITCODE -ne 0) {
            throw "git diff-tree failed with exit code $LASTEXITCODE"
          }
          if ($requests.Count -ne 1) {
            throw "Expected exactly one sen2 service-repair request; found $($requests.Count)."
          }
          $requestPath = ([string]$requests[0]).Trim()
          if (-not (Test-Path -LiteralPath $requestPath -PathType Leaf)) {
            throw "Request file is missing: $requestPath"
          }

          foreach ($relative in @(
            'hack/layersentry/repair-sen2-agent-service-conflict.ps1',
            'hack/layersentry/complete-three-node-runtime.ps1'
          )) {
            $tokens = $null
            $errors = $null
            $path = (Resolve-Path -LiteralPath $relative).ProviderPath
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}:{1}: {2}" -f $path, $_.Extent.StartLineNumber, $_.Message)
              }
              exit 1
            }
          }

          "REQUEST_PATH=$requestPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Selected authorized sen2 service-repair request: $requestPath"

      - name: Repair sen2 service role and enforce twelve-minute local stability
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'layersentry-sen2-agent-service-repair'
          & 'hack/layersentry/repair-sen2-agent-service-conflict.ps1' `
            -RequestPath $env:REQUEST_PATH `
            -CredentialPath 'C:\ProgramData\LayerSentry\bootstrap-credentials.json' `
            -OutputDirectory $root `
            -InitialWaitMinutes 15 `
            -StableSamples 24 `
            -StableIntervalSeconds 30

      - name: Complete authenticated Kubernetes, KubeVirt and Longhorn validation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'layersentry-sen2-agent-service-repair'
          & 'hack/layersentry/complete-three-node-runtime.ps1' `
            -ClusterUrl 'https://10.10.10.10' `
            -PrimaryNode '10.10.10.11' `
            -NodeAddresses @('10.10.10.11', '10.10.10.12', '10.10.10.13') `
            -CredentialPath 'C:\ProgramData\LayerSentry\bootstrap-credentials.json' `
            -MaxWaitMinutes 20 `
            -OutputDirectory (Join-Path $root 'runtime')

      - name: Build sanitized terminal result
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'layersentry-sen2-agent-service-repair'
          New-Item -Path $root -ItemType Directory -Force | Out-Null
          $repairPath = Join-Path $root 'repair-result.json'
          $runtimePath = Join-Path $root 'runtime\runtime-completion.json'
          $repair = $null
          $runtime = $null
          if (Test-Path -LiteralPath $repairPath -PathType Leaf) {
            $repair = Get-Content -LiteralPath $repairPath -Raw -Encoding UTF8 | ConvertFrom-Json
          }
          if (Test-Path -LiteralPath $runtimePath -PathType Leaf) {
            $runtime = Get-Content -LiteralPath $runtimePath -Raw -Encoding UTF8 | ConvertFrom-Json
          }
          $repairPassed = $null -ne $repair -and [bool]$repair.passed
          $runtimePassed = $null -ne $runtime -and [bool]$runtime.passed
          $overall = $repairPassed -and $runtimePassed
          $failure = if (-not $repairPassed -and $null -ne $repair) {
            [string]$repair.failure
          }
          elseif (-not $runtimePassed -and $null -ne $runtime) {
            [string]$runtime.failure
          }
          elseif (-not $repairPassed) {
            'sen2 repair evidence was not generated.'
          }
          elseif (-not $runtimePassed) {
            'Authenticated runtime evidence was not generated.'
          }
          else {
            $null
          }

          [ordered]@{
            schemaVersion = '1.0'
            sourceCommit = $env:GITHUB_SHA
            workflowRunId = $env:GITHUB_RUN_ID
            completedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            sen2ServiceConflictRepairPassed = $repairPassed
            consecutiveSen2StabilitySamples = if ($null -ne $repair) { [int]$repair.consecutiveStableSamples } else { 0 }
            authenticatedRuntimeValidationPassed = $runtimePassed
            installationApiCompletion = $overall
            rke2DataDeleted = $false
            vmDiskWiped = $false
            vmReinstalled = $false
            credentialValuesWrittenToEvidence = $false
            eulaAutomaticallyAccepted = $false
            workloadQualified = $false
            trueAirgapQualified = $false
            haQualified = $false
            upgradeQualified = $false
            backupRestoreQualified = $false
            productionReleaseApproved = $false
            failure = $failure
          } | ConvertTo-Json -Depth 10 |
            Set-Content -LiteralPath (Join-Path $root 'terminal-result.json') -Encoding UTF8

          $marker = if ($overall) { 'SUCCESS' } else { 'FAILURE' }
          New-Item -Path (Join-Path $root $marker) -ItemType File -Force | Out-Null
          @"
          # LayerSentry sen2 service-conflict terminal result

          - sen2 service-role repair passed: **$repairPassed**
          - Consecutive sen2 local stability samples: **$(if ($null -ne $repair) { [int]$repair.consecutiveStableSamples } else { 0 })**
          - Authenticated Kubernetes/KubeVirt/Longhorn validation passed: **$runtimePassed**
          - Installation/API completion: **$overall**
          - RKE2 data deleted: **false**
          - VM disk wiped or VM reinstalled: **false**
          - Production release approved: **false**
          - Failure: $failure
          "@ | Set-Content -LiteralPath (Join-Path $root 'TERMINAL-STATUS.md') -Encoding UTF8
          Get-Content -LiteralPath (Join-Path $root 'TERMINAL-STATUS.md')

      - name: Upload sanitized repair and runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layersentry-sen2-agent-service-repair-${{ github.run_id }}
          path: ${{ runner.temp }}\layersentry-sen2-agent-service-repair\**
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce terminal repair and runtime completion
        shell: powershell
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP 'layersentry-sen2-agent-service-repair\terminal-result.json'
          if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) {
            throw 'Terminal result is missing.'
          }
          $result = Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if (-not [bool]$result.installationApiCompletion) {
            throw "LayerSentry sen2 service-conflict repair failed: $($result.failure)"
          }
          Write-Host 'LAYERSENTRY SEN2 SERVICE-CONFLICT REPAIR AND RUNTIME VALIDATION: PASS'
