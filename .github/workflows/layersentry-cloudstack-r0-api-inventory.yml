name: LayerSentry CloudStack R0 API Inventory

on:
  workflow_dispatch:
    inputs:
      target_profile:
        description: Credential and endpoint binding for the disposable lab
        required: true
        default: dc
        type: choice
        options: [dc, dr]
      refresh_private_ip_capacity:
        description: Refresh derived native Pod IP counters only; no network allocation changes
        type: boolean
        default: false
      api_endpoint:
        description: CloudStack API endpoint, including /client/api
        required: true
        type: string
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - .github/workflows/layersentry-cloudstack-r0-api-inventory.yml
      - hack/layersentry/cloudstack-r0-api-inventory-requests/*.json

permissions:
  contents: read

concurrency:
  group: layersentry-cloudstack-r0-api-inventory
  cancel-in-progress: false

jobs:
  inventory:
    name: Read-only authenticated CloudStack inventory
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    env:
      CLOUDSTACK_API_ENDPOINT: ${{ inputs.api_endpoint || 'http://10.10.10.14:8080/client/api' }}
      REFRESH_PRIVATE_IP_CAPACITY: ${{ inputs.refresh_private_ip_capacity || 'false' }}
      TARGET_PROFILE: ${{ inputs.target_profile || 'dc' }}
      CLOUDSTACK_API_KEY: ${{ secrets[inputs.target_profile == 'dr' && 'LAYERSENTRY_DR_CLOUDSTACK_API_KEY' || 'LAYERSENTRY_CLOUDSTACK_API_KEY'] }}
      CLOUDSTACK_SECRET_KEY: ${{ secrets[inputs.target_profile == 'dr' && 'LAYERSENTRY_DR_CLOUDSTACK_SECRET_KEY' || 'LAYERSENTRY_CLOUDSTACK_SECRET_KEY'] }}

    steps:
      - name: Collect sanitized read-only API inventory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          if ([string]::IsNullOrWhiteSpace($env:CLOUDSTACK_API_KEY) -or
              [string]::IsNullOrWhiteSpace($env:CLOUDSTACK_SECRET_KEY)) {
            throw 'Required CloudStack API credentials are unavailable. Configure the scoped LayerSentry API key and secret as repository or environment secrets.'
          }

          $endpoint = [Uri]$env:CLOUDSTACK_API_ENDPOINT
          $expectedEndpoints = @{ dc = 'http://10.10.10.14:8080/client/api'; dr = 'http://10.10.10.20:8080/client/api' }
          if (-not $expectedEndpoints.ContainsKey($env:TARGET_PROFILE) -or
              $endpoint.AbsoluteUri -cne $expectedEndpoints[$env:TARGET_PROFILE]) {
            throw 'API endpoint does not match the selected disposable-lab credential profile.'
          }
          if ($endpoint.Scheme -notin @('http', 'https')) {
            throw 'The CloudStack API endpoint must use http or https.'
          }
          if (-not $endpoint.AbsolutePath.EndsWith('/client/api')) {
            throw 'The CloudStack API endpoint must end with /client/api.'
          }

          $evidence = Join-Path $env:RUNNER_TEMP 'layersentry-cloudstack-r0-api-inventory'
          if (Test-Path -LiteralPath $evidence) {
            Remove-Item -LiteralPath $evidence -Recurse -Force
          }
          New-Item -Path $evidence -ItemType Directory -Force | Out-Null
          $collectionObservations = [ordered]@{}

          function ConvertTo-Rfc3986 {
            param([Parameter(Mandatory = $true)][string]$Value)
            return [Uri]::EscapeDataString($Value).Replace('%7E', '~')
          }

          function Invoke-CloudStackReadOnlyApi {
            param(
              [Parameter(Mandatory = $true)][string]$Command,
              [hashtable]$Parameters = @{}
            )

            if ($Command -cnotmatch '^list[A-Za-z]+$') { throw 'Only list APIs are allowed.' }

            $query = [ordered]@{
              apikey = $env:CLOUDSTACK_API_KEY
              command = $Command
              response = 'json'
            }
            foreach ($name in $Parameters.Keys) {
              $query[[string]$name] = [string]$Parameters[$name]
            }

            $pairs = @(
              $query.GetEnumerator() |
                Sort-Object { ([string]$_.Key).ToLowerInvariant() } |
                ForEach-Object {
                  '{0}={1}' -f (ConvertTo-Rfc3986 ([string]$_.Key)), (ConvertTo-Rfc3986 ([string]$_.Value))
                }
            )
            $canonical = (($pairs -join '&').ToLowerInvariant())
            $hmac = New-Object System.Security.Cryptography.HMACSHA1
            try {
              $hmac.Key = [Text.Encoding]::UTF8.GetBytes($env:CLOUDSTACK_SECRET_KEY)
              $signature = [Convert]::ToBase64String($hmac.ComputeHash([Text.Encoding]::UTF8.GetBytes($canonical)))
            }
            finally {
              $hmac.Dispose()
            }

            $uri = '{0}?{1}&signature={2}' -f $endpoint.AbsoluteUri, ($pairs -join '&'), (ConvertTo-Rfc3986 $signature)
            try {
              return Invoke-RestMethod -Uri $uri -Method Get -TimeoutSec 20 -MaximumRedirection 0 -ErrorAction Stop
            }
            catch {
              $exceptionType = $_.Exception.GetType().FullName
              $apiErrorCode = $null
              $httpStatusCode = $null
              $failureRecord = $_
              $responseProperty = $failureRecord.Exception.PSObject.Properties['Response']
              $httpResponse = if ($null -ne $responseProperty) { $responseProperty.Value } else { $null }
              if ($null -ne $httpResponse) {
                try {
                  $numericStatus = [int]$httpResponse.StatusCode
                  if ($numericStatus -ge 100 -and $numericStatus -le 599) { $httpStatusCode = $numericStatus }
                }
                catch { $httpStatusCode = $null }
              }
              # PowerShell 7 exposes the consumed body in ErrorDetails.Message;
              # Windows PowerShell 5 may instead expose a WebResponse stream.
              # Retain only numeric codes, never the body, error text or URL.
              $errorBodies = @()
              if ($null -ne $failureRecord.ErrorDetails) { $errorBodies += $failureRecord.ErrorDetails.Message }
              if ($null -ne $httpResponse -and $null -ne $httpResponse.PSObject.Methods['GetResponseStream']) {
                try {
                  $stream = $httpResponse.GetResponseStream()
                  $reader = New-Object IO.StreamReader($stream)
                  try {
                    $errorBodies += $reader.ReadToEnd()
                  }
                  finally {
                    $reader.Dispose()
                    $stream.Dispose()
                  }
                }
                catch { }
              }
              foreach ($errorBody in $errorBodies) {
                try {
                  $errorResponse = $errorBody | ConvertFrom-Json -ErrorAction Stop
                  foreach ($responseName in @('errorresponse', "$($Command.ToLowerInvariant())response")) {
                    $errorPayload = $errorResponse.PSObject.Properties[$responseName]
                    if ($null -eq $errorPayload) { continue }
                    $codeProperty = $errorPayload.Value.PSObject.Properties['errorcode']
                    $numericCode = 0
                    if ($null -ne $codeProperty -and [int]::TryParse([string]$codeProperty.Value, [ref]$numericCode)) {
                      $apiErrorCode = $numericCode
                    }
                  }
                }
                catch { }
              }
              $failure = New-Object System.Management.Automation.RuntimeException("Read-only CloudStack API command $Command failed ($exceptionType).")
              $failure.Data['ApiErrorCode'] = $apiErrorCode
              $failure.Data['HttpStatusCode'] = $httpStatusCode
              throw $failure
            }
          }

          function Get-ResponsePayload {
            param(
              [Parameter(Mandatory = $true)][object]$Response,
              [Parameter(Mandatory = $true)][string]$Command
            )
            $propertyName = "$($Command.ToLowerInvariant())response"
            $property = $Response.PSObject.Properties[$propertyName]
            if ($null -eq $property) {
              throw "CloudStack response for $Command did not contain $propertyName."
            }
            return $property.Value
          }

          function Select-InventoryItems {
            param(
              [Parameter(Mandatory = $true)][object]$Payload,
              [Parameter(Mandatory = $true)][string]$Collection,
              [Parameter(Mandatory = $true)][string[]]$Properties
            )
            $collectionProperty = $Payload.PSObject.Properties[$Collection]
            $items = @()
            if ($null -ne $collectionProperty -and $null -ne $collectionProperty.Value) {
              $items = @($collectionProperty.Value | Where-Object { $null -ne $_ })
            }
            $countProperty = $Payload.PSObject.Properties['count']
            $reportedCount = if ($null -eq $countProperty) { $null } else { [long]$countProperty.Value }
            $collectionObservations[$Collection] = [ordered]@{
              ReturnedCount = @($items).Count
              ReportedCount = $reportedCount
              Truncated = ($null -ne $reportedCount -and $reportedCount -gt @($items).Count)
            }
            return @($items | Select-Object -Property $Properties)
          }

          function Invoke-OptionalCloudStackReadOnlyApi {
            param(
              [Parameter(Mandatory = $true)][string]$Command,
              [hashtable]$Parameters = @{}
            )

            try {
              $payload = Get-ResponsePayload (Invoke-CloudStackReadOnlyApi $Command $Parameters) $Command
              return [pscustomobject]@{ Status = 'AVAILABLE'; Payload = $payload; ErrorType = $null; ApiErrorCode = $null; HttpStatusCode = $null }
            }
            catch {
              # Optional plugins are not installed on every CloudStack deployment. Keep
              # evidence useful without exposing response bodies, signed URLs, or secrets.
              $apiErrorCode = $_.Exception.Data['ApiErrorCode']
              # 431 can mean an invalid parameter; it does not prove absent support.
              $status = 'FAILED'
              return [pscustomobject]@{
                Status = $status
                Payload = $null
                ErrorType = $_.Exception.GetType().FullName
                ApiErrorCode = $apiErrorCode
                HttpStatusCode = $_.Exception.Data['HttpStatusCode']
              }
            }
          }

          $refreshPrivateIpCapacity = $env:REFRESH_PRIVATE_IP_CAPACITY -ceq 'true'
          if ($refreshPrivateIpCapacity -and $env:TARGET_PROFILE -cne 'dc') { throw 'Derived counter refresh is bound to DC only.' }
          $capabilities = Get-ResponsePayload (Invoke-CloudStackReadOnlyApi 'listCapabilities') 'listCapabilities'
          $managementPayload = Get-ResponsePayload (Invoke-CloudStackReadOnlyApi 'listManagementServers') 'listManagementServers'
          $networksPayload = Get-ResponsePayload (Invoke-CloudStackReadOnlyApi 'listNetworks' @{ listall = 'true' }) 'listNetworks'
          $templatesPayload = Get-ResponsePayload (Invoke-CloudStackReadOnlyApi 'listTemplates' @{ templatefilter = 'all'; listall = 'true' }) 'listTemplates'
          $providersObservation = Invoke-OptionalCloudStackReadOnlyApi 'listBackupProviders'
          $backupsObservation = Invoke-OptionalCloudStackReadOnlyApi 'listBackups' @{ listall = 'true' }
          $zonesPayload = Get-ResponsePayload (Invoke-CloudStackReadOnlyApi 'listZones' @{ listall = 'true' }) 'listZones'
          $podsPayload = Get-ResponsePayload (Invoke-CloudStackReadOnlyApi 'listPods' @{ listall = 'true' }) 'listPods'
          $podIpRanges = @()
          $podProperty = $podsPayload.PSObject.Properties['pod']
          if ($null -ne $podProperty) {
            foreach ($pod in @($podProperty.Value)) {
              $rangesProperty = $pod.PSObject.Properties['ipranges']
              if ($null -ne $rangesProperty) {
                foreach ($range in @($rangesProperty.Value)) {
                  $safe = $range | Select-Object startip, endip, gateway, cidr, vlanid, forsystemvms
                  $safe | Add-Member -NotePropertyName podid -NotePropertyValue $pod.id
                  $podIpRanges += $safe
                }
              }
            }
          }
          $capacityParams = @{ type = '5'; fetchlatest = $refreshPrivateIpCapacity.ToString().ToLowerInvariant(); page = '1'; pagesize = '100' }
          if ($env:TARGET_PROFILE -ceq 'dc') { $capacityParams.podid = '020dc658-af4e-4e2e-bed5-0607de8a787f'; $capacityParams.zoneid = '929d1f2c-d629-41ed-96b4-6c48a288d056' }
          $capacityPayload = Get-ResponsePayload (Invoke-CloudStackReadOnlyApi 'listCapacity' $capacityParams) 'listCapacity'
          $routersPayload = Get-ResponsePayload (Invoke-CloudStackReadOnlyApi 'listRouters' @{ listall = 'true'; page = '1'; pagesize = '100' }) 'listRouters'
          $vlanPayload = Get-ResponsePayload (Invoke-CloudStackReadOnlyApi 'listVlanIpRanges' @{ page = '1'; pagesize = '100' }) 'listVlanIpRanges'
          $systemVmsPayload = Get-ResponsePayload (Invoke-CloudStackReadOnlyApi 'listSystemVms' @{ page = '1'; pagesize = '100' }) 'listSystemVms'
          $physicalPayload = Get-ResponsePayload (Invoke-CloudStackReadOnlyApi 'listPhysicalNetworks' @{ page = '1'; pagesize = '100' }) 'listPhysicalNetworks'
          $physicalNetworks = @(Select-InventoryItems $physicalPayload 'physicalnetwork' @('id', 'name', 'zoneid', 'state', 'broadcastdomainrange', 'isolationmethods', 'vlan'))
          $trafficTypes = @()
          foreach ($physical in $physicalNetworks) {
            if ([string]$physical.id -notmatch '^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$') { throw 'Invalid physical network identity.' }
            $trafficPayload = Get-ResponsePayload (Invoke-CloudStackReadOnlyApi 'listTrafficTypes' @{ physicalnetworkid = [string]$physical.id; page = '1'; pagesize = '100' }) 'listTrafficTypes'
            $trafficTypes += @(Select-InventoryItems $trafficPayload 'traffictype' @('id', 'traffictype', 'physicalnetworkid', 'kvmnetworklabel'))
            # Preserve each physical network's count instead of overwriting evidence.
            $collectionObservations['traffictype:' + [string]$physical.id] = $collectionObservations['traffictype']
          }
          $collectionObservations.Remove('traffictype')
          $clustersPayload = Get-ResponsePayload (Invoke-CloudStackReadOnlyApi 'listClusters' @{ listall = 'true' }) 'listClusters'
          $hostsPayload = Get-ResponsePayload (Invoke-CloudStackReadOnlyApi 'listHosts' @{ listall = 'true'; type = 'Routing' }) 'listHosts'
          $storagePayload = Get-ResponsePayload (Invoke-CloudStackReadOnlyApi 'listStoragePools' @{ listall = 'true' }) 'listStoragePools'
          $imageStoresPayload = Get-ResponsePayload (Invoke-CloudStackReadOnlyApi 'listImageStores' @{ listall = 'true' }) 'listImageStores'
          $repositoriesObservation = Invoke-OptionalCloudStackReadOnlyApi 'listBackupRepositories' @{ listall = 'true' }
          $offeringsObservation = Invoke-OptionalCloudStackReadOnlyApi 'listBackupOfferings' @{ listall = 'true' }
          $virtualMachinesPayload = Get-ResponsePayload (Invoke-CloudStackReadOnlyApi 'listVirtualMachines' @{ listall = 'true'; details = 'min' }) 'listVirtualMachines'
          # BaseListCmd in 4.22.1.1 requires page and pagesize together.
          $jobsObservation = Invoke-OptionalCloudStackReadOnlyApi 'listAsyncJobs' @{ listall = 'true'; page = '1'; pagesize = '100' }

          $configurationNames = @(
            'backup.framework.enabled'
            'backup.framework.provider.plugin'
            'backup.framework.sync.interval'
          )
          $configurations = @()
          foreach ($configurationName in $configurationNames) {
            $payload = Get-ResponsePayload (Invoke-CloudStackReadOnlyApi 'listConfigurations' @{ name = $configurationName }) 'listConfigurations'
            $configurations += Select-InventoryItems $payload 'configuration' @('name', 'value', 'scope', 'zonename')
          }

          $inventory = [ordered]@{
            EvidenceClass = if ($refreshPrivateIpCapacity) { 'NATIVE_DERIVED_CAPACITY_REFRESH_AND_API_INVENTORY' } else { 'R0_READ_ONLY_AUTHENTICATED_API' }
            RunId = $env:GITHUB_RUN_ID
            Repository = $env:GITHUB_REPOSITORY
            Commit = $env:GITHUB_SHA
            CapturedUtc = [DateTime]::UtcNow.ToString('o')
            Endpoint = '{0}://{1}{2}' -f $endpoint.Scheme, $endpoint.Authority, $endpoint.AbsolutePath
            MutationPerformed = $refreshPrivateIpCapacity
            MutationScope = if ($refreshPrivateIpCapacity) { 'DERIVED_CAPACITY_COUNTERS_ONLY' } else { 'NONE' }
            TargetProfile = $env:TARGET_PROFILE
            SupportClusterUuidStatus = 'UNKNOWN'
            CollectionScope = 'Single API page per collection; counts below expose truncation. Not a readiness certification.'
            Capabilities = Select-InventoryItems $capabilities 'capability' @('cloudstackversion', 'kvmsnapshotenabled')
            ManagementServers = Select-InventoryItems $managementPayload 'managementserver' @('id', 'name', 'version', 'state', 'ipaddress', 'agentscount', 'pendingjobscount')
            Networks = Select-InventoryItems $networksPayload 'network' @('id', 'name', 'zoneid', 'state', 'type', 'networkofferingid', 'vpcid', 'cidr', 'gateway', 'broadcastdomaintype')
            Templates = Select-InventoryItems $templatesPayload 'template' @('id', 'name', 'zoneid', 'isready', 'hypervisor', 'format', 'size', 'templatetype', 'checksum')
            Zones = Select-InventoryItems $zonesPayload 'zone' @('id', 'name', 'networktype', 'allocationstate', 'localstorageenabled')
            Pods = Select-InventoryItems $podsPayload 'pod' @('id', 'name', 'zoneid', 'zonename', 'allocationstate', 'gateway', 'netmask', 'startip', 'endip')
            PodIpRanges = $podIpRanges
            PrivateIpCapacity = Select-InventoryItems $capacityPayload 'capacity' @('type', 'zoneid', 'podid', 'capacityused', 'capacityallocated', 'capacitytotal', 'percentused')
            VirtualRouters = Select-InventoryItems $routersPayload 'router' @('id', 'name', 'zoneid', 'podid', 'hostid', 'state', 'privateip', 'publicip', 'guestip', 'linklocalip')
            VlanIpRanges = Select-InventoryItems $vlanPayload 'vlaniprange' @('id', 'zoneid', 'podid', 'networkid', 'physicalnetworkid', 'vlan', 'gateway', 'netmask', 'startip', 'endip', 'forvirtualnetwork')
            PhysicalNetworks = $physicalNetworks
            TrafficTypes = $trafficTypes
            SystemVms = Select-InventoryItems $systemVmsPayload 'systemvm' @('id', 'name', 'systemvmtype', 'zoneid', 'podid', 'hostid', 'state', 'privateip', 'publicip', 'guestip', 'linklocalip', 'templateid', 'agentstate')
            Clusters = Select-InventoryItems $clustersPayload 'cluster' @('id', 'name', 'zoneid', 'zonename', 'podid', 'podname', 'hypervisortype', 'allocationstate', 'managedstate')
            Hosts = Select-InventoryItems $hostsPayload 'host' @('id', 'name', 'zoneid', 'zonename', 'podid', 'podname', 'clusterid', 'clustername', 'hypervisor', 'hypervisorversion', 'state', 'resourcestate', 'hahost')
            PrimaryStorage = Select-InventoryItems $storagePayload 'storagepool' @('id', 'name', 'zoneid', 'zonename', 'podid', 'podname', 'clusterid', 'clustername', 'type', 'scope', 'state', 'capacityiops', 'overprovisionfactor')
            ImageStores = Select-InventoryItems $imageStoresPayload 'imagestore' @('id', 'name', 'zoneid', 'zonename', 'protocol', 'readonly', 'scope')
            BackupApiObservations = [ordered]@{
              listBackupProviders = [ordered]@{ Status = $providersObservation.Status; ErrorType = $providersObservation.ErrorType; ApiErrorCode = $providersObservation.ApiErrorCode }
              listBackups = [ordered]@{ Status = $backupsObservation.Status; ErrorType = $backupsObservation.ErrorType; ApiErrorCode = $backupsObservation.ApiErrorCode }
              listBackupRepositories = [ordered]@{ Status = $repositoriesObservation.Status; ErrorType = $repositoriesObservation.ErrorType; ApiErrorCode = $repositoriesObservation.ApiErrorCode }
              listBackupOfferings = [ordered]@{ Status = $offeringsObservation.Status; ErrorType = $offeringsObservation.ErrorType; ApiErrorCode = $offeringsObservation.ApiErrorCode }
            }
            AsyncJobsApiObservation = [ordered]@{ Status = $jobsObservation.Status; ErrorType = $jobsObservation.ErrorType; ApiErrorCode = $jobsObservation.ApiErrorCode }
            BackupRepositories = if ($repositoriesObservation.Status -eq 'AVAILABLE') { Select-InventoryItems $repositoriesObservation.Payload 'backuprepository' @('id', 'name', 'zoneid', 'zonename', 'provider', 'crosszoneinstancecreation') } else { @() }
            BackupOfferings = if ($offeringsObservation.Status -eq 'AVAILABLE') { Select-InventoryItems $offeringsObservation.Payload 'backupoffering' @('id', 'name', 'provider', 'zoneid', 'zonename', 'allowuserdrivenbackups') } else { @() }
            BackupConfigurations = $configurations
            BackupProviders = if ($providersObservation.Status -eq 'AVAILABLE') { Select-InventoryItems $providersObservation.Payload 'providers' @('name') } else { @() }
            Backups = if ($backupsObservation.Status -eq 'AVAILABLE') { Select-InventoryItems $backupsObservation.Payload 'backup' @('id', 'virtualmachineid', 'zoneid', 'status', 'type', 'created', 'size', 'backupofferingid') } else { @() }
            VirtualMachines = Select-InventoryItems $virtualMachinesPayload 'virtualmachine' @('id', 'name', 'displayname', 'zoneid', 'zonename', 'state', 'hypervisor', 'haenable', 'account', 'domainid', 'domain')
            RecentAsyncJobs = if ($jobsObservation.Status -eq 'AVAILABLE') { Select-InventoryItems $jobsObservation.Payload 'asyncjobs' @('jobid', 'cmd', 'jobstatus', 'created', 'completed', 'account', 'domainid') } else { @() }
          }

          $jsonPath = Join-Path $evidence 'inventory.json'
          # PowerShell unrolls function results: normalize every public collection
          # after projection, including zero and singleton optional collections.
          foreach ($field in @('Capabilities', 'ManagementServers', 'Zones', 'Pods', 'PodIpRanges', 'PrivateIpCapacity', 'VirtualRouters', 'VlanIpRanges', 'PhysicalNetworks', 'TrafficTypes', 'SystemVms', 'Clusters', 'Hosts', 'PrimaryStorage', 'ImageStores', 'Networks', 'Templates', 'BackupRepositories', 'BackupOfferings', 'BackupProviders', 'Backups', 'BackupConfigurations', 'VirtualMachines', 'RecentAsyncJobs')) {
            $inventory[$field] = @($inventory[$field] | Where-Object { $null -ne $_ })
          }
          $inventory.BackupApiObservations.listBackupProviders.HttpStatusCode = $providersObservation.HttpStatusCode
          $inventory.BackupApiObservations.listBackups.HttpStatusCode = $backupsObservation.HttpStatusCode
          $inventory.BackupApiObservations.listBackupRepositories.HttpStatusCode = $repositoriesObservation.HttpStatusCode
          $inventory.BackupApiObservations.listBackupOfferings.HttpStatusCode = $offeringsObservation.HttpStatusCode
          $inventory.AsyncJobsApiObservation.HttpStatusCode = $jobsObservation.HttpStatusCode
          $inventory.CollectionObservations = $collectionObservations
          $incomplete = @($collectionObservations.Values | Where-Object { $_.Truncated }).Count -gt 0 -or
            @($providersObservation, $backupsObservation, $repositoriesObservation, $offeringsObservation, $jobsObservation | Where-Object { $_.Status -ne 'AVAILABLE' }).Count -gt 0
          $inventory.InventoryComplete = -not $incomplete
          $summaryPath = Join-Path $evidence 'summary.txt'
          $inventory | ConvertTo-Json -Depth 12 | Set-Content -Path $jsonPath -Encoding UTF8
          @(
            'LAYERSENTRY_CLOUDSTACK_R0_API_INVENTORY'
            "RUN_ID=$env:GITHUB_RUN_ID"
            "COMMIT=$env:GITHUB_SHA"
            "ZONE_COUNT=$(@($inventory.Zones).Count)"
            "KVM_HOST_COUNT=$(@($inventory.Hosts | Where-Object { $_.hypervisor -eq 'KVM' }).Count)"
            "BACKUP_REPOSITORY_COUNT=$(@($inventory.BackupRepositories).Count)"
            "BACKUP_OFFERING_COUNT=$(@($inventory.BackupOfferings).Count)"
            "BACKUP_REPOSITORIES_API_STATUS=$($inventory.BackupApiObservations.listBackupRepositories.Status)"
            "BACKUP_OFFERINGS_API_STATUS=$($inventory.BackupApiObservations.listBackupOfferings.Status)"
            "ASYNC_JOBS_API_STATUS=$($inventory.AsyncJobsApiObservation.Status)"
            "VM_COUNT=$(@($inventory.VirtualMachines).Count)"
            "MUTATION_PERFORMED=$($inventory.MutationPerformed)"
            "MUTATION_SCOPE=$($inventory.MutationScope)"
            "INVENTORY_COMPLETE=$($inventory.InventoryComplete)"
          ) | Set-Content -Path $summaryPath -Encoding UTF8
          Get-Content -LiteralPath $summaryPath
          if ($incomplete) { throw 'Inventory is partial: inspect collection counts and API observations; no readiness claim is valid.' }

      - name: Upload sanitized API inventory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layersentry-cloudstack-r0-api-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}\layersentry-cloudstack-r0-api-inventory\**
          if-no-files-found: error
          retention-days: 30
