name: LayerSentry Source Watcher Ready Repair

on:
  push:
    branches: [layersentry-platform]
    paths:
      - .github/workflows/layersentry-source-watcher-ready-repair-dev.yml

permissions:
  contents: write

concurrency:
  group: layersentry-source-watcher-ready-repair-dev
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: layersentry-platform
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply proof-based lost Ready repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('internal/operator/packagesource_reconciler.go')
          s=p.read_text()
          old='''\tif isOwnMarker || isProgressingInRecovery || artifactGeneratorStuck(ag, readyCondition, now) {\n\t\tlogger.V(1).Info("routing to recovery state machine",\n\t\t\t"packageSource", packageSource.Name,\n\t\t\t"artifactGenerator", ag.Name,\n\t\t\t"attempts", attempts,\n\t\t\t"ownMarker", isOwnMarker,\n\t\t\t"progressingInRecovery", isProgressingInRecovery)\n\t\treturn r.maybeRecoverArtifactGenerator(ctx, packageSource, ag, readyCondition, now)\n\t}\n'''
          new='''\tif isOwnMarker || isProgressingInRecovery || artifactGeneratorStuck(ag, readyCondition, now) {\n\t\trepaired, err := r.repairLostArtifactGeneratorReady(ctx, ag, readyCondition, now)\n\t\tif err != nil {\n\t\t\treturn ctrl.Result{}, fmt.Errorf("prove and repair lost ArtifactGenerator Ready condition: %w", err)\n\t\t}\n\t\tif repaired {\n\t\t\treadyCondition = meta.FindStatusCondition(ag.Status.Conditions, "Ready")\n\t\t\tlogger.Info("repaired source-watcher lost Ready condition from current-source artifact evidence",\n\t\t\t\t"packageSource", packageSource.Name, "artifactGenerator", ag.Name,\n\t\t\t\t"observedSourcesDigest", ag.Status.ObservedSourcesDigest, "inventory", len(ag.Status.Inventory))\n\t\t} else {\n\t\t\tlogger.V(1).Info("routing to recovery state machine",\n\t\t\t\t"packageSource", packageSource.Name,\n\t\t\t\t"artifactGenerator", ag.Name,\n\t\t\t\t"attempts", attempts,\n\t\t\t\t"ownMarker", isOwnMarker,\n\t\t\t\t"progressingInRecovery", isProgressingInRecovery)\n\t\t\treturn r.maybeRecoverArtifactGenerator(ctx, packageSource, ag, readyCondition, now)\n\t\t}\n\t}\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one recovery routing anchor, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY

          cat > internal/operator/packagesource_ready_repair.go <<'EOF'
          /*
          Copyright 2025 The Cozystack Authors.

          Licensed under the Apache License, Version 2.0 (the "License");
          you may not use this file except in compliance with the License.
          You may obtain a copy of the License at

              http://www.apache.org/licenses/LICENSE-2.0

          Unless required by applicable law or agreed to in writing, software
          distributed under the License is distributed on an "AS IS" BASIS,
          WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
          See the License for the specific language governing permissions and
          limitations under the License.
          */

          package operator

          import (
          	"context"
          	"fmt"
          	"time"

          	sourcev1 "github.com/fluxcd/source-controller/api/v1"
          	sourcewatcherv1beta1 "github.com/fluxcd/source-watcher/api/v2/v1beta1"
          	apierrors "k8s.io/apimachinery/pkg/api/errors"
          	"k8s.io/apimachinery/pkg/api/meta"
          	metav1 "k8s.io/apimachinery/pkg/apis/meta/v1"
          	"sigs.k8s.io/controller-runtime/pkg/client"
          )

          const reasonRecoveredLostReady = "RecoveredLostReady"

          // The PackageSource controller only reads Flux source objects here. Keep
          // these markers beside the recovery code so generated RBAC continues to
          // cover every source kind supported by ArtifactGenerator.
          // +kubebuilder:rbac:groups=source.toolkit.fluxcd.io,resources=ocirepositories,verbs=get;list;watch
          // +kubebuilder:rbac:groups=source.toolkit.fluxcd.io,resources=gitrepositories,verbs=get;list;watch
          // +kubebuilder:rbac:groups=source.toolkit.fluxcd.io,resources=buckets,verbs=get;list;watch
          // +kubebuilder:rbac:groups=source.toolkit.fluxcd.io,resources=helmcharts,verbs=get;list;watch
          // +kubebuilder:rbac:groups=source.toolkit.fluxcd.io,resources=externalartifacts,verbs=get;list;watch

          // repairLostArtifactGeneratorReady repairs only the final Ready condition
          // write lost to fluxcd/pkg#934. It does NOT infer success from inventory
          // presence alone. Before writing Ready=True it proves that source-watcher
          // has already completed the current reconciliation by independently
          // reproducing its ObservedSourcesDigest calculation and validating every
          // expected ExternalArtifact against the persisted inventory.
          //
          // This makes the repair fail closed:
          //   - stale source digest: no repair
          //   - incomplete/mismatched inventory: no repair
          //   - ExternalArtifact missing/not Ready/digest mismatch: no repair
          //   - genuine upstream Ready=False: no repair
          //   - stale condition generation: no repair
          //
          // Only Ready=Unknown on the current generation, or our own synthetic
          // Ready=False/SourceWatcherRecoveryForced marker, is eligible.
          func (r *PackageSourceReconciler) repairLostArtifactGeneratorReady(
          	ctx context.Context,
          	ag *sourcewatcherv1beta1.ArtifactGenerator,
          	ready *metav1.Condition,
          	now time.Time,
          ) (bool, error) {
          	if !lostReadyRepairCandidate(ag, ready) {
          		return false, nil
          	}

          	proven, err := r.proveArtifactGeneratorCurrentSuccess(ctx, ag)
          	if err != nil {
          		return false, err
          	}
          	if !proven {
          		return false, nil
          	}

          	base := ag.DeepCopy()
          	priorConditions := cloneConditions(ag.Status.Conditions)
          	meta.SetStatusCondition(&ag.Status.Conditions, metav1.Condition{
          		Type:               "Ready",
          		Status:             metav1.ConditionTrue,
          		Reason:             reasonRecoveredLostReady,
          		Message:            "source-watcher completed current-source artifact generation; cozystack repaired the final Ready=True condition lost to fluxcd/pkg#934",
          		ObservedGeneration: ag.Generation,
          		LastTransitionTime: metav1.NewTime(now),
          	})
          	if err := r.Status().Patch(ctx, ag, client.MergeFrom(base)); err != nil {
          		ag.Status.Conditions = priorConditions
          		return false, fmt.Errorf("patch recovered ArtifactGenerator Ready=True: %w", err)
          	}
          	return true, nil
          }

          func lostReadyRepairCandidate(ag *sourcewatcherv1beta1.ArtifactGenerator, ready *metav1.Condition) bool {
          	if ready == nil || ready.ObservedGeneration != ag.Generation {
          		return false
          	}
          	if ready.Status == metav1.ConditionUnknown {
          		return true
          	}
          	return ready.Status == metav1.ConditionFalse && ready.Reason == reasonRecoveryForced
          }

          // proveArtifactGeneratorCurrentSuccess verifies the exact success state
          // source-watcher v2.1.0 builds immediately before MarkTrue(Ready): current
          // source hash persisted, complete fixed output inventory persisted, and
          // every referenced ExternalArtifact persisted Ready with the same digest.
          func (r *PackageSourceReconciler) proveArtifactGeneratorCurrentSuccess(ctx context.Context, ag *sourcewatcherv1beta1.ArtifactGenerator) (bool, error) {
          	// PackageSource-generated AGs use fixed output names. Dynamic pathPattern
          	// expansion does not have a one-to-one spec/inventory cardinality, so do
          	// not auto-repair it without a stronger proof model.
          	if ag.Spec.PathPattern != "" || len(ag.Spec.OutputArtifacts) == 0 {
          		return false, nil
          	}
          	if ag.Status.ObservedSourcesDigest == "" || len(ag.Status.Inventory) != len(ag.Spec.OutputArtifacts) {
          		return false, nil
          	}

          	currentDigest, sourcesReady, err := r.currentArtifactGeneratorSourcesDigest(ctx, ag)
          	if err != nil {
          		return false, err
          	}
          	if !sourcesReady || currentDigest != ag.Status.ObservedSourcesDigest {
          		return false, nil
          	}

          	expected := make(map[string]struct{}, len(ag.Spec.OutputArtifacts))
          	for _, output := range ag.Spec.OutputArtifacts {
          		if output.Name == "" {
          			return false, nil
          		}
          		expected[output.Name] = struct{}{}
          	}
          	if len(expected) != len(ag.Spec.OutputArtifacts) {
          		return false, nil
          	}

          	seen := make(map[string]struct{}, len(ag.Status.Inventory))
          	for _, ref := range ag.Status.Inventory {
          		if _, ok := expected[ref.Name]; !ok || ref.Namespace != ag.Namespace || ref.Digest == "" || ref.Filename == "" {
          			return false, nil
          		}
          		if _, duplicate := seen[ref.Name]; duplicate {
          			return false, nil
          		}
          		seen[ref.Name] = struct{}{}

          		ea := &sourcev1.ExternalArtifact{}
          		if err := r.Get(ctx, client.ObjectKey{Name: ref.Name, Namespace: ref.Namespace}, ea); err != nil {
          			if apierrors.IsNotFound(err) {
          				return false, nil
          			}
          			return false, fmt.Errorf("get ExternalArtifact %s/%s: %w", ref.Namespace, ref.Name, err)
          		}
          		if ea.Status.Artifact == nil || ea.Status.Artifact.Digest != ref.Digest || !meta.IsStatusConditionTrue(ea.Status.Conditions, "Ready") {
          			return false, nil
          		}
          		if ea.Spec.SourceRef == nil || ea.Spec.SourceRef.Name != ag.Name || ea.Spec.SourceRef.Namespace != ag.Namespace ||
          			ea.Spec.SourceRef.Kind != sourcewatcherv1beta1.ArtifactGeneratorKind || ea.Spec.SourceRef.APIVersion != sourcewatcherv1beta1.GroupVersion.String() {
          			return false, nil
          		}
          		if ag.UID != "" && ea.Labels[sourcewatcherv1beta1.ArtifactGeneratorLabel] != string(ag.UID) {
          			return false, nil
          		}
          	}
          	return len(seen) == len(expected), nil
          }

          // currentArtifactGeneratorSourcesDigest intentionally mirrors
          // source-watcher v2.1.0 observeSources() field-for-field and then calls
          // the API package's HashObservedSources. Any difference in source URL,
          // digest, revision, or origin revision makes the proof fail closed.
          func (r *PackageSourceReconciler) currentArtifactGeneratorSourcesDigest(ctx context.Context, ag *sourcewatcherv1beta1.ArtifactGenerator) (string, bool, error) {
          	observed := make(map[string]sourcewatcherv1beta1.ObservedSource, len(ag.Spec.Sources))
          	for _, src := range ag.Spec.Sources {
          		ns := src.Namespace
          		if ns == "" {
          			ns = ag.Namespace
          		}
          		key := client.ObjectKey{Name: src.Name, Namespace: ns}

          		var source sourcev1.Source
          		switch src.Kind {
          		case sourcev1.OCIRepositoryKind:
          			obj := &sourcev1.OCIRepository{}
          			if err := r.Get(ctx, key, obj); err != nil {
          				if apierrors.IsNotFound(err) { return "", false, nil }
          				return "", false, fmt.Errorf("get OCIRepository %s: %w", key, err)
          			}
          			source = obj
          		case sourcev1.GitRepositoryKind:
          			obj := &sourcev1.GitRepository{}
          			if err := r.Get(ctx, key, obj); err != nil {
          				if apierrors.IsNotFound(err) { return "", false, nil }
          				return "", false, fmt.Errorf("get GitRepository %s: %w", key, err)
          			}
          			source = obj
          		case sourcev1.BucketKind:
          			obj := &sourcev1.Bucket{}
          			if err := r.Get(ctx, key, obj); err != nil {
          				if apierrors.IsNotFound(err) { return "", false, nil }
          				return "", false, fmt.Errorf("get Bucket %s: %w", key, err)
          			}
          			source = obj
          		case sourcev1.HelmChartKind:
          			obj := &sourcev1.HelmChart{}
          			if err := r.Get(ctx, key, obj); err != nil {
          				if apierrors.IsNotFound(err) { return "", false, nil }
          				return "", false, fmt.Errorf("get HelmChart %s: %w", key, err)
          			}
          			source = obj
          		case sourcev1.ExternalArtifactKind:
          			obj := &sourcev1.ExternalArtifact{}
          			if err := r.Get(ctx, key, obj); err != nil {
          				if apierrors.IsNotFound(err) { return "", false, nil }
          				return "", false, fmt.Errorf("get ExternalArtifact source %s: %w", key, err)
          			}
          			source = obj
          		default:
          			return "", false, nil
          		}

          		artifact := source.GetArtifact()
          		if artifact == nil {
          			return "", false, nil
          		}
          		state := sourcewatcherv1beta1.ObservedSource{
          			Digest: artifact.Digest, Revision: artifact.Revision, URL: artifact.URL,
          		}
          		if origin, ok := artifact.Metadata[sourcewatcherv1beta1.ArtifactOriginRevisionAnnotation]; ok {
          			state.OriginRevision = origin
          		}
          		observed[src.Alias] = state
          	}
          	if len(observed) != len(ag.Spec.Sources) {
          		return "", false, nil
          	}
          	return sourcewatcherv1beta1.HashObservedSources(observed), true, nil
          }
          EOF

          cat > internal/operator/packagesource_ready_repair_test.go <<'EOF'
          /*
          Copyright 2025 The Cozystack Authors.

          Licensed under the Apache License, Version 2.0 (the "License");
          you may not use this file except in compliance with the License.
          You may obtain a copy of the License at

              http://www.apache.org/licenses/LICENSE-2.0

          Unless required by applicable law or agreed to in writing, software
          distributed under the License is distributed on an "AS IS" BASIS,
          WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
          See the License for the specific language governing permissions and
          limitations under the License.
          */

          package operator

          import (
          	"context"
          	"testing"
          	"time"

          	cozyv1alpha1 "github.com/cozystack/cozystack/api/v1alpha1"
          	gotkmeta "github.com/fluxcd/pkg/apis/meta"
          	sourcev1 "github.com/fluxcd/source-controller/api/v1"
          	sourcewatcherv1beta1 "github.com/fluxcd/source-watcher/api/v2/v1beta1"
          	"k8s.io/apimachinery/pkg/api/meta"
          	metav1 "k8s.io/apimachinery/pkg/apis/meta/v1"
          	"k8s.io/apimachinery/pkg/runtime"
          	"k8s.io/apimachinery/pkg/types"
          	"sigs.k8s.io/controller-runtime/pkg/client"
          	"sigs.k8s.io/controller-runtime/pkg/client/fake"
          )

          func readyRepairScheme(t *testing.T) *runtime.Scheme {
          	t.Helper()
          	s := runtime.NewScheme()
          	for name, add := range map[string]func(*runtime.Scheme) error{
          		"cozystack": cozyv1alpha1.AddToScheme,
          		"source-watcher": sourcewatcherv1beta1.AddToScheme,
          		"source-controller": sourcev1.AddToScheme,
          	} {
          		if err := add(s); err != nil { t.Fatalf("%s AddToScheme: %v", name, err) }
          	}
          	return s
          }

          func readyRepairFixture(t *testing.T) (*cozyv1alpha1.PackageSource, *sourcewatcherv1beta1.ArtifactGenerator, *sourcev1.OCIRepository, *sourcev1.ExternalArtifact) {
          	t.Helper()
          	artifact := &gotkmeta.Artifact{
          		Digest: "sha256:source-current", Revision: "sha256:release-current", URL: "http://source-controller/cozy-system/src/artifact.tar.gz",
          		Metadata: map[string]string{sourcewatcherv1beta1.ArtifactOriginRevisionAnnotation: "git-current"},
          	}
          	src := &sourcev1.OCIRepository{
          		ObjectMeta: metav1.ObjectMeta{Name: "src", Namespace: "cozy-system"},
          		Status: sourcev1.OCIRepositoryStatus{Artifact: artifact},
          	}
          	observed := map[string]sourcewatcherv1beta1.ObservedSource{
          		"src": {Digest: artifact.Digest, Revision: artifact.Revision, URL: artifact.URL, OriginRevision: "git-current"},
          	}
          	ps := &cozyv1alpha1.PackageSource{
          		ObjectMeta: metav1.ObjectMeta{Name: "example", Namespace: "cozy-system", Generation: 1},
          		Spec: cozyv1alpha1.PackageSourceSpec{SourceRef: &cozyv1alpha1.PackageSourceRef{Name: "src", Kind: sourcev1.OCIRepositoryKind, Namespace: "cozy-system"}},
          	}
          	ag := &sourcewatcherv1beta1.ArtifactGenerator{
          		ObjectMeta: metav1.ObjectMeta{
          			Name: "example", Namespace: "cozy-system", Generation: 1, UID: types.UID("ag-uid"),
          			CreationTimestamp: metav1.NewTime(referenceTime.Add(-time.Hour)),
          			Annotations: map[string]string{
          				annotationRecoveryAttempts: "3",
          				annotationLastRecoveryAt: referenceTime.Add(-time.Minute).UTC().Format(time.RFC3339Nano),
          			},
          		},
          		Spec: sourcewatcherv1beta1.ArtifactGeneratorSpec{
          			Sources: []sourcewatcherv1beta1.SourceReference{{Alias: "src", Name: "src", Namespace: "cozy-system", Kind: sourcev1.OCIRepositoryKind}},
          			OutputArtifacts: []sourcewatcherv1beta1.OutputArtifact{{Name: "one"}},
          		},
          		Status: sourcewatcherv1beta1.ArtifactGeneratorStatus{
          			ObservedSourcesDigest: sourcewatcherv1beta1.HashObservedSources(observed),
          			Inventory: []sourcewatcherv1beta1.ExternalArtifactReference{{Name: "one", Namespace: "cozy-system", Digest: "sha256:output-current", Filename: "output-current.tar.gz"}},
          			Conditions: []metav1.Condition{{Type: "Ready", Status: metav1.ConditionUnknown, Reason: "Progressing", ObservedGeneration: 1, LastTransitionTime: metav1.NewTime(referenceTime.Add(-2 * time.Minute))}},
          		},
          	}
          	ea := &sourcev1.ExternalArtifact{
          		ObjectMeta: metav1.ObjectMeta{Name: "one", Namespace: "cozy-system", Labels: map[string]string{sourcewatcherv1beta1.ArtifactGeneratorLabel: string(ag.UID)}},
          		Spec: sourcev1.ExternalArtifactSpec{SourceRef: &gotkmeta.NamespacedObjectKindReference{APIVersion: sourcewatcherv1beta1.GroupVersion.String(), Kind: sourcewatcherv1beta1.ArtifactGeneratorKind, Name: ag.Name, Namespace: ag.Namespace}},
          		Status: sourcev1.ExternalArtifactStatus{
          			Artifact: &gotkmeta.Artifact{Digest: "sha256:output-current", Revision: "sha256:release-current", URL: "http://source-watcher/one.tar.gz"},
          			Conditions: []metav1.Condition{{Type: "Ready", Status: metav1.ConditionTrue, Reason: "Succeeded", ObservedGeneration: 1}},
          		},
          	}
          	return ps, ag, src, ea
          }

          func TestLostReadyRepairCandidate(t *testing.T) {
          	ag := &sourcewatcherv1beta1.ArtifactGenerator{ObjectMeta: metav1.ObjectMeta{Generation: 2}}
          	tests := []struct{name string; ready *metav1.Condition; want bool}{
          		{"unknown current generation", &metav1.Condition{Status: metav1.ConditionUnknown, ObservedGeneration: 2}, true},
          		{"our forced false current generation", &metav1.Condition{Status: metav1.ConditionFalse, Reason: reasonRecoveryForced, ObservedGeneration: 2}, true},
          		{"real upstream false is never masked", &metav1.Condition{Status: metav1.ConditionFalse, Reason: "SourceFetchFailed", ObservedGeneration: 2}, false},
          		{"true already healthy", &metav1.Condition{Status: metav1.ConditionTrue, Reason: "Succeeded", ObservedGeneration: 2}, false},
          		{"stale generation", &metav1.Condition{Status: metav1.ConditionUnknown, ObservedGeneration: 1}, false},
          		{"missing condition cannot prove spec generation", nil, false},
          	}
          	for _, tt := range tests { t.Run(tt.name, func(t *testing.T){ if got:=lostReadyRepairCandidate(ag,tt.ready); got!=tt.want { t.Errorf("candidate=%v want %v",got,tt.want) } }) }
          }

          func TestProveArtifactGeneratorCurrentSuccess(t *testing.T) {
          	ps, ag, src, ea := readyRepairFixture(t); _ = ps
          	newClient := func(objects ...client.Object) client.Client {
          		return fake.NewClientBuilder().WithScheme(readyRepairScheme(t)).WithObjects(objects...).Build()
          	}
          	t.Run("all current-source evidence matches", func(t *testing.T){
          		r:=&PackageSourceReconciler{Client:newClient(ag.DeepCopy(),src.DeepCopy(),ea.DeepCopy()),Scheme:readyRepairScheme(t)}
          		ok,err:=r.proveArtifactGeneratorCurrentSuccess(context.Background(),ag.DeepCopy()); if err!=nil||!ok {t.Fatalf("proven=%v err=%v want true",ok,err)}
          	})
          	t.Run("stale observed source digest fails closed", func(t *testing.T){
          		bad:=ag.DeepCopy(); bad.Status.ObservedSourcesDigest="sha256:stale"
          		r:=&PackageSourceReconciler{Client:newClient(bad.DeepCopy(),src.DeepCopy(),ea.DeepCopy()),Scheme:readyRepairScheme(t)}
          		ok,err:=r.proveArtifactGeneratorCurrentSuccess(context.Background(),bad); if err!=nil||ok {t.Fatalf("proven=%v err=%v want false",ok,err)}
          	})
          	t.Run("incomplete inventory fails closed", func(t *testing.T){
          		bad:=ag.DeepCopy(); bad.Status.Inventory=nil
          		r:=&PackageSourceReconciler{Client:newClient(bad.DeepCopy(),src.DeepCopy(),ea.DeepCopy()),Scheme:readyRepairScheme(t)}
          		ok,err:=r.proveArtifactGeneratorCurrentSuccess(context.Background(),bad); if err!=nil||ok {t.Fatalf("proven=%v err=%v want false",ok,err)}
          	})
          	t.Run("external artifact digest mismatch fails closed", func(t *testing.T){
          		badEA:=ea.DeepCopy(); badEA.Status.Artifact.Digest="sha256:different"
          		r:=&PackageSourceReconciler{Client:newClient(ag.DeepCopy(),src.DeepCopy(),badEA),Scheme:readyRepairScheme(t)}
          		ok,err:=r.proveArtifactGeneratorCurrentSuccess(context.Background(),ag.DeepCopy()); if err!=nil||ok {t.Fatalf("proven=%v err=%v want false",ok,err)}
          	})
          	t.Run("external artifact not Ready fails closed", func(t *testing.T){
          		badEA:=ea.DeepCopy(); badEA.Status.Conditions[0].Status=metav1.ConditionFalse
          		r:=&PackageSourceReconciler{Client:newClient(ag.DeepCopy(),src.DeepCopy(),badEA),Scheme:readyRepairScheme(t)}
          		ok,err:=r.proveArtifactGeneratorCurrentSuccess(context.Background(),ag.DeepCopy()); if err!=nil||ok {t.Fatalf("proven=%v err=%v want false",ok,err)}
          	})
          	t.Run("dynamic pathPattern is never auto repaired", func(t *testing.T){
          		bad:=ag.DeepCopy(); bad.Spec.PathPattern="@src/{app}/**"
          		r:=&PackageSourceReconciler{Client:newClient(bad.DeepCopy(),src.DeepCopy(),ea.DeepCopy()),Scheme:readyRepairScheme(t)}
          		ok,err:=r.proveArtifactGeneratorCurrentSuccess(context.Background(),bad); if err!=nil||ok {t.Fatalf("proven=%v err=%v want false",ok,err)}
          	})
          }

          func TestUpdateStatus_RepairsOnlyProvenLostReady(t *testing.T) {
          	ps, ag, src, ea := readyRepairFixture(t)
          	scheme:=readyRepairScheme(t)
          	c:=fake.NewClientBuilder().WithScheme(scheme).WithStatusSubresource(ps,ag).WithObjects(ps,ag,src,ea).Build()
          	r:=&PackageSourceReconciler{Client:c,Scheme:scheme}
          	res,err:=r.updateStatus(context.Background(),ps,referenceTime); if err!=nil {t.Fatalf("updateStatus: %v",err)}
          	if res.RequeueAfter!=0 {t.Errorf("RequeueAfter=%v want 0 after proven repair",res.RequeueAfter)}
          	persistedAG:=&sourcewatcherv1beta1.ArtifactGenerator{}; if err:=c.Get(context.Background(),client.ObjectKeyFromObject(ag),persistedAG); err!=nil {t.Fatal(err)}
          	ready:=meta.FindStatusCondition(persistedAG.Status.Conditions,"Ready")
          	if ready==nil||ready.Status!=metav1.ConditionTrue||ready.Reason!=reasonRecoveredLostReady {t.Fatalf("AG Ready=%+v want True/%s",ready,reasonRecoveredLostReady)}
          	if _,ok:=persistedAG.Annotations[annotationRecoveryAttempts]; ok {t.Errorf("recovery tracking not cleared: %v",persistedAG.Annotations)}
          	persistedPS:=&cozyv1alpha1.PackageSource{}; if err:=c.Get(context.Background(),client.ObjectKeyFromObject(ps),persistedPS); err!=nil {t.Fatal(err)}
          	psReady:=meta.FindStatusCondition(persistedPS.Status.Conditions,"Ready")
          	if psReady==nil||psReady.Status!=metav1.ConditionTrue||psReady.Reason!=reasonRecoveredLostReady {t.Fatalf("PS Ready=%+v want True/%s",psReady,reasonRecoveredLostReady)}
          }

          func TestRepairLostReady_DoesNotMaskRealFailure(t *testing.T) {
          	_, ag, src, ea := readyRepairFixture(t)
          	ag.Status.Conditions[0]=metav1.Condition{Type:"Ready",Status:metav1.ConditionFalse,Reason:"SourceFetchFailed",ObservedGeneration:1}
          	scheme:=readyRepairScheme(t); c:=fake.NewClientBuilder().WithScheme(scheme).WithStatusSubresource(ag).WithObjects(ag,src,ea).Build()
