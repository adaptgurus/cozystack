name: LayerSentry DC R0 Host Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layersentry-live-environment
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout collector
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Collect DC read-only inventory
        shell: powershell
        env:
          ROCKY_HOST: ${{ secrets.LAYERSENTRY_ROCKY_R0_HOST }}
          ROCKY_USERNAME: ${{ secrets.LAYERSENTRY_ROCKY_R0_USERNAME }}
          ROCKY_PASSWORD: ${{ secrets.LAYERSENTRY_ROCKY_R0_PASSWORD }}
          DC_KNOWN_HOSTS: ${{ secrets.LAYERSENTRY_DC_SSH_KNOWN_HOSTS }}
        run: ./hack/layersentry/invoke-dc-r0-host-inventory.ps1
      - name: Upload sanitized DC inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layersentry-dc-r0-host-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/layersentry-dc-r0-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
