name: LayerSentry DC DR GUI baseline

on:
  push:
    branches: [codex/ui-gui-qualification]
    paths: [.github/workflows/layersentry-ui-gui-baseline.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layersentry-live-environment
  cancel-in-progress: false

jobs:
  gui:
    if: github.repository == 'adaptgurus/cozystack' && github.ref == 'refs/heads/codex/ui-gui-qualification'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - name: Check out exact reviewed GUI test source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: adaptgurus/cloudstack
          ref: 0e2ad54dc37baa80124b52b5302bfff77efd179d
          path: ui-qualification-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
      - name: Install locked browser harness
        working-directory: ui-qualification-source/tools/layersentry-ui-acceptance
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & npm.cmd ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Browser dependency installation failed.' }
          & npx.cmd --no-install playwright install chrome firefox
          if ($LASTEXITCODE -ne 0) { throw 'Browser installation failed.' }
      - name: Repair verified Firefox runtime prerequisite
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $library = Join-Path $env:WINDIR 'System32\msvcp140_1.dll'
          if (-not (Test-Path -LiteralPath $library)) {
            $installer = Join-Path $env:RUNNER_TEMP "layersentry-vcredist-$env:GITHUB_RUN_ID.exe"
            Invoke-WebRequest -UseBasicParsing -TimeoutSec 120 -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile $installer
            $signature = Get-AuthenticodeSignature -FilePath $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Microsoft Corporation(?:,|$)') { throw 'Microsoft runtime signature verification failed.' }
            Write-Output "VC_REDIST_SHA256=$((Get-FileHash -Algorithm SHA256 $installer).Hash)"
            $process = Start-Process -FilePath $installer -ArgumentList '/install','/quiet','/norestart' -PassThru
            if (-not $process.WaitForExit(180000)) { throw 'Runtime installer timed out; do not blindly replay.' }
            if ($process.ExitCode -notin @(0, 3010)) { throw 'Runtime prerequisite installation failed.' }
            Write-Output "VC_REDIST_EXIT=$($process.ExitCode)"
            Remove-Item -LiteralPath $installer
          }
          if (-not (Test-Path -LiteralPath $library)) { throw 'Firefox runtime DLL remains unavailable.' }
      - name: Exercise deployed candidate GUI without infrastructure mutations
        working-directory: ui-qualification-source/tools/layersentry-ui-acceptance
        shell: powershell
        env:
          LAYERSENTRY_GUI_USERNAME: ${{ secrets.LAYERSENTRY_CLOUDSTACK_USERNAME }}
          LAYERSENTRY_GUI_PASSWORD: ${{ secrets.LAYERSENTRY_CLOUDSTACK_PASSWORD }}
          LAYERSENTRY_GUI_TARGETS: 10.10.10.20
          LAYERSENTRY_GUI_ROUTES: kubernetes-data-services
          LAYERSENTRY_GUI_EVIDENCE: ${{ runner.temp }}/layersentry-gui-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          & node.exe browser-inventory.mjs
          $result = $LASTEXITCODE
          $env:LAYERSENTRY_GUI_PASSWORD = ''
          $env:LAYERSENTRY_GUI_USERNAME = ''
          if ($result -ne 0) { throw 'GUI baseline failed; inspect bounded stage evidence.' }
      - name: Preserve GUI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layersentry-gui-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/layersentry-gui-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14
