name: LayerSentry Three-Node Installer Autopilot v3

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - hack/layersentry/autopilot-v3-requests/*.json
      - hack/layersentry/invoke-harvester-installer-autopilot-v3.ps1
      - hack/layersentry/invoke-harvester-installer-autopilot.ps1
      - hack/layersentry/read-console-ocr.ps1
      - hack/layersentry/classify-harvester-installer-screen.ps1
      - hack/layersentry/classify-harvester-installer-screen-v3.ps1
      - hack/layersentry/invoke-hyperv-console-command.ps1
      - hack/layersentry/capture-hyperv-console.ps1
      - .github/workflows/layersentry-installer-autopilot-v3.yml

permissions:
  contents: read

concurrency:
  group: layersentry-three-node-installer-autopilot
  cancel-in-progress: false

jobs:
  install:
    name: Resume the three-node installation with non-recursive OCR classification
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240

    steps:
      - name: Checkout exact v3 autopilot source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validate authorization and PowerShell source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $requests = @(
            git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA -- 'hack/layersentry/autopilot-v3-requests/*.json'
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if ($LASTEXITCODE -ne 0) {
            throw "git diff-tree failed with exit code $LASTEXITCODE"
          }
          if ($requests.Count -ne 1) {
            throw "Expected exactly one v3 autopilot request; found $($requests.Count)."
          }
          $request = Get-Content -LiteralPath $requests[0].Trim() -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$request.operation -ne 'RESUME_THREE_NODE_LAYERSENTRY_POC_V3') {
            throw "Unsupported operation: $($request.operation)"
          }
          if ([string]$request.authorization -ne 'USER_GRANTED_FULL_POWERSHELL_AND_INSTALL_PERMISSION') {
            throw 'Required explicit installation authorization is absent.'
          }
          $expected = @('sen1', 'sen2', 'sen3')
          $actual = @($request.virtualMachines | ForEach-Object { [string]$_ } | Sort-Object)
          if (($actual -join ',') -ne (($expected | Sort-Object) -join ',')) {
            throw 'The request is not restricted to sen1, sen2, and sen3.'
          }

          foreach ($relative in @(
            'hack/layersentry/invoke-harvester-installer-autopilot-v3.ps1',
            'hack/layersentry/invoke-harvester-installer-autopilot.ps1',
            'hack/layersentry/read-console-ocr.ps1',
            'hack/layersentry/classify-harvester-installer-screen.ps1',
            'hack/layersentry/classify-harvester-installer-screen-v3.ps1',
            'hack/layersentry/invoke-hyperv-console-command.ps1',
            'hack/layersentry/capture-hyperv-console.ps1'
          )) {
            $tokens = $null
            $errors = $null
            $resolved = (Resolve-Path -LiteralPath $relative).ProviderPath
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $resolved,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}:{1}: {2}" -f $relative, $_.Extent.StartLineNumber, $_.Message)
              }
              exit 1
            }
          }

      - name: Resume installation from current console state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'layersentry-installer-autopilot-v3'
          & 'hack/layersentry/invoke-harvester-installer-autopilot-v3.ps1' `
            -VmNames @('sen1', 'sen2', 'sen3') `
            -OutputDirectory $output `
            -MaxIterations 120 `
            -PollSeconds 12 `
            -ClusterReadyTimeoutMinutes 90

      - name: Capture final consoles and host-side VM facts
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $output = Join-Path $env:RUNNER_TEMP 'layersentry-installer-autopilot-v3'
          $final = Join-Path $output 'final-state'
          New-Item -Path $final -ItemType Directory -Force | Out-Null
          & 'hack/layersentry/capture-hyperv-console.ps1' `
            -VmNames @('sen1', 'sen2', 'sen3') `
            -OutputDirectory (Join-Path $final 'consoles')

          $records = foreach ($name in @('sen1', 'sen2', 'sen3')) {
            $vm = Get-VM -Name $name -ErrorAction SilentlyContinue
            if ($null -eq $vm) {
              [ordered]@{ name = $name; exists = $false }
              continue
            }
            $processor = Get-VMProcessor -VMName $name
            $disks = @(Get-VMHardDiskDrive -VMName $name |
              Sort-Object ControllerNumber, ControllerLocation |
              ForEach-Object {
                $vhd = Get-VHD -Path $_.Path
                [ordered]@{
                  path = $_.Path
                  maximumBytes = [int64]$vhd.Size
                  currentFileBytes = [int64]$vhd.FileSize
                  controllerNumber = $_.ControllerNumber
                  controllerLocation = $_.ControllerLocation
                }
              })
            [ordered]@{
              name = $name
              exists = $true
              state = $vm.State.ToString()
              uptimeSeconds = [int64]$vm.Uptime.TotalSeconds
              processorCount = $processor.Count
              exposeVirtualizationExtensions = [bool]$processor.ExposeVirtualizationExtensions
              startupMemoryBytes = [int64]$vm.MemoryStartup
              dynamicMemoryEnabled = [bool]$vm.DynamicMemoryEnabled
              adapterAddresses = @((Get-VMNetworkAdapter -VMName $name).IPAddresses)
              disks = $disks
              dvdMedia = @((Get-VMDvdDrive -VMName $name).Path)
            }
          }
          [ordered]@{
            schemaVersion = '1.0'
            capturedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            clusterVip = '10.10.10.10'
            virtualMachines = @($records)
            installationEvidenceOnly = $true
            runtimeQualificationComplete = $false
            productionReleaseApproved = $false
          } | ConvertTo-Json -Depth 15 |
            Set-Content -LiteralPath (Join-Path $final 'hyperv-state.json') -Encoding UTF8

      - name: Upload v3 installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layersentry-three-node-installer-v3-${{ github.run_id }}
          path: ${{ runner.temp }}\layersentry-installer-autopilot-v3\**
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
