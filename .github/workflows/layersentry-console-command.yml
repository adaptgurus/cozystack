name: LayerSentry Hyper-V Console Command Queue

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - hack/layersentry/commands/*.json

permissions:
  contents: read

concurrency:
  group: layersentry-hyperv-console-command
  cancel-in-progress: false

jobs:
  command:
    name: Execute queued keyboard command and capture consoles
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout exact command request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Select the single queued command
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [string[]]$paths = @(
            @(git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA -- 'hack/layersentry/commands/*.json') |
              ForEach-Object { [string]$_ } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )
          if ($LASTEXITCODE -ne 0) {
            throw "git diff-tree failed with exit code $LASTEXITCODE"
          }
          if ($paths.Count -ne 1) {
            throw "Expected exactly one queued command file in this commit; found $($paths.Count): $($paths -join ', ')"
          }
          $requestPath = ([string]$paths[0]).Trim()
          if (-not (Test-Path -LiteralPath $requestPath -PathType Leaf)) {
            throw "Queued command file does not exist: $requestPath"
          }
          "REQUEST_PATH=$requestPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Selected queued command: $requestPath"

      - name: Parse command executor
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path -LiteralPath 'hack/layersentry/invoke-hyperv-console-command.ps1').ProviderPath
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $path,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Error ("Line {0}: {1}" -f $_.Extent.StartLineNumber, $_.Message)
            }
            exit 1
          }

      - name: Expand repeated keys and execute VM console command
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $request = Get-Content -LiteralPath $env:REQUEST_PATH -Raw -Encoding UTF8 | ConvertFrom-Json
          foreach ($target in @($request.targets)) {
            $expanded = New-Object System.Collections.Generic.List[object]
            foreach ($action in @($target.actions)) {
              if ([string]$action.kind -ieq 'repeatKey') {
                $count = [int]$action.count
                $code = [int]$action.code
                if ($count -lt 1 -or $count -gt 512) {
                  throw "repeatKey count must be between 1 and 512; got $count"
                }
                for ($index = 0; $index -lt $count; $index++) {
                  $expanded.Add([pscustomobject]@{ kind = 'key'; code = $code })
                }
              }
              else {
                $expanded.Add($action)
              }
            }
            $target.actions = @($expanded)
          }
          $expandedPath = Join-Path $env:RUNNER_TEMP 'layersentry-expanded-console-command.json'
          $request | ConvertTo-Json -Depth 20 |
            Set-Content -LiteralPath $expandedPath -Encoding UTF8

          $resultDirectory = Join-Path $env:RUNNER_TEMP 'layersentry-console-command'
          & 'hack/layersentry/invoke-hyperv-console-command.ps1' `
            -RequestPath $expandedPath `
            -OutputDirectory $resultDirectory

      - name: Capture console state after command
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $captureDirectory = Join-Path $env:RUNNER_TEMP 'layersentry-console-after-command'
          & 'hack/layersentry/capture-hyperv-console.ps1' `
            -VmNames @('sen1', 'sen2', 'sen3') `
            -OutputDirectory $captureDirectory

      - name: Upload command and console evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layersentry-console-command-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\layersentry-console-command
            ${{ runner.temp }}\layersentry-console-after-command
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
