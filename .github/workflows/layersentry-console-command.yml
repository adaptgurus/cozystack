name: LayerSentry Hyper-V Console Command

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - hack/layersentry/console-command.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: layersentry-hyperv-console-command
  cancel-in-progress: false

jobs:
  command:
    name: Execute approved keyboard command and capture consoles
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout exact command request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Parse command executor
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path -LiteralPath 'hack/layersentry/invoke-hyperv-console-command.ps1').ProviderPath
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $path,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error ("Line {0}: {1}" -f $_.Extent.StartLineNumber, $_.Message) }
            exit 1
          }

      - name: Execute VM console command
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $resultDirectory = Join-Path $env:RUNNER_TEMP 'layersentry-console-command'
          & 'hack/layersentry/invoke-hyperv-console-command.ps1' `
            -RequestPath 'hack/layersentry/console-command.json' `
            -OutputDirectory $resultDirectory

      - name: Capture console state after command
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $captureDirectory = Join-Path $env:RUNNER_TEMP 'layersentry-console-after-command'
          & 'hack/layersentry/capture-hyperv-console.ps1' `
            -VmNames @('sen1', 'sen2', 'sen3') `
            -OutputDirectory $captureDirectory

      - name: Persist sanitized latest console evidence
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $resultDirectory = Join-Path $env:RUNNER_TEMP 'layersentry-console-command'
          $captureDirectory = Join-Path $env:RUNNER_TEMP 'layersentry-console-after-command'
          $evidenceDirectory = Join-Path $env:GITHUB_WORKSPACE 'hack/layersentry/runtime-evidence/latest'

          if (Test-Path -LiteralPath $evidenceDirectory) {
            Remove-Item -LiteralPath $evidenceDirectory -Recurse -Force
          }
          New-Item -Path $evidenceDirectory -ItemType Directory -Force | Out-Null

          $resultPath = Join-Path $resultDirectory 'console-command-result.json'
          if (Test-Path -LiteralPath $resultPath -PathType Leaf) {
            $result = Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($result.PSObject.Properties['CredentialPathUsed'] -and $null -ne $result.CredentialPathUsed) {
              $result.CredentialPathUsed = 'local-secure-store'
            }
            $result | ConvertTo-Json -Depth 20 |
              Set-Content -LiteralPath (Join-Path $evidenceDirectory 'console-command-result.json') -Encoding UTF8
          }

          foreach ($name in @(
            'console-command-result.txt',
            'console-command-trace.txt'
          )) {
            $source = Join-Path $resultDirectory $name
            if (Test-Path -LiteralPath $source -PathType Leaf) {
              Copy-Item -LiteralPath $source -Destination (Join-Path $evidenceDirectory $name) -Force
            }
          }

          foreach ($name in @(
            'sen1-console.png',
            'sen2-console.png',
            'sen3-console.png',
            'SHA256SUMS.txt'
          )) {
            $source = Join-Path $captureDirectory $name
            if (Test-Path -LiteralPath $source -PathType Leaf) {
              Copy-Item -LiteralPath $source -Destination (Join-Path $evidenceDirectory $name) -Force
            }
          }

          [ordered]@{
            schemaVersion = '1.0'
            sourceCommit = '${{ github.sha }}'
            sourceRunId = '${{ github.run_id }}'
            requestId = if ($null -ne $result) { [string]$result.RequestId } else { $null }
            capturedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            containsCredentialValues = $false
          } | ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath (Join-Path $evidenceDirectory 'metadata.json') -Encoding UTF8

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'hack/layersentry/runtime-evidence/latest'
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No console evidence changes to commit.'
            exit 0
          }
          git commit -m 'ops(evidence): refresh Hyper-V console state [skip ci]'
          if ($LASTEXITCODE -ne 0) {
            throw "git commit failed with exit code $LASTEXITCODE"
          }
          git push origin "HEAD:${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) {
            throw "git push failed with exit code $LASTEXITCODE"
          }

      - name: Upload command and console evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layersentry-console-command-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\layersentry-console-command
            ${{ runner.temp }}\layersentry-console-after-command
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
