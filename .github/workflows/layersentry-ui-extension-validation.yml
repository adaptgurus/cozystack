name: LayerSentry UI Extension Validation

on:
  push:
    branches:
      - feat/hci-virtualization-v1.6.2-test
    paths:
      - .github/workflows/layersentry-ui-extension-validation.yml
  workflow_dispatch:

concurrency:
  group: layersentry-ui-windows-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-ui:
    name: Validate LayerSentry UI on Windows HCI runner
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Clean validation workspace
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'layersentry-ui-validation'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Path $root | Out-Null
          Write-Host "Runner=$env:RUNNER_NAME Computer=$env:COMPUTERNAME"
          Write-Host 'Validation root prepared.'

      - name: Checkout pinned LayerSentry UI revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: adaptgurus/harvester-ui-extension
          ref: e254438888f921761e3fe248154eb372803976cb
          path: layersentry-ui
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: layersentry-ui/yarn.lock

      - name: Ensure Yarn Classic and runner prerequisites
        shell: powershell
        run: |
          if (-not (Get-Command yarn -ErrorAction SilentlyContinue)) {
            npm install --global yarn@1.22.22
          }
          $bash = Get-Command bash -ErrorAction SilentlyContinue
          if (-not $bash) { throw 'Git Bash/bash is required for Rancher extension build-pkg.' }
          Write-Host "Node: $(node --version)"
          Write-Host "Yarn: $(yarn --version)"
          Write-Host "Git: $(git --version)"
          Write-Host "Bash: $($bash.Source)"

      - name: Verify pinned source revision
        shell: powershell
        working-directory: layersentry-ui
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne 'e254438888f921761e3fe248154eb372803976cb') {
            throw "Unexpected UI revision: $head"
          }
          Write-Host "Validated source revision: $head"

      - name: Frozen dependency install
        shell: powershell
        working-directory: layersentry-ui
        run: yarn install --frozen-lockfile

      - name: Lint
        shell: powershell
        working-directory: layersentry-ui
        run: yarn lint

      - name: Build Harvester extension package
        shell: powershell
        run: |
          bash -lc "cd layersentry-ui && yarn build-pkg harvester"

      - name: Validate generated package and LayerSentry assets
        shell: powershell
        working-directory: layersentry-ui
        run: |
          $required = @(
            'pkg/harvester/assets/layersentry/layer-sentry-icon.svg',
            'pkg/harvester/assets/layersentry/layer-sentry-logo.svg',
            'pkg/harvester/config/layersentry-cluster.js',
            'pkg/harvester/l10n/layersentry-en-us.yaml',
            'pkg/harvester/styles/layersentry/index.scss',
            'dist-pkg/harvester-1.10.0-dev/harvester-1.10.0-dev.umd.min.js'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing required LayerSentry output: $path" }
            if ((Get-Item $path).Length -le 0) { throw "Empty required LayerSentry output: $path" }
          }
          $entry = Get-Item 'dist-pkg/harvester-1.10.0-dev/harvester-1.10.0-dev.umd.min.js'
          Write-Host "UMD entrypoint bytes=$($entry.Length)"
          if ($entry.Length -le 1000000) { throw 'Unexpectedly small LayerSentry package entrypoint.' }

      - name: Brand-leak evidence scan
        shell: powershell
        working-directory: layersentry-ui
        run: |
          Write-Host 'Upstream-brand terms in presentation surfaces (technical/upstream-reference context is allowed):'
          $matches = git grep -n -i -E 'Harvester|SUSE|Rancher' -- 'pkg/harvester/*.vue' 'pkg/harvester/**/*.vue' 'pkg/harvester/l10n/*.yaml' 'pkg/harvester/package.json' 2>$null
          if ($LASTEXITCODE -gt 1) { throw 'Brand scan command failed.' }
          if ($matches) { $matches | Select-Object -First 300 } else { Write-Host 'No upstream-brand matches in scanned presentation surfaces.' }

      - name: Cluster and browser capability probe
        shell: powershell
        run: |
          if (Get-Command kubectl -ErrorAction SilentlyContinue) {
            Write-Host '==== kubectl context ===='
            kubectl config current-context
            kubectl get nodes -o wide
            $api = kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}'
            Write-Host "Kubernetes API endpoint=$api"
          } else {
            Write-Host 'kubectl is not installed/configured on this runner.'
          }

          $browsers = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles(x86)\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles(x86)\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          if ($browsers) {
            Write-Host "Browser available: $($browsers[0])"
          } else {
            throw 'No Chrome/Edge executable detected on Windows validation runner.'
          }
