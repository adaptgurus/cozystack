name: LayerSentry DC KVM URL Diagnostic v1

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - hack/layersentry/dc-kvm-url-diagnostic-v1-requests/*.json

permissions:
  contents: read

concurrency:
  group: layersentry-live-environment
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Check out exact request and diagnostic helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve exact request
        id: request
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          [string[]]$changed=@(@(git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA -- 'hack/layersentry/dc-kvm-url-diagnostic-v1-requests/*.json')|ForEach-Object{[string]$_}|Where-Object{-not [string]::IsNullOrWhiteSpace($_)})
          if($LASTEXITCODE -ne 0 -or $changed.Count -ne 1){throw 'Expected exactly one KVM URL diagnostic request.'}
          "request_path=$($changed[0].Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Probe exact KVM host URL validation path
        shell: powershell
        run: |
          & 'hack/layersentry/dc-kvm-url-diagnostic-v1.ps1' -RequestPath '${{ steps.request.outputs.request_path }}' -OutputDirectory (Join-Path $env:RUNNER_TEMP "layersentry-dc-kvm-url-v1-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")

      - name: Upload KVM URL diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layersentry-dc-kvm-url-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\layersentry-dc-kvm-url-v1-${{ github.run_id }}-${{ github.run_attempt }}\**
          if-no-files-found: error
          retention-days: 30
