name: LayerSentry Create and Start Three Hyper-V VMs V2

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - .github/workflows/layersentry-create-3-vms-v2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layersentry-create-three-hyperv-vms
  cancel-in-progress: false

jobs:
  provision:
    name: Provision sen1 sen2 sen3 and boot the verified candidate ISO
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    env:
      LAYERSENTRY_VM_EVIDENCE_DIR: ${{ runner.temp }}\layersentry-create-3-vms

    steps:
      - name: Checkout exact provisioning script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Parse the PowerShell provisioner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path -LiteralPath 'hack/layersentry/provision-hyperv-3-vms.ps1').ProviderPath
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $path,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell parser accepted $path"

      - name: Create configure and start all three VMs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & 'hack/layersentry/provision-hyperv-3-vms.ps1' `
            -IsoPath 'C:\Users\opc\Downloads\final iso\layersentry-v1.0-amd64.iso' `
            -SwitchName 'Cozystack-NAT' `
            -NatName 'Cozystack-NAT' `
            -VmRoot 'C:\Hyper-V\LayerSentry' `
            -EvidenceDirectory $env:LAYERSENTRY_VM_EVIDENCE_DIR

      - name: Upload provisioning evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layersentry-create-3-vms-${{ github.run_id }}
          path: ${{ env.LAYERSENTRY_VM_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
