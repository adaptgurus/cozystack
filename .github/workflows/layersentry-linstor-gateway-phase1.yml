name: LayerSentry LINSTOR Gateway Phase 1

on:
  workflow_dispatch:
  push:
    branches:
      - layersentry-platform
    paths:
      - .github/workflows/layersentry-linstor-gateway-phase1.yml
      - packages/system/linstor-gateway/**

permissions:
  contents: read

jobs:
  static-gate:
    name: Validate Gateway chart and pinned upstream binary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm render
        run: |
          set -euo pipefail
          helm template test packages/system/linstor-gateway --set enabled=true >/tmp/gateway.yaml
          grep -q 'kind: Deployment' /tmp/gateway.yaml
          grep -q 'kind: Service' /tmp/gateway.yaml
          grep -q 'https://linstor-controller.cozy-linstor.svc:3371' /tmp/gateway.yaml
          grep -q 'name: LS_ROOT_CA' /tmp/gateway.yaml
          grep -q 'name: LS_USER_CERTIFICATE' /tmp/gateway.yaml
          grep -q 'name: LS_USER_KEY' /tmp/gateway.yaml
          grep -q 'name: linstor-client-tls' /tmp/gateway.yaml
          grep -q 'key: ca.crt' /tmp/gateway.yaml
          grep -q 'key: tls.crt' /tmp/gateway.yaml
          grep -q 'key: tls.key' /tmp/gateway.yaml
          grep -q 'containerPort: 8337' /tmp/gateway.yaml
          grep -q 'path: /api/v2/status' /tmp/gateway.yaml
      - name: Build checksum-pinned Gateway image
        run: |
          set -euo pipefail
          docker build \
            --build-arg LINSTOR_GATEWAY_VERSION=2.3.0 \
            --build-arg LINSTOR_GATEWAY_SHA256=a5cd30cc79941d8cbf742b1539a57eefa33d5a001f3b26ef671ff027f2c8e4ef \
            -t layersentry-linstor-gateway:test \
            packages/system/linstor-gateway/images/linstor-gateway
          docker run --rm layersentry-linstor-gateway:test version | tee /tmp/version.txt
          grep -q '2.3.0' /tmp/version.txt

  live-control-plane:
    name: Non-destructive Gateway control-plane test on TESTSER
    needs: static-gate
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    env:
      KUBECONFIG: C:\hci-state\cozystack-hci-lab\kubeconfig
      KUBECTL: C:\hci-tools\kubectl.exe
    defaults:
      run:
        shell: powershell
    steps:
      - name: Verify safe live baseline
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_NAME -ne 'layersentry-platform') { throw "refusing branch $env:GITHUB_REF_NAME" }
          if (-not (Test-Path $env:KUBECTL)) { throw "kubectl missing: $env:KUBECTL" }
          if (-not (Test-Path $env:KUBECONFIG)) { throw "kubeconfig missing: $env:KUBECONFIG" }

          Write-Host '===== NODES ====='
          $nodes = @((& $env:KUBECTL get nodes -o json | ConvertFrom-Json).items)
          if ($LASTEXITCODE -ne 0 -or $nodes.Count -ne 3) { throw 'expected exactly three readable Kubernetes nodes' }
          foreach ($node in $nodes) {
            $ready = @($node.status.conditions | Where-Object { $_.type -eq 'Ready' })[0]
            if ($null -eq $ready -or $ready.status -ne 'True') { throw "node $($node.metadata.name) is not Ready" }
          }
          & $env:KUBECTL get nodes -o wide

          Write-Host '===== CLASSIC LINSTOR ====='
          & $env:KUBECTL get deployment,pod,svc -n cozy-linstor -o wide
          if ($LASTEXITCODE -ne 0) { throw 'cannot read cozy-linstor resources' }
          $svc = & $env:KUBECTL get svc linstor-controller -n cozy-linstor -o json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $null -eq $svc) { throw 'linstor-controller service is missing' }
          $ports = @($svc.spec.ports | ForEach-Object { [int]$_.port })
          if ($ports -notcontains 3371) { throw "linstor-controller does not expose TLS REST port 3371; ports=$($ports -join ',')" }

          Write-Host '===== LINSTOR TLS CLIENT MATERIAL ====='
          $tlsSecret = & $env:KUBECTL get secret linstor-client-tls -n cozy-linstor -o json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $null -eq $tlsSecret) { throw 'linstor-client-tls Secret is missing' }
          $tlsKeys = @($tlsSecret.data.PSObject.Properties.Name)
          foreach ($requiredKey in @('ca.crt','tls.crt','tls.key')) {
            if ($tlsKeys -notcontains $requiredKey) { throw "linstor-client-tls is missing required key $requiredKey" }
          }
          Write-Host 'LINSTOR_MTLS_CLIENT_SECRET=READY'

          Write-Host '===== BLOCKSTOR SAFETY BOUNDARY ====='
          $poolJson = & $env:KUBECTL get storagepools.blockstor.cozystack.io -o json 2>$null
          if ($LASTEXITCODE -eq 0) {
            $poolCount = @(($poolJson | ConvertFrom-Json).items).Count
            Write-Host "BLOCKSTOR_STORAGEPOOL_COUNT=$poolCount"
            if ($poolCount -ne 0) { throw 'SAFETY FAILURE: Blockstor StoragePools exist before Gateway Phase 1' }
          } else {
            Write-Host 'BLOCKSTOR_STORAGEPOOL_CRD_NOT_PRESENT_OR_UNREADABLE'
          }
          Write-Host 'DESTRUCTIVE_STORAGE_ACTIONS=DISABLED'

      - name: Configure isolated Gateway control plane
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = @'
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: linstor-gateway-phase1
            namespace: cozy-linstor
            labels:
              app.kubernetes.io/name: linstor-gateway-phase1
              layersentry.io/test-phase: gateway-control-plane
          data:
            linstor-gateway.toml: |
              [linstor]
              controllers = ["https://linstor-controller.cozy-linstor.svc:3371"]

              [server]
              cors_allowed_origins = []
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: linstor-gateway-phase1
            namespace: cozy-linstor
            labels:
              app.kubernetes.io/name: linstor-gateway-phase1
          spec:
            type: ClusterIP
            selector:
              app.kubernetes.io/name: linstor-gateway-phase1
            ports:
              - name: http
                port: 8337
                targetPort: http
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: linstor-gateway-phase1
            namespace: cozy-linstor
            labels:
              app.kubernetes.io/name: linstor-gateway-phase1
              layersentry.io/test-phase: gateway-control-plane
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: linstor-gateway-phase1
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: linstor-gateway-phase1
              spec:
                automountServiceAccountToken: false
                securityContext:
                  seccompProfile:
                    type: RuntimeDefault
                initContainers:
                  - name: fetch-pinned-gateway
                    image: alpine:3.22.1
                    command:
                      - /bin/sh
                      - -ec
                      - |
                        apk add --no-cache ca-certificates curl
                        curl -fsSL https://github.com/LINBIT/linstor-gateway/releases/download/v2.3.0/linstor-gateway-linux-amd64 -o /work/linstor-gateway
                        echo 'a5cd30cc79941d8cbf742b1539a57eefa33d5a001f3b26ef671ff027f2c8e4ef  /work/linstor-gateway' | sha256sum -c -
                        chmod 0755 /work/linstor-gateway
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                    volumeMounts:
                      - name: work
                        mountPath: /work
                containers:
                  - name: gateway
                    image: debian:bookworm-slim
                    command: ["/work/linstor-gateway"]
                    args:
                      - server
                      - --addr=:8337
                      - --config=/etc/linstor-gateway/linstor-gateway.toml
                    env:
                      - name: LS_ROOT_CA
                        valueFrom:
                          secretKeyRef:
                            name: linstor-client-tls
                            key: ca.crt
                      - name: LS_USER_CERTIFICATE
                        valueFrom:
                          secretKeyRef:
                            name: linstor-client-tls
                            key: tls.crt
                      - name: LS_USER_KEY
                        valueFrom:
                          secretKeyRef:
                            name: linstor-client-tls
                            key: tls.key
                    ports:
                      - name: http
                        containerPort: 8337
                    readinessProbe:
                      httpGet:
                        path: /api/v2/status
                        port: http
                      initialDelaySeconds: 2
                      periodSeconds: 5
                      timeoutSeconds: 3
                    livenessProbe:
                      httpGet:
                        path: /api/v2/status
                        port: http
                      initialDelaySeconds: 10
                      periodSeconds: 20
                      timeoutSeconds: 3
                    resources:
                      requests:
                        cpu: 25m
                        memory: 32Mi
                      limits:
                        cpu: 250m
                        memory: 128Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      runAsNonRoot: true
                      runAsUser: 65532
                      runAsGroup: 65532
                      capabilities:
                        drop: ["ALL"]
                    volumeMounts:
                      - name: work
                        mountPath: /work
                        readOnly: true
                      - name: config
                        mountPath: /etc/linstor-gateway/linstor-gateway.toml
                        subPath: linstor-gateway.toml
                        readOnly: true
                      - name: tmp
                        mountPath: /tmp
                volumes:
                  - name: work
                    emptyDir: {}
                  - name: config
                    configMap:
                      name: linstor-gateway-phase1
                  - name: tmp
                    emptyDir: {}
          '@

          $manifest | & $env:KUBECTL apply -f -
          if ($LASTEXITCODE -ne 0) { throw 'failed to apply Gateway Phase 1 control plane' }

          & $env:KUBECTL rollout status deployment/linstor-gateway-phase1 -n cozy-linstor --timeout=240s
          if ($LASTEXITCODE -ne 0) {
            & $env:KUBECTL get pod -n cozy-linstor -l app.kubernetes.io/name=linstor-gateway-phase1 -o wide
            & $env:KUBECTL describe pod -n cozy-linstor -l app.kubernetes.io/name=linstor-gateway-phase1
            & $env:KUBECTL logs -n cozy-linstor -l app.kubernetes.io/name=linstor-gateway-phase1 -c fetch-pinned-gateway --tail=100
            & $env:KUBECTL logs -n cozy-linstor -l app.kubernetes.io/name=linstor-gateway-phase1 -c gateway --tail=100
            throw 'Gateway Phase 1 rollout failed'
          }

      - name: Verify Gateway API without creating storage
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '===== GATEWAY VERSION ====='
          $version = & $env:KUBECTL exec -n cozy-linstor deployment/linstor-gateway-phase1 -c gateway -- /work/linstor-gateway version
          if ($LASTEXITCODE -ne 0 -or ($version -join "`n") -notmatch '2\.3\.0') { throw 'Gateway version validation failed' }
          $version

          $stdout = Join-Path $env:RUNNER_TEMP 'linstor-gateway-portforward.out'
          $stderr = Join-Path $env:RUNNER_TEMP 'linstor-gateway-portforward.err'
          Remove-Item $stdout,$stderr -ErrorAction SilentlyContinue
          $pf = Start-Process -FilePath $env:KUBECTL -ArgumentList @('port-forward','-n','cozy-linstor','service/linstor-gateway-phase1','18337:8337') -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 3
          if ($pf.HasExited) {
            Get-Content $stdout,$stderr -ErrorAction SilentlyContinue
            throw 'Gateway port-forward failed to start'
          }
          try {
            Write-Host '===== GATEWAY STATUS ====='
            $status = Invoke-RestMethod -Uri 'http://127.0.0.1:18337/api/v2/status' -TimeoutSec 10
            $statusJson = $status | ConvertTo-Json -Compress -Depth 10
            Write-Host $statusJson
            if ($status.status -ne 'ok' -or $status.version -ne '2.3.0') { throw 'Gateway status/version validation failed' }

            $readOnlyPaths = @('/api/v2/iscsi','/api/v2/nfs','/api/v2/nvme-of')
            foreach ($path in $readOnlyPaths) {
              Write-Host "===== READ ONLY $path ====="
              $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18337$path" -TimeoutSec 15
              if ([int]$response.StatusCode -ne 200) { throw "Gateway read-only endpoint returned $($response.StatusCode): $path" }
              Write-Host $response.Content
            }
          } finally {
            if (-not $pf.HasExited) { Stop-Process -Id $pf.Id -Force -ErrorAction SilentlyContinue }
          }
          Write-Host 'GATEWAY_CONTROL_PLANE=PASS'
          Write-Host 'GATEWAY_MUTATING_API_CALLS=NONE'

      - name: Verify controller health and preserve data-plane safety boundary
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '===== BUILT-IN SERVER CHECK-HEALTH (READ ONLY) ====='
          & $env:KUBECTL exec -n cozy-linstor deployment/linstor-gateway-phase1 -c gateway -- /work/linstor-gateway check-health --mode=server --controllers=https://linstor-controller.cozy-linstor.svc:3371
          if ($LASTEXITCODE -ne 0) { throw 'Gateway server-mode health check failed' }
          Write-Host 'GATEWAY_SERVER_PREREQUISITES=PASS'
          Write-Host 'GATEWAY_AGENT_PREREQUISITES=SAFE_BLOCKED'
          Write-Host 'Agent-mode iSCSI/NFS/NVMe-oF requires Talos host-side DRBD Reactor and target-service integration; no target was created in Phase 1.'
          Write-Host 'GATEWAY_EXPORT_CREATE_TEST=SAFE_BLOCKED'
          Write-Host 'Reason: execution contract prohibits destructive storage provisioning until stable persistent disk identity/WWID is certified.'
          Write-Host 'LINSTOR_GATEWAY_PHASE1=PASS'
