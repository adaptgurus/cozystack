name: LayerSentry VM Production Build
# Final immutable candidate builder. Enforces status-safe source-watcher recovery before publication.

on:
  workflow_dispatch:
  push:
    branches: [layersentry-platform]
    paths:
      - .github/workflows/layersentry-vm-production-build.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: layersentry-vm-production-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/adaptgurus/cozystack
  IMAGE_TAG: layersentry-production-${{ github.sha }}
  PUBLISH_VERSIONED: '0'
  PUBLISH_FLOATING: '0'
  WRITE_CACHE: '0'

jobs:
  build-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact production candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Flux and yq
        shell: bash
        run: |
          set -euo pipefail
          FLUX_VERSION=v2.6.4
          A="flux_${FLUX_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSLo "/tmp/$A" "https://github.com/fluxcd/flux2/releases/download/${FLUX_VERSION}/$A"
          curl -fsSLo /tmp/flux-checksums "https://github.com/fluxcd/flux2/releases/download/${FLUX_VERSION}/flux_${FLUX_VERSION#v}_checksums.txt"
          grep " $A$" /tmp/flux-checksums | sed "s#  $A#  /tmp/$A#" >/tmp/flux.expected
          sha256sum -c /tmp/flux.expected
          tar -xzf "/tmp/$A" -C /tmp flux
          sudo install -m 0755 /tmp/flux /usr/local/bin/flux

          YQ_VERSION=v4.47.2
          curl -fsSLo /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo '1bb99e1019e23de33c7e6afc23e93dad72aad6cf2cb03c797f068ea79814ddb0  /tmp/yq' >/tmp/yq.expected
          sha256sum -c /tmp/yq.expected
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          flux version --client
          yq --version

      - name: Validate complete dashboard console logic and types
        shell: bash
        working-directory: packages/system/dashboard/images/console
        run: |
          set -euo pipefail
          node --version
          corepack enable
          corepack prepare pnpm@11.1.2 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @cozystack/console test
          pnpm --filter @cozystack/console typecheck
          echo "CONSOLE_LOGIC_TYPE_GATE=PASS"

      - name: Revalidate source-watcher recovery operator logic
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'reasonRecoveredLostReady = "RecoveredLostReady"' internal/operator/packagesource_ready_repair.go >/dev/null
          grep -F 'proveArtifactGeneratorCurrentSuccess' internal/operator/packagesource_ready_repair_test.go >/dev/null
          grep -F 'requestArtifactGeneratorRecovery(ctx, ag, now, nextAttempt)' internal/operator/packagesource_reconciler.go >/dev/null
          ! grep -F 'forceArtifactGeneratorDrift(ctx, ag, now, nextAttempt)' internal/operator/packagesource_reconciler.go >/dev/null
          grep -F 'len(ag.Spec.Sources) == 0' internal/operator/packagesource_recovery_request.go >/dev/null
          go test ./internal/operator -count=1
          echo "OPERATOR_STATUS_SAFE_RECOVERY_TEST_GATE=PASS sha=${GITHUB_SHA}"

      - name: Build immutable dashboard and repaired operator, then package together
        id: build
        shell: bash
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          make -C packages/system/dashboard image
          make -C packages/core/installer image-operator image-packages

          operator_image="$(yq -r '.cozystackOperator.image' packages/core/installer/values.yaml)"
          source_url="$(yq -r '.cozystackOperator.platformSourceUrl' packages/core/installer/values.yaml)"
          source_ref="$(yq -r '.cozystackOperator.platformSourceRef' packages/core/installer/values.yaml)"
          dashboard_image="$(yq -r '.console.image' packages/system/dashboard/values.yaml)"

          case "$operator_image" in ghcr.io/adaptgurus/cozystack/cozystack-operator:*@sha256:*) ;; *) echo "::error::bad operator image $operator_image"; exit 1;; esac
          case "$dashboard_image" in ghcr.io/adaptgurus/cozystack/cozystack-ui:*@sha256:*) ;; *) echo "::error::bad dashboard image $dashboard_image"; exit 1;; esac
          test "$source_url" = 'oci://ghcr.io/adaptgurus/cozystack/cozystack-packages'
          case "$source_ref" in digest=sha256:*) ;; *) echo "::error::bad source ref $source_ref"; exit 1;; esac
          package_digest="${source_ref#digest=}"

          echo "operator_image=$operator_image" >> "$GITHUB_OUTPUT"
          echo "dashboard_image=$dashboard_image" >> "$GITHUB_OUTPUT"
          echo "package_digest=$package_digest" >> "$GITHUB_OUTPUT"
          echo "PRODUCTION_OPERATOR_IMAGE=$operator_image"
          echo "PRODUCTION_DASHBOARD_IMAGE=$dashboard_image"
          echo "PRODUCTION_PACKAGE_DIGEST=$package_digest"

      - name: Verify exact immutable package contents
        shell: bash
        env:
          OPERATOR_IMAGE: ${{ steps.build.outputs.operator_image }}
          DASHBOARD_IMAGE: ${{ steps.build.outputs.dashboard_image }}
          PACKAGE_DIGEST: ${{ steps.build.outputs.package_digest }}
        run: |
          set -euo pipefail
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          flux pull artifact "oci://ghcr.io/adaptgurus/cozystack/cozystack-packages@${PACKAGE_DIGEST}" --output /tmp/pkg

          actual_operator="$(yq -r '.cozystackOperator.image' /tmp/pkg/core/installer/values.yaml)"
          actual_dashboard="$(yq -r '.console.image' /tmp/pkg/system/dashboard/values.yaml)"
          test "$actual_operator" = "$OPERATOR_IMAGE"
          test "$actual_dashboard" = "$DASHBOARD_IMAGE"

          grep -F -- '--scope=openid email profile' /tmp/pkg/system/dashboard/templates/gatekeeper.yaml >/dev/null
          ! grep -F -- '--scope=openid email profile offline_access' /tmp/pkg/system/dashboard/templates/gatekeeper.yaml >/dev/null
          test -f /tmp/pkg/system/dashboard/templates/clusterrole-storage-management.yaml
          test -f /tmp/pkg/system/dashboard/templates/clusterrolebinding-storage-management.yaml

          helm template dashboard /tmp/pkg/system/dashboard --set-string '_cluster.root-host=offline.invalid' >/tmp/dashboard.yaml
          python3 - <<'PY'
          import os, yaml
          docs=list(yaml.safe_load_all(open('/tmp/dashboard.yaml')))
          deps=[d for d in docs if isinstance(d,dict) and d.get('kind')=='Deployment' and d.get('metadata',{}).get('name')=='cozy-dashboard-console']
          if len(deps)!=1:
              raise SystemExit(f'expected one cozy-dashboard-console Deployment, got {len(deps)}')
          containers=deps[0]['spec']['template']['spec']['containers']
          console=[c for c in containers if c.get('name')=='console']
          if len(console)!=1:
              raise SystemExit(f'expected one console container, got {len(console)}')
          actual=console[0].get('image')
          expected=os.environ['DASHBOARD_IMAGE']
          if actual!=expected:
              raise SystemExit(f'rendered dashboard image mismatch expected={expected} actual={actual}')
          print(f'IMMUTABLE_RENDERED_DASHBOARD=PASS image={actual}')
          PY
          echo "IMMUTABLE_PRODUCTION_PACKAGE=PASS digest=${PACKAGE_DIGEST} operator=${OPERATOR_IMAGE} dashboard=${DASHBOARD_IMAGE}"
          echo "CERT_PIN_READY=PASS package=${PACKAGE_DIGEST} operator=${OPERATOR_IMAGE} dashboard=${DASHBOARD_IMAGE} sha=${GITHUB_SHA}"
