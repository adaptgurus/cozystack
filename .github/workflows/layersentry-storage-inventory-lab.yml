name: LayerSentry Storage Inventory Lab

on:
  workflow_dispatch:
  push:
    branches:
      - layersentry-platform
    paths:
      - .github/workflows/layersentry-storage-inventory-lab.yml

concurrency:
  group: layersentry-storage-inventory-lab
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: powershell

jobs:
  inventory:
    name: Certify and publish HCI data-disk inventory
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    env:
      TALOSCONFIG: C:\hci-state\cozystack-hci-lab\talosconfig
      TALOSCTL: C:\hci-tools\talosctl.exe
      KUBECONFIG: C:\hci-state\cozystack-hci-lab\kubeconfig
      KUBECTL: C:\hci-tools\kubectl.exe
      HCI_NODE_IPS: 10.10.10.11,10.10.10.12,10.10.10.13
      DATA_DISK: sdb

    steps:
      - name: Read-only Talos disk identity and existing-data certification
        id: certify
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          if ($env:GITHUB_REF_NAME -ne 'layersentry-platform') {
            throw "refusing branch $env:GITHUB_REF_NAME"
          }
          foreach ($path in @($env:TALOSCTL, $env:TALOSCONFIG)) {
            if (-not (Test-Path $path)) { throw "missing TESTSER asset $path" }
          }

          function Get-Scalar([string]$Yaml, [string]$Key) {
            $match = [regex]::Match($Yaml, "(?m)^\s*" + [regex]::Escape($Key) + ":\s*(.*?)\s*$")
            if (-not $match.Success) { return '' }
            $value = $match.Groups[1].Value.Trim().Trim('"').Trim("'")
            if ($value -in @('', 'null', '~', '<nil>', 'unknown')) { return '' }
            return $value
          }

          function Get-ByIdAliases([string]$Yaml) {
            return @([regex]::Matches($Yaml, '/dev/disk/by-id/[^\s"'']+') |
              ForEach-Object { $_.Value.TrimEnd(',', ']') } |
              Where-Object { $_ -notmatch '-part[0-9]+$' -and $_ -notmatch '/by-id/wwn-0x0+$' } |
              Sort-Object -Unique)
          }

          function Get-ExistingDataEvidence([string]$DiscoveredYaml, [string]$DiskId) {
            $evidence = New-Object System.Collections.Generic.List[string]
            $docs = [regex]::Split($DiscoveredYaml, '(?m)^---\s*$')
            foreach ($doc in $docs) {
              $id = Get-Scalar $doc 'id'
              if (-not $id) { continue }
              $whole = $id -eq $DiskId
              $child = $id -match ('^' + [regex]::Escape($DiskId) + 'p?[0-9]+$')
              if (-not ($whole -or $child)) { continue }

              if ($child) { $evidence.Add("child:$id") }
              foreach ($key in @(
                'discovered',
                'type',
                'filesystem',
                'partition_label',
                'partition_uuid',
                'mountpoint',
                'read_only',
                'encrypted',
                'size'
              )) {
                $value = Get-Scalar $doc $key
                if ($value) { $evidence.Add("${id}:${key}=$value") }
              }
            }
            return @($evidence | Sort-Object -Unique)
          }

          $records = @()
          foreach ($node in ($env:HCI_NODE_IPS -split ',')) {
            Write-Host "===== $node /dev/$env:DATA_DISK ====="

            $diskYaml = (& $env:TALOSCTL -n $node -e $node get disk $env:DATA_DISK -o yaml 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) {
              $records += [pscustomobject]@{
                Node = $node
                Device = "/dev/$env:DATA_DISK"
                Size = ''
                Model = ''
                Transport = ''
                Identity = ''
                ById = ''
                Status = 'BLOCKED'
                Reason = 'disk-resource-unreadable'
                ExistingDataEvidence = ''
              }
              continue
            }

            $systemYaml = (& $env:TALOSCTL -n $node -e $node get systemdisk -o yaml 2>&1 | Out-String)
            $systemOk = $LASTEXITCODE -eq 0
            $volumesYaml = (& $env:TALOSCTL -n $node -e $node get discoveredvolumes -o yaml 2>&1 | Out-String)
            $volumesOk = $LASTEXITCODE -eq 0

            $devPath = Get-Scalar $diskYaml 'dev_path'
            $size = Get-Scalar $diskYaml 'pretty_size'
            if (-not $size) { $size = Get-Scalar $diskYaml 'size' }
            $model = Get-Scalar $diskYaml 'model'
            $transport = Get-Scalar $diskYaml 'transport'
            $readonly = (Get-Scalar $diskYaml 'readonly').ToLowerInvariant()
            $wwid = Get-Scalar $diskYaml 'wwid'
            $serial = Get-Scalar $diskYaml 'serial'
            $aliases = @(Get-ByIdAliases $diskYaml)

            $identity = ''
            if ($wwid -and $wwid -notmatch '^(0x)?0+$') {
              $identity = "wwid:$($wwid.ToLowerInvariant())"
            } elseif ($aliases.Count -gt 0) {
              $identity = "by-id:$([IO.Path]::GetFileName($aliases[0]))"
            } elseif ($serial -and $serial -notmatch '^(0x)?0+$') {
              $identity = "serial:$serial"
            }

            $reasons = New-Object System.Collections.Generic.List[string]
            if ($devPath -ne "/dev/$env:DATA_DISK") { $reasons.Add("unexpected-dev-path:$devPath") }
            if (-not $identity) { $reasons.Add('no-stable-hardware-identity') }
            if ($readonly -eq 'true') { $reasons.Add('read-only-device') }

            if (-not $systemOk) {
              $reasons.Add('system-disk-state-unreadable')
            } elseif ($systemYaml -match "(?m)^\s*disk:\s*$([regex]::Escape($env:DATA_DISK))\s*$" -or
                      $systemYaml -match [regex]::Escape("/dev/$env:DATA_DISK")) {
              $reasons.Add('os-system-disk')
            }

            $evidence = @()
            if (-not $volumesOk) {
              $reasons.Add('discovered-volume-state-unreadable')
            } else {
              $evidence = @(Get-ExistingDataEvidence $volumesYaml $env:DATA_DISK)
              if ($evidence.Count -gt 0) { $reasons.Add('existing-data-present') }
            }

            $records += [pscustomobject]@{
              Node = $node
              Device = $devPath
              Size = $size
              Model = $model
              Transport = $transport
              Identity = $identity
              ById = ($aliases -join ',')
              Status = $(if ($reasons.Count -eq 0) { 'CANDIDATE' } else { 'BLOCKED' })
              Reason = ($reasons -join ',')
              ExistingDataEvidence = ($evidence -join ';')
            }
          }

          # A stable identifier is useful only when it resolves to exactly one disk.
          $duplicates = @($records |
            Where-Object { $_.Identity } |
            Group-Object Identity |
            Where-Object { $_.Count -gt 1 } |
            Select-Object -ExpandProperty Name)
          foreach ($record in $records) {
            if ($record.Identity -and $duplicates -contains $record.Identity) {
              $record.Status = 'BLOCKED'
              $record.Reason = (@($record.Reason, 'duplicate-stable-identity') |
                Where-Object { $_ }) -join ','
            }
          }

          $blocked = @($records | Where-Object { $_.Status -ne 'CANDIDATE' })
          $gate = if ($blocked.Count -eq 0) { 'IDENTITY_CERTIFIED' } else { 'BLOCKED' }
          $report = [ordered]@{
            schemaVersion = 'storage.layersentry.io/v1alpha1'
            generatedAt = [DateTime]::UtcNow.ToString('o')
            sourceCommit = $env:GITHUB_SHA
            sourceRun = $env:GITHUB_RUN_ID
            identityGate = $gate
            initializationAllowed = $false
            blockedDevices = $blocked.Count
            devices = @($records)
          }

          $reportPath = Join-Path $env:RUNNER_TEMP 'layersentry-storage-inventory.json'
          $json = $report | ConvertTo-Json -Depth 12
          [IO.File]::WriteAllText($reportPath, $json, (New-Object Text.UTF8Encoding($false)))

          Write-Host '===== STORAGE IDENTITY CERTIFICATION ====='
          $records | Format-List Node,Device,Size,Model,Transport,Identity,ById,Status,Reason,ExistingDataEvidence
          Write-Host "STORAGE_IDENTITY_CERTIFICATION=$gate"
          Write-Host 'STORAGE_INITIALIZATION_ALLOWED=false'

          @(
            '## LayerSentry Storage Identity Certification',
            '',
            "Identity gate: **$gate**",
            '',
            'Initialization allowed: **false**',
            '',
            '| Node | Device | Size | Stable identity | Status | Reason | Existing-data evidence |',
            '|---|---|---:|---|---|---|---|'
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          foreach ($record in $records) {
            $id = if ($record.Identity) { $record.Identity } else { 'NONE' }
            $reason = if ($record.Reason) { $record.Reason } else { '-' }
            $e = if ($record.ExistingDataEvidence) { $record.ExistingDataEvidence } else { '-' }
            "| $($record.Node) | $($record.Device) | $($record.Size) | $id | $($record.Status) | $reason | $e |" |
              Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

          "report_path=$reportPath" | Add-Content -Path $env:GITHUB_OUTPUT
          "blocked_count=$($blocked.Count)" | Add-Content -Path $env:GITHUB_OUTPUT
          "identity_gate=$gate" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Classify existing storage metadata read-only
        run: |
          $ErrorActionPreference = 'Continue'
          Set-StrictMode -Version Latest

          if ($env:GITHUB_REF_NAME -ne 'layersentry-platform') {
            throw "refusing branch $env:GITHUB_REF_NAME"
          }
          foreach ($path in @($env:TALOSCTL, $env:TALOSCONFIG, $env:KUBECTL, $env:KUBECONFIG)) {
            if (-not (Test-Path $path)) { throw "missing TESTSER asset $path" }
          }

          function Select-StorageSignals([string]$Text, [string]$Pattern) {
            if (-not $Text) { return @() }
            return @($Text -split "`r?`n" |
              Where-Object { $_ -match $Pattern } |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ } |
              Select-Object -Unique)
          }

          function Invoke-TalosReadOnly([string]$Node, [string[]]$Arguments) {
            $text = (& $env:TALOSCTL -n $Node -e $Node @Arguments 2>&1 | Out-String)
            $exit = $LASTEXITCODE
            return [pscustomobject]@{ ExitCode = $exit; Text = $text }
          }

          $storagePattern = 'sdb|zfs|linstor|blockstor|openebs|drbd|nfs|iscsi|nvme|storage|volume|mount'
          $nodeRows = @()

          foreach ($node in ($env:HCI_NODE_IPS -split ',')) {
            Write-Host "===== READ-ONLY STORAGE CLASSIFICATION $node ====="

            $volumes = Invoke-TalosReadOnly $node @('get', 'discoveredvolumes', '-o', 'yaml')
            $mounts = Invoke-TalosReadOnly $node @('read', '/proc/mounts')
            $filesystems = Invoke-TalosReadOnly $node @('read', '/proc/filesystems')
            $modules = Invoke-TalosReadOnly $node @('read', '/proc/modules')
            $resources = Invoke-TalosReadOnly $node @('get', 'rd', '-o', 'yaml')
            $extensions = Invoke-TalosReadOnly $node @('get', 'extensions', '-o', 'yaml')

            $volumeSignals = @(Select-StorageSignals $volumes.Text 'sdb|zfs|filesystem|partition_label|partition_uuid|mountpoint')
            $mountSignals = @(Select-StorageSignals $mounts.Text 'sdb|zfs')
            $filesystemSignals = @(Select-StorageSignals $filesystems.Text 'zfs|nfs|fuse|xfs|ext4')
            $moduleSignals = @(Select-StorageSignals $modules.Text 'zfs|spl|drbd|nvme|iscsi')
            $resourceSignals = @(Select-StorageSignals $resources.Text $storagePattern)
            $extensionSignals = @(Select-StorageSignals $extensions.Text $storagePattern)

            $nodeRows += [pscustomobject]@{
              Node = $node
              DiscoveredVolumeQuery = $volumes.ExitCode
              MountQuery = $mounts.ExitCode
              FilesystemQuery = $filesystems.ExitCode
              ModuleQuery = $modules.ExitCode
              ResourceDefinitionQuery = $resources.ExitCode
              ExtensionQuery = $extensions.ExitCode
              DiscoveredVolumeSignals = ($volumeSignals -join ' | ')
              ActiveMountSignals = ($mountSignals -join ' | ')
              FilesystemSignals = ($filesystemSignals -join ' | ')
              ModuleSignals = ($moduleSignals -join ' | ')
              ResourceSignals = ($resourceSignals -join ' | ')
              ExtensionSignals = ($extensionSignals -join ' | ')
            }

            Write-Host "DISCOVERED_VOLUME_QUERY_EXIT=$($volumes.ExitCode)"
            $volumeSignals | ForEach-Object { Write-Host "VOLUME_SIGNAL=$_" }
            Write-Host "MOUNT_QUERY_EXIT=$($mounts.ExitCode)"
            $mountSignals | ForEach-Object { Write-Host "ACTIVE_MOUNT_SIGNAL=$_" }
            Write-Host "FILESYSTEM_QUERY_EXIT=$($filesystems.ExitCode)"
            $filesystemSignals | ForEach-Object { Write-Host "FILESYSTEM_SIGNAL=$_" }
            Write-Host "MODULE_QUERY_EXIT=$($modules.ExitCode)"
            $moduleSignals | ForEach-Object { Write-Host "MODULE_SIGNAL=$_" }
            Write-Host "RESOURCE_DEFINITION_QUERY_EXIT=$($resources.ExitCode)"
            $resourceSignals | ForEach-Object { Write-Host "RESOURCE_SIGNAL=$_" }
            Write-Host "EXTENSION_QUERY_EXIT=$($extensions.ExitCode)"
            $extensionSignals | ForEach-Object { Write-Host "EXTENSION_SIGNAL=$_" }
          }

          Write-Host '===== READ-ONLY KUBERNETES STORAGE SIGNALS ====='
          $k8sCommands = @(
            @{ Name = 'StorageClasses'; Args = @('get', 'storageclass', '-o', 'wide') },
            @{ Name = 'PersistentVolumes'; Args = @('get', 'pv', '-o', 'wide') },
            @{ Name = 'StoragePods'; Args = @('get', 'pods', '-A', '-o', 'wide') },
            @{ Name = 'StorageWorkloads'; Args = @('get', 'deploy,statefulset,daemonset', '-A', '-o', 'wide') },
            @{ Name = 'StorageCRDs'; Args = @('get', 'crd', '-o', 'name') }
          )
          $k8sSummary = @()
          foreach ($query in $k8sCommands) {
            $text = (& $env:KUBECTL @($query.Args) 2>&1 | Out-String)
            $exit = $LASTEXITCODE
            $signals = @(Select-StorageSignals $text $storagePattern)
            Write-Host "$($query.Name)_QUERY_EXIT=$exit"
            $signals | ForEach-Object { Write-Host "$($query.Name.ToUpperInvariant())_SIGNAL=$_" }
            $k8sSummary += [pscustomobject]@{
              Query = $query.Name
              ExitCode = $exit
              Signals = ($signals -join ' | ')
            }
          }

          @(
            '',
            '## Read-only existing-storage classification',
            '',
            'This step only reads Talos procfs/resources and Kubernetes API objects. It does not import, mount, wipe, format, partition, initialize, or create storage.',
            '',
            '| Node | Active sdb/ZFS mount signal | ZFS/DRBD module signal |',
            '|---|---|---|'
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          foreach ($row in $nodeRows) {
            $mount = if ($row.ActiveMountSignals) { $row.ActiveMountSignals.Replace('|', '\|') } else { '-' }
            $module = if ($row.ModuleSignals) { $row.ModuleSignals.Replace('|', '\|') } else { '-' }
            "| $($row.Node) | $mount | $module |" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

          Write-Host 'STORAGE_METADATA_CLASSIFICATION=READ_ONLY'
          Write-Host 'STORAGE_METADATA_OWNERSHIP=UNPROVEN_UNLESS_DIRECT_SIGNAL_FOUND'
          Write-Host 'NO_DESTRUCTIVE_ACTION_TAKEN=true'

      - name: Publish read-only inventory to Storage Management API surface
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          foreach ($path in @($env:KUBECTL, $env:KUBECONFIG, '${{ steps.certify.outputs.report_path }}')) {
            if (-not (Test-Path $path)) { throw "missing TESTSER asset $path" }
          }

          & $env:KUBECTL get namespace cozy-system -o name | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'cozy-system namespace is unavailable' }

          $reportPath = '${{ steps.certify.outputs.report_path }}'
          $manifest = (& $env:KUBECTL -n cozy-system create configmap layersentry-storage-inventory "--from-file=inventory.json=$reportPath" --dry-run=client -o yaml 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'failed to render storage inventory ConfigMap' }
          $manifest | & $env:KUBECTL apply -f - | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'failed to publish storage inventory ConfigMap' }

          & $env:KUBECTL -n cozy-system label configmap layersentry-storage-inventory app.kubernetes.io/part-of=layersentry layersentry.io/storage-inventory=true --overwrite | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'failed to label storage inventory ConfigMap' }

          $published = (& $env:KUBECTL -n cozy-system get configmap layersentry-storage-inventory -o json | ConvertFrom-Json)
          $payload = $published.data.'inventory.json' | ConvertFrom-Json
          if ([string]$payload.sourceCommit -ne $env:GITHUB_SHA) {
            throw "published sourceCommit $($payload.sourceCommit) does not match $env:GITHUB_SHA"
          }
          if ([bool]$payload.initializationAllowed) {
            throw 'safety violation: published inventory unexpectedly enables initialization'
          }
          Write-Host "STORAGE_INVENTORY_CONFIGMAP=PASS gate=$($payload.identityGate) blocked=$($payload.blockedDevices)"

      - name: Enforce non-destructive boundary
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Get-Content '${{ steps.certify.outputs.report_path }}' -Raw | ConvertFrom-Json
          if ([bool]$report.initializationAllowed) {
            throw 'safety violation: identity workflow must never authorize initialization'
          }
          if ([string]$report.identityGate -eq 'BLOCKED') {
            Write-Host "STORAGE_SAFETY_STATE=BLOCKED blockedDevices=$($report.blockedDevices)"
            Write-Host 'NO_DESTRUCTIVE_ACTION_TAKEN=true'
          } else {
            Write-Host 'STORAGE_SAFETY_STATE=IDENTITY_CERTIFIED'
            Write-Host 'STORAGE_INITIALIZATION_ALLOWED=false'
            Write-Host 'NO_DESTRUCTIVE_ACTION_TAKEN=true'
          }
