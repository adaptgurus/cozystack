name: LayerSentry CloudStack Phase 2 Inventory

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - hack/layersentry/cloudstack-phase2-inventory-requests/*.json

permissions:
  contents: read

concurrency:
  group: layersentry-cloudstack-phase2-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout runner helpers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Collect Hyper-V and guest inventory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          Import-Module Hyper-V -ErrorAction Stop

          $evidence = Join-Path $env:RUNNER_TEMP 'layersentry-cloudstack-phase2-inventory'
          if (Test-Path -LiteralPath $evidence) { Remove-Item -LiteralPath $evidence -Recurse -Force }
          New-Item -Path $evidence -ItemType Directory -Force | Out-Null

          [string[]]$changed = @(
            @(git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA -- 'hack/layersentry/cloudstack-phase2-inventory-requests/*.json') |
              ForEach-Object { [string]$_ } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )
          if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 1) { throw 'Expected exactly one phase-2 inventory request.' }
          $request = Get-Content -LiteralPath $changed[0].Trim() -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$request.operation -ne 'LAYERSENTRY_CLOUDSTACK_PHASE2_INVENTORY') { throw 'Unsupported operation.' }
          if ([string]$request.authorization -ne 'USER_AUTHORIZED_READ_ONLY_PHASE2_INVENTORY') { throw 'Inventory authorization missing.' }
          if ([string]$request.expectedAddress -ne '10.10.10.14') { throw 'Target address mismatch.' }
          if ([string]$request.expectedFqdn -ne 'layersentry.lab.example') { throw 'Target FQDN mismatch.' }

          $vms = @(Get-VM)
          if ($vms.Count -ne 1) { throw "Safety stop: expected exactly one Hyper-V VM; found $($vms.Count)." }
          $vm = $vms[0]
          if ($vm.State -ne 'Running') { throw "Only VM '$($vm.Name)' is not running." }
          $cpu = Get-VMProcessor -VMName $vm.Name
          if (-not [bool]$cpu.ExposeVirtualizationExtensions) { throw 'Nested virtualization is not exposed.' }
          $nic = Get-VMNetworkAdapter -VMName $vm.Name | Select-Object -First 1
          if ([string]$nic.MacAddressSpoofing -ne 'On') { throw 'MAC spoofing is not enabled.' }

          $hostFile = Join-Path $evidence 'hyperv-host.txt'
          '===== HYPER-V VM =====' | Set-Content -LiteralPath $hostFile -Encoding UTF8
          Get-VM -Name $vm.Name | Format-List Name,State,ProcessorCount,MemoryAssigned,Uptime,Path | Out-String | Add-Content -LiteralPath $hostFile -Encoding UTF8
          '===== PROCESSOR =====' | Add-Content -LiteralPath $hostFile -Encoding UTF8
          Get-VMProcessor -VMName $vm.Name | Format-List VMName,Count,ExposeVirtualizationExtensions,CompatibilityForMigrationEnabled | Out-String | Add-Content -LiteralPath $hostFile -Encoding UTF8
          '===== VM NIC =====' | Add-Content -LiteralPath $hostFile -Encoding UTF8
          Get-VMNetworkAdapter -VMName $vm.Name | Format-List VMName,Name,SwitchName,MacAddress,MacAddressSpoofing,Status,IPAddresses | Out-String | Add-Content -LiteralPath $hostFile -Encoding UTF8
          '===== VM VLAN =====' | Add-Content -LiteralPath $hostFile -Encoding UTF8
          Get-VMNetworkAdapterVlan -VMName $vm.Name | Format-List * | Out-String | Add-Content -LiteralPath $hostFile -Encoding UTF8
          '===== VSWITCHES =====' | Add-Content -LiteralPath $hostFile -Encoding UTF8
          Get-VMSwitch | Format-List Name,SwitchType,NetAdapterInterfaceDescription,AllowManagementOS | Out-String | Add-Content -LiteralPath $hostFile -Encoding UTF8
          '===== HOST IPV4 =====' | Add-Content -LiteralPath $hostFile -Encoding UTF8
          Get-NetIPAddress -AddressFamily IPv4 | Sort-Object InterfaceAlias,IPAddress | Format-Table InterfaceAlias,IPAddress,PrefixLength -AutoSize | Out-String | Add-Content -LiteralPath $hostFile -Encoding UTF8
          '===== HOST NAT =====' | Add-Content -LiteralPath $hostFile -Encoding UTF8
          Get-NetNat -ErrorAction SilentlyContinue | Format-List Name,InternalIPInterfaceAddressPrefix,Active | Out-String | Add-Content -LiteralPath $hostFile -Encoding UTF8

          $key = Join-Path $env:RUNNER_TEMP 'layersentry-phase2-inventory-ed25519'
          Remove-Item -LiteralPath $key -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "$key.pub" -Force -ErrorAction SilentlyContinue
          $comment = "layersentry-phase2-inventory-$env:GITHUB_RUN_ID"
          $keygenCommand = "ssh-keygen.exe -q -t ed25519 -N `"`" -C $comment -f `"$key`""
          & cmd.exe /d /s /c $keygenCommand
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $key -PathType Leaf)) { throw 'ssh-keygen failed.' }

          $source = (Resolve-Path -LiteralPath 'hack/layersentry/invoke-hyperv-console-command.ps1').ProviderPath
          $patchedHelper = Join-Path $env:RUNNER_TEMP 'invoke-layersentry-phase2-console.ps1'
          $helper = Get-Content -LiteralPath $source -Raw -Encoding UTF8
          $needle = "`$allowedNames = @('sen1', 'sen2', 'sen3')"
          $escapedVm = $vm.Name.Replace("'", "''")
          if (-not $helper.Contains($needle)) { throw 'Console helper allow-list guard not found.' }
          Set-Content -LiteralPath $patchedHelper -Value ($helper.Replace($needle, "`$allowedNames = @('$escapedVm')")) -Encoding UTF8

          $pub = (Get-Content -LiteralPath "$key.pub" -Raw -Encoding ASCII).Trim()
          if ($pub -notmatch '^ssh-ed25519\s+') { throw 'Unexpected public key format.' }
          $bootstrap = "install -d -m 700 /root/.ssh && echo '$pub' >> /root/.ssh/authorized_keys && chmod 600 /root/.ssh/authorized_keys"
          $consoleRequest = [ordered]@{
            requestId = "phase2-inventory-bootstrap-$env:GITHUB_RUN_ID"
            delayAfterSeconds = 3
            targets = @([ordered]@{
              vm = $vm.Name
              actions = @(
                [ordered]@{ kind='key'; code=13 },
                [ordered]@{ kind='text'; value=$bootstrap },
                [ordered]@{ kind='key'; code=13 }
              )
            })
          }
          $consolePath = Join-Path $env:RUNNER_TEMP 'layersentry-phase2-inventory-console.json'
          $consoleRequest | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $consolePath -Encoding UTF8
          & $patchedHelper -RequestPath $consolePath -OutputDirectory (Join-Path $evidence 'console-bootstrap')

          $ssh = @('-i',$key,'-o','BatchMode=yes','-o','StrictHostKeyChecking=no','-o','UserKnownHostsFile=NUL','-o','LogLevel=ERROR','-o','ConnectTimeout=10','root@10.10.10.14')
          $scp = @('-i',$key,'-o','BatchMode=yes','-o','StrictHostKeyChecking=no','-o','UserKnownHostsFile=NUL','-o','LogLevel=ERROR','-o','ConnectTimeout=10')
          $ready = $false
          try {
            for ($i=1; $i -le 12; $i++) {
              $old=$ErrorActionPreference; $ErrorActionPreference='Continue'
              $probe=& ssh.exe @ssh 'printf PHASE2_INVENTORY_READY' 2>&1; $rc=$LASTEXITCODE
              $ErrorActionPreference=$old
              if ($rc -eq 0 -and (($probe -join '') -match 'PHASE2_INVENTORY_READY')) { $ready=$true; break }
              Start-Sleep -Seconds 5
            }
            if (-not $ready) { throw 'Ephemeral SSH bootstrap failed.' }

            $guestScript = Join-Path $env:RUNNER_TEMP 'layersentry-phase2-inventory.sh'
            $guestB64 = ''
            [IO.File]::WriteAllBytes($guestScript,[Convert]::FromBase64String($guestB64))

            & scp.exe @scp $guestScript 'root@10.10.10.14:/tmp/layersentry-phase2-inventory.sh'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to copy guest inventory script.' }
            $old=$ErrorActionPreference; $ErrorActionPreference='Continue'
            & ssh.exe @ssh 'chmod 700 /tmp/layersentry-phase2-inventory.sh && /tmp/layersentry-phase2-inventory.sh; rc=$?; rm -f /tmp/layersentry-phase2-inventory.sh; exit $rc' 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'guest-inventory.txt')
            $guestRc=$LASTEXITCODE; $ErrorActionPreference=$old
            if ($guestRc -ne 0) { throw "Guest inventory exited $guestRc." }
            if (-not (Select-String -LiteralPath (Join-Path $evidence 'guest-inventory.txt') -Pattern 'PHASE2_INVENTORY_COMPLETE' -Quiet)) { throw 'Inventory completion marker missing.' }
            & 'hack/layersentry/capture-hyperv-console.ps1' -VmNames @($vm.Name) -OutputDirectory (Join-Path $evidence 'final-console')
          }
          finally {
            if ($ready) {
              $safeComment=$comment.Replace("'","")
              $old=$ErrorActionPreference; $ErrorActionPreference='Continue'
              & ssh.exe @ssh "sed -i '/$safeComment`$/d' /root/.ssh/authorized_keys" 2>&1 | Out-Null
              $ErrorActionPreference=$old
            }
            Remove-Item -LiteralPath $key -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath "$key.pub" -Force -ErrorAction SilentlyContinue
          }

      - name: Upload phase 2 inventory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layersentry-cloudstack-phase2-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}\layersentry-cloudstack-phase2-inventory\**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
