name: LayerSentry Dashboard Tenant Diagnose

on:
  push:
    branches:
      - layersentry-platform
    paths:
      - .github/workflows/layersentry-dashboard-tenant-diagnose.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: powershell

jobs:
  diagnose:
    name: Diagnose Cozystack dashboard tenant and schema APIs on TESTSER
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    env:
      KUBECONFIG: C:\hci-state\cozystack-hci-lab\kubeconfig
    steps:
      - name: Verify runner and cluster
        run: |
          $ErrorActionPreference = 'Stop'
          $kubectl = 'C:\hci-tools\kubectl.exe'
          if (-not (Test-Path $kubectl)) { throw "kubectl missing: $kubectl" }
          if (-not (Test-Path $env:KUBECONFIG)) { throw "kubeconfig missing: $env:KUBECONFIG" }
          & $kubectl version
          & $kubectl get nodes -o wide
          if ($LASTEXITCODE -ne 0) { throw 'cluster access failed' }

      - name: Diagnose tenant state and supported creation source
        run: |
          $ErrorActionPreference = 'Continue'
          $kubectl = 'C:\hci-tools\kubectl.exe'

          Write-Host '===== TENANT / PLAN / BACKUP API RESOURCES ====='
          & $kubectl api-resources -o wide | Select-String -Pattern 'tenant|plan|backup' -CaseSensitive:$false

          Write-Host '===== TENANTNAMESPACES ====='
          & $kubectl get tenantnamespaces.core.cozystack.io -o yaml
          Write-Host "tenantnamespace_exit=$LASTEXITCODE"

          Write-Host '===== TENANT ROOT ====='
          & $kubectl get namespace tenant-root -o yaml

          Write-Host '===== TENANT HELMRELEASES ====='
          & $kubectl get helmreleases.helm.toolkit.fluxcd.io -A -o wide | Select-String -Pattern 'tenant' -CaseSensitive:$false

          Write-Host '===== APPLICATIONDEFINITION TENANT ====='
          & $kubectl get applicationdefinitions tenant -o yaml 2>$null
          Write-Host "appdef_tenant_exit=$LASTEXITCODE"

          Write-Host '===== COZYSTACK-APPS SOURCE ====='
          & $kubectl get helmrepository.source.toolkit.fluxcd.io -n cozy-public cozystack-apps -o yaml 2>$null
          Write-Host "cozystack_apps_exit=$LASTEXITCODE"

      - name: Diagnose exact Plan CRD schema failure
        run: |
          $ErrorActionPreference = 'Continue'
          $kubectl = 'C:\hci-tools\kubectl.exe'

          Write-Host '===== EXACT PLAN CRD ====='
          & $kubectl get crd plans.backups.cozystack.io -o yaml 2>$null
          Write-Host "plan_crd_exit=$LASTEXITCODE"

          Write-Host '===== PLAN CRD SUMMARY ====='
          $raw = & $kubectl get crd plans.backups.cozystack.io -o json 2>$null
          if ($LASTEXITCODE -eq 0 -and $raw) {
            $crd = $raw | ConvertFrom-Json
            foreach ($v in @($crd.spec.versions)) {
              $schemaPresent = $null -ne $v.schema.openAPIV3Schema
              Write-Host "name=$($v.name) served=$($v.served) storage=$($v.storage) schemaPresent=$schemaPresent"
            }
          }

          Write-Host '===== CAN-I GET PLAN CRD ====='
          & $kubectl auth can-i get customresourcedefinitions.apiextensions.k8s.io/plans.backups.cozystack.io

          Write-Host '===== PLAN OBJECTS ====='
          & $kubectl get plans.backups.cozystack.io -A -o wide 2>$null
          Write-Host "plan_list_exit=$LASTEXITCODE"

          Write-Host '===== BACKUP API DISCOVERY ====='
          & $kubectl get --raw '/apis/backups.cozystack.io/v1alpha1' 2>$null
          Write-Host "backups_discovery_exit=$LASTEXITCODE"

      - name: Complete non-destructive platform sanity
        run: |
          $ErrorActionPreference = 'Continue'
          $kubectl = 'C:\hci-tools\kubectl.exe'

          Write-Host '===== COZYSTACK APISERVICES ====='
          & $kubectl get apiservice -o wide | Select-String -Pattern 'cozystack' -CaseSensitive:$false

          Write-Host '===== DASHBOARD / API PODS ====='
          & $kubectl get pods -A -o wide | Select-String -Pattern 'dashboard|cozystack-api|backup' -CaseSensitive:$false

          Write-Host '===== NON-HEALTHY PODS ====='
          $pods = & $kubectl get pods -A --no-headers 2>$null
          $badPods = @($pods | Where-Object { $_ -notmatch '\sRunning\s|\sCompleted\s' })
          if ($badPods.Count -eq 0) { Write-Host 'NONE' } else { $badPods }

          Write-Host '===== HELMRELEASES NOT READY ====='
          & $kubectl get helmreleases.helm.toolkit.fluxcd.io -A 2>$null | Select-String -Pattern 'False|Unknown' -CaseSensitive:$false

          Write-Host '===== PACKAGES NOT READY ====='
          & $kubectl get packages.cozystack.io -A 2>$null | Select-String -Pattern 'False|Unknown' -CaseSensitive:$false

          Write-Host '===== STORAGE CLASSES ====='
          & $kubectl get storageclass -o wide

          Write-Host '===== CLASSIC LINSTOR NODES ====='
          & $kubectl -n cozy-linstor exec deploy/linstor-controller -- linstor node list 2>$null

          Write-Host '===== CLASSIC LINSTOR POOLS ====='
          & $kubectl -n cozy-linstor exec deploy/linstor-controller -- linstor storage-pool list 2>$null

          Write-Host '===== BLOCKSTOR SAFETY CHECK ====='
          $pools = & $kubectl get storagepools.blockstor.linbit.com -A --no-headers 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "QUERY_UNAVAILABLE exit=$LASTEXITCODE" }
          elseif (-not $pools) { Write-Host 'ZERO_BLOCKSTOR_STORAGEPOOLS' }
          else { $pools }

          Write-Host 'SAFETY: diagnostic only; no Secret read, apply, create, patch, delete, or disk mutation.'
