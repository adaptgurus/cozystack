name: LayerSentry Dashboard Tenant Diagnose

on:
  push:
    branches:
      - layersentry-platform
    paths:
      - .github/workflows/layersentry-dashboard-tenant-diagnose.yml
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: powershell

jobs:
  diagnose:
    name: Diagnose Cozystack dashboard tenant and schema APIs on TESTSER
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    env:
      KUBECONFIG: C:\hci-state\cozystack-hci-lab\kubeconfig
    steps:
      - name: Collect sanitized live tenant and Plan-schema evidence
        run: |
          $ErrorActionPreference = 'Stop'
          $kubectl = 'C:\hci-tools\kubectl.exe'
          if (-not (Test-Path $kubectl)) { throw "kubectl missing: $kubectl" }
          if (-not (Test-Path $env:KUBECONFIG)) { throw "kubeconfig missing: $env:KUBECONFIG" }

          $report = Join-Path $env:RUNNER_TEMP 'layersentry-dashboard-tenant-latest.md'
          $lines = New-Object System.Collections.Generic.List[string]
          function Add-Line([string]$s = '') { $script:lines.Add($s) | Out-Null }
          function Add-Command([string]$title, [scriptblock]$command) {
            Add-Line "## $title"
            Add-Line '```text'
            $savedPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              $global:LASTEXITCODE = 0
              $output = & $command 2>&1 | Out-String
              $exitCode = $LASTEXITCODE
              if ($null -eq $exitCode) { $exitCode = 0 }
              if ([string]::IsNullOrWhiteSpace($output)) { Add-Line '<no output>' } else { Add-Line $output.TrimEnd() }
              Add-Line "exit=$exitCode"
            } catch {
              Add-Line "ERROR: $($_.Exception.Message)"
            } finally {
              $ErrorActionPreference = $savedPreference
              $global:LASTEXITCODE = 0
            }
            Add-Line '```'
            Add-Line
          }

          Add-Line '# LayerSentry TESTSER dashboard tenant / Plan schema evidence'
          Add-Line
          Add-Line "Generated (UTC): $([DateTime]::UtcNow.ToString('o'))"
          Add-Line "Workflow commit: $env:GITHUB_SHA"
          Add-Line 'Safety: read-only Kubernetes inspection. No Secret contents, credentials, disk mutation, StoragePool creation, apply, patch, or delete operations are included.'
          Add-Line

          Add-Command 'Kubernetes nodes' { & $kubectl get nodes -o wide }
          Add-Command 'Tenant / Plan / Backup API resources' { & $kubectl api-resources -o wide | Select-String -Pattern 'tenant|plan|backup' -CaseSensitive:$false }
          Add-Command 'Cozystack APIService health' { & $kubectl get apiservice -o wide | Select-String -Pattern 'cozystack' -CaseSensitive:$false }
          Add-Command 'backups.cozystack.io APIService' { & $kubectl get apiservice v1alpha1.backups.cozystack.io -o yaml 2>$null }

          Add-Command 'TenantNamespaces aggregated API' { & $kubectl get tenantnamespaces.core.cozystack.io -o yaml }
          Add-Command 'tenant-root Namespace' { & $kubectl get namespace tenant-root -o yaml }
          Add-Command 'Existing generated Tenant objects' { & $kubectl get tenants.apps.cozystack.io -A -o yaml 2>$null }
          Add-Command 'Tenant HelmReleases' { & $kubectl get helmreleases.helm.toolkit.fluxcd.io -A -o wide | Select-String -Pattern 'tenant' -CaseSensitive:$false }
          Add-Command 'Tenant ApplicationDefinition candidates' { & $kubectl get applicationdefinitions -A -o wide 2>$null | Select-String -Pattern 'tenant' -CaseSensitive:$false }
          Add-Command 'Tenant ApplicationDefinition YAML' { & $kubectl get applicationdefinitions tenant -o yaml 2>$null }
          Add-Command 'Tenant ExternalArtifact source' { & $kubectl get externalartifacts.source.toolkit.fluxcd.io -n cozy-system cozystack-tenant-application-default-tenant -o yaml 2>$null }

          Add-Command 'Plan-related CRDs' { & $kubectl get crd -o wide | Select-String -Pattern 'plan|backup' -CaseSensitive:$false }
          Add-Command 'Plan / Backup ApplicationDefinition candidates' { & $kubectl get applicationdefinitions -A -o wide 2>$null | Select-String -Pattern 'plan|backup' -CaseSensitive:$false }
          Add-Command 'Plan ApplicationDefinition YAML' { & $kubectl get applicationdefinitions plan -o yaml 2>$null }
          Add-Command 'Plan CRD served/storage/schema summary' {
            $raw = & $kubectl get crd -o json 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $raw) { 'CRD_LIST_UNAVAILABLE'; return }
            $crds = $raw | ConvertFrom-Json
            $matches = @($crds.items | Where-Object { $_.metadata.name -match '(?i)plan|backup' })
            if ($matches.Count -eq 0) { 'NO_PLAN_OR_BACKUP_CRD_FOUND'; return }
            foreach ($crd in $matches) {
              "CRD=$($crd.metadata.name) group=$($crd.spec.group) kind=$($crd.spec.names.kind)"
              foreach ($v in @($crd.spec.versions)) {
                $schemaPresent = $null -ne $v.schema.openAPIV3Schema
                "version=$($v.name) served=$($v.served) storage=$($v.storage) schemaPresent=$schemaPresent"
              }
            }
          }
          Add-Command 'Plan API discovery and objects' {
            $resources = @(& $kubectl api-resources --verbs=list -o name 2>$null | Where-Object { $_ -match '(?i)plan' })
            if ($resources.Count -eq 0) { 'NO_PLAN_RESOURCE_DISCOVERED'; return }
            foreach ($resource in $resources) {
              "--- $resource ---"
              & $kubectl get $resource -A -o wide 2>&1
            }
          }
          Add-Command 'OpenAPI v3 Cozystack / Backup schema summary' {
            $raw = & $kubectl get --raw '/openapi/v3' 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $raw) { 'OPENAPI_V3_DISCOVERY_UNAVAILABLE'; return }
            $discovery = $raw | ConvertFrom-Json
            $props = @($discovery.paths.PSObject.Properties | Where-Object { $_.Name -match '(?i)cozystack|backup' })
            if ($props.Count -eq 0) { 'NO_COZYSTACK_OR_BACKUP_OPENAPI_PATH'; return }
            foreach ($prop in $props) {
              $name = $prop.Name
              $serverRelativeURL = [string]$prop.Value.serverRelativeURL
              if (-not $serverRelativeURL) {
                "$name serverRelativeURL=<missing>"
                continue
              }
              $schemaRaw = & $kubectl get --raw $serverRelativeURL 2>$null
              $schemaExit = $LASTEXITCODE
              $containsPlan = [bool]([string]$schemaRaw -match '(?i)plan')
              "$name url=$serverRelativeURL exit=$schemaExit bytes=$(([string]$schemaRaw).Length) containsPlan=$containsPlan"
            }
          }
          Add-Command 'apps.cozystack.io discovery' { & $kubectl get --raw '/apis/apps.cozystack.io/v1alpha1' 2>$null }
          Add-Command 'backups.cozystack.io discovery' { & $kubectl get --raw '/apis/backups.cozystack.io/v1alpha1' 2>$null }

          Add-Command 'Dashboard / Cozystack API / Backup pods' { & $kubectl get pods -A -o wide | Select-String -Pattern 'dashboard|cozystack-api|backup' -CaseSensitive:$false }
          Add-Command 'Dashboard / API services and endpoints' { & $kubectl get svc,endpoints -A -o wide | Select-String -Pattern 'dashboard|cozystack-api|backup' -CaseSensitive:$false }
          Add-Command 'Non-running/non-completed pods' {
            $pods = & $kubectl get pods -A --no-headers 2>$null
            $bad = @($pods | Where-Object { $_ -notmatch '\sRunning\s|\sCompleted\s' })
            if ($bad.Count -eq 0) { 'NONE' } else { $bad }
          }
          Add-Command 'HelmReleases not Ready' {
            $hrs = & $kubectl get helmreleases.helm.toolkit.fluxcd.io -A --no-headers 2>$null
            $bad = @($hrs | Where-Object { $_ -notmatch '\sTrue\s' })
            if ($bad.Count -eq 0) { 'NONE' } else { $bad }
          }
          Add-Command 'Packages not Ready' {
            $pkgs = & $kubectl get packages.cozystack.io -A --no-headers 2>$null
            $bad = @($pkgs | Where-Object { $_ -notmatch '\sTrue\s' })
            if ($bad.Count -eq 0) { 'NONE' } else { $bad }
          }
          Add-Command 'StorageClasses' { & $kubectl get storageclass -o wide }
          Add-Command 'Classic LINSTOR nodes' { & $kubectl -n cozy-linstor exec deploy/linstor-controller -- linstor node list 2>$null }
          Add-Command 'Classic LINSTOR storage pools' { & $kubectl -n cozy-linstor exec deploy/linstor-controller -- linstor storage-pool list 2>$null }
          Add-Command 'Blockstor StoragePool safety boundary' {
            $out = & $kubectl get storagepools.blockstor.linbit.com -A --no-headers 2>$null
            if ($LASTEXITCODE -ne 0) { "QUERY_UNAVAILABLE exit=$LASTEXITCODE" }
            elseif (-not $out) { 'ZERO_BLOCKSTOR_STORAGEPOOLS' }
            else { $out }
          }

          $lines | Set-Content -Path $report -Encoding utf8
          Write-Host "Evidence written to $report"
          $global:LASTEXITCODE = 0
          exit 0

      - name: Publish sanitized evidence without checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $env:RUNNER_TEMP 'layersentry-dashboard-tenant-latest.md'
          if (-not (Test-Path $report)) { throw "report missing: $report" }
          if (-not $env:GITHUB_TOKEN) { throw 'GITHUB_TOKEN unavailable' }

          $repo = 'adaptgurus/cozystack'
          $path = 'docs/layersentry/evidence/dashboard-tenant-latest.md'
          $branch = 'layersentry-platform'
          $uri = "https://api.github.com/repos/$repo/contents/$path"
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $existingSha = $null
          try {
            $existing = Invoke-RestMethod -Method Get -Uri ($uri + '?ref=' + $branch) -Headers $headers
            $existingSha = [string]$existing.sha
          } catch {
            $status = 0
            if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
              $status = [int]$_.Exception.Response.StatusCode
            }
            if ($status -ne 404) { throw }
          }

          $text = Get-Content -Raw -Path $report
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($text)
          $body = @{
            message = 'test(layersentry): record live dashboard tenant schema evidence'
            content = [Convert]::ToBase64String($bytes)
            branch = $branch
          }
          if ($existingSha) { $body.sha = $existingSha }

          $json = $body | ConvertTo-Json -Compress
          $result = Invoke-RestMethod -Method Put -Uri $uri -Headers $headers -ContentType 'application/json' -Body $json
          Write-Host "Published sanitized evidence commit=$($result.commit.sha)"
