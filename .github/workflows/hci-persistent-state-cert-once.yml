name: One-shot HCI persistent VM state certification

on:
  push:
    branches:
      - feat/hci-virtualization-v1.6.2-test
    paths:
      - .github/workflows/hci-persistent-state-cert-once.yml

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: powershell

env:
  RUNTIME_SOURCE_SHA: 2b538371bc7141759c02d900f554a310cc92f864
  RUNTIME_ARTIFACT_RUN_ID: '33182992754'
  RUNTIME_ARTIFACT_NAME: layersentry-hci-build-2b538371bc7141759c02d900f554a310cc92f864

jobs:
  certify:
    name: Deploy and certify replicated VM state on TESTSER
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    steps:
      - name: Fetch exact orchestration and certification scripts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'adaptgurus/cozystack') { throw "Unexpected repository: $env:GITHUB_REPOSITORY" }
          if ($env:GITHUB_REF_NAME -ne 'feat/hci-virtualization-v1.6.2-test') { throw "Unexpected branch: $env:GITHUB_REF_NAME" }
          if ($env:GITHUB_SHA -notmatch '^[0-9a-f]{40}$') { throw "Invalid workflow SHA: $env:GITHUB_SHA" }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $sourceDir = Join-Path $env:RUNNER_TEMP "layersentry-persistent-state-$env:GITHUB_SHA"
          Remove-Item -Recurse -Force $sourceDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $sourceDir | Out-Null

          function Save-RepoFile([string]$RepoPath,[string]$Ref,[string]$TargetName) {
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$RepoPath`?ref=$Ref"
            $file = Invoke-RestMethod -Headers $headers -Uri $uri
            if ($file.type -ne 'file' -or -not $file.content) { throw "Exact-ref file fetch failed for $RepoPath@$Ref" }
            $bytes = [Convert]::FromBase64String(([string]$file.content -replace '\s',''))
            $target = Join-Path $sourceDir $TargetName
            [IO.File]::WriteAllBytes($target,$bytes)
            Write-Host "$RepoPath ref=$Ref gitBlob=$($file.sha) sha256=$((Get-FileHash -Algorithm SHA256 $target).Hash.ToLowerInvariant())"
          }

          Save-RepoFile 'hack/hci-lab/bootstrap-production.ps1' $env:GITHUB_SHA 'bootstrap-production.ps1'
          Save-RepoFile 'hack/hci-lab/test-bootstrap-static.ps1' $env:GITHUB_SHA 'test-bootstrap-static.ps1'
          Save-RepoFile 'hack/hci-lab/reconcile-network-fabric-talosconfig.ps1' $env:GITHUB_SHA 'reconcile-network-fabric-talosconfig.ps1'
          Save-RepoFile 'hack/hci-lab/test-network-fabric-talosconfig-static.ps1' $env:GITHUB_SHA 'test-network-fabric-talosconfig-static.ps1'
          Save-RepoFile 'hack/hci-live/test-linux-vm-product-live.ps1' $env:RUNTIME_SOURCE_SHA 'test-linux-vm-product-live.ps1'

          "LAYERSENTRY_CERT_SOURCE_DIR=$sourceDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Wait for exact current-SHA HCI gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $deadline = (Get-Date).AddMinutes(45)
          do {
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/hci-v1.6.2-gate.yml/runs?branch=$env:GITHUB_REF_NAME&event=push&per_page=50"
            $runs = Invoke-RestMethod -Headers $headers -Uri $uri
            $run = @($runs.workflow_runs | Where-Object { $_.head_sha -eq $env:GITHUB_SHA } | Sort-Object run_number -Descending | Select-Object -First 1)
            if ($run.Count -gt 0) {
              $r = $run[0]
              Write-Host "HCI gate run=$($r.id) status=$($r.status) conclusion=$($r.conclusion)"
              if ($r.status -eq 'completed') {
                if ($r.conclusion -ne 'success') { throw "HCI gate failed for exact SHA: $($r.conclusion)" }
                break
              }
            }
            Start-Sleep -Seconds 10
          } while ((Get-Date) -lt $deadline)
          if ($run.Count -eq 0 -or $run[0].status -ne 'completed') { throw 'Timed out waiting for exact current-SHA HCI gate' }

      - name: Verify immutable runtime source ancestry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $run = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RUNTIME_ARTIFACT_RUN_ID"
          if ($run.name -ne 'LayerSentry HCI Artifact Build') { throw "Unexpected artifact workflow: $($run.name)" }
          if ($run.head_sha -ne $env:RUNTIME_SOURCE_SHA) { throw "Artifact SHA mismatch: $($run.head_sha)" }
          if ($run.status -ne 'completed' -or $run.conclusion -ne 'success') { throw "Artifact run is not successful: $($run.status)/$($run.conclusion)" }

          $compare = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/compare/$env:RUNTIME_SOURCE_SHA...$env:GITHUB_SHA"
          if ($compare.status -notin @('ahead','identical')) { throw "Current SHA is not an allowed descendant of runtime source: $($compare.status)" }
          $disallowed = @($compare.files | Where-Object { $_.filename -notmatch '^\.github/workflows/' } | ForEach-Object { $_.filename })
          if ($disallowed.Count -gt 0) { throw "Runtime-affecting files changed after artifact source: $($disallowed -join ', ')" }
          Write-Host "Runtime artifact ancestry PASS: source=$env:RUNTIME_SOURCE_SHA current=$env:GITHUB_SHA"

      - name: Parse exact orchestration before mutation
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:LAYERSENTRY_CERT_SOURCE_DIR 'test-bootstrap-static.ps1') -BootstrapPath (Join-Path $env:LAYERSENTRY_CERT_SOURCE_DIR 'bootstrap-production.ps1')
          if (-not $?) { throw 'Bootstrap static validation failed.' }
          & (Join-Path $env:LAYERSENTRY_CERT_SOURCE_DIR 'test-network-fabric-talosconfig-static.ps1') -ReconcilePath (Join-Path $env:LAYERSENTRY_CERT_SOURCE_DIR 'reconcile-network-fabric-talosconfig.ps1')
          if (-not $?) { throw 'NetworkFabric static validation failed.' }

      - name: Download exact runtime build manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.RUNTIME_ARTIFACT_NAME }}
          path: ${{ runner.temp }}\layersentry-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: adaptgurus/cozystack
          run-id: ${{ env.RUNTIME_ARTIFACT_RUN_ID }}

      - name: Verify immutable runtime manifest
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $env:RUNNER_TEMP 'layersentry-build\build-manifest.json'
          if (-not (Test-Path $manifestPath)) { throw "Build manifest missing: $manifestPath" }
          $m = Get-Content -Raw $manifestPath | ConvertFrom-Json
          if ($m.product -ne 'LayerSentry Platform') { throw "Unexpected product: $($m.product)" }
          if ($m.repository -ne 'adaptgurus/cozystack') { throw "Unexpected repository: $($m.repository)" }
          if ($m.branch -ne 'feat/hci-virtualization-v1.6.2-test') { throw "Unexpected branch: $($m.branch)" }
          if ($m.commit -ne $env:RUNTIME_SOURCE_SHA) { throw "Manifest commit mismatch: $($m.commit)" }
          if ([string]$m.runId -ne $env:RUNTIME_ARTIFACT_RUN_ID) { throw "Manifest run mismatch: $($m.runId)" }
          if ($m.installerUri -notmatch '^oci://ghcr\.io/adaptgurus/cozystack/cozy-installer@sha256:[0-9a-f]{64}$') { throw "Installer is not digest pinned: $($m.installerUri)" }
          if ([string]$m.platformSourceRef -notmatch '^digest=sha256:[0-9a-f]{64}$') { throw "Platform source is not digest pinned: $($m.platformSourceRef)" }
          "LAYERSENTRY_INSTALLER_URI=$($m.installerUri)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LAYERSENTRY_RUNTIME_SOURCE_SHA=$env:RUNTIME_SOURCE_SHA" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Verified installer $($m.installerUri)"

      - name: Install verified kubectl and Helm
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $tools = 'C:\hci-tools'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $curl = (Get-Command curl.exe -ErrorAction Stop).Source

          $kubectlVersion = 'v1.34.3'
          $kubectl = Join-Path $tools 'kubectl.exe'
          $kubectlTmp = "$kubectl.download"
          & $curl --fail --location --connect-timeout 10 --max-time 300 --retry 2 --output $kubectlTmp "https://dl.k8s.io/release/$kubectlVersion/bin/windows/amd64/kubectl.exe"
          if ($LASTEXITCODE -ne 0) { throw 'kubectl download failed' }
          $expectedKubectl = ((Invoke-RestMethod "https://dl.k8s.io/release/$kubectlVersion/bin/windows/amd64/kubectl.exe.sha256").Trim()).ToLowerInvariant()
          $actualKubectl = (Get-FileHash -Algorithm SHA256 $kubectlTmp).Hash.ToLowerInvariant()
          if ($actualKubectl -ne $expectedKubectl) { throw "kubectl checksum mismatch: $actualKubectl" }
          Move-Item -Force $kubectlTmp $kubectl

          $helmVersion = 'v3.18.6'
          $archive = "helm-$helmVersion-windows-amd64.zip"
          $helmZip = Join-Path $tools $archive
          & $curl --fail --location --connect-timeout 10 --max-time 300 --retry 2 --output $helmZip "https://get.helm.sh/$archive"
          if ($LASTEXITCODE -ne 0) { throw 'Helm download failed' }
          $checksum = (Invoke-RestMethod "https://get.helm.sh/$archive.sha256sum").Trim()
          $expectedHelm = ($checksum -split '\s+')[0].ToLowerInvariant()
          $actualHelm = (Get-FileHash -Algorithm SHA256 $helmZip).Hash.ToLowerInvariant()
          if ($actualHelm -ne $expectedHelm) { throw "Helm checksum mismatch: $actualHelm" }
          $extract = Join-Path $env:RUNNER_TEMP 'helm-extract'
          Remove-Item -Recurse -Force $extract -ErrorAction SilentlyContinue
          Expand-Archive -Path $helmZip -DestinationPath $extract -Force
          Copy-Item -Force (Join-Path $extract 'windows-amd64\helm.exe') (Join-Path $tools 'helm.exe')
          $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Capture read-only TESTSER preflight
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'persistent-state-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          Get-VM -Name sen1,sen2,sen3 | Select-Object Name,State,Status,ProcessorCount,MemoryAssigned | Format-Table -AutoSize | Out-String | Set-Content (Join-Path $evidence 'hyperv-preflight.txt')
          $kubeconfig = 'C:\hci-state\cozystack-hci-lab\kubeconfig'
          if (-not (Test-Path $kubeconfig)) { throw "Existing cluster kubeconfig missing: $kubeconfig" }
          $env:KUBECONFIG = $kubeconfig
          & 'C:\hci-tools\kubectl.exe' get nodes -o wide | Tee-Object -FilePath (Join-Path $evidence 'nodes-preflight.txt')
          if ($LASTEXITCODE -ne 0) { throw 'kubectl node preflight failed' }
          & 'C:\hci-tools\kubectl.exe' get pods -A -o wide | Out-File (Join-Path $evidence 'pods-preflight.txt') -Encoding utf8
          "LAYERSENTRY_CERT_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Deploy exact persistent-state runtime to TESTSER
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:LAYERSENTRY_INSTALLER_URI -notmatch '^oci://ghcr\.io/adaptgurus/cozystack/cozy-installer@sha256:[0-9a-f]{64}$') { throw 'Digest-pinned installer is missing.' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:LAYERSENTRY_CERT_SOURCE_DIR 'bootstrap-production.ps1')
          if ($LASTEXITCODE -ne 0) { throw "LayerSentry bootstrap failed with exit code $LASTEXITCODE" }

      - name: Reconcile NetworkFabric credential and controller
        run: |
          $ErrorActionPreference = 'Stop'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:LAYERSENTRY_CERT_SOURCE_DIR 'reconcile-network-fabric-talosconfig.ps1')
          if ($LASTEXITCODE -ne 0) { throw "NetworkFabric reconciliation failed with exit code $LASTEXITCODE" }

      - name: Run Linux VM persistent TPM product lifecycle proof
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Join-Path $env:LAYERSENTRY_CERT_SOURCE_DIR 'test-linux-vm-product-live.ps1'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $test -EvidenceRoot $env:LAYERSENTRY_CERT_EVIDENCE
          if ($LASTEXITCODE -ne 0) { throw "Linux VM persistent-state E2E failed with exit code $LASTEXITCODE" }

      - name: Capture post-certification cluster state
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          $env:KUBECONFIG = 'C:\hci-state\cozystack-hci-lab\kubeconfig'
          & 'C:\hci-tools\kubectl.exe' get nodes -o wide | Out-File (Join-Path $env:LAYERSENTRY_CERT_EVIDENCE 'nodes-post.txt') -Encoding utf8
          & 'C:\hci-tools\kubectl.exe' get kubevirt.kubevirt.io -n cozy-kubevirt kubevirt -o json | Out-File (Join-Path $env:LAYERSENTRY_CERT_EVIDENCE 'kubevirt-post.json') -Encoding utf8
          & 'C:\hci-tools\kubectl.exe' get pvc -A -o wide | Out-File (Join-Path $env:LAYERSENTRY_CERT_EVIDENCE 'pvc-post.txt') -Encoding utf8
          Get-VM -Name sen1,sen2,sen3 | Select-Object Name,State,Status,ProcessorCount,MemoryAssigned | Format-Table -AutoSize | Out-String | Set-Content (Join-Path $env:LAYERSENTRY_CERT_EVIDENCE 'hyperv-post.txt')

      - name: Upload non-secret certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: persistent-vm-state-cert-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\persistent-state-evidence
          if-no-files-found: warn
          retention-days: 30
