name: LayerSentry Production ISO Boot Inspection

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - hack/layersentry/boot-inspection-requests/*.json
      - hack/layersentry/inspect-production-iso-boot.ps1
      - .github/workflows/layersentry-production-iso-boot-inspection.yml

permissions:
  contents: read

concurrency:
  group: layersentry-production-iso-boot-inspection
  cancel-in-progress: false

jobs:
  inspect:
    name: Verify exact ISO and derive in-memory GRUB edit plan
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    steps:
      - name: Checkout exact inspection source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validate inspection request and PowerShell source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $requests = @(
            git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA -- 'hack/layersentry/boot-inspection-requests/*.json'
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if ($LASTEXITCODE -ne 0) { throw "git diff-tree failed with exit code $LASTEXITCODE" }
          if ($requests.Count -ne 1) { throw "Expected exactly one boot inspection request; found $($requests.Count)." }
          $requestPath = $requests[0].Trim()
          $request = Get-Content -LiteralPath $requestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$request.operation -ne 'INSPECT_EXACT_PRODUCTION_ISO_BOOT_CONFIG') {
            throw "Unsupported operation: $($request.operation)"
          }
          if ([bool]$request.allowIsoModification) {
            throw 'This inspection request must prohibit ISO modification.'
          }
          if ([bool]$request.productionReleaseApprovalImplied) {
            throw 'Boot inspection must not imply production release approval.'
          }
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path -LiteralPath 'hack/layersentry/inspect-production-iso-boot.ps1').ProviderPath
          [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error ("Line {0}: {1}" -f $_.Extent.StartLineNumber, $_.Message) }
            exit 1
          }
          Write-Host "Validated non-destructive production ISO boot inspection request: $requestPath"

      - name: Inspect UEFI boot configuration without modifying ISO
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'layersentry-production-iso-boot-inspection'
          & 'hack/layersentry/inspect-production-iso-boot.ps1' `
            -IsoPath 'C:\Users\opc\Downloads\final iso\layersentry-v1.0-harvester-v1.8.2-production-build.iso' `
            -PersistentPlanPath 'C:\ProgramData\LayerSentry\production-install\iso-boot-plan.json' `
            -OutputDirectory $output

      - name: Upload boot inspection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layersentry-production-iso-boot-inspection-${{ github.run_id }}
          path: ${{ runner.temp }}\layersentry-production-iso-boot-inspection\**
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
