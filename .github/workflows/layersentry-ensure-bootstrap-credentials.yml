name: LayerSentry Prepare Protected Bootstrap Credentials

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - .github/workflows/layersentry-ensure-bootstrap-credentials.yml
      - hack/layersentry/ensure-bootstrap-credentials.ps1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layersentry-bootstrap-credentials
  cancel-in-progress: false

jobs:
  prepare:
    name: Generate or reuse host-local protected installer credentials
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout exact credential preparation script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Parse credential generator
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path -LiteralPath 'hack/layersentry/ensure-bootstrap-credentials.ps1').ProviderPath
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $path,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error ("Line {0}: {1}" -f $_.Extent.StartLineNumber, $_.Message) }
            exit 1
          }

      - name: Generate or reuse protected host-local credentials
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'layersentry-bootstrap-credentials'
          & 'hack/layersentry/ensure-bootstrap-credentials.ps1' `
            -CredentialPath 'C:\ProgramData\LayerSentry\bootstrap-credentials.json' `
            -EvidenceDirectory $evidence

      - name: Upload non-secret credential metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layersentry-bootstrap-credential-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}\layersentry-bootstrap-credentials
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
