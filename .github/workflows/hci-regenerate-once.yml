name: HCI Regenerate Once

on:
  push:
    branches:
      - feat/hci-virtualization-v1.6.2-test
    paths:
      - .github/workflows/hci-regenerate-once.yml

permissions:
  contents: write

concurrency:
  group: hci-regenerate-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate virtualization application artifacts once
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: feat/hci-virtualization-v1.6.2-test

      - name: Install Cozystack values generator
        run: |
          set -euo pipefail
          curl -sSL https://github.com/cozystack/cozyvalues-gen/releases/download/v1.6.0/cozyvalues-gen-linux-amd64.tar.gz | tar -xzvf- -C /usr/local/bin/ cozyvalues-gen

      - name: Regenerate HCI application artifacts
        shell: bash
        run: |
          set -euo pipefail
          for package in vm-instance vm-disk vm-network vm-template; do
            make -C "packages/apps/${package}" generate
          done
          git diff --check
          git status --short -- \
            packages/apps/vm-instance packages/apps/vm-disk packages/apps/vm-network packages/apps/vm-template \
            api/apps/v1alpha1/vminstance api/apps/v1alpha1/vmdisk api/apps/v1alpha1/vmnetwork api/apps/v1alpha1/vmtemplate \
            packages/system/vm-instance-rd packages/system/vm-disk-rd packages/system/vm-network-rd packages/system/vm-template-rd

      - name: Commit generated artifacts and remove one-time helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/apps/vm-instance packages/apps/vm-disk packages/apps/vm-network packages/apps/vm-template \
            api/apps/v1alpha1/vminstance api/apps/v1alpha1/vmdisk api/apps/v1alpha1/vmnetwork api/apps/v1alpha1/vmtemplate \
            packages/system/vm-instance-rd packages/system/vm-disk-rd packages/system/vm-network-rd packages/system/vm-template-rd
          git rm .github/workflows/hci-regenerate-once.yml
          git diff --cached --check
          git commit -m "fix(hci): synchronize generated virtualization artifacts"
          git push origin HEAD:feat/hci-virtualization-v1.6.2-test
