name: P1 RKE2 Scoped Recovery and Hardening
on:
  push:
    branches: [ops/p1-rke2-hardening-20260911]
    paths:
      - .github/workflows/p1-rke2-hardening.yml
      - ops/opennebula-lab/p1-hardening-recover.py
permissions:
  contents: read
concurrency:
  group: layersentry-live-environment
  cancel-in-progress: false
jobs:
  recover-and-baseline:
    if: github.repository == 'adaptgurus/cozystack' && github.actor == 'adaptgurus'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Preserve verified sources and execute unchanged platform tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'TESTSER' -or $env:COMPUTERNAME -ne 'TESTSER') { throw 'Unexpected runner identity.' }
          $ErrorActionPreference='Continue'
          $sessions=@(& quser.exe opc 2>&1)
          $sessionCode=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          if ($sessionCode -ne 0 -or (($sessions | ForEach-Object { [string]$_ }) -join "`n") -notmatch '(?im)^\s*>?\s*opc\s+') { throw 'Existing opc session is required.' }
          $user=Get-LocalUser -Name opc
          $work=Join-Path $env:ProgramData "LayerSentry\P1Hardening\run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $task="LayerSentry-P1Hardening-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ((Test-Path -LiteralPath $work) -or (Get-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue)) { throw 'Refusing to replace an existing task or directory.' }
          New-Item -ItemType Directory -Path $work | Out-Null
          $registered=$false
          $exitCode=125
          try {
            $acl=[Security.AccessControl.DirectorySecurity]::new()
            $acl.SetAccessRuleProtection($true,$false)
            foreach ($sid in @([Security.Principal.SecurityIdentifier]::new('S-1-5-18'),[Security.Principal.SecurityIdentifier]::new('S-1-5-32-544'),$user.SID)) {
              $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($sid,'FullControl','ContainerInherit,ObjectInherit','None','Allow'))
            }
            Set-Acl -LiteralPath $work -AclObject $acl
            $uri="https://raw.githubusercontent.com/adaptgurus/cozystack/$env:GITHUB_SHA/ops/opennebula-lab/p1-hardening-recover.py"
            $text=(Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec 30).Content
            if ($text -is [byte[]]) { $text=[Text.Encoding]::UTF8.GetString($text) }
            if ($text -isnot [string] -or -not $text.StartsWith('#!/usr/bin/env python3')) { throw 'Invalid pinned script.' }
            [IO.File]::WriteAllText((Join-Path $work 'recover.py'),$text.Replace("`r",''),[Text.UTF8Encoding]::new($false))
            Write-Host "EXECUTING_OPERATIONS_COMMIT=$env:GITHUB_SHA"
            $bash=@'
          #!/usr/bin/env bash
          set -euo pipefail
          umask 077
          work=${1:?working directory required}
          case "$work" in /mnt/c/ProgramData/LayerSentry/P1Hardening/run-*) ;; *) exit 21;; esac
          trap 'rc=$?; printf "%s\n" "$rc" > "$work/shell-exit-code.txt"' EXIT
          [[ $(id -un) == opc && $(hostname -s) == testser ]] || exit 20
          export PATH="$HOME/.local/bin:/usr/local/go/bin:$PATH"
          py=/tmp/layersentry-python-runtime/cpython-3.12.14-linux-x86_64-gnu/bin/python3.12
          [[ -x "$py" ]] || py=$(command -v python3)
          "$py" -B -u "$work/recover.py"
          '@
            [IO.File]::WriteAllText((Join-Path $work 'run.sh'),$bash.Replace("`r",'')+"`n",[Text.UTF8Encoding]::new($false))
            $child=@'
          param([string]$Work)
          $ErrorActionPreference='Stop'
          $code=125
          try {
            $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
            $principal=[Security.Principal.WindowsPrincipal]::new($identity)
            if ($identity.Name -ne "$env:COMPUTERNAME\opc" -or -not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'Unexpected child principal.' }
            $linuxWork=($Work -replace '\\','/') -replace '^C:','/mnt/c'
            $ErrorActionPreference='Continue'
            & "$env:WINDIR\System32\wsl.exe" --distribution Ubuntu-22.04 --exec /bin/bash --noprofile --norc "$linuxWork/run.sh" "$linuxWork" 1> (Join-Path $Work 'stdout.log') 2> (Join-Path $Work 'stderr.log')
            $nativeCode=$LASTEXITCODE
            $ErrorActionPreference='Stop'
            $resultFile=Join-Path $Work 'shell-exit-code.txt'
            if (-not (Test-Path -LiteralPath $resultFile)) { throw 'Missing independent shell exit code.' }
            $raw=[IO.File]::ReadAllText($resultFile).Trim()
            if ($raw -notmatch '^\d{1,3}$') { throw 'Invalid shell result.' }
            $code=[int]$raw
            if ($null -eq $nativeCode -or $nativeCode -ne $code) { throw 'Native and shell results disagree.' }
          } catch {
            [IO.File]::WriteAllText((Join-Path $Work 'error.txt'),$_.Exception.Message)
            $code=125
          } finally {
            [IO.File]::WriteAllText((Join-Path $Work 'complete.json'),(@{exit_code=$code;observed_utc=[DateTime]::UtcNow.ToString('o')} | ConvertTo-Json -Compress))
          }
          exit $code
          '@
            $script=Join-Path $work 'run.ps1'
            [IO.File]::WriteAllText($script,$child,[Text.UTF8Encoding]::new($false))
            $action=New-ScheduledTaskAction -Execute "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -Argument "-NoProfile -NonInteractive -File `"$script`" -Work `"$work`""
            $principal=New-ScheduledTaskPrincipal -UserId "$env:COMPUTERNAME\opc" -LogonType Interactive -RunLevel Highest
            $settings=New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 18)
            Register-ScheduledTask -TaskName $task -Action $action -Principal $principal -Settings $settings -Description 'Owner-authorized P1 source backup and isolated tests. No guest mutation or supervisor edits.' | Out-Null
            $registered=$true
            Start-ScheduledTask -TaskName $task
            $deadline=[DateTime]::UtcNow.AddSeconds(1100)
            do {
              Start-Sleep -Seconds 3
              $taskState=(Get-ScheduledTask -TaskName $task).State
              if ((Test-Path -LiteralPath (Join-Path $work 'complete.json')) -and $taskState -ne 'Running') { break }
              $info=Get-ScheduledTaskInfo -TaskName $task
              if ($taskState -ne 'Running' -and $info.LastRunTime.Year -gt 2000 -and $info.LastTaskResult -ne 267009 -and -not (Test-Path -LiteralPath (Join-Path $work 'complete.json'))) { throw "Task ended without an authoritative result: $($info.LastTaskResult)" }
            } while ([DateTime]::UtcNow -lt $deadline)
            if (-not (Test-Path -LiteralPath (Join-Path $work 'complete.json'))) { throw 'Timed out: reconcile state before any retry.' }
            $report=[IO.File]::ReadAllText((Join-Path $work 'complete.json')) | ConvertFrom-Json
            if ($null -eq $report.exit_code) { throw 'Null exit code is not success.' }
            $exitCode=[int]$report.exit_code
            Write-Host ('P1_RECOVERY_EXECUTION='+($report | ConvertTo-Json -Compress))
          } finally {
            if ($registered) {
              if ((Get-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue).State -eq 'Running') { Stop-ScheduledTask -TaskName $task }
              Unregister-ScheduledTask -TaskName $task -Confirm:$false
            }
            foreach ($file in @('stdout.log','stderr.log','error.txt')) {
              $p=Join-Path $work $file
              if (Test-Path -LiteralPath $p) {
                Write-Host "LOG=$file"
                Get-Content -LiteralPath $p -Tail 350 | ForEach-Object { $_ -replace '(?i)(gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+)','[REDACTED]' }
              }
            }
            if (Test-Path -LiteralPath $work) { Remove-Item -LiteralPath $work -Recurse -Force }
            Write-Host 'TEMPORARY_WINDOWS_RESOURCES_REMOVED=true; GUEST_MUTATIONS=false; PAID_MODEL_CALLS=0; FORCE_PUSH=false; MANUAL_SUPERVISOR_EDITS=false'
          }
          exit $exitCode
