name: LayerSentry Storage Phase 1 Install

on:
  workflow_dispatch:
  push:
    branches:
      - layersentry-platform
    paths:
      - .github/workflows/layersentry-storage-phase1-install.yml

concurrency:
  group: layersentry-storage-phase1-install
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: powershell

jobs:
  install-verify:
    name: Install Blockstor and Keycloak-protected LINSTOR GUI on TESTSER
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    env:
      KUBECONFIG: C:\hci-state\cozystack-hci-lab\kubeconfig
      TALOSCONFIG: C:\hci-state\cozystack-hci-lab\talosconfig
      KUBECTL: C:\hci-tools\kubectl.exe
      TALOSCTL: C:\hci-tools\talosctl.exe
      HCI_NODE_IPS: 10.10.10.11,10.10.10.12,10.10.10.13
      BLOCKSTOR_VERSION: 0.1.17
      BLOCKSTOR_TAG: v0.1.17

    steps:
      - name: Safety preflight and preserve current LINSTOR state
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_NAME -ne 'layersentry-platform') { throw "refusing branch $env:GITHUB_REF_NAME" }
          foreach ($path in @($env:KUBECTL, $env:TALOSCTL, $env:KUBECONFIG, $env:TALOSCONFIG)) {
            if (-not (Test-Path $path)) { throw "required TESTSER asset missing: $path" }
          }
          if (-not (Get-Command curl.exe -ErrorAction SilentlyContinue)) { throw 'curl.exe is required on TESTSER for auth-gate verification' }

          & $env:KUBECTL wait --for=condition=Ready nodes --all --timeout=120s
          if ($LASTEXITCODE -ne 0) { throw 'one or more Kubernetes nodes are not Ready' }

          $linstor = (& $env:KUBECTL get package.cozystack.io cozystack.linstor -o json | ConvertFrom-Json)
          $linstorReady = @($linstor.status.conditions | Where-Object { $_.type -eq 'Ready' } | Select-Object -Last 1)
          if (($linstorReady.Count -eq 0) -or ($linstorReady[0].status -ne 'True')) { throw 'existing LINSTOR Package is not Ready; refusing storage-layer mutation' }

          foreach ($name in @('local','replicated')) {
            $provisioner = (& $env:KUBECTL get storageclass $name -o jsonpath='{.provisioner}').Trim()
            if ($provisioner -ne 'linstor.csi.linbit.com') { throw "StorageClass $name provisioner changed: $provisioner" }
          }
          $csi = (& $env:KUBECTL get csidriver linstor.csi.linbit.com -o name).Trim()
          if (-not $csi) { throw 'LINSTOR CSI driver is missing' }
          $snap = (& $env:KUBECTL get volumesnapshotclass linstor-snapshots -o jsonpath='{.driver}').Trim()
          if ($snap -ne 'linstor.csi.linbit.com') { throw "LINSTOR snapshot class driver changed: $snap" }

          foreach ($node in ($env:HCI_NODE_IPS -split ',')) {
            $ext = (& $env:TALOSCTL -n $node -e $node get extensions -o yaml 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "Talos extension discovery failed on $node" }
            foreach ($required in @('drbd','zfs')) {
              if ($ext -notmatch [regex]::Escape($required)) { throw "required Blockstor extension '$required' missing on $node" }
            }
          }

          Write-Host '===== EXISTING STORAGE BEFORE PHASE 1 ====='
          & $env:KUBECTL get storageclass -o wide
          & $env:KUBECTL get csidriver -o wide
          & $env:KUBECTL get volumesnapshotclass -o wide
          & $env:KUBECTL get pods -n cozy-linstor -o wide
          Write-Host 'SAFETY_GATE=PASS'

      - name: Enable platform OIDC and native LINSTOR GUI package
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = (& $env:KUBECTL get package.cozystack.io cozystack.cozystack-platform -o json | ConvertFrom-Json)
          $values = $pkg.spec.components.platform.values

          $enabled = @($values.bundles.enabledPackages | Where-Object { $_ })
          if ('cozystack.linstor-gui' -notin $enabled) { $enabled += 'cozystack.linstor-gui' }
          $enabled = @($enabled | Sort-Object -Unique)

          $exposed = @($values.publishing.exposedServices | Where-Object { $_ })
          if ('linstor-gui' -notin $exposed) { $exposed += 'linstor-gui' }
          $exposed = @($exposed | Sort-Object -Unique)

          $patchObject = @{
            spec = @{
              components = @{
                platform = @{
                  values = @{
                    authentication = @{
                      oidc = @{
                        enabled = $true
                      }
                    }
                    bundles = @{
                      enabledPackages = $enabled
                    }
                    publishing = @{
                      exposedServices = $exposed
                    }
                  }
                }
              }
            }
          }
          $patch = $patchObject | ConvertTo-Json -Depth 20 -Compress
          & $env:KUBECTL patch package.cozystack.io cozystack.cozystack-platform --type merge -p $patch
          if ($LASTEXITCODE -ne 0) { throw 'failed to enable OIDC/LINSTOR GUI' }

          Write-Host 'enabledPackages:' ($enabled -join ',')
          Write-Host 'exposedServices:' ($exposed -join ',')
          Write-Host 'authentication.oidc.enabled=true'

      - name: Wait for Keycloak and LINSTOR GUI reconciliation
        run: |
          $ErrorActionPreference = 'Stop'
          function Wait-PackageReady([string]$name, [int]$minutes = 15) {
            $deadline = (Get-Date).AddMinutes($minutes)
            do {
              $raw = & $env:KUBECTL get package.cozystack.io $name -o json 2>$null
              if ($LASTEXITCODE -eq 0) {
                $pkg = $raw | ConvertFrom-Json
                $ready = @($pkg.status.conditions | Where-Object { $_.type -eq 'Ready' } | Select-Object -Last 1)
                if (($ready.Count -gt 0) -and ($ready[0].status -eq 'True')) {
                  Write-Host "$name=Ready variant=$($pkg.spec.variant)"
                  return
                }
                if ($ready.Count -gt 0) { Write-Host "$name pending: $($ready[0].reason) $($ready[0].message)" }
              } else {
                $global:LASTEXITCODE = 0
                Write-Host "$name not emitted yet"
              }
              Start-Sleep -Seconds 15
            } while ((Get-Date) -lt $deadline)
            throw "$name did not become Ready"
          }

          Wait-PackageReady 'cozystack.keycloak-operator'
          Wait-PackageReady 'cozystack.keycloak'
          Wait-PackageReady 'cozystack.cozystack-engine'
          Wait-PackageReady 'cozystack.linstor-gui'

          $engineVariant = (& $env:KUBECTL get package.cozystack.io cozystack.cozystack-engine -o jsonpath='{.spec.variant}').Trim()
          if ($engineVariant -ne 'oidc') { throw "cozystack-engine variant is '$engineVariant', expected oidc" }

          & $env:KUBECTL rollout status deployment/linstor-gui -n cozy-linstor-gui --timeout=300s
          if ($LASTEXITCODE -ne 0) { throw 'linstor-gui Deployment not Ready' }
          & $env:KUBECTL rollout status deployment/linstor-gui-gatekeeper -n cozy-linstor-gui --timeout=300s
          if ($LASTEXITCODE -ne 0) { throw 'linstor-gui gatekeeper Deployment not Ready' }

          $clients = (& $env:KUBECTL get keycloakclients.v1.edp.epam.com -A -o name 2>$null | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'KeycloakClient API unavailable after OIDC enablement' }
          if ($clients -notmatch 'linstor-gui') { throw 'linstor-gui KeycloakClient was not created' }

          Write-Host '===== AUTHENTICATED LINSTOR GUI RESOURCES ====='
          & $env:KUBECTL get pods,svc,ingress -n cozy-linstor-gui -o wide
          & $env:KUBECTL get keycloakclients.v1.edp.epam.com -A
          Write-Host 'OIDC_GUI_RECONCILIATION=PASS'

      - name: Verify unauthenticated LINSTOR GUI is gated by Keycloak
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = (& $env:KUBECTL get package.cozystack.io cozystack.cozystack-platform -o json | ConvertFrom-Json)
          $rootHost = $pkg.spec.components.platform.values.publishing.host
          if (-not $rootHost) { throw 'platform root host is empty' }
          $url = "https://linstor-gui.$rootHost/"
          Write-Host "auth_test_url=$url"

          $headers = (& curl.exe -k -sS -I --max-time 20 $url 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "LINSTOR GUI endpoint is unreachable: $headers" }
          Write-Host $headers
          $status = [regex]::Match($headers, 'HTTP/\S+\s+(\d{3})').Groups[1].Value
          if (-not $status) { throw 'could not parse LINSTOR GUI HTTP status' }
          if ($status -eq '200') { throw 'SECURITY FAILURE: unauthenticated LINSTOR GUI returned HTTP 200' }
          if ($status -notin @('302','303','307','401','403')) { throw "unexpected unauthenticated GUI status $status" }
          if (($status -in @('302','303','307')) -and ($headers -notmatch '(?i)location:.*(oauth2|keycloak)')) {
            throw 'GUI redirected, but redirect does not point into the oauth2/Keycloak authentication flow'
          }
          Write-Host "LINSTOR_GUI_AUTH_GATE=PASS status=$status"

          Write-Host '===== GUI / KEYCLOAK CERTIFICATES (informational for private nip.io lab) ====='
          & $env:KUBECTL get certificate -A 2>$null | Select-String -Pattern 'keycloak|linstor-gui' -CaseSensitive:$false
          $global:LASTEXITCODE = 0

      - name: Install Blockstor v0.1.17 CRDs and controller side-by-side
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "https://raw.githubusercontent.com/cozystack/blockstor/$env:BLOCKSTOR_TAG"
          $crds = @(
            'blockstor.cozystack.io_nodes.yaml',
            'blockstor.cozystack.io_storagepools.yaml',
            'blockstor.cozystack.io_resourcegroups.yaml',
            'blockstor.cozystack.io_resourcedefinitions.yaml',
            'blockstor.cozystack.io_resources.yaml',
            'blockstor.cozystack.io_snapshots.yaml'
          )
          foreach ($file in $crds) {
            $url = "$base/config/crd/bases/$file"
            Write-Host "Applying pinned Blockstor CRD: $url"
            & $env:KUBECTL apply -f $url
            if ($LASTEXITCODE -ne 0) { throw "failed applying $file" }
          }

          foreach ($crd in @(
            'nodes.blockstor.cozystack.io',
            'storagepools.blockstor.cozystack.io',
            'resourcegroups.blockstor.cozystack.io',
            'resourcedefinitions.blockstor.cozystack.io',
            'resources.blockstor.cozystack.io',
            'snapshots.blockstor.cozystack.io'
          )) {
            & $env:KUBECTL wait --for=condition=Established "crd/$crd" --timeout=120s
            if ($LASTEXITCODE -ne 0) { throw "CRD $crd not Established" }
          }

          $tmp = Join-Path $env:RUNNER_TEMP 'blockstor-controller.yaml'
          $text = (Invoke-WebRequest -UseBasicParsing "$base/stand/blockstor-deploy.yaml").Content
          $text = $text.Replace('__REGISTRY__/blockstor-controller:dev', "ghcr.io/cozystack/blockstor-controller:$env:BLOCKSTOR_VERSION")
          Set-Content -Path $tmp -Value $text -Encoding UTF8
          & $env:KUBECTL apply -f $tmp
          if ($LASTEXITCODE -ne 0) { throw 'failed to apply Blockstor controller manifest' }

          Write-Host 'BLOCKSTOR_CRD_CONTROLLER_APPLY=PASS'

      - name: Install Blockstor mTLS API and register HCI nodes
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "https://raw.githubusercontent.com/cozystack/blockstor/$env:BLOCKSTOR_TAG"

          & $env:KUBECTL apply -f "$base/stand/blockstor-apiserver-tls.yaml"
          if ($LASTEXITCODE -ne 0) { throw 'failed to apply Blockstor mTLS PKI' }

          foreach ($cert in @('blockstor-api-ca','blockstor-apiserver-server','blockstor-apiserver-client')) {
            & $env:KUBECTL wait --for=condition=Ready "certificate/$cert" -n blockstor-system --timeout=240s
            if ($LASTEXITCODE -ne 0) { throw "Blockstor certificate $cert not Ready" }
          }

          $tmpApi = Join-Path $env:RUNNER_TEMP 'blockstor-apiserver.yaml'
          $apiText = (Invoke-WebRequest -UseBasicParsing "$base/stand/blockstor-apiserver-deploy.yaml").Content
          $apiText = $apiText.Replace('__REGISTRY__/blockstor-apiserver:dev', "ghcr.io/cozystack/blockstor-apiserver:$env:BLOCKSTOR_VERSION")
          Set-Content -Path $tmpApi -Value $apiText -Encoding UTF8
          & $env:KUBECTL apply -f $tmpApi
          if ($LASTEXITCODE -ne 0) { throw 'failed to apply Blockstor apiserver manifest' }

          $k8sNodes = @((& $env:KUBECTL get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}') -split "`n" | Where-Object { $_.Trim() })
          if ($k8sNodes.Count -ne 3) { throw "expected 3 HCI Kubernetes nodes, found $($k8sNodes.Count)" }
          $docs = @()
          foreach ($node in $k8sNodes) {
            $docs += @"
apiVersion: blockstor.cozystack.io/v1alpha1
kind: Node
metadata:
  name: $node
spec:
  type: SATELLITE
"@
          }
          $nodeFile = Join-Path $env:RUNNER_TEMP 'blockstor-nodes.yaml'
          Set-Content -Path $nodeFile -Value ($docs -join "`n---`n") -Encoding UTF8
          & $env:KUBECTL apply -f $nodeFile
          if ($LASTEXITCODE -ne 0) { throw 'failed to register Blockstor HCI nodes' }

          Write-Host 'BLOCKSTOR_API_NODE_REGISTRATION=PASS'

      - name: Install Blockstor satellites on all three HCI nodes
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "https://raw.githubusercontent.com/cozystack/blockstor/$env:BLOCKSTOR_TAG"
          $tmpSat = Join-Path $env:RUNNER_TEMP 'blockstor-satellite.yaml'
          $satText = (Invoke-WebRequest -UseBasicParsing "$base/stand/blockstor-satellite-daemonset.yaml").Content
          $satText = $satText.Replace('__REGISTRY__/blockstor-satellite:dev', "ghcr.io/cozystack/blockstor-satellite:$env:BLOCKSTOR_VERSION")
          Set-Content -Path $tmpSat -Value $satText -Encoding UTF8
          & $env:KUBECTL apply -f $tmpSat
          if ($LASTEXITCODE -ne 0) { throw 'failed to apply Blockstor satellite manifest' }

          # Upstream stand excludes control-plane nodes because its dev control-plane lacks
          # DRBD. This LayerSentry HCI lab is three control-plane nodes and the safety
          # preflight above proves DRBD + ZFS are present on every one, so remove only that
          # upstream stand affinity. Tolerations/privilege/state separation stay unchanged.
          $affinityPatch = '{"spec":{"template":{"spec":{"affinity":null}}}}'
          & $env:KUBECTL patch daemonset blockstor-satellite -n blockstor-system --type merge -p $affinityPatch
          if ($LASTEXITCODE -ne 0) { throw 'failed to adapt Blockstor satellite affinity for HCI control-plane nodes' }

          & $env:KUBECTL rollout status deployment/blockstor-controller -n blockstor-system --timeout=300s
          if ($LASTEXITCODE -ne 0) { throw 'Blockstor controller rollout failed' }
          & $env:KUBECTL rollout status deployment/blockstor-apiserver -n blockstor-system --timeout=300s
          if ($LASTEXITCODE -ne 0) { throw 'Blockstor apiserver rollout failed' }
          & $env:KUBECTL rollout status daemonset/blockstor-satellite -n blockstor-system --timeout=420s
          if ($LASTEXITCODE -ne 0) { throw 'Blockstor satellite rollout failed' }

          Write-Host 'BLOCKSTOR_WORKLOAD_ROLLOUT=PASS'

      - name: Verify Blockstor node health and enforce zero-pool safety
        run: |
          $ErrorActionPreference = 'Stop'
          $deadline = (Get-Date).AddMinutes(5)
          do {
            $items = (& $env:KUBECTL get nodes.blockstor.cozystack.io -o json | ConvertFrom-Json).items
            $notReady = @()
            foreach ($node in $items) {
              $ready = @($node.status.conditions | Where-Object { $_.type -eq 'Ready' } | Select-Object -Last 1)
              if (($ready.Count -eq 0) -or ($ready[0].status -ne 'True')) { $notReady += $node.metadata.name }
            }
            Write-Host "blockstor_nodes=$($items.Count) not_ready=$($notReady.Count)"
            if (($items.Count -eq 3) -and ($notReady.Count -eq 0)) { break }
            if ($notReady.Count -gt 0) { Write-Host ('not ready: ' + ($notReady -join ',')) }
            Start-Sleep -Seconds 10
          } while ((Get-Date) -lt $deadline)
          if ($items.Count -ne 3) { throw "Blockstor Node count is $($items.Count), expected 3" }
          if ($notReady.Count -gt 0) { throw "Blockstor Nodes not Ready: $($notReady -join ',')" }

          $poolItems = (& $env:KUBECTL get storagepools.blockstor.cozystack.io -o json | ConvertFrom-Json).items
          if (@($poolItems).Count -ne 0) { throw 'SAFETY FAILURE: Blockstor StoragePools exist even though Phase 1 must be zero-pool/non-destructive' }

          Write-Host '===== BLOCKSTOR WORKLOADS ====='
          & $env:KUBECTL get pods,svc -n blockstor-system -o wide
          Write-Host '===== BLOCKSTOR NODES ====='
          & $env:KUBECTL get nodes.blockstor.cozystack.io -o wide
          Write-Host 'BLOCKSTOR_ZERO_POOL_SAFETY=PASS'

      - name: Validate storage backend option schema and existing LINSTOR health
        run: |
          $ErrorActionPreference = 'Stop'
          $crd = (& $env:KUBECTL get crd storagepools.blockstor.cozystack.io -o json | ConvertFrom-Json)
          $actual = @($crd.spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.providerKind.enum | Sort-Object)
          $expected = @('DISKLESS','FILE','FILE_THIN','LVM','LVM_THIN','ZFS','ZFS_THIN' | Sort-Object)
          $missing = @($expected | Where-Object { $_ -notin $actual })
          if ($missing.Count -gt 0) { throw "Blockstor StoragePool provider schema missing: $($missing -join ',')" }
          Write-Host ('blockstor_provider_kinds=' + ($actual -join ','))

          foreach ($name in @('local','replicated')) {
            $provisioner = (& $env:KUBECTL get storageclass $name -o jsonpath='{.provisioner}').Trim()
            if ($provisioner -ne 'linstor.csi.linbit.com') { throw "existing StorageClass $name changed after Blockstor install" }
          }
          $linstor = (& $env:KUBECTL get package.cozystack.io cozystack.linstor -o json | ConvertFrom-Json)
          $linstorReady = @($linstor.status.conditions | Where-Object { $_.type -eq 'Ready' } | Select-Object -Last 1)
          if (($linstorReady.Count -eq 0) -or ($linstorReady[0].status -ne 'True')) { throw 'existing LINSTOR degraded after Blockstor install' }

          $linstorPods = (& $env:KUBECTL get pods -n cozy-linstor -o json | ConvertFrom-Json).items
          $bad = @($linstorPods | Where-Object { $_.status.phase -notin @('Running','Succeeded') } | ForEach-Object { $_.metadata.name })
          if ($bad.Count -gt 0) { throw "existing LINSTOR pods degraded: $($bad -join ',')" }

          Write-Host '===== FINAL CLASSIC LINSTOR STORAGE ====='
          & $env:KUBECTL get storageclass -o wide
          & $env:KUBECTL get csidriver -o wide
          & $env:KUBECTL get volumesnapshotclass -o wide
          & $env:KUBECTL get pods -n cozy-linstor -o wide
          Write-Host 'EXISTING_LINSTOR_POSTCHECK=PASS'

      - name: Report live host storage protocol capability truthfully
        run: |
          $ErrorActionPreference = 'Stop'
          $protocols = @('iscsi','multipath','nfs','nvme','trident-iscsi','util-linux')
          $missingAny = @()
          foreach ($node in ($env:HCI_NODE_IPS -split ',')) {
            $ext = (& $env:TALOSCTL -n $node -e $node get extensions -o yaml 2>&1 | Out-String)
            Write-Host "===== STORAGE PROTOCOL EXTENSIONS $node ====="
            foreach ($p in $protocols) {
              $present = $ext -match [regex]::Escape($p)
              Write-Host "$p=$present"
              if (-not $present) { $missingAny += "$node/$p" }
            }
          }
          if ($missingAny.Count -gt 0) {
            Write-Host ('STORAGE_PROTOCOL_EXTENSION_GAPS=' + ($missingAny -join ','))
            Write-Host 'STORAGE_PROTOCOL_CERTIFICATION=PARTIAL'
          } else {
            Write-Host 'STORAGE_PROTOCOL_CERTIFICATION=PASS'
          }
          Write-Host 'STORAGE_PHASE1_INSTALL_GATE=PASS'
