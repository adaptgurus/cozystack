name: LayerSentry CloudStack Backup Export v2

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - hack/layersentry/cloudstack-backup-export-v2-requests/*.json

permissions:
  contents: read

concurrency:
  group: layersentry-live-environment
  cancel-in-progress: false

jobs:
  reconcile-backup-export:
    name: Reconcile dedicated NAS backup export on exact DC VM
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Check out exact request and source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Reconcile exact backup export
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          Import-Module Hyper-V -ErrorAction Stop

          $expectedHyperVHost = 'TESTSER'
          $expectedVmName = 'sen'
          $expectedVmId = '29ba176b-b81a-4f47-8f51-ecec869f247f'
          $expectedAddress = '10.10.10.14'
          $expectedFqdn = 'layersentry.lab.example'
          $expectedSwitch = 'Cozystack-NAT'
          $expectedExport = '/export/backup'
          $expectedClient = '10.10.10.0/24'
          $scriptPath = 'hack/layersentry/reconcile-backup-export-v2.sh'

          if ($env:COMPUTERNAME -cne $expectedHyperVHost) { throw 'Runner host mismatch.' }

          $evidence = Join-Path $env:RUNNER_TEMP "layersentry-backup-export-v2-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $evidence) { Remove-Item -LiteralPath $evidence -Recurse -Force }
          New-Item -Path $evidence -ItemType Directory -Force | Out-Null
          @(
            'LAYERSENTRY_BACKUP_EXPORT_V2_STARTED'
            "RUN_ID=$env:GITHUB_RUN_ID"
            "COMMIT=$env:GITHUB_SHA"
            "VM_ID=$expectedVmId"
            "EXPORT=$expectedExport"
          ) | Set-Content -LiteralPath (Join-Path $evidence 'started.txt') -Encoding UTF8

          [string[]]$changed = @(
            @(git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA -- 'hack/layersentry/cloudstack-backup-export-v2-requests/*.json') |
              ForEach-Object { [string]$_ } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )
          if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 1) { throw 'Expected exactly one backup-export v2 request.' }
          $request = Get-Content -LiteralPath $changed[0].Trim() -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$request.operation -cne 'RECONCILE_LAYERSENTRY_NAS_BACKUP_EXPORT_V2') { throw 'Unsupported operation.' }
          if ([string]$request.authorization -cne 'USER_AUTHORIZED_DISPOSABLE_LAB_BACKUP_EXPORT') { throw 'Authorization mismatch.' }
          if ([string]$request.vmId -cne $expectedVmId -or [string]$request.vmName -cne $expectedVmName -or
              [string]$request.address -cne $expectedAddress -or [string]$request.export -cne $expectedExport -or
              [string]$request.client -cne $expectedClient) { throw 'Backup-export request binding mismatch.' }
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) { throw 'Backup-export guest script missing.' }

          $vm = Get-VM -Name $expectedVmName -ErrorAction Stop
          if ([string]$vm.Id -cne $expectedVmId -or [string]$vm.State -cne 'Running') { throw 'Exact DC VM identity/state mismatch.' }
          $processor = Get-VMProcessor -VMName $expectedVmName -ErrorAction Stop
          if (-not [bool]$processor.ExposeVirtualizationExtensions) { throw 'Nested virtualization is not exposed.' }
          $nic = Get-VMNetworkAdapter -VMName $expectedVmName -ErrorAction Stop | Select-Object -First 1
          if ([string]$nic.SwitchName -cne $expectedSwitch -or [string]$nic.MacAddressSpoofing -cne 'On') { throw 'VM network safety gate failed.' }

          $key = Join-Path $env:RUNNER_TEMP "layersentry-backup-export-v2-$env:GITHUB_RUN_ID.key"
          $knownHosts = Join-Path $env:RUNNER_TEMP "layersentry-backup-export-v2-$env:GITHUB_RUN_ID.known_hosts"
          $patchedHelper = Join-Path $env:RUNNER_TEMP "invoke-backup-export-v2-console-$env:GITHUB_RUN_ID.ps1"
          $consolePath = Join-Path $env:RUNNER_TEMP "backup-export-v2-console-$env:GITHUB_RUN_ID.json"
          Remove-Item -LiteralPath $key,"$key.pub",$knownHosts,$patchedHelper,$consolePath -Force -ErrorAction SilentlyContinue
          $comment = "layersentry-backup-export-v2-$env:GITHUB_RUN_ID"
          & cmd.exe /d /s /c "ssh-keygen.exe -q -t ed25519 -N `"`" -C $comment -f `"$key`""
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $key -PathType Leaf)) { throw 'ssh-keygen failed.' }

          $ready = $false
          try {
            $helperSource = (Resolve-Path -LiteralPath 'hack/layersentry/invoke-hyperv-console-command.ps1').ProviderPath
            $helper = Get-Content -LiteralPath $helperSource -Raw -Encoding UTF8
            $needle = "`$allowedNames = @('sen1', 'sen2', 'sen3')"
            if (-not $helper.Contains($needle)) { throw 'Console helper allow-list guard not found.' }
            Set-Content -LiteralPath $patchedHelper -Value ($helper.Replace($needle, "`$allowedNames = @('$expectedVmName')")) -Encoding UTF8

            $pub = (Get-Content -LiteralPath "$key.pub" -Raw -Encoding ASCII).Trim()
            if ($pub -notmatch '^ssh-ed25519\s+') { throw 'Unexpected generated public-key format.' }
            $bootstrap = "install -d -m 700 /root/.ssh && echo '$pub' >> /root/.ssh/authorized_keys && chmod 600 /root/.ssh/authorized_keys"
            $consoleRequest = [ordered]@{
              requestId = "backup-export-v2-bootstrap-$env:GITHUB_RUN_ID"
              delayAfterSeconds = 3
              targets = @([ordered]@{
                vm = $expectedVmName
                actions = @(
                  [ordered]@{ kind='key'; code=13 },
                  [ordered]@{ kind='text'; value=$bootstrap },
                  [ordered]@{ kind='key'; code=13 }
                )
              })
            }
            $consoleRequest | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $consolePath -Encoding UTF8
            & $patchedHelper -RequestPath $consolePath -OutputDirectory (Join-Path $evidence 'console-bootstrap')

            $ssh = @('-i',$key,'-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o',"UserKnownHostsFile=$knownHosts",'-o','LogLevel=ERROR','-o','ConnectTimeout=10',"root@$expectedAddress")
            $scp = @('-i',$key,'-o','BatchMode=yes','-o','StrictHostKeyChecking=yes','-o',"UserKnownHostsFile=$knownHosts",'-o','LogLevel=ERROR','-o','ConnectTimeout=10')
            for ($i=1; $i -le 12; $i++) {
              $old = $ErrorActionPreference; $ErrorActionPreference = 'Continue'
              $probe = & ssh.exe @ssh "test `"`$(hostname -f)`" = '$expectedFqdn' && test `"`$(systemctl is-active cloudstack-agent)`" = active && test `"`$(systemctl is-enabled cloudstack-agent)`" = enabled && test `"`$(systemctl is-active nfs-server)`" = active && ip -4 address show cloudbr0 | grep -F 'inet $expectedAddress/24' >/dev/null && printf BACKUP_EXPORT_V2_READY" 2>&1
              $rc = $LASTEXITCODE; $ErrorActionPreference = $old
              if ($rc -eq 0 -and (($probe -join '') -match 'BACKUP_EXPORT_V2_READY')) { $ready = $true; break }
              Start-Sleep -Seconds 5
            }
            if (-not $ready) { throw 'Exact guest SSH/bootstrap identity validation failed.' }

            & ssh.exe @ssh "echo =====PRE=====; hostname -f; exportfs -v; test -d '$expectedExport' && ls -ld '$expectedExport' || true; systemctl is-active cloudstack-management cloudstack-agent nfs-server; systemctl is-enabled cloudstack-agent" 2>&1 |
              Set-Content -LiteralPath (Join-Path $evidence 'pre.txt') -Encoding UTF8
            if ($LASTEXITCODE -ne 0) { throw 'Pre-export inventory failed.' }

            $remoteScript = '/root/reconcile-backup-export-v2.sh'
            & scp.exe @scp $scriptPath "root@${expectedAddress}:$remoteScript"
            if ($LASTEXITCODE -ne 0) { throw 'Failed to transfer backup-export script.' }
            $localHash = (Get-FileHash -LiteralPath $scriptPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $remoteHash = (& ssh.exe @ssh "sha256sum '$remoteScript' | awk '{print `$1}'").Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $remoteHash -cne $localHash) { throw 'Remote backup-export script hash mismatch.' }

            $old = $ErrorActionPreference; $ErrorActionPreference = 'Continue'
            & ssh.exe @ssh "chmod 700 '$remoteScript' && bash -n '$remoteScript' && '$remoteScript'" 2>&1 |
              Tee-Object -FilePath (Join-Path $evidence 'reconcile.txt')
            $rc = $LASTEXITCODE; $ErrorActionPreference = $old
            if ($rc -ne 0) {
              $old = $ErrorActionPreference; $ErrorActionPreference = 'Continue'
              & ssh.exe @ssh "echo =====FAILURE_STATE=====; exportfs -v || true; systemctl is-active cloudstack-management cloudstack-agent nfs-server || true; systemctl is-enabled cloudstack-agent || true; test -f /etc/exports.d/layersentry-backup.exports && cat /etc/exports.d/layersentry-backup.exports || true" 2>&1 |
                Set-Content -LiteralPath (Join-Path $evidence 'failure.txt') -Encoding UTF8
              $ErrorActionPreference = $old
              throw "Backup-export reconciliation exited $rc."
            }
            if (-not (Select-String -LiteralPath (Join-Path $evidence 'reconcile.txt') -Pattern 'LAYERSENTRY_BACKUP_EXPORT_V2_COMPLETE' -Quiet)) { throw 'Backup-export completion marker missing.' }

            & ssh.exe @ssh "echo =====POST=====; exportfs -v; ls -ld '$expectedExport'; cat /etc/exports.d/layersentry-backup.exports; systemctl is-active cloudstack-management cloudstack-agent nfs-server; systemctl is-enabled cloudstack-agent" 2>&1 |
              Set-Content -LiteralPath (Join-Path $evidence 'post.txt') -Encoding UTF8
            if ($LASTEXITCODE -ne 0) { throw 'Post-export validation failed.' }
            @(
              'LAYERSENTRY_BACKUP_EXPORT_V2_COMPLETE'
              "RUN_ID=$env:GITHUB_RUN_ID"
              "COMMIT=$env:GITHUB_SHA"
              "SCRIPT_SHA256=$localHash"
              "EXPORT=$expectedExport"
              "CLIENT=$expectedClient"
              'NFS_V42_MOUNT_WRITE_TEST=true'
              'CLOUDSTACK_AGENT_PRESERVED=true'
            ) | Set-Content -LiteralPath (Join-Path $evidence 'summary.txt') -Encoding UTF8
          }
          finally {
            if ($ready) {
              $safeComment = $comment.Replace("'",'')
              $old = $ErrorActionPreference; $ErrorActionPreference = 'Continue'
              & ssh.exe @ssh "sed -i '/$safeComment`$/d' /root/.ssh/authorized_keys; rm -f /root/reconcile-backup-export-v2.sh" 2>&1 | Out-Null
              $ErrorActionPreference = $old
            }
            Remove-Item -LiteralPath $key,"$key.pub",$knownHosts,$patchedHelper,$consolePath -Force -ErrorAction SilentlyContinue
          }

      - name: Upload backup export evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layersentry-backup-export-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\layersentry-backup-export-v2-${{ github.run_id }}-${{ github.run_attempt }}\**
          if-no-files-found: error
          retention-days: 30
