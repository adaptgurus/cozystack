name: LayerSentry current module UI DR deploy
on:
  push:
    branches: [codex/modules-runtime-validation]
    paths: [.github/workflows/layersentry-module-ui-dr-deploy.yml]
  workflow_dispatch:
    inputs:
      artifact-run:
        type: string
        required: true
      artifact-id:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: layersentry-live-environment
  cancel-in-progress: false
env:
  CLOUDSTACK_UI_COMMIT: dc58f76f67dac13aa886c8d45475944f31b0c039
  EXPECTED_CONFIRMATION: DEPLOY-dc58f76f67dac13aa886c8d45475944f31b0c039-TO-10.10.10.20
  ARTIFACT_RUN: ${{ inputs.artifact-run }}
  ARTIFACT_ID: ${{ inputs.artifact-id }}
jobs:
  deploy:
    name: Deploy prebuilt UI to exact DR management host
    if: github.event_name == 'workflow_dispatch' && github.repository == 'adaptgurus/cozystack' && github.ref == 'refs/heads/codex/modules-runtime-validation'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out exact deployment transport
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact successful module UI build and immutable artifact
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:ARTIFACT_RUN -cnotmatch '^[0-9]{1,20}$' -or $env:ARTIFACT_ID -cnotmatch '^[0-9]{1,20}$'){throw 'Exact artifact inputs required.'}
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'}
          $base='https://api.github.com/repos/adaptgurus/cozystack/actions'
          $run=Invoke-RestMethod -Uri "$base/runs/$env:ARTIFACT_RUN" -Headers $headers -TimeoutSec 30
          if($run.head_sha -cne '99733f131ea1deb0262f256afc04e7c1bb79c34b' -or $run.head_branch -cne 'codex/modules-runtime-validation' -or $run.status -cne 'completed' -or $run.conclusion -cne 'success' -or $run.path -cne '.github/workflows/layersentry-module-ui-artifact.yml'){throw 'Reviewed build source/result mismatch.'}
          $artifact=Invoke-RestMethod -Uri "$base/artifacts/$env:ARTIFACT_ID" -Headers $headers -TimeoutSec 30
          if([string]$artifact.workflow_run.id -cne $env:ARTIFACT_RUN -or $artifact.expired -or $artifact.name -cne "layersentry-module-ui-$env:ARTIFACT_RUN-$($run.run_attempt)" -or $artifact.digest -cnotmatch '^sha256:[0-9a-f]{64}$' -or $artifact.size_in_bytes -gt 536870912){throw 'Immutable UI artifact binding failed.'}
      - name: Download exact prebuilt artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: adaptgurus/cozystack
          run-id: ${{ inputs.artifact-run }}
          artifact-ids: ${{ inputs.artifact-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/layersentry-dr-ui-download-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Transfer and execute guarded DR deployment
        shell: powershell
        env:
          DR_HOST: ${{ secrets.LAYERSENTRY_DR_ROCKY_HOST }}
          DR_USER: ${{ secrets.LAYERSENTRY_DR_ROCKY_USER }}
          DR_KEY: ${{ secrets.LAYERSENTRY_DR_SSH_PRIVATE_KEY }}
          DR_KNOWN_HOSTS: ${{ secrets.LAYERSENTRY_DR_SSH_KNOWN_HOSTS }}
          SUPPLIED_CONFIRMATION: DEPLOY-dc58f76f67dac13aa886c8d45475944f31b0c039-TO-10.10.10.20
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          if ($env:GITHUB_REPOSITORY -cne 'adaptgurus/cozystack' -or $env:GITHUB_REF -cne 'refs/heads/codex/modules-runtime-validation') { throw 'Repository or branch binding failed.' }
          if ($env:SUPPLIED_CONFIRMATION -cne $env:EXPECTED_CONFIRMATION) { throw 'Exact deployment confirmation is missing.' }
          if ($env:DR_HOST -cne '10.10.10.20' -or $env:DR_USER -cne 'root') { throw 'DR target binding failed.' }
          if (-not $env:DR_KEY -or -not $env:DR_KNOWN_HOSTS) { throw 'Required DR SSH secrets are missing.' }
          if ($env:GITHUB_RUN_ID -cnotmatch '^\d+$' -or $env:GITHUB_RUN_ATTEMPT -cnotmatch '^\d+$') { throw 'Invalid workflow run identity.' }

          $runIdentity = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $artifact = Join-Path $env:RUNNER_TEMP "layersentry-dr-ui-download-$runIdentity"
          $archive = Join-Path $artifact 'ui-dist.tar.gz'
          $checksum = Join-Path $artifact 'ui-dist.tar.gz.sha256'
          $manifestPath = Join-Path $artifact 'build-manifest.json'
          $scriptSource = (Resolve-Path 'hack/layersentry/deploy-dr-cloudstack-ui.sh').ProviderPath
          $script = Join-Path $env:RUNNER_TEMP "deploy-dr-cloudstack-ui-$runIdentity.sh"
          $scriptRemoteName = [IO.Path]::GetFileName($script)
          $scriptText = [IO.File]::ReadAllText($scriptSource).Replace("`r`n", "`n").Replace("`r", "`n")
          [IO.File]::WriteAllText($script, $scriptText, [Text.UTF8Encoding]::new($false))
          foreach ($path in @($archive, $checksum, $manifestPath, $script)) { if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Deployment input is missing: $path" } }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $properties = @($manifest.PSObject.Properties.Name | Sort-Object)
          $expectedProperties = @('artifact','artifactSha256','builtOnManagementNode','cloudstackUiCommit','component','product','schemaVersion')
          if (($properties -join ',') -cne ($expectedProperties -join ',')) { throw 'Build manifest has unexpected fields.' }
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.schemaVersion -cne '1.0' -or $manifest.product -cne 'LayerSentry' -or $manifest.component -cne 'cloudstack-ui' -or $manifest.cloudstackUiCommit -cne $env:CLOUDSTACK_UI_COMMIT -or $manifest.artifact -cne 'ui-dist.tar.gz' -or $manifest.artifactSha256 -cne $archiveHash -or $manifest.builtOnManagementNode -ne $false) { throw 'Build manifest validation failed.' }

          $private = Join-Path $env:RUNNER_TEMP "layersentry-dr-ui-private-$runIdentity"
          $evidence = Join-Path $env:RUNNER_TEMP "layersentry-dr-ui-evidence-$runIdentity"
          $remote = "/run/layersentry-dr-ui-$runIdentity"
          New-Item -ItemType Directory -Path $private -ErrorAction Stop | Out-Null
          New-Item -ItemType Directory -Path $evidence -ErrorAction Stop | Out-Null
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          & icacls $private /inheritance:r /grant:r "${identity}:(OI)(CI)(F)" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Private runtime directory ACL failed.' }
          $key = Join-Path $private 'identity'
          $known = Join-Path $private 'known_hosts'
          [IO.File]::WriteAllText($key, $env:DR_KEY.Replace("`r", '') + "`n", [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText($known, $env:DR_KNOWN_HOSTS.Replace("`r", '') + "`n", [Text.UTF8Encoding]::new($false))
          $env:DR_KEY = ''
          $options = @('-F','NUL','-o','IdentitiesOnly=yes','-o','GlobalKnownHostsFile=NUL','-o','UpdateHostKeys=no','-o','BatchMode=yes','-o','ConnectTimeout=15','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=4','-o','StrictHostKeyChecking=yes','-o',"UserKnownHostsFile=$known",'-o','LogLevel=ERROR','-i',$key)
          $target = 'root@10.10.10.20'
          $remoteCreated = $false
          try {
            $output = & ssh @options $target "umask 077; test ! -e '$remote' && mkdir '$remote'" 2>&1
            if ($LASTEXITCODE -ne 0) { throw 'Remote staging creation failed; SSH output withheld.' }
            $remoteCreated = $true
            $scpArguments = @($options) + @($archive, $checksum, $manifestPath, $script, "${target}:$remote/")
            $output = & scp @scpArguments 2>&1
            if ($LASTEXITCODE -ne 0) { throw 'Artifact transfer failed; SCP output withheld.' }
            # Merge remote diagnostics before Windows PowerShell can promote
            # native stderr into a terminating error and skip evidence capture.
            $command = "chmod 0700 '$remote/$scriptRemoteName' && bash '$remote/$scriptRemoteName' '$remote' '$env:CLOUDSTACK_UI_COMMIT' '$runIdentity' 2>&1"
            $output = & ssh @options $target $command 2>&1
            $remoteExit = $LASTEXITCODE
            $output | Set-Content -LiteralPath (Join-Path $evidence 'deployment.txt') -Encoding UTF8
            if ($remoteExit -ne 0) { throw 'DR UI deployment failed; inspect the sanitized deployment evidence.' }
            $joined = $output -join "`n"
            if ($joined -cnotmatch '(?m)^LAYERSENTRY_DR_UI_DEPLOYMENT=PASS$' -or $joined -cnotmatch "(?m)^CLOUDSTACK_UI_COMMIT=$([regex]::Escape($env:CLOUDSTACK_UI_COMMIT))$" -or $joined -cnotmatch '(?m)^CLOUDSTACK_VERSION=4\.22\.1\.1$' -or $joined -cnotmatch '(?m)^RUNTIME_PRODUCT=LayerSentry$' -or $joined -cnotmatch '(?m)^RUNTIME_PROFILE=layersentry-kvm$' -or $joined -cnotmatch '(?m)^HTTP_CLIENT=200$') { throw 'Deployment completion evidence is incomplete.' }
          }
          finally {
            if ($remoteCreated) {
              $cleanupOutput = & ssh @options $target "rm -rf -- '$remote'" 2>&1
              if ($LASTEXITCODE -ne 0) { Write-Warning "Remote staging cleanup requires follow-up at $remote." }
            }
            Remove-Item -LiteralPath $private -Recurse -Force -ErrorAction SilentlyContinue
            $env:DR_KEY = ''
          }

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layersentry-module-ui-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/layersentry-dr-ui-evidence-${{ github.run_id }}-${{ github.run_attempt }}/deployment.txt
          if-no-files-found: warn
          retention-days: 90
