name: One-shot HCI persistent state read-only probe

on:
  push:
    branches:
      - feat/hci-virtualization-v1.6.2-test
    paths:
      - .github/workflows/hci-persistent-state-probe-once.yml

permissions:
  contents: read

defaults:
  run:
    shell: powershell

jobs:
  probe:
    name: Read-only persistent state reconciliation probe
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Probe effective runtime without mutation
        run: |
          $ErrorActionPreference = 'Stop'
          $kubectl = 'C:\hci-tools\kubectl.exe'
          $env:KUBECONFIG = 'C:\hci-state\cozystack-hci-lab\kubeconfig'
          if (-not (Test-Path $kubectl)) { throw 'kubectl missing' }
          if (-not (Test-Path $env:KUBECONFIG)) { throw 'kubeconfig missing' }

          Write-Host '=== NODES ==='
          & $kubectl get nodes -o wide
          if ($LASTEXITCODE -ne 0) { throw 'node probe failed' }

          Write-Host '=== PLATFORM HELMRELEASE SUMMARY ==='
          $platformRaw = & $kubectl get helmrelease.helm.toolkit.fluxcd.io -n cozy-system cozystack-platform -o json
          if ($LASTEXITCODE -ne 0) { throw 'platform HelmRelease probe failed' }
          $platform = $platformRaw | ConvertFrom-Json
          $platform.status.conditions | Select-Object type,status,reason,message,lastTransitionTime | Format-Table -Wrap
          Write-Host "platform.lastAttemptedRevision=$($platform.status.lastAttemptedRevision)"
          Write-Host "platform.lastAttemptedRevisionDigest=$($platform.status.lastAttemptedRevisionDigest)"
          if ($platform.status.history) {
            Write-Host "platform.latestHistoryChart=$($platform.status.history[0].chartVersion)"
            Write-Host "platform.latestHistoryDigest=$($platform.status.history[0].ociDigest)"
          }

          Write-Host '=== KUBEVIRT PACKAGE SUMMARY ==='
          $pkgRaw = & $kubectl get package.cozystack.io cozystack.kubevirt -o json
          if ($LASTEXITCODE -ne 0) { throw 'KubeVirt Package probe failed' }
          $pkg = $pkgRaw | ConvertFrom-Json
          $pkg.status.conditions | Select-Object type,status,reason,message,lastTransitionTime | Format-Table -Wrap
          Write-Host "kubevirt.package.generation=$($pkg.metadata.generation) resourceVersion=$($pkg.metadata.resourceVersion)"
          Write-Host "kubevirt.package.values=$($pkg.spec.components.kubevirt.values | ConvertTo-Json -Compress -Depth 10)"

          Write-Host '=== KUBEVIRT HELMRELEASE SUMMARY ==='
          $hrRaw = & $kubectl get helmrelease.helm.toolkit.fluxcd.io -n cozy-kubevirt kubevirt -o json
          if ($LASTEXITCODE -ne 0) { throw 'KubeVirt HelmRelease probe failed' }
          $hr = $hrRaw | ConvertFrom-Json
          $hr.status.conditions | Select-Object type,status,reason,message,lastTransitionTime | Format-Table -Wrap
          Write-Host "kubevirt.hr.generation=$($hr.metadata.generation)"
          Write-Host "kubevirt.hr.lastAttemptedRevision=$($hr.status.lastAttemptedRevision)"
          if ($hr.status.history) {
            Write-Host "kubevirt.hr.latestHistoryChart=$($hr.status.history[0].chartVersion)"
            Write-Host "kubevirt.hr.latestHistoryDigest=$($hr.status.history[0].ociDigest)"
          }

          Write-Host '=== EFFECTIVE KUBEVIRT CONFIG ==='
          $kvRaw = & $kubectl get kubevirt.kubevirt.io -n cozy-kubevirt kubevirt -o json
          if ($LASTEXITCODE -ne 0) { throw 'KubeVirt CR probe failed' }
          $kv = $kvRaw | ConvertFrom-Json
          $gates = @($kv.spec.configuration.developerConfiguration.featureGates | ForEach-Object { [string]$_ })
          Write-Host "kubevirt.phase=$($kv.status.phase)"
          Write-Host "kubevirt.featureGates=$($gates -join ',')"
          Write-Host "kubevirt.vmStateStorageClass=$($kv.spec.configuration.vmStateStorageClass)"
          Write-Host "persistentStateGatePresent=$($gates -contains 'VMPersistentState')"
          Write-Host "replicatedStateClassPresent=$([string]$kv.spec.configuration.vmStateStorageClass -eq 'replicated')"

          Write-Host '=== OPERATOR IMAGE ==='
          $operatorRaw = & $kubectl get deployment -n cozy-system cozystack-operator -o json
          if ($LASTEXITCODE -ne 0) { throw 'operator deployment probe failed' }
          $operator = $operatorRaw | ConvertFrom-Json
          Write-Host (($operator.spec.template.spec.containers | ForEach-Object { $_.image }) -join ',')
