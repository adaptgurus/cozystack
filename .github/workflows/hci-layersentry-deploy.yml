name: LayerSentry HCI Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - feat/hci-virtualization-v1.6.2-test
    paths:
      - .github/workflows/hci-layersentry-deploy.yml
      - hack/hci-lab/bootstrap-production.ps1
      - hack/hci-lab/test-bootstrap-static.ps1
      - hack/hci-lab/reconcile-network-fabric-talosconfig.ps1
      - hack/hci-lab/test-network-fabric-talosconfig-static.ps1

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: powershell

env:
  RUNTIME_SOURCE_SHA: 4f7067142d9d84040f09148fd26150df98c47789
  RUNTIME_ARTIFACT_RUN_ID: '33167986706'
  RUNTIME_ARTIFACT_NAME: layersentry-hci-build-4f7067142d9d84040f09148fd26150df98c47789

jobs:
  deploy:
    name: Guarded current-orchestration deployment to Hyper-V lab
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 150
    steps:
      - name: Fetch exact current-SHA orchestration files without repository checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'adaptgurus/cozystack') { throw "Unexpected repository: $env:GITHUB_REPOSITORY" }
          if ($env:GITHUB_REF_NAME -ne 'feat/hci-virtualization-v1.6.2-test') { throw "Unexpected branch: $env:GITHUB_REF_NAME" }
          if ($env:GITHUB_SHA -notmatch '^[0-9a-f]{40}$') { throw "Invalid orchestration SHA: $env:GITHUB_SHA" }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $commit = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA"
          if ($commit.sha -ne $env:GITHUB_SHA) { throw "GitHub commit lookup returned $($commit.sha), expected $env:GITHUB_SHA" }

          $sourceDir = Join-Path $env:RUNNER_TEMP "layersentry-orchestration-$env:GITHUB_SHA"
          Remove-Item -Recurse -Force $sourceDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $sourceDir | Out-Null

          foreach ($name in 'bootstrap-production.ps1','test-bootstrap-static.ps1','reconcile-network-fabric-talosconfig.ps1','test-network-fabric-talosconfig-static.ps1') {
            $repoPath = "hack/hci-lab/$name"
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$repoPath`?ref=$env:GITHUB_SHA"
            $file = Invoke-RestMethod -Headers $headers -Uri $uri
            if ($file.type -ne 'file' -or -not $file.content) { throw "Exact-SHA file fetch failed for $repoPath" }
            $bytes = [Convert]::FromBase64String(([string]$file.content -replace '\s',''))
            $target = Join-Path $sourceDir $name
            [IO.File]::WriteAllBytes($target,$bytes)
            if (-not (Test-Path $target)) { throw "Failed to materialize $repoPath" }
            Write-Host "$repoPath gitBlob=$($file.sha) sha256=$((Get-FileHash -Algorithm SHA256 $target).Hash.ToLowerInvariant())"
          }

          "LAYERSENTRY_ORCHESTRATION_DIR=$sourceDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "orchestration_sha=$env:GITHUB_SHA runtime_source_sha=$env:RUNTIME_SOURCE_SHA"

      - name: Wait for current-SHA HCI and bootstrap-static gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          function Wait-WorkflowForSha {
            param(
              [Parameter(Mandatory=$true)][string]$WorkflowFile,
              [Parameter(Mandatory=$true)][string]$ExpectedName
            )
            $deadline = (Get-Date).AddMinutes(45)
            do {
              $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/$WorkflowFile/runs?branch=$env:GITHUB_REF_NAME&event=push&per_page=50"
              $runs = Invoke-RestMethod -Headers $headers -Uri $uri
              $run = @($runs.workflow_runs | Where-Object { $_.head_sha -eq $env:GITHUB_SHA } | Sort-Object run_number -Descending | Select-Object -First 1)
              if ($run.Count -gt 0) {
                $r = $run[0]
                Write-Host "$ExpectedName current-SHA run=$($r.id) status=$($r.status) conclusion=$($r.conclusion)"
                if ($r.name -ne $ExpectedName) { throw "Unexpected workflow name '$($r.name)'" }
                if ($r.status -eq 'completed') {
                  if ($r.conclusion -ne 'success') { throw "$ExpectedName failed for current SHA: $($r.conclusion)" }
                  return
                }
              } else {
                Write-Host "Waiting for $ExpectedName run to appear for $env:GITHUB_SHA"
              }
              Start-Sleep -Seconds 10
            } while ((Get-Date) -lt $deadline)
            throw "Timed out waiting for $ExpectedName on current SHA $env:GITHUB_SHA"
          }

          Wait-WorkflowForSha -WorkflowFile 'hci-v1.6.2-gate.yml' -ExpectedName 'HCI v1.6.2 Gate'
          Wait-WorkflowForSha -WorkflowFile 'hci-bootstrap-static.yml' -ExpectedName 'HCI Bootstrap Static Safety'

      - name: Verify runtime artifact source is an allowed ancestor delta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $runUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RUNTIME_ARTIFACT_RUN_ID"
          $artifactRun = Invoke-RestMethod -Headers $headers -Uri $runUri
          if ($artifactRun.name -ne 'LayerSentry HCI Artifact Build') { throw "Unexpected runtime build workflow: $($artifactRun.name)" }
          if ($artifactRun.head_sha -ne $env:RUNTIME_SOURCE_SHA) { throw "Artifact run SHA mismatch: $($artifactRun.head_sha)" }
          if ($artifactRun.status -ne 'completed' -or $artifactRun.conclusion -ne 'success') {
            throw "Runtime artifact run is not successful: $($artifactRun.status)/$($artifactRun.conclusion)"
          }

          $compareUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/compare/$env:RUNTIME_SOURCE_SHA...$env:GITHUB_SHA"
          $compare = Invoke-RestMethod -Headers $headers -Uri $compareUri
          if ($compare.status -notin @('ahead','identical')) { throw "Current orchestration is not an allowed descendant of runtime source: $($compare.status)" }

          $allowed = @(
            '^hack/hci-lab/',
            '^hack/test-hci-v1\.6\.2\.sh$',
            '^\.github/workflows/'
          )
          $disallowed = @()
          foreach ($file in @($compare.files)) {
            $ok = $false
            foreach ($pattern in $allowed) {
              if ($file.filename -match $pattern) { $ok = $true; break }
            }
            if (-not $ok) { $disallowed += $file.filename }
          }
          if ($disallowed.Count -gt 0) {
            throw "Runtime-affecting files changed after artifact source and require a new artifact build: $($disallowed -join ', ')"
          }
          Write-Host 'Runtime source delta is orchestration/test-only; immutable runtime artifact may be reused.'

      - name: Parse exact current orchestration before any mutation
        run: |
          $ErrorActionPreference = 'Stop'
          $bootstrapTest = Join-Path $env:LAYERSENTRY_ORCHESTRATION_DIR 'test-bootstrap-static.ps1'
          $bootstrap = Join-Path $env:LAYERSENTRY_ORCHESTRATION_DIR 'bootstrap-production.ps1'
          $networkFabricTest = Join-Path $env:LAYERSENTRY_ORCHESTRATION_DIR 'test-network-fabric-talosconfig-static.ps1'
          $networkFabricReconcile = Join-Path $env:LAYERSENTRY_ORCHESTRATION_DIR 'reconcile-network-fabric-talosconfig.ps1'
          & $bootstrapTest -BootstrapPath $bootstrap
          if (-not $?) { throw 'Bootstrap static validation failed on self-hosted runner.' }
          & $networkFabricTest -ReconcilePath $networkFabricReconcile
          if (-not $?) { throw 'NetworkFabric Talos credential static validation failed on self-hosted runner.' }

      - name: Download exact runtime build manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.RUNTIME_ARTIFACT_NAME }}
          path: ${{ runner.temp }}\layersentry-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: adaptgurus/cozystack
          run-id: ${{ env.RUNTIME_ARTIFACT_RUN_ID }}

      - name: Verify immutable custom artifact manifest
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $env:RUNNER_TEMP 'layersentry-build\build-manifest.json'
          if (-not (Test-Path $manifestPath)) { throw "Build manifest missing: $manifestPath" }
          $m = Get-Content -Raw $manifestPath | ConvertFrom-Json

          if ($m.product -ne 'LayerSentry Platform') { throw "Unexpected product identity: $($m.product)" }
          if ($m.repository -ne 'adaptgurus/cozystack') { throw "Unexpected repository: $($m.repository)" }
          if ($m.branch -ne 'feat/hci-virtualization-v1.6.2-test') { throw "Unexpected branch: $($m.branch)" }
          if ($m.commit -ne $env:RUNTIME_SOURCE_SHA) { throw "Manifest runtime source mismatch: $($m.commit)" }
          if ([string]$m.runId -ne $env:RUNTIME_ARTIFACT_RUN_ID) { throw "Manifest run ID mismatch: $($m.runId)" }

          $installerPattern = '^oci://ghcr\.io/adaptgurus/cozystack/cozy-installer@sha256:[0-9a-f]{64}$'
          if ($m.installerUri -notmatch $installerPattern) { throw "Installer is not digest-pinned custom artifact: $($m.installerUri)" }

          $imagePattern = '^ghcr\.io/adaptgurus/cozystack/[a-z0-9._/-]+:[^@]+@sha256:[0-9a-f]{64}$'
          foreach ($field in 'operatorImage','apiImage','uiImage','networkFabricControllerImage','vmNetworkAdmissionImage','vmTemplateControllerImage') {
            $value = [string]$m.$field
            if ($value -notmatch $imagePattern) { throw "$field is not a digest-pinned adaptgurus image: $value" }
          }

          if ([string]$m.platformSourceUrl -ne 'oci://ghcr.io/adaptgurus/cozystack/cozystack-packages') {
            throw "Unexpected platform source URL: $($m.platformSourceUrl)"
          }
          if ([string]$m.platformSourceRef -notmatch '^digest=sha256:[0-9a-f]{64}$') {
            throw "Platform source is not digest-pinned: $($m.platformSourceRef)"
          }

          "LAYERSENTRY_INSTALLER_URI=$($m.installerUri)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LAYERSENTRY_RUNTIME_SOURCE_SHA=$env:RUNTIME_SOURCE_SHA" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Verified runtime source $($m.commit) installer $($m.installerUri)"

      - name: Install verified kubectl and Helm
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $tools = 'C:\hci-tools'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $curl = (Get-Command curl.exe -ErrorAction Stop).Source

          $kubectlVersion = 'v1.34.3'
          $kubectl = Join-Path $tools 'kubectl.exe'
          $kubectlTmp = "$kubectl.download"
          & $curl --fail --location --connect-timeout 10 --max-time 300 --retry 2 --output $kubectlTmp "https://dl.k8s.io/release/$kubectlVersion/bin/windows/amd64/kubectl.exe"
          if ($LASTEXITCODE -ne 0) { throw 'kubectl download failed' }
          $expectedKubectl = ((Invoke-RestMethod "https://dl.k8s.io/release/$kubectlVersion/bin/windows/amd64/kubectl.exe.sha256").Trim()).ToLowerInvariant()
          $actualKubectl = (Get-FileHash -Algorithm SHA256 $kubectlTmp).Hash.ToLowerInvariant()
          if ($actualKubectl -ne $expectedKubectl) { throw "kubectl checksum mismatch: $actualKubectl" }
          Move-Item -Force $kubectlTmp $kubectl

          $helmVersion = 'v3.18.6'
          $archive = "helm-$helmVersion-windows-amd64.zip"
          $helmZip = Join-Path $tools $archive
          & $curl --fail --location --connect-timeout 10 --max-time 300 --retry 2 --output $helmZip "https://get.helm.sh/$archive"
          if ($LASTEXITCODE -ne 0) { throw 'Helm download failed' }
          $checksum = (Invoke-RestMethod "https://get.helm.sh/$archive.sha256sum").Trim()
          $expectedHelm = ($checksum -split '\s+')[0].ToLowerInvariant()
          $actualHelm = (Get-FileHash -Algorithm SHA256 $helmZip).Hash.ToLowerInvariant()
          if ($actualHelm -ne $expectedHelm) { throw "Helm checksum mismatch: $actualHelm" }
          $extract = Join-Path $env:RUNNER_TEMP 'helm-extract'
          Remove-Item -Recurse -Force $extract -ErrorAction SilentlyContinue
          Expand-Archive -Path $helmZip -DestinationPath $extract -Force
          Copy-Item -Force (Join-Path $extract 'windows-amd64\helm.exe') (Join-Path $tools 'helm.exe')
          $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Execute guarded exact current bootstrap
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:LAYERSENTRY_INSTALLER_URI -notmatch '^oci://ghcr\.io/adaptgurus/cozystack/cozy-installer@sha256:[0-9a-f]{64}$') {
            throw 'Digest-pinned LayerSentry installer was not supplied.'
          }
          $bootstrap = Join-Path $env:LAYERSENTRY_ORCHESTRATION_DIR 'bootstrap-production.ps1'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $bootstrap
          if ($LASTEXITCODE -ne 0) { throw "LayerSentry bootstrap failed with exit code $LASTEXITCODE" }

      - name: Reconcile NetworkFabric Talos credential and wait for controller
        run: |
          $ErrorActionPreference = 'Stop'
          $reconcile = Join-Path $env:LAYERSENTRY_ORCHESTRATION_DIR 'reconcile-network-fabric-talosconfig.ps1'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $reconcile
          if ($LASTEXITCODE -ne 0) { throw "NetworkFabric Talos credential reconciliation failed with exit code $LASTEXITCODE" }

      - name: Capture non-secret deployment evidence
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'layersentry-deploy-evidence'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          "orchestration_sha=$env:GITHUB_SHA`nruntime_source_sha=$env:RUNTIME_SOURCE_SHA`nrun_id=$env:GITHUB_RUN_ID" |
            Set-Content -Path (Join-Path $out 'provenance.txt') -Encoding UTF8

          Get-VM -Name sen1,sen2,sen3 |
            Format-List Name,State,Status,ProcessorCount,MemoryStartup,Uptime |
            Out-String | Set-Content -Path (Join-Path $out 'hyperv.txt') -Encoding UTF8

          if (Test-Path 'C:\hci-state\cozystack-hci-lab\kubeconfig') {
            $env:KUBECONFIG = 'C:\hci-state\cozystack-hci-lab\kubeconfig'
            & 'C:\hci-tools\kubectl.exe' get nodes -o wide 2>&1 |
              Out-String | Set-Content -Path (Join-Path $out 'nodes.txt') -Encoding UTF8
            & 'C:\hci-tools\kubectl.exe' get hr -A 2>&1 |
              Out-String | Set-Content -Path (Join-Path $out 'helmreleases.txt') -Encoding UTF8
            & 'C:\hci-tools\kubectl.exe' get pods -A -o wide 2>&1 |
              Out-String | Set-Content -Path (Join-Path $out 'pods.txt') -Encoding UTF8
            & 'C:\hci-tools\kubectl.exe' get storageclass,pv,pvc -A 2>&1 |
              Out-String | Set-Content -Path (Join-Path $out 'storage.txt') -Encoding UTF8
            & 'C:\hci-tools\kubectl.exe' exec -n cozy-linstor deploy/linstor-controller -- linstor storage-pool list 2>&1 |
              Out-String | Set-Content -Path (Join-Path $out 'linstor-pools.txt') -Encoding UTF8
            & 'C:\hci-tools\kubectl.exe' get deployment,pods -n cozy-network-fabric-controller -o wide 2>&1 |
              Out-String | Set-Content -Path (Join-Path $out 'network-fabric-controller.txt') -Encoding UTF8
          }

          Get-ChildItem 'C:\hci-diagnostics\production-bootstrap-*.txt' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 3 |
            Copy-Item -Destination $out -Force -ErrorAction SilentlyContinue

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layersentry-hci-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\layersentry-deploy-evidence
          if-no-files-found: error
          retention-days: 30
