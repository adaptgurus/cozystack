name: LayerSentry Dashboard VM UX Production Certification

on:
  workflow_dispatch:
  push:
    branches:
      - layersentry-platform
    paths:
      - .github/workflows/layersentry-dashboard-console-vm-ux-live.yml

concurrency:
  group: layersentry-dashboard-console-vm-ux-live
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/cozystack/cozystack-ui
  IMAGE_TAG: layersentry-vm-ux-${{ github.sha }}

jobs:
  publish:
    name: Source gate, publish and smoke-test immutable console
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Verify source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "adaptgurus/cozystack"
          test "${GITHUB_REF_NAME}" = "layersentry-platform"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -s packages/system/dashboard/images/console/apps/console/src/components/VMInstanceExperience.tsx
          test -s packages/system/dashboard/images/console/apps/console/src/components/VMInstanceExperience.test.ts
          test -s packages/system/dashboard/images/console/apps/console/src/routes/ApplicationOrderPage.tsx
          echo "SOURCE_PROVENANCE=PASS sha=${GITHUB_SHA}"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: packages/system/dashboard/images/console/package.json

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/system/dashboard/images/console/pnpm-lock.yaml

      - name: Run full console gate
        working-directory: packages/system/dashboard/images/console
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm --filter @cozystack/console build
          echo "SOURCE_VM_UX_GATE=PASS"

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish attested console image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx create --name layersentry-console-builder --driver docker-container --use
          docker buildx inspect --bootstrap
          image="${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          metadata="${RUNNER_TEMP}/console-build-metadata.json"
          docker buildx build \
            --platform linux/amd64 \
            --file packages/system/dashboard/images/console/Containerfile \
            --build-arg "APP_VERSION=layersentry-${GITHUB_SHA}" \
            --tag "$image" \
            --metadata-file "$metadata" \
            --provenance=true \
            --sbom=true \
            --push \
            packages/system/dashboard/images/console
          digest="$(jq -r '."containerimage.digest" // empty' "$metadata")"
          case "$digest" in sha256:*) ;; *) exit 1 ;; esac
          image_ref="${IMAGE_REPOSITORY}@${digest}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "CONSOLE_IMAGE_REF=$image_ref"

      - name: Smoke-test exact published image
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
          cid="$(docker run -d --rm --add-host kubernetes.default.svc:127.0.0.1 -p 127.0.0.1:18080:8080 "$IMAGE_REF")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/healthcheck | grep -Eiq 'healthy|ok' && break
            docker inspect "$cid" >/dev/null 2>&1 || exit 1
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthcheck | grep -Eiq 'healthy|ok'
          curl -fsS http://127.0.0.1:18080/ | grep -F '<div id="root"></div>' >/dev/null
          echo "IMMUTABLE_IMAGE_SMOKE=PASS image=$IMAGE_REF"

      - name: Remove BuildKit builder
        if: always()
        shell: bash
        run: docker buildx rm layersentry-console-builder >/dev/null 2>&1 || true

  certify-testser:
    name: End-to-end VM GUI contract on TESTSER
    needs: publish
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    defaults:
      run:
        shell: powershell
    env:
      KUBECONFIG: C:\hci-state\cozystack-hci-lab\kubeconfig
      KUBECTL: C:\hci-tools\kubectl.exe
      IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
    steps:
      - name: Preflight and capture rollback baseline
        run: |
          $ErrorActionPreference='Stop'
          if(-not(Test-Path $env:KUBECONFIG)){throw 'TESTSER kubeconfig missing'}
          if(-not(Test-Path $env:KUBECTL)){throw 'kubectl missing'}
          if($env:IMAGE_REF -notmatch '^ghcr\.io/adaptgurus/cozystack/cozystack-ui@sha256:[0-9a-f]{64}$'){throw "unexpected image ref $env:IMAGE_REF"}
          $nodes=@((& $env:KUBECTL get nodes -o json|ConvertFrom-Json).items)
          if($nodes.Count -lt 3){throw "expected >=3 nodes, found $($nodes.Count)"}
          $bad=@($nodes|Where-Object{(@($_.status.conditions|Where-Object{$_.type -eq 'Ready'}|Select-Object -First 1).status) -ne 'True'})
          if($bad.Count){throw "non-Ready nodes: $($bad.metadata.name -join ',')"}
          $hr=& $env:KUBECTL -n cozy-dashboard get helmrelease dashboard -o json|ConvertFrom-Json
          $dep=& $env:KUBECTL -n cozy-dashboard get deployment cozy-dashboard-console -o json|ConvertFrom-Json
          $console=@($dep.spec.template.spec.containers|Where-Object{$_.name -eq 'console'}|Select-Object -First 1)
          if(-not $console){throw 'console container missing'}
          $hadImage=$false;$oldValueImage=$null
          if($hr.spec.values -and $hr.spec.values.console -and ($hr.spec.values.console.PSObject.Properties.Name -contains 'image')){$hadImage=$true;$oldValueImage=[string]$hr.spec.values.console.image}
          $postJson=if($null -ne $hr.spec.postRenderers){$hr.spec.postRenderers|ConvertTo-Json -Depth 60 -Compress}else{'null'}
          $baseline=[ordered]@{deploymentImage=[string]$console.image;hadValueImage=$hadImage;valueImage=$oldValueImage;postRenderersJson=$postJson}
          $baseline|ConvertTo-Json -Depth 70|Set-Content (Join-Path $env:RUNNER_TEMP 'vm-ux-baseline.json') -Encoding UTF8
          Write-Host "LAB_PREFLIGHT=PASS nodes=$($nodes.Count) image=$($console.image) valueImagePresent=$hadImage"

      - name: Discover live VM application contract
        run: |
          $ErrorActionPreference='Stop'
          $ad=& $env:KUBECTL get applicationdefinition vm-instance -o json|ConvertFrom-Json
          if(-not $ad.spec.application.kind -or -not $ad.spec.application.plural){throw 'vm-instance definition incomplete'}
          $schema=[string]$ad.spec.application.openAPISchema|ConvertFrom-Json
          $ns='tenant-layersentry'
          $nso=& $env:KUBECTL get ns $ns -o json|ConvertFrom-Json
          if($nso.status.phase -ne 'Active'){throw "$ns not Active"}
          $apps=@((& $env:KUBECTL -n $ns get $ad.spec.application.plural -o json|ConvertFrom-Json).items)
          if($apps.Count -ne 0){throw "E2E safety requires no pre-existing VM application CRs; found $($apps.Count)"}
          $contract=[ordered]@{kind=[string]$ad.spec.application.kind;plural=[string]$ad.spec.application.plural;namespace=$ns;instanceType=[string]$schema.properties.instanceType.default;instanceProfile=[string]$schema.properties.instanceProfile.default}
          if(-not $contract.instanceType){$contract.instanceType='u1.medium'}
          if(-not $contract.instanceProfile){$contract.instanceProfile='ubuntu'}
          $contract|ConvertTo-Json|Set-Content (Join-Path $env:RUNNER_TEMP 'vm-contract.json') -Encoding UTF8
          Write-Host "VM_APPLICATION_CONTRACT=PASS kind=$($contract.kind) plural=$($contract.plural) instanceType=$($contract.instanceType) profile=$($contract.instanceProfile)"

      - name: Persist immutable console image through native Helm values
        run: |
          $ErrorActionPreference='Stop'
          $baseline=Get-Content (Join-Path $env:RUNNER_TEMP 'vm-ux-baseline.json') -Raw|ConvertFrom-Json
          $patch=[ordered]@{spec=[ordered]@{values=[ordered]@{console=[ordered]@{image=$env:IMAGE_REF}}}}
          $f=Join-Path $env:RUNNER_TEMP 'dashboard-image-patch.json';$patch|ConvertTo-Json -Depth 20|Set-Content $f -Encoding UTF8
          & $env:KUBECTL -n cozy-dashboard patch helmrelease dashboard --type=merge "--patch-file=$f"|Out-Host
          if($LASTEXITCODE){throw 'failed to set dashboard values.console.image'}
          Set-Content (Join-Path $env:RUNNER_TEMP 'dashboard-mutated.flag') 'true'
          $hr=& $env:KUBECTL -n cozy-dashboard get helmrelease dashboard -o json|ConvertFrom-Json
          if([string]$hr.spec.values.console.image -ne $env:IMAGE_REF){throw 'HelmRelease did not retain exact console image value'}
          $postNow=if($null -ne $hr.spec.postRenderers){$hr.spec.postRenderers|ConvertTo-Json -Depth 60 -Compress}else{'null'}
          if($postNow -ne [string]$baseline.postRenderersJson){throw 'existing dashboard postRenderers changed unexpectedly'}
          Write-Host 'HELM_NATIVE_IMAGE_OVERRIDE=PASS postRenderersPreserved=true'

      - name: Reconcile dashboard and verify exact live image
        run: |
          $ErrorActionPreference='Stop'
          $stamp=[DateTimeOffset]::UtcNow.ToUnixTimeSeconds().ToString()
          & $env:KUBECTL -n cozy-dashboard annotate helmrelease dashboard "reconcile.fluxcd.io/requestedAt=$stamp" --overwrite|Out-Null
          $deadline=(Get-Date).AddMinutes(6)
          do{
            $hr=& $env:KUBECTL -n cozy-dashboard get helmrelease dashboard -o json|ConvertFrom-Json
            $ready=@($hr.status.conditions|Where-Object{$_.type -eq 'Ready'}|Select-Object -First 1)
            if([string]$hr.status.lastHandledReconcileAt -eq $stamp -and $ready.status -eq 'True'){break}
            Start-Sleep 5
          }while((Get-Date)-lt $deadline)
          if([string]$hr.status.lastHandledReconcileAt -ne $stamp -or $ready.status -ne 'True'){throw "dashboard reconcile failed: $($ready.message)"}
          & $env:KUBECTL -n cozy-dashboard rollout status deployment/cozy-dashboard-console --timeout=240s|Out-Host
          if($LASTEXITCODE){throw 'console rollout failed'}
          $dep=& $env:KUBECTL -n cozy-dashboard get deployment cozy-dashboard-console -o json|ConvertFrom-Json
          $image=[string](@($dep.spec.template.spec.containers|Where-Object{$_.name -eq 'console'}|Select-Object -First 1).image)
          if($image -ne $env:IMAGE_REF){throw "live image mismatch expected=$env:IMAGE_REF actual=$image"}
          Write-Host "DASHBOARD_CONSOLE_IMAGE=PASS image=$image"

      - name: Verify deployed bundle has guided create and edit UX
        run: |
          $ErrorActionPreference='Stop'
          $prefix='/api/v1/namespaces/cozy-dashboard/services/http:cozy-dashboard-console:8080/proxy'
          $health=(& $env:KUBECTL get --raw "$prefix/healthcheck"|Out-String).Trim()
          if($health -notmatch '(?i)healthy|ok'){throw "health failed: $health"}
          $html=& $env:KUBECTL get --raw "$prefix/"|Out-String
          $m=[regex]::Match($html,'src="(/assets/index-[^"]+\.js)"');if(-not$m.Success){throw 'main bundle missing'}
          $js=& $env:KUBECTL get --raw "$prefix$($m.Groups[1].Value)"|Out-String
          foreach($x in @('Create virtual machine','Basics','Compute','Storage','Network','Access','Review','Pending changes','Safe edit behavior')){if($js -notmatch [regex]::Escape($x)){throw "bundle missing marker $x"}}
          Write-Host 'DEPLOYED_VM_GUI_BUNDLE=PASS markers=10'

      - name: Create disposable VM through the same application API contract
        run: |
          $ErrorActionPreference='Stop'
          $c=Get-Content (Join-Path $env:RUNNER_TEMP 'vm-contract.json') -Raw|ConvertFrom-Json
          $name="vm-e2e-$env:GITHUB_RUN_ID".ToLower();Set-Content (Join-Path $env:RUNNER_TEMP 'vm-e2e-name.txt') $name
          $before=@((& $env:KUBECTL -n $c.namespace get virtualmachines.kubevirt.io -o json|ConvertFrom-Json).items|ForEach-Object{$_.metadata.name})
          $before|ConvertTo-Json|Set-Content (Join-Path $env:RUNNER_TEMP 'vm-before.json') -Encoding UTF8
          $body=[ordered]@{apiVersion='apps.cozystack.io/v1alpha1';kind=$c.kind;metadata=[ordered]@{name=$name;namespace=$c.namespace};spec=[ordered]@{runStrategy='Halted';instanceType=$c.instanceType;instanceProfile=$c.instanceProfile}}
          $f=Join-Path $env:RUNNER_TEMP 'vm-e2e-create.json';$body|ConvertTo-Json -Depth 20|Set-Content $f -Encoding UTF8
          & $env:KUBECTL create -f $f|Out-Host;if($LASTEXITCODE){throw 'VM application create failed'}
          $deadline=(Get-Date).AddMinutes(6);$new=@()
          do{
            $all=@((& $env:KUBECTL -n $c.namespace get virtualmachines.kubevirt.io -o json|ConvertFrom-Json).items)
            $new=@($all|Where-Object{$before -notcontains $_.metadata.name})
            if($new.Count -eq 1 -and [string]$new[0].spec.runStrategy -eq 'Halted'){break}
            Start-Sleep 5
          }while((Get-Date)-lt $deadline)
          if($new.Count -ne 1){throw "expected one downstream KubeVirt VM, found $($new.Count)"}
          if([string]$new[0].spec.runStrategy -ne 'Halted'){throw "downstream VM runStrategy=$($new[0].spec.runStrategy)"}
          Set-Content (Join-Path $env:RUNNER_TEMP 'kubevirt-vm-name.txt') ([string]$new[0].metadata.name)
          $vmiRaw=& $env:KUBECTL -n $c.namespace get virtualmachineinstances.kubevirt.io -o json|ConvertFrom-Json
          $vmiNew=@($vmiRaw.items|Where-Object{$_.metadata.name -eq $new[0].metadata.name})
          if($vmiNew.Count){throw 'Halted E2E VM unexpectedly launched a VMI'}
          Write-Host "VM_APPLICATION_CREATE=PASS app=$name kubevirtVM=$($new[0].metadata.name) halted=true"

      - name: Exercise PUT-style edit and prove untouched fields stay unchanged
        run: |
          $ErrorActionPreference='Stop'
          $c=Get-Content (Join-Path $env:RUNNER_TEMP 'vm-contract.json') -Raw|ConvertFrom-Json
          $name=(Get-Content (Join-Path $env:RUNNER_TEMP 'vm-e2e-name.txt') -Raw).Trim()
          $obj=& $env:KUBECTL -n $c.namespace get $c.plural $name -o json|ConvertFrom-Json
          $before=$obj.spec
          $replace=[ordered]@{apiVersion=[string]$obj.apiVersion;kind=[string]$obj.kind;metadata=[ordered]@{name=$name;namespace=$c.namespace;resourceVersion=[string]$obj.metadata.resourceVersion};spec=$obj.spec}
          $replace.spec.runStrategy='Manual'
          $f=Join-Path $env:RUNNER_TEMP 'vm-e2e-replace.json';$replace|ConvertTo-Json -Depth 40|Set-Content $f -Encoding UTF8
          & $env:KUBECTL replace -f $f|Out-Host;if($LASTEXITCODE){throw 'PUT-style VM edit failed'}
          $after=& $env:KUBECTL -n $c.namespace get $c.plural $name -o json|ConvertFrom-Json
          if([string]$after.spec.runStrategy -ne 'Manual'){throw 'application edit did not persist Manual'}
          $bp=@($before.PSObject.Properties.Name|Sort-Object);$ap=@($after.spec.PSObject.Properties.Name|Sort-Object)
          if(($bp -join '|') -ne ($ap -join '|')){throw "edit injected/removed fields before=$($bp -join ',') after=$($ap -join ',')"}
          foreach($p in $bp){if($p -eq 'runStrategy'){continue};$a=$before.$p|ConvertTo-Json -Depth 30 -Compress;$b=$after.spec.$p|ConvertTo-Json -Depth 30 -Compress;if($a -ne $b){throw "untouched field changed: $p"}}
          $kv=(Get-Content (Join-Path $env:RUNNER_TEMP 'kubevirt-vm-name.txt') -Raw).Trim();$deadline=(Get-Date).AddMinutes(5)
          do{$vm=& $env:KUBECTL -n $c.namespace get virtualmachine.kubevirt.io $kv -o json|ConvertFrom-Json;if([string]$vm.spec.runStrategy -eq 'Manual'){break};Start-Sleep 5}while((Get-Date)-lt $deadline)
          if([string]$vm.spec.runStrategy -ne 'Manual'){throw "KubeVirt VM did not reconcile edit; runStrategy=$($vm.spec.runStrategy)"}
          Write-Host "VM_SAFE_EDIT=PASS app=$name kubevirtVM=$kv defaultsInjected=false"

      - name: Prove console image survives second Flux reconciliation
        run: |
          $ErrorActionPreference='Stop'
          $stamp=[DateTimeOffset]::UtcNow.ToUnixTimeSeconds().ToString();& $env:KUBECTL -n cozy-dashboard annotate helmrelease dashboard "reconcile.fluxcd.io/requestedAt=$stamp" --overwrite|Out-Null
          $deadline=(Get-Date).AddMinutes(6)
          do{$hr=& $env:KUBECTL -n cozy-dashboard get helmrelease dashboard -o json|ConvertFrom-Json;$ready=@($hr.status.conditions|Where-Object{$_.type -eq 'Ready'}|Select-Object -First 1);if([string]$hr.status.lastHandledReconcileAt -eq $stamp -and $ready.status -eq 'True'){break};Start-Sleep 5}while((Get-Date)-lt $deadline)
          if([string]$hr.status.lastHandledReconcileAt -ne $stamp -or $ready.status -ne 'True'){throw 'second Flux reconcile failed'}
          $dep=& $env:KUBECTL -n cozy-dashboard get deployment cozy-dashboard-console -o json|ConvertFrom-Json;$image=[string](@($dep.spec.template.spec.containers|Where-Object{$_.name -eq 'console'}|Select-Object -First 1).image)
          if($image -ne $env:IMAGE_REF){throw "Flux reverted console image to $image"}
          Write-Host 'DASHBOARD_VM_UX_DURABILITY=PASS fluxReconcile=true'

      - name: Clean disposable VM and verify no lifecycle leak
        if: always()
        run: |
          $ErrorActionPreference='Stop'
          $nf=Join-Path $env:RUNNER_TEMP 'vm-e2e-name.txt';$cf=Join-Path $env:RUNNER_TEMP 'vm-contract.json'
          if(-not(Test-Path $nf) -or -not(Test-Path $cf)){Write-Host 'VM_E2E_CLEANUP=NOT_REQUIRED';exit 0}
          $name=(Get-Content $nf -Raw).Trim();$c=Get-Content $cf -Raw|ConvertFrom-Json
          & $env:KUBECTL -n $c.namespace delete $c.plural $name --ignore-not-found=true --wait=true --timeout=240s|Out-Host
          if($LASTEXITCODE){throw 'VM application delete failed'}
          $kvf=Join-Path $env:RUNNER_TEMP 'kubevirt-vm-name.txt'
          if(Test-Path $kvf){$kv=(Get-Content $kvf -Raw).Trim();$deadline=(Get-Date).AddMinutes(5);do{& $env:KUBECTL -n $c.namespace get virtualmachine.kubevirt.io $kv *> $null;if($LASTEXITCODE -ne 0){break};Start-Sleep 5}while((Get-Date)-lt $deadline);if($LASTEXITCODE -eq 0){throw "KubeVirt VM leaked after delete: $kv"}}
          $leaks=@()
          foreach($resource in @('persistentvolumeclaims','services','secrets')){$items=@((& $env:KUBECTL -n $c.namespace get $resource -o json|ConvertFrom-Json).items);$leaks+=@($items|Where-Object{$_.metadata.name -like "*$name*"}|ForEach-Object{"$resource/$($_.metadata.name)"})}
          if($leaks.Count){throw "VM lifecycle leaked resources: $($leaks -join ',')"}
          Write-Host "VM_E2E_CLEANUP=PASS app=$name leakedResources=0"

      - name: Roll back dashboard exactly if certification fails
        if: failure()
        run: |
          $ErrorActionPreference='Stop'
          $flag=Join-Path $env:RUNNER_TEMP 'dashboard-mutated.flag';if(-not(Test-Path $flag)){Write-Host 'DASHBOARD_ROLLBACK=NOT_REQUIRED';exit 0}
          $b=Get-Content (Join-Path $env:RUNNER_TEMP 'vm-ux-baseline.json') -Raw|ConvertFrom-Json
          $restoreImage=if($b.hadValueImage){[string]$b.valueImage}else{$null}
          $patch=[ordered]@{spec=[ordered]@{values=[ordered]@{console=[ordered]@{image=$restoreImage}}}}
          $f=Join-Path $env:RUNNER_TEMP 'dashboard-rollback.json';$patch|ConvertTo-Json -Depth 20|Set-Content $f -Encoding UTF8
          & $env:KUBECTL -n cozy-dashboard patch helmrelease dashboard --type=merge "--patch-file=$f"|Out-Host;if($LASTEXITCODE){throw 'dashboard rollback patch failed'}
          $hr=& $env:KUBECTL -n cozy-dashboard get helmrelease dashboard -o json|ConvertFrom-Json
          $postNow=if($null -ne $hr.spec.postRenderers){$hr.spec.postRenderers|ConvertTo-Json -Depth 60 -Compress}else{'null'};if($postNow -ne [string]$b.postRenderersJson){throw 'postRenderers changed during rollback'}
          $stamp=[DateTimeOffset]::UtcNow.ToUnixTimeSeconds().ToString();& $env:KUBECTL -n cozy-dashboard annotate helmrelease dashboard "reconcile.fluxcd.io/requestedAt=$stamp" --overwrite|Out-Null
          $deadline=(Get-Date).AddMinutes(6);do{$hr=& $env:KUBECTL -n cozy-dashboard get helmrelease dashboard -o json|ConvertFrom-Json;$ready=@($hr.status.conditions|Where-Object{$_.type -eq 'Ready'}|Select-Object -First 1);if([string]$hr.status.lastHandledReconcileAt -eq $stamp -and $ready.status -eq 'True'){break};Start-Sleep 5}while((Get-Date)-lt $deadline)
          if([string]$hr.status.lastHandledReconcileAt -ne $stamp -or $ready.status -ne 'True'){throw 'rollback Flux reconcile failed'}
          & $env:KUBECTL -n cozy-dashboard rollout status deployment/cozy-dashboard-console --timeout=240s|Out-Host
          $dep=& $env:KUBECTL -n cozy-dashboard get deployment cozy-dashboard-console -o json|ConvertFrom-Json;$image=[string](@($dep.spec.template.spec.containers|Where-Object{$_.name -eq 'console'}|Select-Object -First 1).image)
          if($image -ne [string]$b.deploymentImage){throw "rollback image mismatch expected=$($b.deploymentImage) actual=$image"}
          Write-Host "DASHBOARD_ROLLBACK=PASS image=$image postRenderersPreserved=true"
