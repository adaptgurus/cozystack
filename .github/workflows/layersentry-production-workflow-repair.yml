name: LayerSentry Production Workflow Repair

on:
  push:
    branches: [layersentry-platform]
    paths:
      - .github/workflows/layersentry-production-workflow-repair.yml

permissions:
  contents: write

concurrency:
  group: layersentry-production-workflow-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repair commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Harden production workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/layersentry-vm-production-build.yml')
          s = p.read_text()

          test_anchor = '''      - name: Revalidate repaired operator before image build\n'''
          test_block = '''      - name: Validate dashboard console logic and types\n        shell: bash\n        working-directory: packages/system/dashboard/images/console\n        run: |\n          set -euo pipefail\n          node --version\n          corepack enable\n          corepack prepare pnpm@11.1.2 --activate\n          pnpm install --frozen-lockfile\n          pnpm --filter @cozystack/console test\n          pnpm --filter @cozystack/console typecheck\n          echo "CONSOLE_LOGIC_TYPE_GATE=PASS"\n\n'''
          if 'CONSOLE_LOGIC_TYPE_GATE=PASS' not in s:
              if s.count(test_anchor) != 1:
                  raise SystemExit(f'operator test anchor count={s.count(test_anchor)}')
              s = s.replace(test_anchor, test_block + test_anchor, 1)

          old = '''          git commit -m "ci(layersentry): pin repaired operator VM production certification"\n          git fetch origin layersentry-platform\n          git rebase origin/layersentry-platform\n          git push origin HEAD:layersentry-platform\n'''
          new = '''          git commit -m "ci(layersentry): pin repaired operator VM production certification"\n          # Image/package builds intentionally rewrite tracked values files. The\n          # certification pins above are already committed, so discard only\n          # remaining uncommitted build outputs before the branch-safe rebase.\n          git reset --hard HEAD\n          git clean -fd\n          git fetch origin layersentry-platform\n          git rebase origin/layersentry-platform\n          git push origin HEAD:layersentry-platform\n'''
          if 'remaining uncommitted build outputs' not in s:
              if s.count(old) != 1:
                  raise SystemExit(f'final handoff anchor count={s.count(old)}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          grep -F 'CONSOLE_LOGIC_TYPE_GATE=PASS' .github/workflows/layersentry-vm-production-build.yml >/dev/null
          grep -F 'git reset --hard HEAD' .github/workflows/layersentry-vm-production-build.yml >/dev/null
          grep -F 'git clean -fd' .github/workflows/layersentry-vm-production-build.yml >/dev/null

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/layersentry-production-workflow-repair.yml
          git add .github/workflows/layersentry-vm-production-build.yml
          git config user.name "adaptgurus"
          git config user.email "73125939+adaptgurus@users.noreply.github.com"
          git commit -m "ci(layersentry): harden production certification handoff"
          git fetch origin layersentry-platform
          git rebase origin/layersentry-platform
          git push origin HEAD:layersentry-platform
