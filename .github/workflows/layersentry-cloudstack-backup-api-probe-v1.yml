name: LayerSentry CloudStack Backup API Probe v1

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - hack/layersentry/cloudstack-backup-api-probe-v1-requests/*.json

permissions:
  contents: read

concurrency:
  group: layersentry-live-environment
  cancel-in-progress: false

jobs:
  probe:
    name: Reconcile native CloudStack B&R APIs without mutation
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    env:
      CLOUDSTACK_API_ENDPOINT: http://10.10.10.14:8080/client/api
      CLOUDSTACK_API_KEY: ${{ secrets.LAYERSENTRY_CLOUDSTACK_API_KEY }}
      CLOUDSTACK_SECRET_KEY: ${{ secrets.LAYERSENTRY_CLOUDSTACK_SECRET_KEY }}

    steps:
      - name: Check out exact request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Probe exact B&R API state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $expectedZoneId = '929d1f2c-d629-41ed-96b4-6c48a288d056'
          $expectedZoneName = 'dc'
          $expectedHostId = '3abb80a8-bc4a-48de-bc99-dedc5ac91bf9'
          $endpoint = [Uri]$env:CLOUDSTACK_API_ENDPOINT
          if ([string]::IsNullOrWhiteSpace($env:CLOUDSTACK_API_KEY) -or [string]::IsNullOrWhiteSpace($env:CLOUDSTACK_SECRET_KEY)) { throw 'Scoped CloudStack API credentials are unavailable.' }
          if ($endpoint.AbsoluteUri -cne 'http://10.10.10.14:8080/client/api') { throw 'CloudStack endpoint binding mismatch.' }

          $evidence = Join-Path $env:RUNNER_TEMP "layersentry-backup-api-probe-v1-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $evidence) { Remove-Item -LiteralPath $evidence -Recurse -Force }
          New-Item -Path $evidence -ItemType Directory -Force | Out-Null
          @('LAYERSENTRY_BACKUP_API_PROBE_V1_STARTED',"RUN_ID=$env:GITHUB_RUN_ID","COMMIT=$env:GITHUB_SHA","ZONE_ID=$expectedZoneId") | Set-Content -LiteralPath (Join-Path $evidence 'started.txt') -Encoding UTF8

          [string[]]$changed = @(@(git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA -- 'hack/layersentry/cloudstack-backup-api-probe-v1-requests/*.json') | ForEach-Object { [string]$_ } | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 1) { throw 'Expected exactly one B&R API probe request.' }
          $request = Get-Content -LiteralPath $changed[0].Trim() -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$request.operation -cne 'PROBE_LAYERSENTRY_CLOUDSTACK_BACKUP_APIS_V1' -or [string]$request.authorization -cne 'USER_AUTHORIZED_READ_ONLY_BACKUP_API_RECONCILIATION' -or [string]$request.zoneId -cne $expectedZoneId) { throw 'B&R API probe request mismatch.' }

          function Encode([string]$Value) { return [Uri]::EscapeDataString($Value).Replace('%7E','~') }
          function Invoke-CS([string]$Command,[hashtable]$Parameters=@{}) {
            $allowed=@('listZones','listHosts','listConfigurations','listBackupProviders','listBackupRepositories','listBackupOfferings','listBackups')
            if ($Command -notin $allowed) { throw "Command not allow-listed: $Command" }
            $query=[ordered]@{apikey=$env:CLOUDSTACK_API_KEY;command=$Command;response='json'}
            foreach($name in $Parameters.Keys){$query[[string]$name]=[string]$Parameters[$name]}
            $pairs=@($query.GetEnumerator()|Sort-Object {([string]$_.Key).ToLowerInvariant()}|ForEach-Object {'{0}={1}' -f (Encode ([string]$_.Key)),(Encode ([string]$_.Value))})
            $canonical=(($pairs -join '&').ToLowerInvariant())
            $hmac=New-Object System.Security.Cryptography.HMACSHA1
            try{$hmac.Key=[Text.Encoding]::UTF8.GetBytes($env:CLOUDSTACK_SECRET_KEY);$sig=[Convert]::ToBase64String($hmac.ComputeHash([Text.Encoding]::UTF8.GetBytes($canonical)))}finally{$hmac.Dispose()}
            $uri='{0}?{1}&signature={2}' -f $endpoint.AbsoluteUri,($pairs -join '&'),(Encode $sig)
            return Invoke-RestMethod -Uri $uri -Method Get -TimeoutSec 45 -MaximumRedirection 0 -ErrorAction Stop
          }
          function Payload([object]$Response,[string]$Command){$n="$($Command.ToLowerInvariant())response";$p=$Response.PSObject.Properties[$n];if($null -eq $p){throw "Missing response payload $n"};return $p.Value}
          function Rows([object]$Payload,[string]$Name){$p=$Payload.PSObject.Properties[$Name];if($null -eq $p -or $null -eq $p.Value){return @()};return @($p.Value|Where-Object{$null -ne $_})}
          function Config([string]$Name,[string]$ZoneId=''){$a=@{name=$Name;listall='true'};if($ZoneId){$a.zoneid=$ZoneId};$r=@(Rows (Payload (Invoke-CS 'listConfigurations' $a) 'listConfigurations') 'configuration'|Where-Object{[string]$_.name -ceq $Name});if($r.Count -ne 1){throw "Configuration $Name not unique"};return [string]$r[0].value}

          $zones=@(Rows (Payload (Invoke-CS 'listZones' @{id=$expectedZoneId;listall='true'}) 'listZones') 'zone')
          if($zones.Count -ne 1 -or [string]$zones[0].name -cne $expectedZoneName -or [string]$zones[0].allocationstate -cne 'Enabled'){throw 'Exact DC Zone is not Enabled.'}
          $hosts=@(Rows (Payload (Invoke-CS 'listHosts' @{id=$expectedHostId;listall='true'}) 'listHosts') 'host')
          if($hosts.Count -ne 1 -or [string]$hosts[0].state -cne 'Up' -or [string]$hosts[0].resourcestate -cne 'Enabled'){throw 'Exact KVM host is not Up/Enabled.'}

          $globalEnabled=Config 'backup.framework.enabled'
          $zoneEnabled=Config 'backup.framework.enabled' $expectedZoneId
          $providerConfig=Config 'backup.framework.provider.plugin'
          if($globalEnabled -cne 'true' -or $zoneEnabled -cne 'true' -or $providerConfig -cne 'nas'){throw 'B&R framework configuration is not reconciled.'}

          $results=[ordered]@{}
          $commands=[ordered]@{
            listBackupProviders=@{}
            listBackupRepositories=@{zoneid=$expectedZoneId;page='1';pagesize='100'}
            listBackupOfferings=@{zoneid=$expectedZoneId;page='1';pagesize='100'}
            listBackups=@{zoneid=$expectedZoneId;page='1';pagesize='100'}
          }
          foreach($command in $commands.Keys){
            try{
              $payload=Payload (Invoke-CS $command $commands[$command]) $command
              $results[$command]=[ordered]@{available=$true;count=if($null -ne $payload.PSObject.Properties['count']){[int]$payload.count}else{$null};payload=$payload}
            }catch{
              $results[$command]=[ordered]@{available=$false;error=$_.Exception.Message}
            }
          }
          $results | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $evidence 'backup-api-state.json') -Encoding UTF8
          $failed=@($results.Keys|Where-Object{-not [bool]$results[$_].available})
          if($failed.Count -gt 0){throw "B&R API probe failed: $($failed -join ', ')"}
          @('LAYERSENTRY_BACKUP_API_PROBE_V1_COMPLETE',"RUN_ID=$env:GITHUB_RUN_ID",'MUTATION=false','BACKUP_FRAMEWORK_GLOBAL=true','BACKUP_FRAMEWORK_ZONE=true','BACKUP_PROVIDER_CONFIG=nas','BACKUP_APIS_AVAILABLE=true') | Set-Content -LiteralPath (Join-Path $evidence 'summary.txt') -Encoding UTF8

      - name: Upload B&R API evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layersentry-backup-api-probe-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\layersentry-backup-api-probe-v1-${{ github.run_id }}-${{ github.run_attempt }}\**
          if-no-files-found: error
          retention-days: 30
