name: LayerSentry CloudStack Customer UI Deploy

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - hack/layersentry/cloudstack-customer-ui-deploy-requests/*.json

permissions:
  contents: read

concurrency:
  group: layersentry-cloudstack-customer-ui-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout exact request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Deploy customer-friendly Layersentry UI
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          Import-Module Hyper-V -ErrorAction Stop

          $evidence=Join-Path $env:RUNNER_TEMP 'layersentry-customer-ui-deploy'
          if(Test-Path $evidence){Remove-Item $evidence -Recurse -Force}
          New-Item $evidence -ItemType Directory -Force|Out-Null

          [string[]]$changed=@(@(git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA -- 'hack/layersentry/cloudstack-customer-ui-deploy-requests/*.json')|ForEach-Object{[string]$_}|Where-Object{-not[string]::IsNullOrWhiteSpace($_)})
          if($LASTEXITCODE -ne 0 -or $changed.Count -ne 1){throw 'Expected exactly one customer-UI deployment request.'}
          $r=Get-Content $changed[0].Trim() -Raw -Encoding UTF8|ConvertFrom-Json
          if([string]$r.operation -ne 'DEPLOY_LAYERSENTRY_CUSTOMER_UI'){throw 'Unsupported operation.'}
          if([string]$r.authorization -ne 'USER_AUTHORIZED_LAYERSENTRY_CUSTOMER_UI_DEPLOY'){throw 'Authorization missing.'}
          if([string]$r.expectedAddress -ne '10.10.10.14' -or [string]$r.expectedFqdn -ne 'layersentry.lab.example'){throw 'Target mismatch.'}
          if([string]$r.productRepairCommit -ne '85031bd2e394c16c631b6e493ced1af87c19fbd3'){throw 'Product repair commit mismatch.'}
          if([string]$r.uiCommit -ne '6ce76d6c241629086ffcad794093dbdd5f2dd5ba'){throw 'UI commit mismatch.'}

          $vms=@(Get-VM)
          if($vms.Count -ne 1){throw "Expected exactly one Hyper-V VM; found $($vms.Count)."}
          $vm=$vms[0]
          if($vm.State -ne 'Running'){throw 'Only VM is not running.'}

          $key=Join-Path $env:RUNNER_TEMP 'layersentry-customer-ui-ed25519'
          Remove-Item $key,"$key.pub" -Force -ErrorAction SilentlyContinue
          $comment="layersentry-customer-ui-$env:GITHUB_RUN_ID"
          & cmd.exe /d /s /c "ssh-keygen.exe -q -t ed25519 -N `"`" -C $comment -f `"$key`""
          if($LASTEXITCODE -ne 0){throw 'ssh-keygen failed.'}

          $src=(Resolve-Path 'hack/layersentry/invoke-hyperv-console-command.ps1').ProviderPath
          $patched=Join-Path $env:RUNNER_TEMP 'invoke-customer-ui-console.ps1'
          $helper=Get-Content $src -Raw -Encoding UTF8
          $needle="`$allowedNames = @('sen1', 'sen2', 'sen3')"
          $escaped=$vm.Name.Replace("'","''")
          if(-not $helper.Contains($needle)){throw 'Console helper guard missing.'}
          Set-Content $patched ($helper.Replace($needle,"`$allowedNames = @('$escaped')")) -Encoding UTF8

          $pub=(Get-Content "$key.pub" -Raw -Encoding ASCII).Trim()
          $bootstrap="install -d -m 700 /root/.ssh && echo '$pub' >> /root/.ssh/authorized_keys && chmod 600 /root/.ssh/authorized_keys"
          $req=[ordered]@{requestId="customer-ui-bootstrap-$env:GITHUB_RUN_ID";delayAfterSeconds=3;targets=@([ordered]@{vm=$vm.Name;actions=@([ordered]@{kind='key';code=13},[ordered]@{kind='text';value=$bootstrap},[ordered]@{kind='key';code=13})})}
          $cp=Join-Path $env:RUNNER_TEMP 'customer-ui-console.json'
          $req|ConvertTo-Json -Depth 10|Set-Content $cp -Encoding UTF8
          & $patched -RequestPath $cp -OutputDirectory (Join-Path $evidence 'console-bootstrap')

          $ssh=@('-i',$key,'-o','BatchMode=yes','-o','StrictHostKeyChecking=no','-o','UserKnownHostsFile=NUL','-o','LogLevel=ERROR','-o','ConnectTimeout=10','root@10.10.10.14')
          $ready=$false
          try {
            for($i=1;$i -le 12;$i++){
              $old=$ErrorActionPreference;$ErrorActionPreference='Continue'
              $p=& ssh.exe @ssh 'printf CUSTOMER_UI_READY' 2>&1
              $rc=$LASTEXITCODE
              $ErrorActionPreference=$old
              if($rc -eq 0 -and (($p-join '') -match 'CUSTOMER_UI_READY')){$ready=$true;break}
              Start-Sleep 5
            }
            if(-not $ready){throw 'Ephemeral SSH bootstrap failed.'}

            $old=$ErrorActionPreference;$ErrorActionPreference='Continue'
            & ssh.exe @ssh 'echo =====BUILD-RUNTIME=====; node --version 2>/dev/null || true; npm --version 2>/dev/null || true' 2>&1|Tee-Object -FilePath (Join-Path $evidence 'preflight.txt')
            $ErrorActionPreference=$old

            $scriptUrl='https://raw.githubusercontent.com/adaptgurus/cloudstack/85031bd2e394c16c631b6e493ced1af87c19fbd3/install-layersentry-rocky9-served-ui-repair.sh'
            $remote="curl -fsSL --retry 4 --retry-all-errors --connect-timeout 15 --max-time 120 '$scriptUrl' -o /root/install-layersentry-rocky9-served-ui-repair.sh && chmod 700 /root/install-layersentry-rocky9-served-ui-repair.sh && bash -n /root/install-layersentry-rocky9-served-ui-repair.sh && /root/install-layersentry-rocky9-served-ui-repair.sh"
            $old=$ErrorActionPreference;$ErrorActionPreference='Continue'
            & ssh.exe @ssh $remote 2>&1|Tee-Object -FilePath (Join-Path $evidence 'deploy.txt')
            $rc=$LASTEXITCODE
            $ErrorActionPreference=$old
            if($rc -ne 0){
              $old=$ErrorActionPreference;$ErrorActionPreference='Continue'
              & ssh.exe @ssh "L=`$(ls -1t /var/log/layersentry-served-ui-branding-*.log 2>/dev/null|head -1); echo LOG=`$L; test -z `"`$L`" || tail -n 800 `"`$L`"; echo =====SERVICES=====; systemctl is-active cloudstack-management cloudstack-agent || true" 2>&1|Tee-Object -FilePath (Join-Path $evidence 'failure.txt')
              $ErrorActionPreference=$old
              throw "Customer UI deployment exited $rc."
            }
            if(-not(Select-String (Join-Path $evidence 'deploy.txt') -Pattern 'V1_PLACEHOLDERS=ABSENT' -Quiet)){throw 'V1 placeholder-removal verification marker missing.'}
            if(-not(Select-String (Join-Path $evidence 'deploy.txt') -Pattern '\[100%\] Layersentry V1.0 served-UI branding verified' -Quiet)){throw 'Deployment completion marker missing.'}

            $verify='/root/install-layersentry-rocky9-served-ui-repair.sh --verify-only'
            $old=$ErrorActionPreference;$ErrorActionPreference='Continue'
            & ssh.exe @ssh $verify 2>&1|Tee-Object -FilePath (Join-Path $evidence 'verify.txt')
            $rc=$LASTEXITCODE
            $ErrorActionPreference=$old
            if($rc -ne 0){throw "Read-only runtime verification exited $rc."}
            if(-not(Select-String (Join-Path $evidence 'verify.txt') -Pattern 'TERMINOLOGY=PASS' -Quiet)){throw 'Customer terminology verification marker missing.'}
            if(-not(Select-String (Join-Path $evidence 'verify.txt') -Pattern 'V1_PLACEHOLDERS=ABSENT' -Quiet)){throw 'Read-only V1 placeholder-removal marker missing.'}
            if(-not(Select-String (Join-Path $evidence 'verify.txt') -Pattern '\[100%\] Layersentry V1.0 served-UI branding verified' -Quiet)){throw 'Runtime verification completion marker missing.'}

            & 'hack/layersentry/capture-hyperv-console.ps1' -VmNames @($vm.Name) -OutputDirectory (Join-Path $evidence 'final-console')
          }
          finally {
            if($ready){
              $safe=$comment.Replace("'","")
              $old=$ErrorActionPreference;$ErrorActionPreference='Continue'
              & ssh.exe @ssh "sed -i '/$safe`$/d' /root/.ssh/authorized_keys" 2>&1|Out-Null
              $ErrorActionPreference=$old
            }
            Remove-Item $key,"$key.pub" -Force -ErrorAction SilentlyContinue
          }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layersentry-customer-ui-deploy-${{ github.run_id }}
          path: ${{ runner.temp }}\layersentry-customer-ui-deploy\**
          if-no-files-found: warn
          retention-days: 30
