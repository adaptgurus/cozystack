name: P1 RKE2 Day-2 Live Readonly Validation
on:
  push:
    branches: [ops/p1-rke2-day2-live-20260913]
    paths:
      - .github/workflows/p1-rke2-day2-live.yml
permissions:
  contents: read
concurrency:
  group: layersentry-live-environment
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'adaptgurus/cozystack' && github.actor == 'adaptgurus'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - name: Validate exact Day-2 source and inventory lab through WSL
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'TESTSER' -or $env:COMPUTERNAME -ne 'TESTSER') { throw 'Unexpected runner identity.' }
          $ErrorActionPreference='Continue'
          $sessions=@(& quser.exe opc 2>&1)
          $sessionCode=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          if ($sessionCode -ne 0 -or (($sessions | ForEach-Object { [string]$_ }) -join "`n") -notmatch '(?im)^\s*>?\s*opc\s+') { throw 'Existing opc session is required for the registered WSL distribution.' }
          $user=Get-LocalUser -Name opc
          $work=Join-Path $env:ProgramData "LayerSentry\P1Day2Live\run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $task="LayerSentry-P1Day2Live-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ((Test-Path -LiteralPath $work) -or (Get-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue)) { throw 'Refusing to replace an existing task or directory.' }
          New-Item -ItemType Directory -Path $work | Out-Null
          $registered=$false
          $exitCode=125
          try {
            $acl=[Security.AccessControl.DirectorySecurity]::new()
            $acl.SetAccessRuleProtection($true,$false)
            foreach ($sid in @([Security.Principal.SecurityIdentifier]::new('S-1-5-18'),[Security.Principal.SecurityIdentifier]::new('S-1-5-32-544'),$user.SID)) {
              $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($sid,'FullControl','ContainerInherit,ObjectInherit','None','Allow'))
            }
            Set-Acl -LiteralPath $work -AclObject $acl
            $bash=@'
          #!/usr/bin/env bash
          set -euo pipefail
          umask 077
          work=${1:?working directory required}
          case "$work" in /mnt/c/ProgramData/LayerSentry/P1Day2Live/run-*) ;; *) exit 21;; esac
          trap 'rc=$?; printf "%s\n" "$rc" > "$work/shell-exit-code.txt"' EXIT
          [[ $(id -un) == opc && $(hostname -s | tr '[:upper:]' '[:lower:]') == testser ]] || exit 20
          export PATH="$HOME/.local/bin:/usr/local/go/bin:$PATH"
          echo '=== WSL_IDENTITY ==='
          id
          uname -a
          printf 'wsl_host=%s\n' "$(hostname -s)"
          printf 'go=%s\n' "$(command -v go || true)"
          go version

          echo '=== DAY2_PLATFORM_SOURCE_GATE ==='
          state=/home/opc/.local/state/layersentry-runner
          repo="$state/capabilities/d5db2181-14e4-4ab0-8464-493b643130b9/source/layersentry-platform"
          test -d "$repo/.git"
          expected=aa47337fb5141ade8bcacb9d5251e917d055b740
          git -C "$repo" fetch --no-prune origin layersentry/p1-rke2-day2-production-20260913
          test "$(git -C "$repo" rev-parse 'origin/layersentry/p1-rke2-day2-production-20260913^{commit}')" = "$expected"
          tmp=$(mktemp -d -p /home/opc layersentry-day2-live-XXXXXX)
          cleanup() {
            git -C "$repo" worktree remove --force "$tmp/platform" >/dev/null 2>&1 || true
            rm -rf "$tmp"
          }
          trap 'rc=$?; cleanup; printf "%s\n" "$rc" > "$work/shell-exit-code.txt"' EXIT
          git -C "$repo" worktree add --detach "$tmp/platform" "$expected"
          git -C "$tmp/platform" status --porcelain=v1 --untracked-files=all | tee "$work/platform-dirty.txt"
          test ! -s "$work/platform-dirty.txt"
          (cd "$tmp/platform" && go test -race -count=1 ./...)
          (cd "$tmp/platform" && go vet ./...)
          (cd "$tmp/platform" && go build ./...)
          test -z "$(git -C "$tmp/platform" status --porcelain=v1 --untracked-files=all)"
          echo "PLATFORM_DAY2_SOURCE_GATE=PASS head=$expected"

          echo '=== SSH_ALIAS_RESOLUTION ==='
          for host in rocky-01 rocky-02 rocky-03; do
            echo "--- $host ---"
            ssh -G "$host" 2>/dev/null | awk '$1=="hostname" || $1=="user" || $1=="port" || $1=="proxyjump" {print}'
          done

          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=2)
          echo '=== ROCKY01_OPENNEBULA_READONLY ==='
          ssh "${ssh_opts[@]}" rocky-01 'set -eu; hostname; echo "-- version --"; oneversion || true; echo "-- hosts --"; onehost list; echo "-- vms --"; onevm list; echo "-- clusters --"; onecluster list; echo "-- images --"; oneimage list; echo "-- datastores --"; onedatastore list; echo "-- flow templates --"; oneflow-template list; echo "-- flows --"; oneflow list; echo "-- oneks processes --"; ps -ef | grep -E "[o]neks|[o]ne-server|[o]ned" || true; echo "-- listeners --"; ss -lnt | grep -E ":(2633|2616|2617|2618|9869|80|443)[[:space:]]" || true'

          echo '=== ROCKY02_COMPUTE_READONLY ==='
          ssh "${ssh_opts[@]}" rocky-02 'set -eu; hostname; sudo -n virsh list --all; echo "-- datastore --"; df -hT /var/lib/one/datastores || true; echo "-- addresses --"; ip -brief address'
          echo '=== ROCKY03_COMPUTE_READONLY ==='
          ssh "${ssh_opts[@]}" rocky-03 'set -eu; hostname; sudo -n virsh list --all; echo "-- datastore --"; df -hT /var/lib/one/datastores || true; echo "-- addresses --"; ip -brief address'

          echo 'LIVE_READONLY_LAB_ACCESS=PASS'
          '@
            [IO.File]::WriteAllText((Join-Path $work 'run.sh'),$bash.Replace("`r",'')+"`n",[Text.UTF8Encoding]::new($false))
            $child=@'
          param([string]$Work)
          $ErrorActionPreference='Stop'
          $code=125
          try {
            $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
            $principal=[Security.Principal.WindowsPrincipal]::new($identity)
            if ($identity.Name -ne "$env:COMPUTERNAME\opc" -or -not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'Unexpected child principal.' }
            $linuxWork=($Work -replace '\\','/') -replace '^C:','/mnt/c'
            $ErrorActionPreference='Continue'
            & "$env:WINDIR\System32\wsl.exe" --distribution Ubuntu-22.04 --exec /bin/bash --noprofile --norc "$linuxWork/run.sh" "$linuxWork" 1> (Join-Path $Work 'stdout.log') 2> (Join-Path $Work 'stderr.log')
            $nativeCode=$LASTEXITCODE
            $ErrorActionPreference='Stop'
            $resultFile=Join-Path $Work 'shell-exit-code.txt'
            if (-not (Test-Path -LiteralPath $resultFile)) { throw 'Missing independent shell exit code.' }
            $raw=[IO.File]::ReadAllText($resultFile).Trim()
            if ($raw -notmatch '^\d{1,3}$') { throw 'Invalid shell result.' }
            $code=[int]$raw
            if ($null -eq $nativeCode -or $nativeCode -ne $code) { throw 'Native and shell results disagree.' }
          } catch {
            [IO.File]::WriteAllText((Join-Path $Work 'error.txt'),$_.Exception.Message)
            $code=125
          } finally {
            [IO.File]::WriteAllText((Join-Path $Work 'complete.json'),(@{exit_code=$code;observed_utc=[DateTime]::UtcNow.ToString('o')} | ConvertTo-Json -Compress))
          }
          exit $code
          '@
            $script=Join-Path $work 'run.ps1'
            [IO.File]::WriteAllText($script,$child,[Text.UTF8Encoding]::new($false))
            $action=New-ScheduledTaskAction -Execute "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -Argument "-NoProfile -NonInteractive -File `"$script`" -Work `"$work`""
            $principal=New-ScheduledTaskPrincipal -UserId "$env:COMPUTERNAME\opc" -LogonType Interactive -RunLevel Highest
            $settings=New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 23)
            Register-ScheduledTask -TaskName $task -Action $action -Principal $principal -Settings $settings -Description 'Owner-authorized P1 Day-2 source validation and read-only OpenNebula lab inventory.' | Out-Null
            $registered=$true
            Start-ScheduledTask -TaskName $task
            $deadline=[DateTime]::UtcNow.AddSeconds(1380)
            do {
              Start-Sleep -Seconds 3
              $taskState=(Get-ScheduledTask -TaskName $task).State
              if ((Test-Path -LiteralPath (Join-Path $work 'complete.json')) -and $taskState -ne 'Running') { break }
            } while ([DateTime]::UtcNow -lt $deadline)
            if (-not (Test-Path -LiteralPath (Join-Path $work 'complete.json'))) { throw 'Timed out: reconcile state before any retry.' }
            $report=[IO.File]::ReadAllText((Join-Path $work 'complete.json')) | ConvertFrom-Json
            if ($null -eq $report.exit_code) { throw 'Null exit code is not success.' }
            $exitCode=[int]$report.exit_code
            Write-Host ('P1_DAY2_LIVE_EXECUTION='+($report | ConvertTo-Json -Compress))
          } finally {
            if ($registered) {
              if ((Get-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue).State -eq 'Running') { Stop-ScheduledTask -TaskName $task }
              Unregister-ScheduledTask -TaskName $task -Confirm:$false
            }
            foreach ($file in @('stdout.log','stderr.log','error.txt')) {
              $p=Join-Path $work $file
              if (Test-Path -LiteralPath $p) {
                Write-Host "LOG=$file"
                Get-Content -LiteralPath $p -Tail 1000 | ForEach-Object { $_ -replace '(?i)(gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+)','[REDACTED]' }
              }
            }
            if (Test-Path -LiteralPath $work) { Remove-Item -LiteralPath $work -Recurse -Force }
            Write-Host 'TEMPORARY_WINDOWS_RESOURCES_REMOVED=true; GUEST_MUTATIONS=false; FORCE_PUSH=false; SECRETS_PRINTED=false'
          }
          exit $exitCode
