name: LayerSentry Secure Administrator Initialization

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - hack/layersentry/admin-reset-requests/*.json
      - hack/layersentry/initialize-harvester-admin-v4.ps1
      - .github/workflows/layersentry-initialize-harvester-admin.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layersentry-secure-admin-initialization
  cancel-in-progress: false

jobs:
  initialize:
    name: Securely initialize and verify the Harvester administrator
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25

    steps:
      - name: Checkout exact administrator initialization source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validate authorization request and PowerShell source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [string[]]$requests = @(
            @(git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA -- 'hack/layersentry/admin-reset-requests/*.json') |
              ForEach-Object { [string]$_ } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )
          if ($LASTEXITCODE -ne 0) {
            throw "git diff-tree failed with exit code $LASTEXITCODE"
          }
          if ($requests.Count -eq 0) {
            $latest = Get-ChildItem -LiteralPath 'hack/layersentry/admin-reset-requests' -Filter '*.json' -File |
              Sort-Object LastWriteTimeUtc, Name -Descending |
              Select-Object -First 1
            if ($null -eq $latest) {
              throw 'No administrator initialization authorization request exists.'
            }
            $requests = @($latest.FullName)
          }
          if ($requests.Count -ne 1) {
            throw "Expected exactly one administrator initialization request; found $($requests.Count)."
          }

          $requestPath = ([string]$requests[0]).Trim()
          $request = Get-Content -LiteralPath $requestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$request.operation -ne 'SECURELY_INITIALIZE_HARVESTER_ADMIN') {
            throw "Unsupported operation: $($request.operation)"
          }
          if ([string]$request.authorization -ne 'USER_GRANTED_FULL_POWERSHELL_AND_INSTALL_PERMISSION') {
            throw 'The request is missing the user authorization marker.'
          }
          if ([bool]$request.writeCredentialValuesToEvidence) {
            throw 'Credential values must never be written to evidence.'
          }
          if ([bool]$request.acceptEula) {
            throw 'This workflow must not accept the EULA on behalf of the user.'
          }
          if ([bool]$request.productionReleaseApprovalImplied) {
            throw 'Administrator initialization must not imply production approval.'
          }
          if ([string]$request.clusterUrl -ne 'https://10.10.10.10') {
            throw "Unexpected cluster URL: $($request.clusterUrl)"
          }
          if ([string]$request.nodeAddress -ne '10.10.10.11') {
            throw "Unexpected reset node: $($request.nodeAddress)"
          }

          $tokens = $null
          $errors = $null
          $scriptPath = (Resolve-Path -LiteralPath 'hack/layersentry/initialize-harvester-admin-v4.ps1').ProviderPath
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Error ("{0}:{1}: {2}" -f $scriptPath, $_.Extent.StartLineNumber, $_.Message)
            }
            exit 1
          }
          Write-Host "Validated secure administrator initialization request: $requestPath"

      - name: Initialize administrator through the installed node
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'layersentry-admin-initialization'
          & 'hack/layersentry/initialize-harvester-admin-v4.ps1' `
            -ClusterUrl 'https://10.10.10.10' `
            -NodeAddress '10.10.10.11' `
            -CredentialPath 'C:\ProgramData\LayerSentry\bootstrap-credentials.json' `
            -OutputDirectory $output

      - name: Show sanitized administrator status
        if: always()
        shell: powershell
        run: |
          $status = Join-Path $env:RUNNER_TEMP 'layersentry-admin-initialization\STATUS.md'
          if (Test-Path -LiteralPath $status -PathType Leaf) {
            Get-Content -LiteralPath $status
          }

      - name: Upload sanitized administrator initialization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layersentry-admin-initialization-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\layersentry-admin-initialization\admin-initialization.json
            ${{ runner.temp }}\layersentry-admin-initialization\STATUS.md
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
