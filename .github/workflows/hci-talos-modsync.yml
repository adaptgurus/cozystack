name: HCI Talos Module Sync

on:
  push:
    branches:
      - feat/hci-virtualization-v1.6.2-test

concurrency:
  group: hci-talos-modsync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Go 1.26.5
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.26.5
          cache: true

      - name: Synchronize Talos v1.13.6 dependencies
        shell: bash
        run: |
          set -euo pipefail
          go mod edit -go=1.26.5
          go get github.com/siderolabs/talos/pkg/machinery@v1.13.6
          go mod tidy
          git add go.mod go.sum
          if git diff --cached --quiet; then
            echo 'Talos module graph already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(hci): pin Talos machinery v1.13.6'
          git push origin HEAD:feat/hci-virtualization-v1.6.2-test
