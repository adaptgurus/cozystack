name: LayerSentry Authenticated GUI Acceptance
on:
  push:
    branches: [codex/modules-runtime-validation]
    paths: [.github/workflows/layersentry-authenticated-gui-acceptance.yml]
  workflow_dispatch:
    inputs:
      request_path:
        description: Reviewed public GUI request in hack/layersentry/gui-acceptance-requests/
        required: true
        type: string
      artifact_run_id:
        description: Successful same-repository UI build run
        required: true
        type: string
      artifact_name:
        description: Exact UI deployment artifact name
        required: true
        type: string
      credential_source:
        required: true
        default: protected-personas
        type: choice
        options: [protected-personas, existing-operator]
      dc_fixture_path:
        description: Exact reviewed native DC identity/project receipt, required for DC
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: layersentry-live-environment
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'adaptgurus/cozystack' && github.ref == 'refs/heads/codex/modules-runtime-validation'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate fixed public request and artifact identity
        shell: powershell
        env:
          REQUEST_PATH: ${{ inputs.request_path }}
          ARTIFACT_RUN: ${{ inputs.artifact_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          GH_TOKEN: ${{ github.token }}
          DC_FIXTURE_PATH: ${{ inputs.dc_fixture_path }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:REQUEST_PATH -cnotmatch '^hack/layersentry/gui-acceptance-requests/[A-Za-z0-9_-]+\.json$') {throw 'Request path rejected.'}
          if($env:ARTIFACT_RUN -cnotmatch '^[0-9]+$' -or $env:ARTIFACT_NAME -cnotmatch '^[A-Za-z0-9_-]{1,160}$') {throw 'Artifact input rejected.'}
          $r=Get-Content -LiteralPath $env:REQUEST_PATH -Raw -Encoding UTF8|ConvertFrom-Json
          if($r.target -ceq 'dc' -and $env:DC_FIXTURE_PATH -cnotmatch '^hack/layersentry/gui-acceptance-requests/dc-fixture-[A-Za-z0-9_-]+\.json$') {throw 'Reviewed DC fixture receipt path required.'}
          if([string]$r.artifactRunId -cne $env:ARTIFACT_RUN -or [string]$r.artifactName -cne $env:ARTIFACT_NAME) {throw 'Artifact request binding mismatch.'}
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'}
          $run=Invoke-RestMethod -Uri "https://api.github.com/repos/adaptgurus/cozystack/actions/runs/$env:ARTIFACT_RUN" -Headers $headers -TimeoutSec 30
          if($run.status -cne 'completed' -or $run.conclusion -cne 'success' -or $run.path -cne '.github/workflows/layersentry-module-ui-artifact.yml' -or $run.head_sha -cne '99733f131ea1deb0262f256afc04e7c1bb79c34b' -or $r.cloudstackUiCommit -cne 'dc58f76f67dac13aa886c8d45475944f31b0c039' -or $r.artifactSha256 -cne '131717933f8c7fbe4a4385dfa313abd700ffd016926164d825b6bde86aa90edf') {throw 'Reviewed successful UI build provenance differs.'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
          name: ${{ inputs.artifact_name }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/layersentry-gui-artifact-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Install locked harness and browsers
        shell: powershell
        working-directory: hack/layersentry/gui-acceptance
        run: |
          $ErrorActionPreference='Stop'
          npm ci --ignore-scripts --no-audit --no-fund
          if($LASTEXITCODE -ne 0) {throw 'Harness dependency installation failed.'}
          node node_modules/playwright/cli.js install chrome firefox
          if($LASTEXITCODE -ne 0) {throw 'Browser installation failed.'}
          npm test
          if($LASTEXITCODE -ne 0) {throw 'Harness source qualification failed.'}
      - name: Authenticate and inspect exact served UI without provisioning
        shell: powershell
        env:
          REQUEST_PATH: ${{ inputs.request_path }}
          CREDENTIAL_SOURCE: ${{ inputs.credential_source }}
          DC_FIXTURE_PATH: ${{ inputs.dc_fixture_path }}
          DR_HOST: ${{ secrets.LAYERSENTRY_DR_ROCKY_HOST }}
          DR_USER: ${{ secrets.LAYERSENTRY_DR_ROCKY_USER }}
          DR_KEY: ${{ secrets.LAYERSENTRY_DR_SSH_PRIVATE_KEY }}
          DR_KNOWN_HOSTS: ${{ secrets.LAYERSENTRY_DR_SSH_KNOWN_HOSTS }}
          ROCKY_HOST: ${{ secrets.LAYERSENTRY_ROCKY_R0_HOST }}
          ROCKY_USERNAME: ${{ secrets.LAYERSENTRY_ROCKY_R0_USERNAME }}
          ROCKY_PASSWORD: ${{ secrets.LAYERSENTRY_ROCKY_R0_PASSWORD }}
          DC_KNOWN_HOSTS: ${{ secrets.LAYERSENTRY_DC_SSH_KNOWN_HOSTS }}
          LAYERSENTRY_CLOUDSTACK_USERNAME: ${{ secrets.LAYERSENTRY_CLOUDSTACK_USERNAME }}
          LAYERSENTRY_CLOUDSTACK_PASSWORD: ${{ secrets.LAYERSENTRY_CLOUDSTACK_PASSWORD }}
        run: |
          & ./hack/layersentry/gui-acceptance/invoke-acceptance.ps1 -RequestPath $env:REQUEST_PATH -ArtifactDirectory "$env:RUNNER_TEMP/layersentry-gui-artifact-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" -EvidenceDirectory "$env:RUNNER_TEMP/layersentry-gui-evidence-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" -CredentialSource $env:CREDENTIAL_SOURCE -DcFixtureEvidencePath $env:DC_FIXTURE_PATH
          exit $LASTEXITCODE
      - name: Upload only allowlisted public evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layersentry-gui-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/layersentry-gui-evidence-${{ github.run_id }}-${{ github.run_attempt }}/acceptance.json
            ${{ runner.temp }}/layersentry-gui-evidence-${{ github.run_id }}-${{ github.run_attempt }}/*-module-title.png
          if-no-files-found: warn
          retention-days: 14
