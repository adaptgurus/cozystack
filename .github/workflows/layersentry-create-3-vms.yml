name: LayerSentry Create and Start Three Hyper-V VMs

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - .github/workflows/layersentry-create-3-vms.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layersentry-create-three-hyperv-vms
  cancel-in-progress: false

jobs:
  provision:
    name: Create sen1 sen2 sen3 and boot verified LayerSentry ISO
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    steps:
      - name: Provision and start three LayerSentry test nodes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          Import-Module Hyper-V -ErrorAction Stop

          $outDir = Join-Path $env:RUNNER_TEMP 'layersentry-create-3-vms'
          if (Test-Path -LiteralPath $outDir) {
            Remove-Item -LiteralPath $outDir -Recurse -Force
          }
          New-Item -Path $outDir -ItemType Directory -Force | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "LAYERSENTRY_VM_EVIDENCE_DIR=$outDir"

          $isoPath = 'C:\Users\opc\Downloads\final iso\layersentry-v1.0-amd64.iso'
          $sha512Path = "$isoPath.sha512"
          $expectedSha256 = 'bc1ca4540faa79ebf6c26f185ebd99247b222077c5310541e06a3acbc2bbda1e'
          $expectedSha512 = '886872ab84a93e0aa314d8f38cd2f455488e604574e4cd0f05dbbf3dd1601fed23657b2fbcc6b342d11215fbaac9b65d549c08e8386a916b5c23e6c7742e10fe'
          $switchName = 'Cozystack-NAT'
          $natName = 'Cozystack-NAT'
          $natPrefix = '10.10.10.0/24'
          $hostGateway = '10.10.10.1'
          $vmRootBase = 'C:\Hyper-V\LayerSentry'
          $vmNames = @('sen1', 'sen2', 'sen3')
          $startDelays = @{ sen1 = 0; sen2 = 45; sen3 = 90 }
          $addressPlan = @{
            sen1 = '10.10.10.11/24'
            sen2 = '10.10.10.12/24'
            sen3 = '10.10.10.13/24'
          }

          function Save-FailureEvidence {
            param([string]$Message)
            [pscustomobject]@{
              CollectedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
              Host = $env:COMPUTERNAME
              Error = $Message
              ExistingVMs = @(Get-VM -ErrorAction SilentlyContinue | Select-Object Name, State)
              FreeMemoryGiB = [math]::Round(((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB), 2)
              CDriveFreeGiB = [math]::Round(((Get-Volume -DriveLetter C).SizeRemaining / 1GB), 2)
            } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $outDir 'failure.json') -Encoding UTF8
          }

          try {
            if (-not (Test-Path -LiteralPath $isoPath -PathType Leaf)) {
              throw "LayerSentry ISO not found: $isoPath"
            }
            if (-not (Test-Path -LiteralPath $sha512Path -PathType Leaf)) {
              throw "LayerSentry ISO SHA-512 sidecar not found: $sha512Path"
            }

            $actualSha256 = (Get-FileHash -LiteralPath $isoPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $expectedSha256) {
              throw "ISO SHA-256 mismatch. Expected $expectedSha256 but found $actualSha256"
            }

            $sidecar = [System.IO.File]::ReadAllText($sha512Path).Trim()
            if ($sidecar -notmatch '^(?<hash>[0-9A-Fa-f]{128})\s+.+$') {
              throw 'ISO SHA-512 sidecar is not in sha512sum format.'
            }
            $sidecarSha512 = $Matches['hash'].ToLowerInvariant()
            $actualSha512 = (Get-FileHash -LiteralPath $isoPath -Algorithm SHA512).Hash.ToLowerInvariant()
            if ($sidecarSha512 -ne $expectedSha512 -or $actualSha512 -ne $expectedSha512) {
              throw 'ISO SHA-512 verification failed.'
            }

            $vmms = Get-Service -Name vmms -ErrorAction Stop
            if ($vmms.Status -ne 'Running') {
              throw "Hyper-V VMMS is $($vmms.Status), not Running."
            }

            $switch = Get-VMSwitch -Name $switchName -ErrorAction Stop
            if ([string]$switch.SwitchType -ne 'Internal') {
              throw "Switch $switchName is not an Internal Hyper-V switch."
            }

            $nat = Get-NetNat -Name $natName -ErrorAction Stop
            if ($nat.InternalIPInterfaceAddressPrefix -ne $natPrefix) {
              throw "NAT $natName uses $($nat.InternalIPInterfaceAddressPrefix), expected $natPrefix."
            }

            $gatewayAddress = Get-NetIPAddress -AddressFamily IPv4 -IPAddress $hostGateway -ErrorAction Stop
            if ($gatewayAddress.PrefixLength -ne 24) {
              throw "Host NAT gateway $hostGateway does not use prefix length 24."
            }

            $existingNames = @()
            foreach ($name in $vmNames) {
              if (Get-VM -Name $name -ErrorAction SilentlyContinue) {
                $existingNames += $name
              }
            }
            if ($existingNames.Count -gt 0) {
              throw "Refusing to overwrite existing VMs: $($existingNames -join ', ')"
            }

            $computer = Get-CimInstance Win32_ComputerSystem -ErrorAction Stop
            $operatingSystem = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
            $volumeC = Get-Volume -DriveLetter C -ErrorAction Stop
            $totalMemoryGiB = [math]::Round(($computer.TotalPhysicalMemory / 1GB), 2)
            $freeMemoryGiBBefore = [math]::Round(($operatingSystem.FreePhysicalMemory / 1MB), 2)
            $freeStorageGiBBefore = [math]::Round(($volumeC.SizeRemaining / 1GB), 2)

            if ($freeMemoryGiBBefore -lt 98) {
              throw "Less than 98 GiB free RAM is available before starting the three static-memory VMs: $freeMemoryGiBBefore GiB"
            }
            if ($freeStorageGiBBefore -lt 100) {
              throw "Less than 100 GiB physical free storage is available for dynamic VHDX creation: $freeStorageGiBBefore GiB"
            }

            New-Item -Path $vmRootBase -ItemType Directory -Force | Out-Null
            $created = New-Object System.Collections.Generic.List[string]

            foreach ($name in $vmNames) {
              $vmBase = Join-Path $vmRootBase $name
              $vhdDirectory = Join-Path $vmBase 'Virtual Hard Disks'
              $osDiskPath = Join-Path $vhdDirectory "$name-os.vhdx"
              $dataDiskPath = Join-Path $vhdDirectory "$name-data.vhdx"

              New-Item -Path $vhdDirectory -ItemType Directory -Force | Out-Null
              if ((Test-Path -LiteralPath $osDiskPath) -or (Test-Path -LiteralPath $dataDiskPath)) {
                throw "Refusing to overwrite an existing VHDX for $name in $vhdDirectory"
              }

              New-VM -Name $name -Generation 2 -Path $vmBase `
                -MemoryStartupBytes 32GB `
                -NewVHDPath $osDiskPath -NewVHDSizeBytes 100GB `
                -SwitchName $switchName | Out-Null

              $created.Add($name)
              Set-VMProcessor -VMName $name -Count 10 -ExposeVirtualizationExtensions $true
              Set-VMMemory -VMName $name -DynamicMemoryEnabled $false -StartupBytes 32GB
              Set-VM -Name $name `
                -AutomaticCheckpointsEnabled $false `
                -CheckpointType Disabled `
                -AutomaticStartAction Start `
                -AutomaticStartDelay $startDelays[$name] `
                -AutomaticStopAction ShutDown
              Set-VMFirmware -VMName $name -EnableSecureBoot Off
              Set-VMNetworkAdapter -VMName $name `
                -MacAddressSpoofing On `
                -DhcpGuard Off `
                -RouterGuard Off

              New-VHD -Path $dataDiskPath -Dynamic -SizeBytes 300GB | Out-Null
              Add-VMHardDiskDrive -VMName $name -ControllerType SCSI -Path $dataDiskPath
              $dvd = Add-VMDvdDrive -VMName $name -Path $isoPath -Passthru
              Set-VMFirmware -VMName $name -FirstBootDevice $dvd

              Set-VM -Name $name -Notes @"
LayerSentry v1.0 POC node
Embedded platform target: Harvester v1.8.2
Planned node IP: $($addressPlan[$name])
Cluster VIP plan: 10.10.10.10
Gateway: 10.10.10.1
ISO SHA-256: $expectedSha256
Provisioned by GitHub Actions run $env:GITHUB_RUN_ID
"@
            }

            $startFailures = New-Object System.Collections.Generic.List[string]
            foreach ($name in $vmNames) {
              try {
                Start-VM -Name $name -ErrorAction Stop | Out-Null
                $deadline = (Get-Date).AddMinutes(3)
                do {
                  Start-Sleep -Seconds 3
                  $state = (Get-VM -Name $name -ErrorAction Stop).State
                } while ($state -ne 'Running' -and (Get-Date) -lt $deadline)

                if ($state -ne 'Running') {
                  throw "VM did not reach Running state; current state is $state"
                }
                Start-Sleep -Seconds 15
              }
              catch {
                $startFailures.Add("$name: $($_.Exception.Message)")
              }
            }

            $vmEvidence = foreach ($name in $vmNames) {
              $vm = Get-VM -Name $name -ErrorAction Stop
              $processor = Get-VMProcessor -VMName $name -ErrorAction Stop
              $memory = Get-VMMemory -VMName $name -ErrorAction Stop
              $firmware = Get-VMFirmware -VMName $name -ErrorAction Stop
              $network = Get-VMNetworkAdapter -VMName $name -ErrorAction Stop
              $disks = foreach ($drive in @(Get-VMHardDiskDrive -VMName $name -ErrorAction Stop)) {
                $vhd = Get-VHD -Path $drive.Path -ErrorAction Stop
                [pscustomobject]@{
                  Path = $drive.Path
                  ControllerType = [string]$drive.ControllerType
                  ControllerNumber = $drive.ControllerNumber
                  ControllerLocation = $drive.ControllerLocation
                  VhdType = [string]$vhd.VhdType
                  VirtualSizeGiB = [math]::Round(($vhd.Size / 1GB), 2)
                  FileSizeGiB = [math]::Round(($vhd.FileSize / 1GB), 4)
                }
              }
              $dvdDrive = Get-VMDvdDrive -VMName $name -ErrorAction Stop
              [pscustomobject]@{
                Name = $name
                State = [string]$vm.State
                Status = $vm.Status
                Generation = [int]$vm.Generation
                Version = [string]$vm.Version
                VCPU = $processor.Count
                ExposeVirtualizationExtensions = $processor.ExposeVirtualizationExtensions
                StartupMemoryGiB = [math]::Round(($memory.Startup / 1GB), 2)
                DynamicMemoryEnabled = $memory.DynamicMemoryEnabled
                SecureBoot = [string]$firmware.SecureBoot
                AutomaticStartAction = [string]$vm.AutomaticStartAction
                AutomaticStartDelaySeconds = $vm.AutomaticStartDelay
                AutomaticStopAction = [string]$vm.AutomaticStopAction
                CheckpointType = [string]$vm.CheckpointType
                PlannedNodeAddress = $addressPlan[$name]
                PlannedClusterVip = '10.10.10.10'
                Network = [pscustomobject]@{
                  SwitchName = $network.SwitchName
                  Status = [string]$network.Status
                  Connected = $network.Connected
                  MacAddress = $network.MacAddress
                  MacAddressSpoofing = [string]$network.MacAddressSpoofing
                  IPAddresses = @($network.IPAddresses)
                }
                HardDisks = @($disks)
                DVD = [pscustomobject]@{
                  Path = $dvdDrive.Path
                  ControllerNumber = $dvdDrive.ControllerNumber
                  ControllerLocation = $dvdDrive.ControllerLocation
                }
              }
            }

            $freeMemoryGiBAfter = [math]::Round(((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB), 2)
            $freeStorageGiBAfter = [math]::Round(((Get-Volume -DriveLetter C).SizeRemaining / 1GB), 2)
            $report = [pscustomobject]@{
              SchemaVersion = '1.0'
              CollectedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
              Operation = 'create-and-start-three-hyperv-vms'
              AuthorizedByUser = $true
              Host = [pscustomobject]@{
                ComputerName = $env:COMPUTERNAME
                TotalMemoryGiB = $totalMemoryGiB
                FreeMemoryGiBBefore = $freeMemoryGiBBefore
                FreeMemoryGiBAfter = $freeMemoryGiBAfter
                FreeStorageGiBBefore = $freeStorageGiBBefore
                FreeStorageGiBAfter = $freeStorageGiBAfter
              }
              CapacityRisk = [pscustomobject]@{
                StaticVmMemoryTotalGiB = 96
                MaximumVirtualDiskCapacityGiB = 1200
                HostMemoryReserveRiskAccepted = $true
                DynamicVhdxFullGrowthRiskAccepted = $true
              }
              NetworkPlan = [pscustomobject]@{
                Switch = $switchName
                Nat = $natName
                Prefix = $natPrefix
                Gateway = $hostGateway
                Vip = '10.10.10.10'
                Nodes = $addressPlan
              }
              ISO = [pscustomobject]@{
                Path = $isoPath
                LengthBytes = (Get-Item -LiteralPath $isoPath).Length
                Sha256 = $actualSha256
                Sha512 = $actualSha512
                SidecarMatched = $true
                Classification = 'POC_CANDIDATE_NOT_PRODUCTION_APPROVED'
              }
              VirtualMachines = @($vmEvidence)
              StartFailures = @($startFailures)
              AllRunning = (@($vmEvidence | Where-Object State -ne 'Running').Count -eq 0)
              InstallationPerformed = $false
              RuntimeQualified = $false
              ReleaseApproved = $false
            }

            $jsonPath = Join-Path $outDir 'layersentry-three-vm-provisioning.json'
            $summaryPath = Join-Path $outDir 'layersentry-three-vm-provisioning.txt'
            $report | ConvertTo-Json -Depth 15 | Set-Content -LiteralPath $jsonPath -Encoding UTF8

            $summary = @(
              'LayerSentry three-VM Hyper-V provisioning'
              "Host: $env:COMPUTERNAME"
              "ISO: $isoPath"
              "ISO SHA-256: $actualSha256"
              "VMs created: $($created -join ', ')"
              "All VMs running: $($report.AllRunning)"
              "Free RAM before/after: $freeMemoryGiBBefore / $freeMemoryGiBAfter GiB"
              "Free C drive before/after: $freeStorageGiBBefore / $freeStorageGiBAfter GiB"
              ''
              ($vmEvidence | Select-Object Name, State, Generation, VCPU, StartupMemoryGiB, DynamicMemoryEnabled, ExposeVirtualizationExtensions, SecureBoot, PlannedNodeAddress |
                Format-Table -AutoSize | Out-String -Width 300)
              'Installation has not been confirmed. The VMs are booting the candidate ISO.'
              'Production approval remains false.'
            )
            $summary | Set-Content -LiteralPath $summaryPath -Encoding UTF8

            $hashLines = foreach ($file in @(Get-ChildItem -LiteralPath $outDir -File)) {
              $hash = Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256
              "$($hash.Hash.ToLowerInvariant())  $($file.Name)"
            }
            $hashLines | Set-Content -LiteralPath (Join-Path $outDir 'SHA256SUMS.txt') -Encoding ASCII
            Get-Content -LiteralPath $summaryPath

            if ($startFailures.Count -gt 0) {
              throw "One or more VMs failed to start: $($startFailures -join '; ')"
            }
            if (-not $report.AllRunning) {
              throw 'Not all three VMs are in Running state.'
            }
          }
          catch {
            Save-FailureEvidence -Message $_.Exception.Message
            throw
          }

      - name: Upload VM provisioning evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layersentry-create-3-vms-${{ github.run_id }}
          path: ${{ env.LAYERSENTRY_VM_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
