name: LayerSentry Keycloak User Live

on:
  workflow_dispatch:
  push:
    branches:
      - layersentry-platform
    paths:
      - .github/workflows/layersentry-keycloak-user-live.yml

permissions:
  contents: read

defaults:
  run:
    shell: powershell

jobs:
  discover-keycloak-user-api:
    name: Discover native Keycloak user management on TESTSER
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    env:
      KUBECONFIG: C:\hci-state\cozystack-hci-lab\kubeconfig
      KUBECTL: C:\hci-tools\kubectl.exe
    steps:
      - name: Validate Keycloak and discover user CRDs
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($hr in @('keycloak-operator','keycloak','keycloak-configure')) {
            & $env:KUBECTL wait --for=condition=Ready "helmrelease/$hr" -n cozy-keycloak --timeout=120s
            if ($LASTEXITCODE -ne 0) { throw "Keycloak HelmRelease $hr is not Ready" }
          }
          Write-Host '=== Keycloak API resources ==='
          & $env:KUBECTL api-resources | Select-String -Pattern 'keycloak' -CaseSensitive:$false
          Write-Host '=== Keycloak CRDs ==='
          & $env:KUBECTL get crd -o name | Select-String -Pattern 'keycloak' -CaseSensitive:$false
          Write-Host '=== Keycloak workloads (names/images only) ==='
          & $env:KUBECTL get pods -n cozy-keycloak -o custom-columns='NAME:.metadata.name,IMAGE:.spec.containers[0].image' --no-headers
          Write-Host '=== Keycloak secret names only ==='
          & $env:KUBECTL get secret -n cozy-keycloak -o name
          $userCrds = @(& $env:KUBECTL get crd -o name | Select-String -Pattern 'user.*keycloak|keycloak.*user' -CaseSensitive:$false | ForEach-Object { $_.Line.Trim() })
          foreach ($crdName in $userCrds) {
            Write-Host "=== Schema for $crdName ==="
            & $env:KUBECTL explain ($crdName -replace '^customresourcedefinition.apiextensions.k8s.io/','') --recursive | Select-Object -First 220
          }
