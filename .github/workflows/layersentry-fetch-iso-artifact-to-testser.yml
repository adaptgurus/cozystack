name: LayerSentry Fetch Original ISO Artifact to TESTSER

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - .github/workflows/layersentry-fetch-iso-artifact-to-testser.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: layersentry-fetch-original-iso-to-testser
  cancel-in-progress: false

jobs:
  fetch:
    name: Download original successful ISO artifact and restore target path
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    env:
      TARGET_ISO: C:\Users\opc\Downloads\final iso\layersentry-v1.0-amd64.iso
      EXPECTED_SHA256: bc1ca4540faa79ebf6c26f185ebd99247b222077c5310541e06a3acbc2bbda1e

    steps:
      - name: Detect an already verified target ISO
        id: preflight
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $alreadyValid = $false
          if (Test-Path -LiteralPath $env:TARGET_ISO -PathType Leaf) {
            $existing = Get-Item -LiteralPath $env:TARGET_ISO
            $existingSha256 = (Get-FileHash -LiteralPath $env:TARGET_ISO -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "Existing target bytes: $($existing.Length)"
            Write-Host "Existing target SHA-256: $existingSha256"
            $alreadyValid = $existingSha256 -ceq $env:EXPECTED_SHA256
          }

          "already-valid=$($alreadyValid.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Already verified: $alreadyValid"

      - name: Download original LayerSentry ISO artifact
        if: steps.preflight.outputs.already-valid != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: layersentry-v1.0-amd64-offline-iso
          path: ${{ runner.temp }}\layersentry-original-iso
          github-token: ${{ github.token }}
          repository: adaptgurus/harvester-installer
          run-id: '33379774526'

      - name: Verify and place ISO in requested directory
        shell: powershell
        env:
          ALREADY_VALID: ${{ steps.preflight.outputs.already-valid }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $sourceRoot = Join-Path $env:RUNNER_TEMP 'layersentry-original-iso'
          $targetDirectory = Split-Path -Parent $env:TARGET_ISO
          New-Item -ItemType Directory -Force -Path $targetDirectory | Out-Null

          if ($env:ALREADY_VALID -cne 'true') {
            if (-not (Test-Path -LiteralPath $sourceRoot -PathType Container)) {
              throw "Downloaded artifact directory is missing: $sourceRoot"
            }

            $isoCandidates = @(
              Get-ChildItem -LiteralPath $sourceRoot -Filter '*.iso' -File -Recurse -ErrorAction Stop |
                Sort-Object Length -Descending
            )
            if ($isoCandidates.Count -eq 0) {
              throw 'The original workflow artifact contains no ISO file.'
            }

            $matchingIso = $null
            foreach ($candidate in $isoCandidates) {
              $hash = (Get-FileHash -LiteralPath $candidate.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Host "Candidate: $($candidate.FullName)"
              Write-Host "Bytes: $($candidate.Length)"
              Write-Host "SHA-256: $hash"
              if ($hash -ceq $env:EXPECTED_SHA256) {
                $matchingIso = $candidate
                break
              }
            }
            if ($null -eq $matchingIso) {
              throw "Artifact downloaded successfully, but no ISO matches expected SHA-256 $env:EXPECTED_SHA256. Refusing to install an unverified image."
            }

            $partial = "$($env:TARGET_ISO).partial"
            Remove-Item -LiteralPath $partial -Force -ErrorAction SilentlyContinue
            Copy-Item -LiteralPath $matchingIso.FullName -Destination $partial -Force
            $partialHash = (Get-FileHash -LiteralPath $partial -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($partialHash -cne $env:EXPECTED_SHA256) {
              Remove-Item -LiteralPath $partial -Force -ErrorAction SilentlyContinue
              throw "Copied ISO hash mismatch: $partialHash"
            }
            Move-Item -LiteralPath $partial -Destination $env:TARGET_ISO -Force
          }

          $final = Get-Item -LiteralPath $env:TARGET_ISO -ErrorAction Stop
          $sha256 = (Get-FileHash -LiteralPath $env:TARGET_ISO -Algorithm SHA256).Hash.ToLowerInvariant()
          $sha512 = (Get-FileHash -LiteralPath $env:TARGET_ISO -Algorithm SHA512).Hash.ToLowerInvariant()
          if ($sha256 -cne $env:EXPECTED_SHA256) {
            throw 'Final target ISO failed SHA-256 verification.'
          }

          "$sha256 *layersentry-v1.0-amd64.iso" | Set-Content -LiteralPath "$($env:TARGET_ISO).sha256" -Encoding ASCII
          "$sha512 *layersentry-v1.0-amd64.iso" | Set-Content -LiteralPath "$($env:TARGET_ISO).sha512" -Encoding ASCII

          Write-Host 'LAYERSENTRY ISO PLACEMENT: PASS'
          Write-Host "Target: $($env:TARGET_ISO)"
          Write-Host "Bytes: $($final.Length)"
          Write-Host "SHA-256: $sha256"
          Write-Host "SHA-512: $sha512"
