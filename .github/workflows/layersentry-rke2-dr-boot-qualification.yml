name: LayerSentry RKE2 candidate DR boot qualification
on:
  workflow_dispatch:
    inputs:
      image-run:
        required: true
        type: string
      image-artifact:
        required: true
        type: string
      image-source:
        required: true
        type: string
      image-sha256:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: layersentry-live-environment
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'adaptgurus/cozystack'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    env:
      BOOT_SOURCE: e96e9b8d211d39bcde00704cda70b22f347d1f07
      IMAGE_RUN: ${{ inputs.image-run }}
      IMAGE_ARTIFACT: ${{ inputs.image-artifact }}
      IMAGE_SOURCE: ${{ inputs.image-source }}
      IMAGE_SHA256: ${{ inputs.image-sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Bind successful source build and immutable artifact
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:IMAGE_RUN -cnotmatch '^[0-9]{1,20}$' -or $env:IMAGE_ARTIFACT -cnotmatch '^[0-9]{1,20}$' -or $env:IMAGE_SOURCE -cnotmatch '^[0-9a-f]{40}$' -or $env:IMAGE_SHA256 -cnotmatch '^[0-9a-f]{64}$') { throw 'Exact immutable inputs required.' }
          $headers = @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'}
          $base = 'https://api.github.com/repos/adaptgurus/cloudstack/actions'
          $run = Invoke-RestMethod -Uri "$base/runs/$env:IMAGE_RUN" -Headers $headers -TimeoutSec 30
          if ($run.head_sha -cne $env:IMAGE_SOURCE -or $run.head_branch -cne 'codex/k8s-artifact-completion' -or $run.conclusion -cne 'success' -or $run.path -cne '.github/workflows/layersentry-rke2-cpu-image-build.yml') { throw 'Build identity or result mismatch.' }
          $artifact = Invoke-RestMethod -Uri "$base/artifacts/$env:IMAGE_ARTIFACT" -Headers $headers -TimeoutSec 30
          if ([string]$artifact.workflow_run.id -cne $env:IMAGE_RUN -or $artifact.expired -or $artifact.name -cne "layersentry-rke2-cpu-image-$env:IMAGE_SOURCE-$($run.run_attempt)") { throw 'Artifact identity mismatch.' }
          if ($artifact.digest -cnotmatch '^sha256:[0-9a-f]{64}$' -or $artifact.size_in_bytes -gt 10737418240) { throw 'Artifact digest or size invalid.' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: adaptgurus/cloudstack
          run-id: ${{ inputs.image-run }}
          artifact-ids: ${{ inputs.image-artifact }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/layersentry-cpu-candidate-${{ github.run_id }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: adaptgurus/cloudstack
          ref: e96e9b8d211d39bcde00704cda70b22f347d1f07
          path: candidate-source
          persist-credentials: false
      - name: Boot exact candidate through verified DR SSH
        shell: powershell
        env:
          DR_HOST: ${{ secrets.LAYERSENTRY_DR_ROCKY_HOST }}
          DR_USER: ${{ secrets.LAYERSENTRY_DR_ROCKY_USER }}
          DR_KEY: ${{ secrets.LAYERSENTRY_DR_SSH_PRIVATE_KEY }}
          DR_KNOWN_HOSTS: ${{ secrets.LAYERSENTRY_DR_SSH_KNOWN_HOSTS }}
        run: ./hack/layersentry/invoke-rke2-dr-boot-qualification.ps1
      - name: Preserve bounded boot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layersentry-rke2-dr-boot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/layersentry-rke2-dr-boot-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
