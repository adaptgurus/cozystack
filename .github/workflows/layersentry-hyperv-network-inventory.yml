name: LayerSentry Hyper-V Network Inventory

on:
  push:
    branches: [ops/layersentry-hyperv-inventory]
    paths:
      - hack/layersentry/network-inventory-actions/*.json

permissions:
  contents: read

concurrency:
  group: layersentry-live-environment
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Collect read-only switch and NAT state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          Import-Module Hyper-V -ErrorAction Stop
          $evidence = Join-Path $env:RUNNER_TEMP "network-inventory-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $evidence -ErrorAction Stop | Out-Null
          $report = [ordered]@{
            status = 'LIVE_VERIFIED'
            mutationPerformed = $false
            host = $env:COMPUTERNAME
            switches = @(Get-VMSwitch | Select-Object Name, Id, SwitchType, AllowManagementOS)
            adapters = @(Get-NetAdapter | Where-Object Name -like 'vEthernet*' | Select-Object Name, InterfaceIndex, Status, MacAddress)
            addresses = @(Get-NetIPAddress -AddressFamily IPv4 | Select-Object InterfaceAlias, InterfaceIndex, IPAddress, PrefixLength, AddressState)
            routes = @(Get-NetRoute -AddressFamily IPv4 | Select-Object InterfaceAlias, InterfaceIndex, DestinationPrefix, NextHop, RouteMetric, State)
            nats = @(Get-NetNat -ErrorAction SilentlyContinue | Select-Object Name, InternalIPInterfaceAddressPrefix, Active, Store)
            mappings = @(Get-NetNatStaticMapping -ErrorAction SilentlyContinue | Select-Object NatName, Protocol, ExternalIPAddress, ExternalPort, InternalIPAddress, InternalPort)
            vmNics = @(Get-VMNetworkAdapter -All | Select-Object VMName, Name, Id, SwitchName, SwitchId, Status, MacAddress, IPAddresses)
          }
          $report | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $evidence 'network-inventory.json') -Encoding UTF8
      - name: Upload sanitized network inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: network-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/network-inventory-${{ github.run_id }}/network-inventory.json
          if-no-files-found: error
          retention-days: 30
