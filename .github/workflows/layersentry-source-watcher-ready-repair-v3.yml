name: LayerSentry Source Watcher Ready Repair V3

on:
  push:
    branches: [layersentry-platform]
    paths:
      - .github/workflows/layersentry-source-watcher-ready-repair-v3.yml

permissions:
  contents: write

concurrency:
  group: layersentry-source-watcher-ready-repair-v3
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: layersentry-platform
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply reviewed repair with v2.0.3 API correction
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml <<'RUBY'
          doc = YAML.load_file('.github/workflows/layersentry-source-watcher-ready-repair-dev.yml')
          steps = doc.fetch('jobs').fetch('patch-test-commit').fetch('steps')
          step = steps.find { |s| s['name'] == 'Apply proof-based lost Ready repair' }
          abort 'reviewed repair step missing' unless step && step['run']
          script = step['run'].dup

          old_guard = 'if ag.Spec.PathPattern != "" || len(ag.Spec.OutputArtifacts) == 0 {'
          new_guard = 'if len(ag.Spec.OutputArtifacts) == 0 {'
          abort 'PathPattern guard anchor missing' unless script.sub!(old_guard, new_guard)

          before = script.dup
          script.sub!(/\n\s*t\.Run\("dynamic pathPattern is never auto repaired".*?\n\s*\}\)\n/m, "\n")
          abort 'PathPattern test anchor missing' if script == before

          File.write('/tmp/apply-ready-repair.sh', "set -euo pipefail\n" + script)
          RUBY
          bash /tmp/apply-ready-repair.sh

          python3 - <<'PY'
          from pathlib import Path
          p=Path('internal/operator/packagesource_ready_repair.go')
          s=p.read_text()
          s=s.replace(
              '// PackageSource-generated AGs use fixed output names. Dynamic pathPattern\n\t// expansion does not have a one-to-one spec/inventory cardinality, so do\n\t// not auto-repair it without a stronger proof model.\n',
              '// PackageSource-generated ArtifactGenerators in the pinned v2.0.3 API\n\t// use fixed OutputArtifacts, which gives a one-to-one proof surface.\n'
          )
          p.write_text(s)
          PY
          gofmt -w internal/operator/packagesource_ready_repair.go
          go test ./internal/operator -count=1

      - name: Commit tested repair without validation workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/layersentry-source-watcher-ready-repair-dev.yml
          git rm .github/workflows/layersentry-source-watcher-ready-repair-v2.yml
          git rm .github/workflows/layersentry-source-watcher-ready-repair-v3.yml
          git add internal/operator/packagesource_reconciler.go internal/operator/packagesource_ready_repair.go internal/operator/packagesource_ready_repair_test.go
          git config user.name "adaptgurus"
          git config user.email "73125939+adaptgurus@users.noreply.github.com"
          git commit -m "fix(operator): recover proven source-watcher lost Ready"
          for attempt in 1 2 3; do
            git fetch origin layersentry-platform
            git rebase origin/layersentry-platform
            go test ./internal/operator -count=1
            if git push origin HEAD:layersentry-platform; then
              exit 0
            fi
          done
          echo "failed to push tested repair after concurrent updates" >&2
          exit 1
