name: HCI v1.6.2 Gate

on:
  push:
    branches:
      - feat/hci-virtualization-v1.6.2-test
  workflow_dispatch:

concurrency:
  group: hci-v1.6.2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hci-gate:
    name: Go and Helm HCI validation
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout code and tags
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Helm
        uses: Azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.18.6

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.1.2

      - name: Test VM template safety backend and transaction controller
        run: go test ./pkg/vmtemplate ./pkg/vmtemplatecontroller

      - name: Test VM Template product charts and generated schema parity
        shell: bash
        run: |
          set -euo pipefail
          helm lint packages/apps/vm-template --set sourceVM=source-vm
          helm unittest packages/apps/vm-template
          helm lint packages/system/vm-template-crd
          helm lint packages/system/vm-template-controller
          helm lint packages/system/vm-template-rd
          helm template vm-template packages/apps/vm-template --namespace tenant-test --set sourceVM=source-vm > /tmp/vm-template.yaml
          grep -q 'kind: VMTemplateOperation' /tmp/vm-template.yaml
          grep -q 'sourceVM: "source-vm"' /tmp/vm-template.yaml
          grep -q 'scope: Tenant' /tmp/vm-template.yaml
          grep -q 'requireHalted: true' /tmp/vm-template.yaml
          grep -q 'name: cozystack.vm-template-application' packages/core/platform/sources/vm-template-application.yaml
          grep -q 'cozystack.vm-template-application' packages/core/platform/templates/bundles/iaas-vm-template.yaml
          python3 - <<'PY'
          import json
          from pathlib import Path

          src = json.loads(Path('packages/apps/vm-template/values.schema.json').read_text())
          lines = Path('packages/system/vm-template-rd/cozyrds/vm-template.yaml').read_text().splitlines()
          for i, line in enumerate(lines):
              if line.strip() == 'openAPISchema: |-':
                  generated = json.loads(lines[i + 1].strip())
                  break
          else:
              raise SystemExit('VMTemplate ApplicationDefinition has no openAPISchema')
          if src != generated:
              raise SystemExit('VMTemplate generated ApplicationDefinition schema drift')
          if src['properties']['sourceVM']['x-cozystack-options']['source'] != 'vminstance':
              raise SystemExit('VMTemplate sourceVM is not wired to tenant VMInstance options')
          PY

      - name: Run HCI v1.6.2 gate
        run: ./hack/test-hci-v1.6.2.sh
