name: LayerSentry Prepare Protected Web Admin Password

on:
  workflow_dispatch:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - .github/workflows/layersentry-prepare-admin-password.yml

permissions:
  contents: read

concurrency:
  group: layersentry-prepare-admin-password
  cancel-in-progress: false

jobs:
  prepare:
    name: Generate and protect the LayerSentry web administrator password
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Prepare a separate protected web administrator password
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $credentialPath = 'C:\ProgramData\LayerSentry\bootstrap-credentials.json'
          $output = Join-Path $env:RUNNER_TEMP 'layersentry-admin-password-preparation'
          New-Item -Path $output -ItemType Directory -Force | Out-Null

          if (-not (Test-Path -LiteralPath $credentialPath -PathType Leaf)) {
            throw "Protected bootstrap credential file is missing: $credentialPath"
          }

          $credentials = Get-Content -LiteralPath $credentialPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $existing = $credentials.PSObject.Properties |
            Where-Object { $_.Name -ieq 'adminPassword' } |
            Select-Object -First 1

          $generated = $false
          if ($null -eq $existing -or [string]::IsNullOrWhiteSpace([string]$existing.Value)) {
            $alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%*-_=+'
            $bytes = New-Object byte[] 32
            [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
            $builder = New-Object System.Text.StringBuilder
            foreach ($byte in $bytes) {
              [void]$builder.Append($alphabet[$byte % $alphabet.Length])
            }
            $adminPassword = $builder.ToString()
            $credentials | Add-Member -NotePropertyName adminPassword -NotePropertyValue $adminPassword -Force
            $credentials | Add-Member -NotePropertyName adminUsername -NotePropertyValue 'admin' -Force
            $credentials | Add-Member -NotePropertyName adminPasswordPurpose -NotePropertyValue 'LayerSentry web dashboard first-login administrator password' -Force
            $credentials | Add-Member -NotePropertyName adminPasswordGeneratedAtUtc -NotePropertyValue ((Get-Date).ToUniversalTime().ToString('o')) -Force
            $generated = $true
          } else {
            $adminPassword = [string]$existing.Value
          }

          if ($adminPassword.Length -lt 20) {
            throw 'The protected adminPassword is shorter than 20 characters.'
          }

          $temporary = "$credentialPath.tmp"
          $credentials | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $temporary -Encoding UTF8
          Move-Item -LiteralPath $temporary -Destination $credentialPath -Force

          $acl = New-Object System.Security.AccessControl.FileSecurity
          $acl.SetAccessRuleProtection($true, $false)
          $systemRule = New-Object System.Security.AccessControl.FileSystemAccessRule(
            'NT AUTHORITY\SYSTEM',
            [System.Security.AccessControl.FileSystemRights]::FullControl,
            [System.Security.AccessControl.AccessControlType]::Allow
          )
          $adminRule = New-Object System.Security.AccessControl.FileSystemAccessRule(
            'BUILTIN\Administrators',
            [System.Security.AccessControl.FileSystemRights]::FullControl,
            [System.Security.AccessControl.AccessControlType]::Allow
          )
          [void]$acl.AddAccessRule($systemRule)
          [void]$acl.AddAccessRule($adminRule)
          Set-Acl -LiteralPath $credentialPath -AclObject $acl

          $verified = Get-Content -LiteralPath $credentialPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $verifiedProperty = $verified.PSObject.Properties |
            Where-Object { $_.Name -ieq 'adminPassword' } |
            Select-Object -First 1
          if ($null -eq $verifiedProperty -or [string]::IsNullOrWhiteSpace([string]$verifiedProperty.Value)) {
            throw 'adminPassword was not persisted to the protected local file.'
          }

          [ordered]@{
            schemaVersion = '1.0'
            generatedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            credentialPath = 'C:\ProgramData\LayerSentry\bootstrap-credentials.json'
            adminUsername = 'admin'
            adminPasswordPrepared = $true
            newlyGenerated = $generated
            passwordLength = ([string]$verifiedProperty.Value).Length
            credentialValueLogged = $false
            eulaAccepted = $false
            clusterModified = $false
          } | ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath (Join-Path $output 'admin-password-preparation.json') -Encoding UTF8

          @"
          # LayerSentry administrator password preparation

          - Protected password prepared: **true**
          - Password value logged or uploaded: **false**
          - EULA accepted automatically: **false**
          - Cluster modified: **false**
          - Local credential file: `C:\ProgramData\LayerSentry\bootstrap-credentials.json`
          "@ | Set-Content -LiteralPath (Join-Path $output 'STATUS.md') -Encoding UTF8

          $adminPassword = $null
          $credentials = $null
          $verified = $null
          Write-Host 'Protected LayerSentry web administrator password is ready. Its value was not printed.'

      - name: Upload sanitized preparation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layersentry-admin-password-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}\layersentry-admin-password-preparation\**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
