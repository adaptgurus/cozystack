name: LayerSentry Storage Management CI

on:
  workflow_dispatch:
  push:
    branches:
      - layersentry-platform
    paths:
      - packages/system/dashboard/templates/clusterrole-cluster-usage.yaml
      - packages/system/dashboard/templates/clusterrolebinding-cluster-usage.yaml
      - packages/system/dashboard/templates/clusterrole-storage-management.yaml
      - packages/system/dashboard/templates/clusterrolebinding-storage-management.yaml
      - packages/system/dashboard/tests/cluster_usage_rbac_test.yaml
      - packages/system/dashboard/tests/storage_management_logical_rbac_test.yaml
      - packages/system/dashboard/images/console/apps/console/src/routes/StoragePage.tsx
      - packages/system/dashboard/images/console/apps/console/src/components/storage/**
      - packages/system/dashboard/images/console/apps/console/package.json
      - packages/system/dashboard/images/console/package.json
      - packages/system/dashboard/images/console/pnpm-lock.yaml
      - .github/workflows/layersentry-storage-management-ci.yml

permissions:
  contents: read

jobs:
  dashboard-rbac:
    name: Storage Management dashboard Helm/RBAC tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Install pinned helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.1.2

      - name: Run dashboard Helm unit tests
        run: helm unittest packages/system/dashboard

      - name: Enforce physical inventory read-only boundary
        shell: python
        run: |
          from pathlib import Path
          import re

          text = Path("packages/system/dashboard/templates/clusterrole-cluster-usage.yaml").read_text()
          required = (
              "pods",
              "persistentvolumes",
              "persistentvolumeclaims",
              "storageclasses",
              "volumesnapshots",
              "layersentry-storage-inventory",
              "layersentry-storage-backend-inventory",
          )
          for token in required:
              if token not in text:
                  raise SystemExit(f"missing Storage Management read RBAC token: {token}")

          forbidden = {"create", "update", "patch", "delete", "deletecollection"}
          for match in re.finditer(r"verbs:\s*\[([^\]]+)\]", text):
              verbs = {v.strip().strip("\"'") for v in match.group(1).split(",")}
              bad = verbs & forbidden
              if bad:
                  raise SystemExit(f"write verb leaked into physical/read-only Storage Management role: {sorted(bad)}")
          print("STORAGE_PHYSICAL_AND_INVENTORY_RBAC_READ_ONLY=PASS")

      - name: Enforce logical storage mutation boundary
        shell: python
        run: |
          from pathlib import Path

          text = Path("packages/system/dashboard/templates/clusterrole-storage-management.yaml").read_text()
          for token in ("persistentvolumeclaims", "storageclasses", "volumesnapshots", "csidrivers", "csinodes", "volumesnapshotclasses", "volumesnapshotcontents"):
              if token not in text:
                  raise SystemExit(f"missing logical Storage Management RBAC token: {token}")

          forbidden_exact = (
              'resources: ["persistentvolumes"]',
              'resources: ["configmaps"]',
              'resources: ["nodes"]',
              'resources: ["secrets"]',
          )
          for token in forbidden_exact:
              if token in text:
                  raise SystemExit(f"forbidden logical-storage mutation target present: {token}")

          if "deletecollection" in text:
              raise SystemExit("deletecollection is not allowed in logical storage management")
          print("STORAGE_LOGICAL_MUTATION_SCOPE=PASS")

  console:
    name: Storage Management console tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/system/dashboard/images/console
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: packages/system/dashboard/images/console/package.json

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: packages/system/dashboard/images/console/pnpm-lock.yaml

      - name: Verify pinned pnpm
        run: |
          test "$(pnpm --version)" = "11.1.2"
          pnpm --version

      - name: Install console dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Run Storage Management component tests
        run: pnpm --filter @cozystack/console exec vitest run src/components/storage/StorageManagementOverview.test.tsx src/components/storage/StorageBackendHealth.test.tsx src/components/storage/StorageLogicalManagement.test.tsx

      - name: Type-check console
        run: pnpm --filter @cozystack/console typecheck

      - name: Build console
        run: pnpm --filter @cozystack/console build
