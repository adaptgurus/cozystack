name: LayerSentry Network Inventory Type Fix

on:
  push:
    branches: [layersentry-platform]
    paths:
      - .github/workflows/layersentry-network-inventory-type-fix.yml

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Preserve extended evidence shape after base validation
        shell: python
        run: |
          from pathlib import Path
          p=Path('packages/system/dashboard/images/console/apps/console/src/components/network/network-inventory.ts')
          s=p.read_text()
          old='''function isSriovEvidence(value: unknown): value is SriovEvidence {
  if (!isRecord(value) || !isCapabilityEvidence(value)) return false
  if (!isNullableNonNegativeInteger(value.totalVfs) || !isNullableNonNegativeInteger(value.configuredVfs)) return false
  if (value.totalVfs !== null && value.configuredVfs !== null && value.configuredVfs > value.totalVfs) return false
  if (value.supported === true && (value.totalVfs === null || value.totalVfs <= 0)) return false
  return true
}

function isRdmaEvidence(value: unknown): value is RdmaEvidence {
  if (!isRecord(value) || !isCapabilityEvidence(value) || !isStringArray(value.devices)) return false
  if (value.supported === true && value.devices.length === 0) return false
  return true
}
'''
          new='''function isSriovEvidence(value: unknown): value is SriovEvidence {
  if (!isRecord(value) || !isCapabilityEvidence(value)) return false
  // isCapabilityEvidence intentionally narrows to the common evidence shape;
  // retain the original record for SR-IOV-specific fields while validating
  // each unknown value before using it.
  const record = value as UnknownRecord & CapabilityEvidence
  if (!isNullableNonNegativeInteger(record.totalVfs) || !isNullableNonNegativeInteger(record.configuredVfs)) return false
  if (record.totalVfs !== null && record.configuredVfs !== null && record.configuredVfs > record.totalVfs) return false
  if (record.supported === true && (record.totalVfs === null || record.totalVfs <= 0)) return false
  return true
}

function isRdmaEvidence(value: unknown): value is RdmaEvidence {
  if (!isRecord(value) || !isCapabilityEvidence(value)) return false
  const record = value as UnknownRecord & CapabilityEvidence
  if (!isStringArray(record.devices)) return false
  if (record.supported === true && record.devices.length === 0) return false
  return true
}
'''
          if s.count(old)!=1: raise SystemExit(f'validator anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1))

      - name: Run complete console test and type gate
        working-directory: packages/system/dashboard/images/console
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.1.2 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @cozystack/console test
          pnpm --filter @cozystack/console typecheck
          echo NETWORK_INVENTORY_TYPE_GATE=PASS

      - name: Commit tested fix on latest branch
        shell: bash
        run: |
          set -euo pipefail
          git add packages/system/dashboard/images/console/apps/console/src/components/network/network-inventory.ts
          git config user.name adaptgurus
          git config user.email 73125939+adaptgurus@users.noreply.github.com
          git commit -m 'fix(network): preserve extended inventory evidence types'
          git fetch origin layersentry-platform
          git rebase origin/layersentry-platform
          cd packages/system/dashboard/images/console
          corepack enable
          corepack prepare pnpm@11.1.2 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @cozystack/console typecheck
          cd - >/dev/null
          git push origin HEAD:layersentry-platform
