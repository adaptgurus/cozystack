name: LayerSentry KubeVirt Persistent Storage Validation

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - hack/layersentry/storage-validation-requests/*.json
      - hack/layersentry/test-kubevirt-persistent-storage.ps1
      - .github/workflows/layersentry-kubevirt-storage-validation.yml

permissions:
  contents: read

concurrency:
  group: layersentry-three-node-installer-autopilot
  cancel-in-progress: false

jobs:
  validate:
    name: Prove Longhorn VM block data survives VMI recreation
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90

    steps:
      - name: Checkout exact storage validation source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validate request and PowerShell source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $requests = @(
            git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA -- 'hack/layersentry/storage-validation-requests/*.json'
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if ($LASTEXITCODE -ne 0) {
            throw "git diff-tree failed with exit code $LASTEXITCODE"
          }
          if ($requests.Count -ne 1) {
            throw "Expected exactly one storage validation request; found $($requests.Count)."
          }
          $requestPath = $requests[0].Trim()
          $request = Get-Content -LiteralPath $requestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$request.operation -ne 'VALIDATE_LONGHORN_VM_BLOCK_PERSISTENCE') {
            throw "Unsupported storage validation operation: $($request.operation)"
          }
          if ([string]$request.authorization -ne 'USER_GRANTED_FULL_POWERSHELL_AND_INSTALL_PERMISSION') {
            throw 'The request is missing the user authorization marker.'
          }
          if (-not [bool]$request.retainVmAndPvcForInspection) {
            throw 'The request must explicitly retain the validation VM and PVC.'
          }
          if ([bool]$request.productionReleaseApprovalImplied) {
            throw 'Storage validation must not imply production release approval.'
          }
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path -LiteralPath 'hack/layersentry/test-kubevirt-persistent-storage.ps1').ProviderPath
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $path,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Error ("Line {0}: {1}" -f $_.Extent.StartLineNumber, $_.Message)
            }
            exit 1
          }
          Write-Host "Validated user-authorized persistent VM storage request: $requestPath"

      - name: Create and restart the Longhorn-backed validation VM
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'layersentry-kubevirt-storage-validation'
          & 'hack/layersentry/test-kubevirt-persistent-storage.ps1' `
            -ClusterUrl 'https://10.10.10.10' `
            -CredentialPath 'C:\ProgramData\LayerSentry\bootstrap-credentials.json' `
            -Namespace 'layersentry-validation' `
            -VmName 'layersentry-storage-vm' `
            -PvcName 'layersentry-storage-vm-disk' `
            -SourceVmName 'layersentry-smoke-vm' `
            -OutputDirectory $output `
            -TimeoutMinutes 35

      - name: Upload persistent-storage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layersentry-kubevirt-storage-validation-${{ github.run_id }}
          path: ${{ runner.temp }}\layersentry-kubevirt-storage-validation\**
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
