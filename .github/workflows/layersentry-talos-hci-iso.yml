name: LayerSentry HCI Talos Production Hold

on:
  workflow_dispatch:
  push:
    branches:
      - layersentry-platform
    paths:
      - 'packages/core/talos/**'
      - 'packages/system/cilium/values.yaml'
      - '.github/workflows/layersentry-talos-hci-iso.yml'

concurrency:
  group: layersentry-talos-hci-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-hold:
    name: Block superseded r4 ISO publication
    if: github.ref_name == 'layersentry-platform'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout layersentry-platform
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Enforce production rebuild hold
        shell: bash
        run: |
          set -euo pipefail
          test -f packages/core/talos/PRODUCTION_REBUILD_HOLD.md
          echo '::error::LayerSentry Talos r4 is superseded. Production ISO rebuild hold is active; publication is intentionally blocked.'
          exit 1
