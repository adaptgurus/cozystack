name: LayerSentry HCI Talos Release

on:
  workflow_dispatch:
  push:
    branches:
      - layersentry-platform
    paths:
      - 'packages/core/talos/**'
      - '.github/workflows/layersentry-talos-hci-iso.yml'

concurrency:
  group: layersentry-talos-hci-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-release:
    name: Build, audit and publish LayerSentry HCI Talos ISO
    if: github.ref_name == 'layersentry-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout layersentry-platform
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Assert branch and clean output
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "layersentry-platform"
          rm -rf _out/assets _out/extensions
          mkdir -p _out/assets _out/extensions

      - name: Build LayerSentry HCI Talos ISO
        shell: bash
        run: |
          set -euo pipefail
          make -C packages/core/talos talos-iso
          test -s _out/assets/metal-amd64.iso

      - name: Verify storage extensions and embedded runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          profile="packages/core/talos/images/talos/profiles/iso.yaml"
          runtime_config="packages/core/talos/layersentry-hci-machine-config.yaml"
          iscsi_ext="_out/extensions/layersentry-iscsi-target.tar"
          nfs_ext="_out/extensions/layersentry-nfs-server.tar"

          test -s "$profile"
          test -s "$runtime_config"
          test -s "$iscsi_ext"
          test -s "$nfs_ext"

          required_extensions=(
            drbd
            zfs
            iscsi-tools
            multipath-tools
            nfsd
            nfs-utils
            nfsrahead
            nvme-cli
            lldpd
            trident-iscsi-tools
            util-linux-tools
            nvidia-open-gpu-kernel-modules-production
            nvidia-container-toolkit-production
            nvidia-gdrdrv-device
          )

          for extension in "${required_extensions[@]}"; do
            if ! grep -Fq "/${extension}:" "$profile"; then
              echo "::error::Required Talos extension '${extension}' is missing from ${profile}"
              exit 1
            fi
          done

          grep -Fq 'tarballPath: /extensions/layersentry-iscsi-target.tar' "$profile"
          grep -Fq 'tarballPath: /extensions/layersentry-nfs-server.tar' "$profile"

          tar -tf "$iscsi_ext" | grep -Fx 'rootfs/usr/local/lib/containers/layersentry-iscsi-target/usr/sbin/tgtd' >/dev/null
          tar -tf "$iscsi_ext" | grep -Fx 'rootfs/usr/local/lib/containers/layersentry-iscsi-target/usr/sbin/tgtadm' >/dev/null
          tar -tf "$iscsi_ext" | grep -Fx 'rootfs/usr/local/lib/containers/layersentry-iscsi-target/usr/sbin/tgtimg' >/dev/null
          tar -tf "$iscsi_ext" | grep -Fx 'rootfs/usr/local/etc/containers/layersentry-iscsi-target.yaml' >/dev/null
          tar -xOf "$iscsi_ext" manifest.yaml | grep -F 'name: layersentry-iscsi-target' >/dev/null

          tar -tf "$nfs_ext" | grep -Fx 'rootfs/usr/local/lib/containers/layersentry-nfs-server/usr/sbin/exportfs' >/dev/null
          tar -tf "$nfs_ext" | grep -Fx 'rootfs/usr/local/lib/containers/layersentry-nfs-server/usr/sbin/rpc.nfsd' >/dev/null
          tar -tf "$nfs_ext" | grep -Fx 'rootfs/usr/local/lib/containers/layersentry-nfs-server/usr/sbin/rpc.mountd' >/dev/null
          tar -tf "$nfs_ext" | grep -Fx 'rootfs/usr/local/lib/containers/layersentry-nfs-server/sbin/rpc.statd' >/dev/null
          tar -tf "$nfs_ext" | grep -Fx 'rootfs/usr/local/lib/containers/layersentry-nfs-server/usr/local/sbin/layersentry-nfs-server' >/dev/null
          tar -tf "$nfs_ext" | grep -Fx 'rootfs/usr/local/etc/containers/layersentry-nfs-server.yaml' >/dev/null
          tar -xOf "$nfs_ext" manifest.yaml | grep -F 'name: layersentry-nfs-server' >/dev/null

          grep -Fq '/trident-iscsi-tools:' "$profile"
          grep -Fq 'name: dm_multipath' "$runtime_config"
          grep -Fq 'name: dm_round-robin' "$runtime_config"
          grep -Fq 'name: multipathd' "$runtime_config"
          grep -Fq 'path_selector "round-robin 0"' "$runtime_config"
          grep -Fq 'name: nfsd' "$runtime_config"
          grep -Fq 'kind: NetworkDefaultActionConfig' "$runtime_config"
          grep -Fq 'ingress: accept' "$runtime_config"
          grep -Fq 'embeddedMachineConfiguration:' "$profile"
          grep -Fq 'name: dm_multipath' "$profile"
          grep -Fq 'name: nfsd' "$profile"
          grep -Fq 'kind: NetworkDefaultActionConfig' "$profile"
          grep -Fq 'ingress: accept' "$profile"
          grep -Fq '| NVMe/FC host | PASS - HARDWARE CERTIFICATION REQUIRED |' packages/core/talos/LAYERSENTRY_HCI_IMAGE_AUDIT.md

      - name: Package release assets
        id: package
        shell: bash
        run: |
          set -euo pipefail
          profile="packages/core/talos/images/talos/profiles/iso.yaml"
          talos_version="$(awk '/^version:/ {print $2; exit}' "$profile")"
          test -n "$talos_version"

          version="${talos_version#v}"
          base="layersentry-hci-talos-${version}-amd64"
          iso="_out/assets/${base}.iso"
          checksum="_out/assets/${base}.sha256"
          manifest="_out/assets/${base}-extensions.txt"
          profile_asset="_out/assets/${base}-profile.yaml"
          runtime_asset="_out/assets/${base}-machine-config.yaml"
          audit_asset="_out/assets/${base}-audit.md"
          iscsi_asset="_out/assets/${base}-iscsi-target-extension.tar"
          nfs_asset="_out/assets/${base}-nfs-server-extension.tar"
          custom_checksums="_out/assets/${base}-custom-extensions.sha256"
          release_tag="layersentry-hci-talos-v${version}-r3"

          mv _out/assets/metal-amd64.iso "$iso"
          cp "$profile" "$profile_asset"
          cp packages/core/talos/layersentry-hci-machine-config.yaml "$runtime_asset"
          cp packages/core/talos/LAYERSENTRY_HCI_IMAGE_AUDIT.md "$audit_asset"
          cp _out/extensions/layersentry-iscsi-target.tar "$iscsi_asset"
          cp _out/extensions/layersentry-nfs-server.tar "$nfs_asset"

          {
            echo "LayerSentry HCI Talos image"
            echo "Talos version: ${talos_version}"
            echo "Release tag: ${release_tag}"
            echo "Git branch: ${GITHUB_REF_NAME}"
            echo "Git commit: ${GITHUB_SHA}"
            echo
            echo "Official Talos system extensions (digest pinned):"
            awk '/systemExtensions:/{p=1; next} p && /imageRef:/{sub(/^.*imageRef: /, ""); print "  " $0; next} p && /^output:/{exit}' "$profile"
            echo
            echo "LayerSentry custom extensions:"
            echo "  layersentry-iscsi-target: scsi-tgt/tgtd + tgtadm + tgtimg"
            echo "  layersentry-nfs-server: exportfs + rpc.nfsd + rpc.mountd + rpc.statd/rpcbind"
            echo
            echo "Embedded runtime configuration:"
            echo "  dm_multipath + dm_round-robin"
            echo "  multipathd with round-robin path selector"
            echo "  nfsd module loaded"
            echo "  Talos host ingress action: accept (host firewall filtering disabled)"
            echo "  netfilter/nftables/iptables capability retained for Kubernetes/Cilium datapath compatibility"
            echo
            echo "Storage protocol status:"
            echo "  NVMe/FC host support: enabled by exact Talos v1.13.6 kernel; hardware/fabric certification required"
            echo "  iSCSI target: userspace tgtd service included; no default LUN/ACL"
            echo "  NFS server/export engine: included; no default export"
            echo "  iSER: not claimed by this release"
          } > "$manifest"

          (cd _out/assets && sha256sum "${base}.iso" > "${base}.sha256")
          (cd _out/assets && sha256sum \
            "${base}-iscsi-target-extension.tar" \
            "${base}-nfs-server-extension.tar" \
            > "${base}-custom-extensions.sha256")

          for asset in \
            "$iso" "$checksum" "$manifest" "$profile_asset" "$runtime_asset" \
            "$audit_asset" "$iscsi_asset" "$nfs_asset" "$custom_checksums"; do
            test -s "$asset"
          done

          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "talos_version=${talos_version}" >> "$GITHUB_OUTPUT"
          echo "iso=${iso}" >> "$GITHUB_OUTPUT"
          echo "checksum=${checksum}" >> "$GITHUB_OUTPUT"
          echo "manifest=${manifest}" >> "$GITHUB_OUTPUT"
          echo "profile_asset=${profile_asset}" >> "$GITHUB_OUTPUT"
          echo "runtime_asset=${runtime_asset}" >> "$GITHUB_OUTPUT"
          echo "audit_asset=${audit_asset}" >> "$GITHUB_OUTPUT"
          echo "iscsi_asset=${iscsi_asset}" >> "$GITHUB_OUTPUT"
          echo "nfs_asset=${nfs_asset}" >> "$GITHUB_OUTPUT"
          echo "custom_checksums=${custom_checksums}" >> "$GITHUB_OUTPUT"

          cat "$checksum"
          cat "$custom_checksums"
          cat "$manifest"

      - name: Publish official-style GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          TALOS_VERSION: ${{ steps.package.outputs.talos_version }}
          ISO: ${{ steps.package.outputs.iso }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          MANIFEST: ${{ steps.package.outputs.manifest }}
          PROFILE_ASSET: ${{ steps.package.outputs.profile_asset }}
          RUNTIME_ASSET: ${{ steps.package.outputs.runtime_asset }}
          AUDIT_ASSET: ${{ steps.package.outputs.audit_asset }}
          ISCSI_ASSET: ${{ steps.package.outputs.iscsi_asset }}
          NFS_ASSET: ${{ steps.package.outputs.nfs_asset }}
          CUSTOM_CHECKSUMS: ${{ steps.package.outputs.custom_checksums }}
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/layersentry-release-notes.md <<EOF
          LayerSentry HCI Talos ${TALOS_VERSION} **r3** built from the \`layersentry-platform\` branch.

          **Storage profile in r3**
          - NVMe/FC host support release-audited against the exact Talos v1.13.6 kernel configuration.
          - LayerSentry userspace iSCSI target service (\`tgtd\`) baked into the ISO without requiring Linux LIO/targetcli.
          - Full NFS server/export userspace plus Talos \`nfsd\` module baked into the ISO. No export is created until LayerSentry supplies explicit export policy.
          - Talos host ingress firewall action explicitly set to \`accept\`. Netfilter/nftables/iptables capability is retained only for Kubernetes/Cilium datapath compatibility.

          **Build identity**
          - Commit: \`${GITHUB_SHA}\`
          - Full ISO is stored as a GitHub Release asset, not committed into Git history.
          - Verify the ISO and custom extension assets against the attached SHA-256 files before installation.

          **Release gate**
          - Custom iSCSI/NFS extension build and binary verification: required
          - Talos Imager system-extension validation: required
          - Talos ISO build: required
          - Digest-pinned official extension verification: required
          - Embedded DM-Multipath/NFSD/open-ingress configuration verification: required
          - Package/capability audit: attached

          Hardware-dependent FC/NVMe-FC/RDMA/SR-IOV/VFIO/GPU functionality remains subject to real-hardware certification.
          EOF

          assets=(
            "$ISO"
            "$CHECKSUM"
            "$MANIFEST"
            "$PROFILE_ASSET"
            "$RUNTIME_ASSET"
            "$AUDIT_ASSET"
            "$ISCSI_ASSET"
            "$NFS_ASSET"
            "$CUSTOM_CHECKSUMS"
          )

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Release tag ${RELEASE_TAG} already points to ${tag_sha}, not ${GITHUB_SHA}. Increment the LayerSentry release revision before publishing a new build."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "LayerSentry HCI Talos ${TALOS_VERSION} r3" \
              --notes-file /tmp/layersentry-release-notes.md \
              --latest=false \
              "${assets[@]}"
          fi

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          BASE: ${{ steps.package.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,url --jq '{tag:.tagName,url:.url}'
          assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for required in \
            "${BASE}.iso" \
            "${BASE}.sha256" \
            "${BASE}-extensions.txt" \
            "${BASE}-profile.yaml" \
            "${BASE}-machine-config.yaml" \
            "${BASE}-audit.md" \
            "${BASE}-iscsi-target-extension.tar" \
            "${BASE}-nfs-server-extension.tar" \
            "${BASE}-custom-extensions.sha256"; do
            printf '%s\n' "$assets" | grep -Fx "$required" >/dev/null || {
              echo "::error::Published release is missing asset ${required}"
              exit 1
            }
          done