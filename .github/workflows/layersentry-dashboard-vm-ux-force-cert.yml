name: LayerSentry Dashboard VM UX Forced Final Certification

on:
  workflow_dispatch:
  push:
    branches: [layersentry-platform]
    paths:
      - .github/workflows/layersentry-dashboard-vm-ux-force-cert.yml

concurrency:
  group: layersentry-dashboard-vm-ux-force-cert
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  PACKAGE_URL: oci://ghcr.io/adaptgurus/cozystack/cozystack-packages
  BASE_PACKAGE_DIGEST: sha256:652e8b0e41260ae9f35d1a1ba33b5d304156ae19f7689f7df52be30b835b954f
  RELEASE_PACKAGE_DIGEST: sha256:2b8f7de309d005fa85da90fd5253b26d0a86f165639405ebadbcfab18de1d0a2
  OPERATOR_IMAGE: ghcr.io/adaptgurus/cozystack/cozystack-operator:layersentry-production-5f493cd69cff10f1e2580d8818e0de5547e61a6a@sha256:85aa5ff0bfe56404a8416fcf9542d227965eb7e395790bea95a5662ed3dbc095
  IMAGE_REF: ghcr.io/adaptgurus/cozystack/cozystack-ui:layersentry-production-5f493cd69cff10f1e2580d8818e0de5547e61a6a@sha256:7fe10f0eab5146dfe00036bf5f3ae30afd7ec074911d25659ae1eab3d964da13

jobs:
  verify-release:
    name: Verify immutable VM UX package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install pinned Flux CLI
        shell: bash
        run: |
          set -euo pipefail
          V=v2.6.4
          A="flux_${V#v}_linux_amd64.tar.gz"
          curl -fsSLo "/tmp/$A" "https://github.com/fluxcd/flux2/releases/download/${V}/$A"
          curl -fsSLo /tmp/checksums "https://github.com/fluxcd/flux2/releases/download/${V}/flux_${V#v}_checksums.txt"
          grep " $A$" /tmp/checksums | sed "s#  $A#  /tmp/$A#" >/tmp/expected
          sha256sum -c /tmp/expected
          tar -xzf "/tmp/$A" -C /tmp flux
          sudo install -m 0755 /tmp/flux /usr/local/bin/flux

      - name: Pull, inspect and render exact release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/release && mkdir -p /tmp/release
          flux pull artifact "${PACKAGE_URL}@${RELEASE_PACKAGE_DIGEST}" --output /tmp/release
          test "$(yq -r '.cozystackOperator.image' /tmp/release/core/installer/values.yaml)" = "${OPERATOR_IMAGE}"
          test "$(yq -r '.console.image' /tmp/release/system/dashboard/values.yaml)" = "${IMAGE_REF}"
          grep -F -- '--scope=openid email profile' /tmp/release/system/dashboard/templates/gatekeeper.yaml >/dev/null
          ! grep -F -- '--scope=openid email profile offline_access' /tmp/release/system/dashboard/templates/gatekeeper.yaml >/dev/null
          test -f /tmp/release/system/dashboard/templates/clusterrole-storage-management.yaml
          test -f /tmp/release/system/dashboard/templates/clusterrolebinding-storage-management.yaml
          helm template dashboard /tmp/release/system/dashboard --set-string '_cluster.root-host=offline.invalid' >/tmp/rendered.yaml
          python3 - <<'PY'
          import os, yaml
          docs=list(yaml.safe_load_all(open('/tmp/rendered.yaml')))
          targets=[d for d in docs if isinstance(d,dict) and d.get('kind')=='Deployment' and d.get('metadata',{}).get('name')=='cozy-dashboard-console']
          if len(targets)!=1: raise SystemExit(f'expected one console Deployment, got {len(targets)}')
          containers=targets[0]['spec']['template']['spec']['containers']
          console=[c for c in containers if c.get('name')=='console']
          if len(console)!=1: raise SystemExit('console container missing')
          actual=console[0].get('image')
          expected=os.environ['IMAGE_REF']
          if actual!=expected: raise SystemExit(f'chart image mismatch expected={expected} actual={actual}')
          print(f'IMMUTABLE_RELEASE_RENDER=PASS image={actual}')
          PY
          echo "IMMUTABLE_RELEASE_PACKAGE=PASS package=${RELEASE_PACKAGE_DIGEST} operator=${OPERATOR_IMAGE} dashboard=${IMAGE_REF}"

  certify-testser:
    name: Forced generated-artifact and browser VM UX E2E on TESTSER
    needs: verify-release
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 70
    env:
      KUBECONFIG: C:\hci-state\cozystack-hci-lab\kubeconfig
      KUBECTL: C:\hci-tools\kubectl.exe
    defaults:
      run:
        shell: powershell
    steps:
      - name: Capture certified baseline and VM contract
        run: |
          $ErrorActionPreference='Stop'
          if(-not(Test-Path $env:KUBECONFIG)){throw 'TESTSER kubeconfig missing'}
          if(-not(Test-Path $env:KUBECTL)){throw 'kubectl missing'}
          $nodes=@((& $env:KUBECTL get nodes -o json|ConvertFrom-Json).items)
          if($nodes.Count -lt 3){throw "expected 3-node lab, found $($nodes.Count)"}
          $bad=@($nodes|Where-Object{[string](@($_.status.conditions|Where-Object{$_.type -eq 'Ready'}|Select-Object -First 1).status) -ne 'True'})
          if($bad.Count){throw "non-Ready nodes: $($bad.metadata.name -join ',')"}

          $sources=[ordered]@{}
          foreach($n in @('cozystack-platform','cozystack-packages')){
            $s=& $env:KUBECTL -n cozy-system get ocirepository.source.toolkit.fluxcd.io $n -o json|ConvertFrom-Json
            if([string]$s.spec.url -ne $env:PACKAGE_URL){throw "unexpected $n URL $($s.spec.url)"}
            if([string]$s.spec.ref.digest -ne $env:BASE_PACKAGE_DIGEST){throw "SAFETY_ABORT $n baseline=$($s.spec.ref.digest) expected=$env:BASE_PACKAGE_DIGEST"}
            $sources[$n]=[ordered]@{url=[string]$s.spec.url;digest=[string]$s.spec.ref.digest}
          }
          $dep=& $env:KUBECTL -n cozy-system get deploy cozystack-operator -o json|ConvertFrom-Json
          $op=@($dep.spec.template.spec.containers|Where-Object{$_.name -eq 'cozystack-operator'}|Select-Object -First 1)
          if(-not$op){throw 'cozystack-operator container missing'}
          $ag=& $env:KUBECTL -n cozy-system get artifactgenerator.source.extensions.fluxcd.io cozystack.cozystack-engine -o json|ConvertFrom-Json
          $inv=@($ag.status.inventory|Where-Object{$_.name -eq 'cozystack-cozystack-engine-oidc-dashboard'}|Select-Object -First 1)
          if(-not$inv){throw 'baseline dashboard artifact missing'}
          $hr=& $env:KUBECTL -n cozy-dashboard get helmrelease dashboard -o json|ConvertFrom-Json
          $depDash=& $env:KUBECTL -n cozy-dashboard get deploy cozy-dashboard-console -o json|ConvertFrom-Json
          $console=@($depDash.spec.template.spec.containers|Where-Object{$_.name -eq 'console'}|Select-Object -First 1)
          $post=if($null -ne $hr.spec.postRenderers){$hr.spec.postRenderers|ConvertTo-Json -Depth 80 -Compress}else{'null'}
          $base=[ordered]@{sources=$sources;operatorArgs=@($op.args);operatorImage=[string]$op.image;agSourcesDigest=[string]$ag.status.observedSourcesDigest;dashboardArtifactDigest=[string]$inv.digest;dashboardRevision=[string]$hr.status.lastAttemptedRevision;postRenderersJson=$post;dashboardImage=[string]$console.image}
          $base|ConvertTo-Json -Depth 90|Set-Content (Join-Path $env:RUNNER_TEMP 'vm-force-baseline.json') -Encoding UTF8

          $ad=& $env:KUBECTL get applicationdefinition vm-instance -o json|ConvertFrom-Json
          $schema=[string]$ad.spec.application.openAPISchema|ConvertFrom-Json
          $c=[ordered]@{kind=[string]$ad.spec.application.kind;plural=[string]$ad.spec.application.plural;namespace='tenant-layersentry';instanceType=[string]$schema.properties.instanceType.default;instanceProfile=[string]$schema.properties.instanceProfile.default}
          if(-not$c.kind -or -not$c.plural){throw 'vm-instance contract incomplete'}
          if(-not$c.instanceType){$c.instanceType='u1.medium'}
          if(-not$c.instanceProfile){$c.instanceProfile='ubuntu'}
          $ns=& $env:KUBECTL get ns $c.namespace -o json|ConvertFrom-Json
          if($ns.status.phase -ne 'Active'){throw 'tenant-layersentry not Active'}
          $existing=@((& $env:KUBECTL -n $c.namespace get $c.plural -o json|ConvertFrom-Json).items)
          if($existing.Count){throw "safety requires zero existing VM app CRs, found $($existing.Count)"}
          $c|ConvertTo-Json|Set-Content (Join-Path $env:RUNNER_TEMP 'vm-force-contract.json') -Encoding UTF8
          Write-Host "FORCE_CERT_PREFLIGHT=PASS nodes=$($nodes.Count) artifact=$($inv.digest) revision=$($hr.status.lastAttemptedRevision) operator=$($op.image) image=$($console.image)"

      - name: Switch immutable operator and OCI package source
        run: |
          $ErrorActionPreference='Stop'
          $dep=& $env:KUBECTL -n cozy-system get deploy cozystack-operator -o json|ConvertFrom-Json
          $op=@($dep.spec.template.spec.containers|Where-Object{$_.name -eq 'cozystack-operator'}|Select-Object -First 1)
          $args=New-Object System.Collections.Generic.List[string];$urlSeen=$false;$refSeen=$false
          foreach($a in @($op.args)){
            $s=[string]$a
            if($s -like '--platform-source-url=*'){$args.Add("--platform-source-url=$env:PACKAGE_URL");$urlSeen=$true}
            elseif($s -like '--platform-source-ref=*'){$args.Add("--platform-source-ref=digest=$env:RELEASE_PACKAGE_DIGEST");$refSeen=$true}
            else{$args.Add($s)}
          }
          if(-not$urlSeen){$args.Add("--platform-source-url=$env:PACKAGE_URL")}
          if(-not$refSeen){$args.Add("--platform-source-ref=digest=$env:RELEASE_PACKAGE_DIGEST")}
          $patch=[ordered]@{spec=[ordered]@{template=[ordered]@{spec=[ordered]@{containers=@([ordered]@{name='cozystack-operator';image=$env:OPERATOR_IMAGE;args=@($args)})}}}}
          $f=Join-Path $env:RUNNER_TEMP 'force-op.json';$patch|ConvertTo-Json -Depth 30|Set-Content $f -Encoding UTF8
          & $env:KUBECTL -n cozy-system patch deploy cozystack-operator --type=strategic "--patch-file=$f"|Out-Null
          if($LASTEXITCODE){throw 'operator source patch failed'}
          & $env:KUBECTL -n cozy-system rollout status deploy/cozystack-operator --timeout=300s|Out-Host
          if($LASTEXITCODE){throw 'operator rollout failed'}
          $liveOp=& $env:KUBECTL -n cozy-system get deploy cozystack-operator -o json|ConvertFrom-Json
          $liveOpImage=[string](@($liveOp.spec.template.spec.containers|Where-Object{$_.name -eq 'cozystack-operator'}|Select-Object -First 1).image)
          if($liveOpImage -ne $env:OPERATOR_IMAGE){throw "operator image pin failed expected=$env:OPERATOR_IMAGE actual=$liveOpImage"}
          Write-Host "IMMUTABLE_OPERATOR_IMAGE=PASS image=$liveOpImage"

          $sp=[ordered]@{spec=[ordered]@{url=$env:PACKAGE_URL;ref=[ordered]@{digest=$env:RELEASE_PACKAGE_DIGEST;tag=$null;semver=$null;semverFilter=$null}}}
          $sf=Join-Path $env:RUNNER_TEMP 'force-source.json';$sp|ConvertTo-Json -Depth 12|Set-Content $sf -Encoding UTF8
          foreach($n in @('cozystack-platform','cozystack-packages')){
            & $env:KUBECTL -n cozy-system patch ocirepository.source.toolkit.fluxcd.io $n --type=merge "--patch-file=$sf"|Out-Null
            if($LASTEXITCODE){throw "source patch failed $n"}
          }
          Set-Content (Join-Path $env:RUNNER_TEMP 'force-mutated.flag') 'true'
          $deadline=(Get-Date).AddMinutes(10)
          do{
            Start-Sleep 5;$ok=$true
            foreach($n in @('cozystack-platform','cozystack-packages')){
              $s=& $env:KUBECTL -n cozy-system get ocirepository.source.toolkit.fluxcd.io $n -o json|ConvertFrom-Json
              $r=@($s.status.conditions|Where-Object{$_.type -eq 'Ready'}|Select-Object -First 1)
              if([string]$s.spec.ref.digest -ne $env:RELEASE_PACKAGE_DIGEST -or $r.status -ne 'True' -or [string]$s.status.artifact.revision -notmatch [regex]::Escape($env:RELEASE_PACKAGE_DIGEST)){$ok=$false}
            }
          }while(-not$ok -and (Get-Date)-lt$deadline)
          if(-not$ok){throw 'release OCI sources not Ready'}
          Write-Host "IMMUTABLE_PACKAGE_SOURCE=PASS digest=$env:RELEASE_PACKAGE_DIGEST"

      - name: Force bounded source-watcher drift and wait regenerated dashboard
        run: |
          $ErrorActionPreference='Stop'
          $b=Get-Content (Join-Path $env:RUNNER_TEMP 'vm-force-baseline.json') -Raw|ConvertFrom-Json
          $forceSchedule=@(0,30,90,210,450,690)
          $forceIndex=0;$start=Get-Date;$deadline=$start.AddMinutes(14);$changed=$false
          do{
            $elapsed=[int]((Get-Date)-$start).TotalSeconds
            if($forceIndex -lt $forceSchedule.Count -and $elapsed -ge $forceSchedule[$forceIndex]){
              $ag=& $env:KUBECTL -n cozy-system get artifactgenerator.source.extensions.fluxcd.io cozystack.cozystack-engine -o json|ConvertFrom-Json
              $conditions=New-Object System.Collections.ArrayList
              foreach($condition in @($ag.status.conditions)){if([string]$condition.type -ne 'Ready'){[void]$conditions.Add($condition)}}
              $now=[DateTime]::UtcNow.ToString('o')
              [void]$conditions.Add([ordered]@{type='Ready';status='False';reason='SourceWatcherRecoveryForced';message="LayerSentry certification bounded recovery attempt $($forceIndex+1)";observedGeneration=[long]$ag.metadata.generation;lastTransitionTime=$now})
              $statusPatch=[ordered]@{status=[ordered]@{conditions=@($conditions)}}
              $pf=Join-Path $env:RUNNER_TEMP 'force-ag-status.json';$statusPatch|ConvertTo-Json -Depth 30|Set-Content $pf -Encoding UTF8
              & $env:KUBECTL -n cozy-system patch artifactgenerator.source.extensions.fluxcd.io cozystack.cozystack-engine --subresource=status --type=merge "--patch-file=$pf"|Out-Null
              if($LASTEXITCODE){throw 'failed to set ArtifactGenerator Ready=False drift signal'}
              & $env:KUBECTL -n cozy-system annotate artifactgenerator.source.extensions.fluxcd.io cozystack.cozystack-engine "reconcile.fluxcd.io/requestedAt=$now" --overwrite|Out-Null
              if($LASTEXITCODE){throw 'failed to enqueue ArtifactGenerator reconcile'}
              $forceIndex++
              Write-Host "SOURCE_WATCHER_FORCE_SIGNAL=PASS attempt=$forceIndex readyFalse=true requestedAt=$now"
            }
            Start-Sleep 5
            $ag=& $env:KUBECTL -n cozy-system get artifactgenerator.source.extensions.fluxcd.io cozystack.cozystack-engine -o json|ConvertFrom-Json
            $ready=@($ag.status.conditions|Where-Object{$_.type -eq 'Ready'}|Select-Object -First 1)
            $inv=@($ag.status.inventory|Where-Object{$_.name -eq 'cozystack-cozystack-engine-oidc-dashboard'}|Select-Object -First 1)
            $ps=& $env:KUBECTL get packagesource.cozystack.io cozystack.cozystack-engine -o json|ConvertFrom-Json
            $psReady=@($ps.status.conditions|Where-Object{$_.type -eq 'Ready'}|Select-Object -First 1)
            if($psReady.status -eq 'False' -and $psReady.reason -eq 'SourceWatcherStalled'){throw "source-watcher recovery exhausted: $($psReady.message)"}
            $changed=($ready.status -eq 'True' -and [string]$ag.status.observedSourcesDigest -ne [string]$b.agSourcesDigest -and $inv -and [string]$inv.digest -ne [string]$b.dashboardArtifactDigest)
          }while(-not$changed -and (Get-Date)-lt$deadline)
          if(-not$changed){
            $platform=& $env:KUBECTL -n cozy-system get ocirepository.source.toolkit.fluxcd.io cozystack-platform -o json|ConvertFrom-Json
            throw "regenerated dashboard barrier failed attempts=$forceIndex sourceDigest=$($ag.status.observedSourcesDigest) dashboard=$($inv.digest) ready=$($ready.status)/$($ready.reason) readyMessage=$($ready.message) packageSource=$($psReady.status)/$($psReady.reason) packageSourceMessage=$($psReady.message) ociRevision=$($platform.status.artifact.revision) baselineSource=$($b.agSourcesDigest) baselineDashboard=$($b.dashboardArtifactDigest)"
          }
          $expected="0.0.0+"+([string]$inv.digest).Replace('sha256:','').Substring(0,12)
          Set-Content (Join-Path $env:RUNNER_TEMP 'force-artifact-digest.txt') ([string]$inv.digest)
          Set-Content (Join-Path $env:RUNNER_TEMP 'force-chart-revision.txt') $expected
          Write-Host "GENERATED_DASHBOARD_ARTIFACT=PASS digest=$($inv.digest) sourceDigest=$($ag.status.observedSourcesDigest) revision=$expected attempts=$forceIndex"

      - name: Reconcile platform and consume exact generated chart revision
        run: |
          $ErrorActionPreference='Stop'
          $expected=(Get-Content (Join-Path $env:RUNNER_TEMP 'force-chart-revision.txt') -Raw).Trim()
          $stamp=[DateTime]::UtcNow.ToString('o')
          & $env:KUBECTL -n cozy-system annotate helmrelease cozystack-platform "reconcile.fluxcd.io/requestedAt=$stamp" --overwrite|Out-Null
          $deadline=(Get-Date).AddMinutes(8)
          do{Start-Sleep 5;$p=& $env:KUBECTL -n cozy-system get helmrelease cozystack-platform -o json|ConvertFrom-Json;$pr=@($p.status.conditions|Where-Object{$_.type -eq 'Ready'}|Select-Object -First 1)}while(([string]$p.status.lastHandledReconcileAt -ne $stamp -or $pr.status -ne 'True') -and (Get-Date)-lt$deadline)
          if([string]$p.status.lastHandledReconcileAt -ne $stamp -or $pr.status -ne 'True'){throw "platform reconcile failed: $($pr.message)"}

          $deadline=(Get-Date).AddMinutes(8)
          do{
            $hr=& $env:KUBECTL -n cozy-dashboard get helmrelease dashboard -o json|ConvertFrom-Json
            $rr=@($hr.status.conditions|Where-Object{$_.type -eq 'Ready'}|Select-Object -First 1)
            if([string]$hr.status.lastAttemptedRevision -eq $expected -and $rr.status -eq 'True'){break}
            & $env:KUBECTL -n cozy-dashboard annotate helmrelease dashboard "reconcile.fluxcd.io/requestedAt=$([DateTime]::UtcNow.ToString('o'))" --overwrite|Out-Null
            Start-Sleep 5
          }while((Get-Date)-lt$deadline)
          if([string]$hr.status.lastAttemptedRevision -ne $expected -or $rr.status -ne 'True'){throw "dashboard chart not consumed expected=$expected attempted=$($hr.status.lastAttemptedRevision) ready=$($rr.status) message=$($rr.message)"}
          Write-Host "EXACT_DASHBOARD_REVISION=PASS revision=$expected"

      - name: Certify exact deployed image and guided VM bundle
        run: |
          $ErrorActionPreference='Stop'
          & $env:KUBECTL -n cozy-dashboard rollout status deploy/cozy-dashboard-console --timeout=300s|Out-Host
          if($LASTEXITCODE){throw 'console rollout failed'}
          $dep=& $env:KUBECTL -n cozy-dashboard get deploy cozy-dashboard-console -o json|ConvertFrom-Json
          $image=[string](@($dep.spec.template.spec.containers|Where-Object{$_.name -eq 'console'}|Select-Object -First 1).image)
          if($image -ne $env:IMAGE_REF){throw "LIVE_IMAGE_MISMATCH expected=$env:IMAGE_REF actual=$image"}
          $prefix='/api/v1/namespaces/cozy-dashboard/services/http:cozy-dashboard-console:8080/proxy'
          $health=(& $env:KUBECTL get --raw "$prefix/healthcheck"|Out-String).Trim()
          if($health -notmatch '(?i)healthy|ok'){throw "console health failed: $health"}
          $html=& $env:KUBECTL get --raw "$prefix/"|Out-String
          $m=[regex]::Match($html,'src="(/assets/index-[^"]+\.js)"')
          if(-not$m.Success){throw 'deployed JS asset missing'}
          $js=& $env:KUBECTL get --raw "$prefix$($m.Groups[1].Value)"|Out-String
          foreach($marker in @('Create virtual machine','Basics','Compute','Storage','Network','Access','Review','Pending changes','Safe edit behavior')){if($js -notmatch [regex]::Escape($marker)){throw "bundle marker missing: $marker"}}
          if($js -match 'Mockup'){throw 'production bundle contains Mockup marker'}
          Write-Host "LIVE_GUIDED_VM_GUI=PASS image=$image markers=9 mockup=false"

      - name: Controller-level VM create and safe edit lifecycle
        run: |
          $ErrorActionPreference='Stop'
          $c=Get-Content (Join-Path $env:RUNNER_TEMP 'vm-force-contract.json') -Raw|ConvertFrom-Json
          $name="vm-api-$env:GITHUB_RUN_ID".ToLower();Set-Content (Join-Path $env:RUNNER_TEMP 'force-api-name.txt') $name
          $before=@((& $env:KUBECTL -n $c.namespace get virtualmachines.kubevirt.io -o json|ConvertFrom-Json).items|ForEach-Object{$_.metadata.name})
          $body=[ordered]@{apiVersion='apps.cozystack.io/v1alpha1';kind=$c.kind;metadata=[ordered]@{name=$name;namespace=$c.namespace};spec=[ordered]@{runStrategy='Halted';instanceType=$c.instanceType;instanceProfile=$c.instanceProfile}}
          $f=Join-Path $env:RUNNER_TEMP 'force-api-create.json';$body|ConvertTo-Json -Depth 30|Set-Content $f -Encoding UTF8
          & $env:KUBECTL create -f $f|Out-Host
          if($LASTEXITCODE){throw 'VM application create failed'}
          $deadline=(Get-Date).AddMinutes(8);$new=@()
          do{Start-Sleep 5;$all=@((& $env:KUBECTL -n $c.namespace get virtualmachines.kubevirt.io -o json|ConvertFrom-Json).items);$new=@($all|Where-Object{$before -notcontains $_.metadata.name})}while($new.Count -ne 1 -and (Get-Date)-lt$deadline)
          if($new.Count -ne 1){throw "expected one downstream KubeVirt VM, found $($new.Count)"}
          $kv=[string]$new[0].metadata.name;Set-Content (Join-Path $env:RUNNER_TEMP 'force-api-kv.txt') $kv
          if([string]$new[0].spec.runStrategy -ne 'Halted'){throw "downstream runStrategy=$($new[0].spec.runStrategy)"}
          $vmi=@((& $env:KUBECTL -n $c.namespace get virtualmachineinstances.kubevirt.io -o json|ConvertFrom-Json).items|Where-Object{$_.metadata.name -eq $kv})
          if($vmi.Count){throw 'Halted VM unexpectedly launched a VMI'}

          $obj=& $env:KUBECTL -n $c.namespace get $c.plural $name -o json|ConvertFrom-Json
          $beforeSpec=$obj.spec
          $replace=[ordered]@{apiVersion=[string]$obj.apiVersion;kind=[string]$obj.kind;metadata=[ordered]@{name=$name;namespace=$c.namespace;resourceVersion=[string]$obj.metadata.resourceVersion};spec=$obj.spec}
          $replace.spec.runStrategy='Manual'
          $rf=Join-Path $env:RUNNER_TEMP 'force-api-edit.json';$replace|ConvertTo-Json -Depth 50|Set-Content $rf -Encoding UTF8
          & $env:KUBECTL replace -f $rf|Out-Host
          if($LASTEXITCODE){throw 'PUT-style VM edit failed'}
          $after=& $env:KUBECTL -n $c.namespace get $c.plural $name -o json|ConvertFrom-Json
          if([string]$after.spec.runStrategy -ne 'Manual'){throw 'application edit did not persist Manual'}
          $bp=@($beforeSpec.PSObject.Properties.Name|Sort-Object);$ap=@($after.spec.PSObject.Properties.Name|Sort-Object)
          if(($bp -join '|') -ne ($ap -join '|')){throw "edit changed field set before=$($bp -join ',') after=$($ap -join ',')"}
          foreach($p in $bp){if($p -eq 'runStrategy'){continue};$a=$beforeSpec.$p|ConvertTo-Json -Depth 40 -Compress;$b=$after.spec.$p|ConvertTo-Json -Depth 40 -Compress;if($a -ne $b){throw "untouched field changed: $p"}}
          $deadline=(Get-Date).AddMinutes(5)
          do{Start-Sleep 5;$vm=& $env:KUBECTL -n $c.namespace get virtualmachine.kubevirt.io $kv -o json|ConvertFrom-Json}while([string]$vm.spec.runStrategy -ne 'Manual' -and (Get-Date)-lt$deadline)
          if([string]$vm.spec.runStrategy -ne 'Manual'){throw 'KubeVirt VM did not reconcile Manual'}
          Write-Host "VM_CONTROLLER_LIFECYCLE=PASS app=$name kubevirtVM=$kv haltedCreate=true manualEdit=true defaultsInjected=false"

      - name: Set up Node.js for real browser E2E
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Prepare ephemeral browser identity and Chromium
        run: |
          $ErrorActionPreference='Stop'
          $c=Get-Content (Join-Path $env:RUNNER_TEMP 'vm-force-contract.json') -Raw|ConvertFrom-Json
          $sa="vm-gui-$env:GITHUB_RUN_ID".ToLower();$crb=$sa
          Set-Content (Join-Path $env:RUNNER_TEMP 'force-sa.txt') $sa;Set-Content (Join-Path $env:RUNNER_TEMP 'force-crb.txt') $crb
          & $env:KUBECTL -n $c.namespace create sa $sa|Out-Host
          if($LASTEXITCODE){throw 'browser service account create failed'}
          & $env:KUBECTL create clusterrolebinding $crb "--clusterrole=cluster-admin" "--serviceaccount=$($c.namespace):$sa"|Out-Host
          if($LASTEXITCODE){throw 'browser role binding create failed'}
          $token=(& $env:KUBECTL -n $c.namespace create token $sa --duration=20m|Out-String).Trim()
          if(-not$token){throw 'browser token creation failed'}
          Write-Host "::add-mask::$token";Set-Content (Join-Path $env:RUNNER_TEMP 'force-token.txt') $token -NoNewline
          $pw=Join-Path $env:RUNNER_TEMP 'force-pw';New-Item -ItemType Directory -Force $pw|Out-Null
          Push-Location $pw
          npm init -y|Out-Null
          npm install --no-audit --no-fund playwright@1.55.0
          if($LASTEXITCODE){throw 'Playwright install failed'}
          npx playwright install chromium
          if($LASTEXITCODE){throw 'Chromium install failed'}
          Pop-Location
          Write-Host 'REAL_BROWSER_PREP=PASS identity=ephemeral'

      - name: Real browser creates VM through six-step guided flow
        run: |
          $ErrorActionPreference='Stop'
          $c=Get-Content (Join-Path $env:RUNNER_TEMP 'vm-force-contract.json') -Raw|ConvertFrom-Json
          $name="vm-browser-$env:GITHUB_RUN_ID".ToLower();Set-Content (Join-Path $env:RUNNER_TEMP 'force-browser-name.txt') $name
          $token=Get-Content (Join-Path $env:RUNNER_TEMP 'force-token.txt') -Raw
          $pf=Start-Process $env:KUBECTL -ArgumentList @('-n','cozy-dashboard','port-forward','service/cozy-dashboard-console','18081:8080','--address=127.0.0.1') -PassThru -WindowStyle Hidden
          try{
            $deadline=(Get-Date).AddSeconds(45);$up=$false
            do{try{$r=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18081/healthcheck' -TimeoutSec 2;if($r.StatusCode -eq 200){$up=$true}}catch{};if(-not$up){Start-Sleep 1}}while(-not$up -and (Get-Date)-lt$deadline)
            if(-not$up){throw 'console port-forward unhealthy'}
            $env:E2E_TOKEN=$token;$env:E2E_NAME=$name
            $js=@'
          const { chromium }=require('playwright');
          (async()=>{const browser=await chromium.launch({headless:true});const ctx=await browser.newContext({extraHTTPHeaders:{Authorization:`Bearer ${process.env.E2E_TOKEN}`}});const p=await ctx.newPage();const errors=[];p.on('pageerror',e=>errors.push(String(e)));p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});await p.addInitScript(()=>localStorage.setItem('cozystack-ui:selected-tenant','layersentry'));await p.goto('http://127.0.0.1:18081/console/new/vm-instance',{waitUntil:'networkidle',timeout:60000});await p.getByRole('heading',{name:'Create virtual machine'}).waitFor({timeout:30000});await p.locator('input[placeholder="web-01"]').fill(process.env.E2E_NAME);await p.getByLabel(/Run strategy/i).selectOption('Halted');for(const step of ['Compute','Storage','Network','Access','Review']){await p.getByRole('button',{name:/Continue/}).click();await p.getByText(step,{exact:true}).first().waitFor()}await p.getByText(process.env.E2E_NAME,{exact:true}).first().waitFor();await p.getByRole('button',{name:'Create virtual machine'}).click();await p.waitForURL(new RegExp(`/console/vminstances/${process.env.E2E_NAME}$`),{timeout:90000});if(errors.length)throw new Error(errors.join(' | '));await browser.close()})().catch(e=>{console.error(e);process.exit(1)});
          '@
            $script=Join-Path $env:RUNNER_TEMP 'force-create.cjs';Set-Content $script $js -Encoding UTF8
            Push-Location (Join-Path $env:RUNNER_TEMP 'force-pw');node $script;if($LASTEXITCODE){throw 'browser create failed'};Pop-Location
          }finally{if($pf -and -not$pf.HasExited){Stop-Process $pf.Id -Force -ErrorAction SilentlyContinue}}
          $deadline=(Get-Date).AddMinutes(6);$app=$null
          do{Start-Sleep 5;$raw=& $env:KUBECTL -n $c.namespace get $c.plural $name -o json 2>$null;if($LASTEXITCODE -eq 0){$app=$raw|ConvertFrom-Json}}while(-not$app -and (Get-Date)-lt$deadline)
          if(-not$app){throw 'browser-created VM application missing'}
          if([string]$app.spec.runStrategy -ne 'Halted'){throw "browser VM runStrategy=$($app.spec.runStrategy)"}
          $app.spec|ConvertTo-Json -Depth 50 -Compress|Set-Content (Join-Path $env:RUNNER_TEMP 'force-browser-before.json') -Encoding UTF8
          Write-Host "VM_BROWSER_CREATE=PASS app=$name sixStepWizard=true"

      - name: Real browser edits VM and proves safe edit behavior
        run: |
          $ErrorActionPreference='Stop'
          $c=Get-Content (Join-Path $env:RUNNER_TEMP 'vm-force-contract.json') -Raw|ConvertFrom-Json
          $name=(Get-Content (Join-Path $env:RUNNER_TEMP 'force-browser-name.txt') -Raw).Trim();$token=Get-Content (Join-Path $env:RUNNER_TEMP 'force-token.txt') -Raw
          $pf=Start-Process $env:KUBECTL -ArgumentList @('-n','cozy-dashboard','port-forward','service/cozy-dashboard-console','18081:8080','--address=127.0.0.1') -PassThru -WindowStyle Hidden
          try{
            $deadline=(Get-Date).AddSeconds(45);$up=$false
            do{try{$r=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18081/healthcheck' -TimeoutSec 2;if($r.StatusCode -eq 200){$up=$true}}catch{};if(-not$up){Start-Sleep 1}}while(-not$up -and (Get-Date)-lt$deadline)
            if(-not$up){throw 'edit port-forward unhealthy'}
            $env:E2E_TOKEN=$token;$env:E2E_NAME=$name
            $js=@'
          const { chromium }=require('playwright');
          (async()=>{const browser=await chromium.launch({headless:true});const ctx=await browser.newContext({extraHTTPHeaders:{Authorization:`Bearer ${process.env.E2E_TOKEN}`}});const p=await ctx.newPage();const errors=[];p.on('pageerror',e=>errors.push(String(e)));await p.addInitScript(()=>localStorage.setItem('cozystack-ui:selected-tenant','layersentry'));await p.goto(`http://127.0.0.1:18081/console/vminstances/${process.env.E2E_NAME}/edit`,{waitUntil:'networkidle',timeout:60000});await p.getByRole('heading',{name:`Edit ${process.env.E2E_NAME}`}).waitFor({timeout:30000});await p.getByLabel(/Run strategy/i).selectOption('Manual');await p.getByText('Review',{exact:true}).first().click();await p.getByText('Pending changes',{exact:true}).waitFor();await p.getByText('Safe edit behavior',{exact:true}).waitFor();await p.getByRole('button',{name:'Save changes'}).click();await p.waitForURL(new RegExp(`/console/vminstances/${process.env.E2E_NAME}$`),{timeout:90000});if(errors.length)throw new Error(errors.join(' | '));await browser.close()})().catch(e=>{console.error(e);process.exit(1)});
          '@
            $script=Join-Path $env:RUNNER_TEMP 'force-edit.cjs';Set-Content $script $js -Encoding UTF8
            Push-Location (Join-Path $env:RUNNER_TEMP 'force-pw');node $script;if($LASTEXITCODE){throw 'browser edit failed'};Pop-Location
          }finally{if($pf -and -not$pf.HasExited){Stop-Process $pf.Id -Force -ErrorAction SilentlyContinue}}
          $after=& $env:KUBECTL -n $c.namespace get $c.plural $name -o json|ConvertFrom-Json
          if([string]$after.spec.runStrategy -ne 'Manual'){throw 'browser edit did not persist Manual'}
          $before=Get-Content (Join-Path $env:RUNNER_TEMP 'force-browser-before.json') -Raw|ConvertFrom-Json
          $bp=@($before.PSObject.Properties.Name|Sort-Object);$ap=@($after.spec.PSObject.Properties.Name|Sort-Object)
          if(($bp -join '|') -ne ($ap -join '|')){throw "browser edit field set changed before=$($bp -join ',') after=$($ap -join ',')"}
          foreach($x in $bp){if($x -eq 'runStrategy'){continue};$a=$before.$x|ConvertTo-Json -Depth 40 -Compress;$b=$after.spec.$x|ConvertTo-Json -Depth 40 -Compress;if($a -ne $b){throw "browser changed untouched field $x"}}
          Write-Host "VM_BROWSER_EDIT=PASS app=$name pendingChanges=true safeEdit=true defaultsInjected=false"

      - name: Cleanup all disposable certification resources
        if: always()
        run: |
          $ErrorActionPreference='Continue';$cf=Join-Path $env:RUNNER_TEMP 'vm-force-contract.json';$leaks=@()
          if(Test-Path $cf){
            $c=Get-Content $cf -Raw|ConvertFrom-Json
            foreach($nf in @('force-api-name.txt','force-browser-name.txt')){
              $p=Join-Path $env:RUNNER_TEMP $nf
              if(Test-Path $p){$n=(Get-Content $p -Raw).Trim();& $env:KUBECTL -n $c.namespace delete $c.plural $n --ignore-not-found=true --wait=true --timeout=300s|Out-Host}
            }
            $deadline=(Get-Date).AddMinutes(6)
            do{
              $leaks=@()
              foreach($nf in @('force-api-name.txt','force-browser-name.txt')){
                $p=Join-Path $env:RUNNER_TEMP $nf;if(-not(Test-Path $p)){continue};$n=(Get-Content $p -Raw).Trim()
                foreach($res in @('virtualmachines.kubevirt.io','virtualmachineinstances.kubevirt.io','persistentvolumeclaims','services','secrets')){
                  $raw=& $env:KUBECTL -n $c.namespace get $res -o json 2>$null
                  if($LASTEXITCODE -eq 0){$items=@(($raw|ConvertFrom-Json).items);$leaks+=@($items|Where-Object{$_.metadata.name -like "*$n*"}|ForEach-Object{"$res/$($_.metadata.name)"})}
                }
              }
              if($leaks.Count){Start-Sleep 5}
            }while($leaks.Count -and (Get-Date)-lt$deadline)
          }
          $crbp=Join-Path $env:RUNNER_TEMP 'force-crb.txt';if(Test-Path $crbp){& $env:KUBECTL delete clusterrolebinding ((Get-Content $crbp -Raw).Trim()) --ignore-not-found=true|Out-Null}
          $sap=Join-Path $env:RUNNER_TEMP 'force-sa.txt';if((Test-Path $sap) -and (Test-Path $cf)){$c=Get-Content $cf -Raw|ConvertFrom-Json;& $env:KUBECTL -n $c.namespace delete sa ((Get-Content $sap -Raw).Trim()) --ignore-not-found=true|Out-Null}
          if($leaks.Count){throw "disposable resource leaks: $($leaks -join ',')"}
          Write-Host 'VM_CERT_CLEANUP=PASS leakedResources=0'
          $global:LASTEXITCODE=0

      - name: Second production reconciliation durability proof
        if: success()
        run: |
          $ErrorActionPreference='Stop'
          $artifact=(Get-Content (Join-Path $env:RUNNER_TEMP 'force-artifact-digest.txt') -Raw).Trim();$expected=(Get-Content (Join-Path $env:RUNNER_TEMP 'force-chart-revision.txt') -Raw).Trim()
          $stamp=[DateTime]::UtcNow.ToString('o');& $env:KUBECTL -n cozy-system annotate helmrelease cozystack-platform "reconcile.fluxcd.io/requestedAt=$stamp" --overwrite|Out-Null
          $deadline=(Get-Date).AddMinutes(8)
          do{Start-Sleep 5;$p=& $env:KUBECTL -n cozy-system get helmrelease cozystack-platform -o json|ConvertFrom-Json;$r=@($p.status.conditions|Where-Object{$_.type -eq 'Ready'}|Select-Object -First 1)}while(([string]$p.status.lastHandledReconcileAt -ne $stamp -or $r.status -ne 'True') -and (Get-Date)-lt$deadline)
          if([string]$p.status.lastHandledReconcileAt -ne $stamp -or $r.status -ne 'True'){throw 'second platform reconcile failed'}
          foreach($n in @('cozystack-platform','cozystack-packages')){$s=& $env:KUBECTL -n cozy-system get ocirepository.source.toolkit.fluxcd.io $n -o json|ConvertFrom-Json;if([string]$s.spec.ref.digest -ne $env:RELEASE_PACKAGE_DIGEST){throw "$n reverted to $($s.spec.ref.digest)"}}
          $opDep=& $env:KUBECTL -n cozy-system get deploy cozystack-operator -o json|ConvertFrom-Json;$opImage=[string](@($opDep.spec.template.spec.containers|Where-Object{$_.name -eq 'cozystack-operator'}|Select-Object -First 1).image)
          if($opImage -ne $env:OPERATOR_IMAGE){throw "operator image reverted: $opImage"}
          $ag=& $env:KUBECTL -n cozy-system get artifactgenerator.source.extensions.fluxcd.io cozystack.cozystack-engine -o json|ConvertFrom-Json;$inv=@($ag.status.inventory|Where-Object{$_.name -eq 'cozystack-cozystack-engine-oidc-dashboard'}|Select-Object -First 1)
          if([string]$inv.digest -ne $artifact){throw "dashboard artifact drifted: $($inv.digest)"}
          $hr=& $env:KUBECTL -n cozy-dashboard get helmrelease dashboard -o json|ConvertFrom-Json
          if([string]$hr.status.lastAttemptedRevision -ne $expected){throw "dashboard revision drifted: $($hr.status.lastAttemptedRevision)"}
          $dep=& $env:KUBECTL -n cozy-dashboard get deploy cozy-dashboard-console -o json|ConvertFrom-Json;$image=[string](@($dep.spec.template.spec.containers|Where-Object{$_.name -eq 'console'}|Select-Object -First 1).image)
          if($image -ne $env:IMAGE_REF){throw "console image reverted: $image"}
          Write-Host "FINAL_DURABILITY=PASS package=$env:RELEASE_PACKAGE_DIGEST artifact=$artifact revision=$expected operator=$opImage image=$image"
          Write-Host 'LAYERSENTRY_VM_GUI_PRODUCTION_CERTIFICATION=PASS'

      - name: Restore exact baseline on certification failure
        if: failure()
        run: |
          $ErrorActionPreference='Stop';$bf=Join-Path $env:RUNNER_TEMP 'vm-force-baseline.json'
          if(-not(Test-Path $bf)){Write-Host 'FORCE_ROLLBACK_NOT_REQUIRED baseline=false';exit 0}
          $b=Get-Content $bf -Raw|ConvertFrom-Json
          $patch=[ordered]@{spec=[ordered]@{template=[ordered]@{spec=[ordered]@{containers=@([ordered]@{name='cozystack-operator';image=[string]$b.operatorImage;args=@($b.operatorArgs)})}}}}
          $f=Join-Path $env:RUNNER_TEMP 'force-rb-op.json';$patch|ConvertTo-Json -Depth 30|Set-Content $f -Encoding UTF8
          & $env:KUBECTL -n cozy-system patch deploy cozystack-operator --type=strategic "--patch-file=$f"|Out-Null
          if($LASTEXITCODE){throw 'rollback operator patch failed'}
          & $env:KUBECTL -n cozy-system rollout status deploy/cozystack-operator --timeout=300s|Out-Host
          if($LASTEXITCODE){throw 'rollback operator rollout failed'}
          $rbOp=& $env:KUBECTL -n cozy-system get deploy cozystack-operator -o json|ConvertFrom-Json;$rbOpImage=[string](@($rbOp.spec.template.spec.containers|Where-Object{$_.name -eq 'cozystack-operator'}|Select-Object -First 1).image)
          if($rbOpImage -ne [string]$b.operatorImage){throw "rollback operator image mismatch expected=$($b.operatorImage) actual=$rbOpImage"}
          foreach($n in @('cozystack-platform','cozystack-packages')){
            $sb=$b.sources.$n;$sp=[ordered]@{spec=[ordered]@{url=[string]$sb.url;ref=[ordered]@{digest=[string]$sb.digest;tag=$null;semver=$null;semverFilter=$null}}}
            $sf=Join-Path $env:RUNNER_TEMP "force-rb-$n.json";$sp|ConvertTo-Json -Depth 12|Set-Content $sf -Encoding UTF8
            & $env:KUBECTL -n cozy-system patch ocirepository.source.toolkit.fluxcd.io $n --type=merge "--patch-file=$sf"|Out-Null
          }
          $deadline=(Get-Date).AddMinutes(10);$srcOk=$false
          do{Start-Sleep 5;$srcOk=$true;foreach($n in @('cozystack-platform','cozystack-packages')){$s=& $env:KUBECTL -n cozy-system get ocirepository.source.toolkit.fluxcd.io $n -o json|ConvertFrom-Json;$r=@($s.status.conditions|Where-Object{$_.type -eq 'Ready'}|Select-Object -First 1);if([string]$s.spec.ref.digest -ne $env:BASE_PACKAGE_DIGEST -or $r.status -ne 'True' -or [string]$s.status.artifact.revision -notmatch [regex]::Escape($env:BASE_PACKAGE_DIGEST)){$srcOk=$false}}}while(-not$srcOk -and (Get-Date)-lt$deadline)
          if(-not$srcOk){throw 'rollback OCI sources did not restore baseline'}

          $forceSchedule=@(0,30,90,210,450,690)
          $forceIndex=0;$start=Get-Date;$deadline=$start.AddMinutes(14);$restored=$false
          do{
            $elapsed=[int]((Get-Date)-$start).TotalSeconds
            if($forceIndex -lt $forceSchedule.Count -and $elapsed -ge $forceSchedule[$forceIndex]){
              $ag=& $env:KUBECTL -n cozy-system get artifactgenerator.source.extensions.fluxcd.io cozystack.cozystack-engine -o json|ConvertFrom-Json
              $conditions=New-Object System.Collections.ArrayList
              foreach($condition in @($ag.status.conditions)){if([string]$condition.type -ne 'Ready'){[void]$conditions.Add($condition)}}
              $now=[DateTime]::UtcNow.ToString('o')
              [void]$conditions.Add([ordered]@{type='Ready';status='False';reason='SourceWatcherRecoveryForced';message="LayerSentry rollback bounded recovery attempt $($forceIndex+1)";observedGeneration=[long]$ag.metadata.generation;lastTransitionTime=$now})
              $statusPatch=[ordered]@{status=[ordered]@{conditions=@($conditions)}};$pf=Join-Path $env:RUNNER_TEMP 'force-rb-ag-status.json';$statusPatch|ConvertTo-Json -Depth 30|Set-Content $pf -Encoding UTF8
              & $env:KUBECTL -n cozy-system patch artifactgenerator.source.extensions.fluxcd.io cozystack.cozystack-engine --subresource=status --type=merge "--patch-file=$pf"|Out-Null
              if($LASTEXITCODE){throw 'rollback AG Ready=False drift patch failed'}
              & $env:KUBECTL -n cozy-system annotate artifactgenerator.source.extensions.fluxcd.io cozystack.cozystack-engine "reconcile.fluxcd.io/requestedAt=$now" --overwrite|Out-Null
              if($LASTEXITCODE){throw 'rollback AG enqueue failed'}
              $forceIndex++
            }
            Start-Sleep 5
            $ag=& $env:KUBECTL -n cozy-system get artifactgenerator.source.extensions.fluxcd.io cozystack.cozystack-engine -o json|ConvertFrom-Json
            $ready=@($ag.status.conditions|Where-Object{$_.type -eq 'Ready'}|Select-Object -First 1)
            $inv=@($ag.status.inventory|Where-Object{$_.name -eq 'cozystack-cozystack-engine-oidc-dashboard'}|Select-Object -First 1)
            $restored=($ready.status -eq 'True' -and [string]$inv.digest -eq [string]$b.dashboardArtifactDigest)
          }while(-not$restored -and (Get-Date)-lt$deadline)
          if(-not$restored){throw "rollback dashboard artifact mismatch attempts=$forceIndex expected=$($b.dashboardArtifactDigest) actual=$($inv.digest) ready=$($ready.status)/$($ready.reason)"}

          $stamp=[DateTime]::UtcNow.ToString('o');& $env:KUBECTL -n cozy-system annotate helmrelease cozystack-platform "reconcile.fluxcd.io/requestedAt=$stamp" --overwrite|Out-Null
          $deadline=(Get-Date).AddMinutes(8);do{Start-Sleep 5;$p=& $env:KUBECTL -n cozy-system get helmrelease cozystack-platform -o json|ConvertFrom-Json;$pr=@($p.status.conditions|Where-Object{$_.type -eq 'Ready'}|Select-Object -First 1)}while($pr.status -ne 'True' -and (Get-Date)-lt$deadline)
          if($pr.status -ne 'True'){throw 'rollback platform not Ready'}
          $post=$null;if([string]$b.postRenderersJson -ne 'null'){$post=[string]$b.postRenderersJson|ConvertFrom-Json}
          $hp=[ordered]@{spec=[ordered]@{postRenderers=$post}};$hf=Join-Path $env:RUNNER_TEMP 'force-rb-hr.json';$hp|ConvertTo-Json -Depth 80|Set-Content $hf -Encoding UTF8
          & $env:KUBECTL -n cozy-dashboard patch helmrelease dashboard --type=merge "--patch-file=$hf"|Out-Null
          $deadline=(Get-Date).AddMinutes(8)
          do{$hr=& $env:KUBECTL -n cozy-dashboard get helmrelease dashboard -o json|ConvertFrom-Json;$rr=@($hr.status.conditions|Where-Object{$_.type -eq 'Ready'}|Select-Object -First 1);if([string]$hr.status.lastAttemptedRevision -eq [string]$b.dashboardRevision -and $rr.status -eq 'True'){break};& $env:KUBECTL -n cozy-dashboard annotate helmrelease dashboard "reconcile.fluxcd.io/requestedAt=$([DateTime]::UtcNow.ToString('o'))" --overwrite|Out-Null;Start-Sleep 5}while((Get-Date)-lt$deadline)
          if([string]$hr.status.lastAttemptedRevision -ne [string]$b.dashboardRevision -or $rr.status -ne 'True'){throw "rollback dashboard revision mismatch expected=$($b.dashboardRevision) actual=$($hr.status.lastAttemptedRevision)"}
          & $env:KUBECTL -n cozy-dashboard rollout status deploy/cozy-dashboard-console --timeout=300s|Out-Host
          $dep=& $env:KUBECTL -n cozy-dashboard get deploy cozy-dashboard-console -o json|ConvertFrom-Json;$image=[string](@($dep.spec.template.spec.containers|Where-Object{$_.name -eq 'console'}|Select-Object -First 1).image)
          if($image -ne [string]$b.dashboardImage){throw "rollback image mismatch expected=$($b.dashboardImage) actual=$image"}
          Write-Host "FORCE_CERT_ROLLBACK=PASS package=$env:BASE_PACKAGE_DIGEST artifact=$($b.dashboardArtifactDigest) revision=$($b.dashboardRevision) operator=$rbOpImage image=$image"
