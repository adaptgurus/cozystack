name: LayerSentry Recover sen2 Through Verified VIP Continuation 11

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - hack/layersentry/sen2-vip-agent-continuation-requests-v11/*.json

permissions:
  contents: read

concurrency:
  group: layersentry-recover-sen2-vip-agent-continuation-11
  cancel-in-progress: false

jobs:
  recover:
    name: Recover sen2 agent role, prove stability, and validate authenticated runtime
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 105

    steps:
      - name: Checkout exact recovery request commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Initialize sanitized evidence root before every gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'layersentry-sen2-vip-agent-continuation-11'
          if (Test-Path -LiteralPath $evidenceRoot) {
            Remove-Item -LiteralPath $evidenceRoot -Recurse -Force
          }
          New-Item -Path $evidenceRoot -ItemType Directory -Force | Out-Null
          "EVIDENCE_ROOT=$evidenceRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'Sanitized evidence root initialized.'

      - name: Validate runner, unique request, endpoint contract, and execution sources
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $validationPath = Join-Path $env:EVIDENCE_ROOT 'validation-result.json'
          $passed = $false
          $failure = $null
          $requestPath = $null
          try {
            if ($env:COMPUTERNAME -cne 'TESTSER') {
              throw "Recovery is restricted to TESTSER; observed $env:COMPUTERNAME."
            }
            $identity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
            if ($identity -cne 'NT AUTHORITY\SYSTEM') {
              throw "Recovery runner must execute as NT AUTHORITY\SYSTEM; observed $identity."
            }
            Import-Module Hyper-V -ErrorAction Stop
            $switch = Get-VMSwitch -Name 'Cozystack-NAT' -ErrorAction Stop
            if ([string]$switch.SwitchType -cne 'Internal') {
              throw 'Cozystack-NAT must remain an Internal Hyper-V switch.'
            }

            [string[]]$requests = @(
              @(git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA -- 'hack/layersentry/sen2-vip-agent-continuation-requests-v11/*.json') |
                ForEach-Object { [string]$_ } |
                Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
            )
            if ($LASTEXITCODE -ne 0) {
              throw "git diff-tree failed with exit code $LASTEXITCODE."
            }
            if ($requests.Count -ne 1) {
              throw "Expected exactly one version-11 recovery request; found $($requests.Count)."
            }
            $requestPath = ([string]$requests[0]).Trim()
            $expectedRequestPath = 'hack/layersentry/sen2-vip-agent-continuation-requests-v11/20260902-recover-sen2-vip-endpoint-agent-services-11.json'
            if ($requestPath -cne $expectedRequestPath) {
              throw "Unexpected recovery request path: $requestPath"
            }

            $request = Get-Content -LiteralPath $requestPath -Raw -Encoding UTF8 | ConvertFrom-Json
            if ([string]$request.requestId -cne 'recover-sen2-vip-endpoint-agent-services-20260902-11') {
              throw 'The request ID is not the unique version-11 recovery request.'
            }
            if ([string]$request.operation -cne 'REPAIR_SEN2_AGENT_SERVICE_CONFLICT' -or
                [string]$request.authorization -cne 'USER_GRANTED_FULL_POWERSHELL_AND_INSTALL_PERMISSION') {
              throw 'The operation or authorization marker is invalid.'
            }
            if ([string]$request.targetNode -cne 'sen2' -or [string]$request.targetAddress -cne '10.10.10.12' -or
                [string]$request.peerNode -cne 'sen3' -or [string]$request.peerAddress -cne '10.10.10.13' -or
                [string]$request.primaryNode -cne '10.10.10.11') {
              throw 'The recovery request is not bound to sen1/sen2/sen3 lab addressing.'
            }
            if ([string]$request.expectedClusterVip -cne '10.10.10.10' -or
                [string]$request.expectedRancherdServerUrl -cne 'https://10.10.10.10:443' -or
                [string]$request.knownDriftedRancherdServerUrl -cne 'https://10.10.10.11:443' -or
                [string]$request.managementApiUrl -cne 'https://10.10.10.10') {
              throw 'The exact VIP, expected JOIN URL, known drift URL, or management URL contract is invalid.'
            }
            if ([string]$request.expectedRancherdRole -cne 'agent' -or
                [string]$request.expectedTargetMachineName -cne 'fleet-local/custom-81a2c5e94b13') {
              throw 'The request is not bound to the authoritative sen2 worker machine.'
            }

            $exactValues = [ordered]@{
              expectedCapiMachineUid = 'fbc63284-6a86-4827-b2df-477ece763cad'
              expectedRkeBootstrapUid = '7d1481a5-cff7-4903-bbc0-874b8d764c04'
              expectedCustomMachineUid = '54e8ea49-b617-475a-b422-4e1222fa768c'
              expectedPlanSecretUid = '73fb994b-8b32-4d9b-9599-a621ef934629'
              expectedOldPlanSha256 = 'b24c9bdb896734ac1cde0846f32d702b7e78de1c7ec2f9733b5a99bc9bad2b7f'
              previousCorrectedPlanSha256 = '1ecfe7272c42cb9453d277c0620e421986dd8ebbc97183b8209ea6384012798a'
              expectedCorrectedPlanSha256 = '1ecfe7272c42cb9453d277c0620e421986dd8ebbc97183b8209ea6384012798a'
              expectedKnownDriftedRancherdConfigSha256 = '4c5778d356d4e9dc077403e1fe55a45ff39573c1d5a63275fc5e6720e5237e5b'
              expectedSen2HarvesterConfigSha256 = '48dd0644d711693475a092b9c8f84955769a3176ff630c5a232180cd4eb90614'
              expectedSen1RancherdConfigSha256 = 'ccf33e69a631d37a351c599b25f60fcbc95262fac85592f676c56864de08600a'
              expectedSen1HarvesterConfigSha256 = '1cf23532b6fcdc685f8812199835570f1988048e21c9252db15268b0cadff614'
              expectedSen3RancherdConfigSha256 = '272950e988e3fb4e2c220f6f97e0b6293edad4fd06db0fe86782efa42143cdc8'
              expectedSen3HarvesterConfigSha256 = 'e2a2ac80ec1aa2946d9530cc6e4d3d2b6fb0d105051d6824d5f7498d0f118bef'
            }
            foreach ($entry in $exactValues.GetEnumerator()) {
              $property = $request.PSObject.Properties[[string]$entry.Key]
              if ($null -eq $property -or [string]$property.Value -cne [string]$entry.Value) {
                throw "Exact request binding failed for $($entry.Key)."
              }
            }

            foreach ($requiredTrue in @(
              'allowKnownRancherdServerDriftCorrection',
              'doNotChangeWorkingPeerConfiguration',
              'sourceCorrectionAlreadyPassed',
              'verifyAuthoritativeWorkerStateOnly',
              'comparePersistedJoinEndpointsReadOnly',
              'backupConfigurationBeforeRepair',
              'disableConflictingRke2Server',
              'enableRke2Agent',
              'rebootOnlySen2',
              'runAuthenticatedRuntimeValidation',
              'firstRunGuiSetupRequiresManualEulaAcceptance'
            )) {
              if (-not [bool]$request.$requiredTrue) {
                throw "Required request flag is false: $requiredTrue"
              }
            }
            if ([int]$request.requiredStableSamples -ne 24 -or [int]$request.stableIntervalSeconds -ne 30) {
              throw 'The request must require exactly 24 consecutive 30-second stability samples.'
            }
            foreach ($forbidden in @(
              'mutateAuthoritativeSource',
              'reinstallOrWipeDisks',
              'deleteRke2Data',
              'acceptEula',
              'writeCredentialValuesToEvidence',
              'publishKubeconfig',
              'productionReleaseApprovalImplied'
            )) {
              if ([bool]$request.$forbidden) {
                throw "Forbidden request flag is true: $forbidden"
              }
            }
            if (-not (Test-Path -LiteralPath 'C:\ProgramData\LayerSentry\bootstrap-credentials.json' -PathType Leaf)) {
              throw 'The protected bootstrap credential file is missing.'
            }

            foreach ($relative in @(
              'hack/layersentry/verify-sen2-worker-source-continuation-06.ps1',
              'hack/layersentry/verify-harvester-join-endpoint-continuation-09.ps1',
              'hack/layersentry/invoke-sen2-vip-agent-recovery-continuation-10.ps1',
              'hack/layersentry/repair-sen2-agent-service-conflict.ps1',
              'hack/layersentry/complete-three-node-runtime-continuation-07.ps1'
            )) {
              $tokens = $null
              $parseErrors = $null
              $resolved = (Resolve-Path -LiteralPath $relative).ProviderPath
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                $resolved,
                [ref]$tokens,
                [ref]$parseErrors
              )
              if ($parseErrors.Count -gt 0) {
                $message = ($parseErrors | ForEach-Object { "$($_.Extent.StartLineNumber):$($_.Message)" }) -join '; '
                throw "PowerShell parser rejected $relative: $message"
              }
            }

            $modulePath = (Resolve-Path -LiteralPath 'hack/layersentry/Sen2RancherdEndpointDecision.psm1').ProviderPath
            Import-Module -Name $modulePath -Force -ErrorAction Stop
            $expected = [string]$request.expectedRancherdServerUrl
            $knownDrift = [string]$request.knownDriftedRancherdServerUrl
            $alreadyExpected = Resolve-Sen2RancherdEndpointDecision `
              -ObservedRancherdServerUrl $expected `
              -ExpectedRancherdServerUrl $expected `
              -KnownDriftedRancherdServerUrl $knownDrift `
              -AllowKnownDriftCorrection $true
            $knownDriftDecision = Resolve-Sen2RancherdEndpointDecision `
              -ObservedRancherdServerUrl $knownDrift `
              -ExpectedRancherdServerUrl $expected `
              -KnownDriftedRancherdServerUrl $knownDrift `
              -AllowKnownDriftCorrection $true
            $unexpected = Resolve-Sen2RancherdEndpointDecision `
              -ObservedRancherdServerUrl 'https://10.10.10.99:443' `
              -ExpectedRancherdServerUrl $expected `
              -KnownDriftedRancherdServerUrl $knownDrift `
              -AllowKnownDriftCorrection $true
            if (-not [bool]$alreadyExpected.accepted -or [bool]$alreadyExpected.correctionRequired -or
                [int]$alreadyExpected.rejectionExitCode -ne 0) {
              throw 'The already-expected URL regression case failed.'
            }
            if (-not [bool]$knownDriftDecision.accepted -or -not [bool]$knownDriftDecision.correctionRequired -or
                [int]$knownDriftDecision.rejectionExitCode -ne 0) {
              throw 'The exact known-drift URL regression case failed.'
            }
            if ([bool]$unexpected.accepted -or [int]$unexpected.rejectionExitCode -ne 64) {
              throw 'Unexpected rancherd URLs must be rejected with exit code 64 before mutation.'
            }

            "REQUEST_PATH=$requestPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "EXPECTED_RANCHERD_SERVER_URL=$expected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "MANAGEMENT_API_URL=$([string]$request.managementApiUrl)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $passed = $true
            Write-Host "Validated unique recovery request: $requestPath"
            Write-Host 'Exact expected/known-drift/unexpected endpoint regression matrix: PASS'
          }
          catch {
            $failure = [string]$_.Exception.Message
            throw
          }
          finally {
            [ordered]@{
              schemaVersion = '1.0'
              sourceCommit = $env:GITHUB_SHA
              workflowRunId = $env:GITHUB_RUN_ID
              requestPath = $requestPath
              runnerHost = $env:COMPUTERNAME
              runnerIdentityExpected = 'NT AUTHORITY\SYSTEM'
              expectedRancherdServerUrl = 'https://10.10.10.10:443'
              knownDriftedRancherdServerUrl = 'https://10.10.10.11:443'
              managementApiUrl = 'https://10.10.10.10'
              exit64RegressionMatrixPassed = $passed
              credentialValuesWrittenToEvidence = $false
              kubeconfigWrittenToEvidence = $false
              passed = $passed
              failure = $failure
            } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $validationPath -Encoding UTF8
          }

      - name: Revalidate exact authoritative sen2 worker source through sen1 read only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $outputRoot = Join-Path $env:EVIDENCE_ROOT 'source-before'
          & 'hack/layersentry/verify-sen2-worker-source-continuation-06.ps1' `
            -RequestPath $env:REQUEST_PATH `
            -CredentialPath 'C:\ProgramData\LayerSentry\bootstrap-credentials.json' `
            -OutputDirectory $outputRoot
          $result = Get-Content -LiteralPath (Join-Path $outputRoot 'source-verification-result.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if (-not [bool]$result.passed -or
              [bool]$result.mutationAttempted -or
              [int]$result.mutationsApplied -ne 0 -or
              [bool]$result.rancherObjectsModified) {
            throw "Authoritative worker-source gate failed: $($result.failure)"
          }
          Write-Host 'LAYERSENTRY CURRENT AUTHORITATIVE WORKER SOURCE: PASS'

      - name: Compare sen2 and sen3 rancherd server URLs and verify plan through sen1 read only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $outputRoot = Join-Path $env:EVIDENCE_ROOT 'endpoint-before'
          New-Item -Path $outputRoot -ItemType Directory -Force | Out-Null
          $contractPath = Join-Path $outputRoot 'rancherd-endpoint-contract-result.json'
          $passed = $false
          $failure = $null
          $result = $null
          $request = Get-Content -LiteralPath $env:REQUEST_PATH -Raw -Encoding UTF8 | ConvertFrom-Json
          try {
            & 'hack/layersentry/verify-harvester-join-endpoint-continuation-09.ps1' `
              -RequestPath 'hack/layersentry/harvester-join-endpoint-verification-requests/20260902-verify-harvester-join-endpoint-from-vip-09.json' `
              -CredentialPath 'C:\ProgramData\LayerSentry\bootstrap-credentials.json' `
              -OutputDirectory $outputRoot

            $resultPath = Join-Path $outputRoot 'join-endpoint-verification-result.json'
            $result = Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 | ConvertFrom-Json
            if (-not [bool]$result.verificationPassed) {
              throw "Persisted endpoint verification failed: $($result.failure)"
            }
            if ([string]$result.authoritativeJoinServerUrl -cne [string]$request.expectedRancherdServerUrl) {
              throw 'sen1 persisted cluster VIP no longer derives the exact requested JOIN endpoint.'
            }
            if ([string]$result.sen3.rancherdServer -cne [string]$request.expectedRancherdServerUrl) {
              throw 'Healthy sen3 rancherd .server no longer exactly matches the VIP JOIN endpoint.'
            }
            if ([string]$result.sen3.role -cne 'agent' -or [string]$result.sen3.installMode -cne 'join') {
              throw 'Healthy sen3 is no longer an agent/join comparison peer.'
            }
            if ([string]$result.sen1.rancherdConfigSha256 -cne [string]$request.expectedSen1RancherdConfigSha256 -or
                [string]$result.sen1.harvesterConfigSha256 -cne [string]$request.expectedSen1HarvesterConfigSha256) {
              throw 'sen1 persisted configuration hashes changed after the verified endpoint run.'
            }
            if ([string]$result.sen3.rancherdConfigSha256 -cne [string]$request.expectedSen3RancherdConfigSha256 -or
                [string]$result.sen3.harvesterConfigSha256 -cne [string]$request.expectedSen3HarvesterConfigSha256) {
              throw 'sen3 persisted configuration hashes changed after the verified endpoint run.'
            }
            $observedSen2 = [string]$result.sen2.rancherdServer
            if ($observedSen2 -cne [string]$request.expectedRancherdServerUrl -and
                $observedSen2 -cne [string]$request.knownDriftedRancherdServerUrl) {
              throw "sen2 has an unexpected rancherd .server URL: $observedSen2"
            }
            if ($observedSen2 -ceq [string]$request.knownDriftedRancherdServerUrl -and
                [string]$result.sen2.rancherdConfigSha256 -cne [string]$request.expectedKnownDriftedRancherdConfigSha256) {
              throw 'sen2 known-drift rancherd configuration hash changed after the verified endpoint run.'
            }
            if ([string]$result.sen2.harvesterConfigSha256 -cne [string]$request.expectedSen2HarvesterConfigSha256) {
              throw 'sen2 Harvester configuration changed after the verified endpoint run.'
            }
            if (-not [bool]$result.readOnly -or
                [bool]$result.authoritativeSourceModified -or
                [bool]$result.configurationModified -or
                [bool]$result.servicesModified -or
                [bool]$result.rebootPerformed) {
              throw 'The endpoint comparison violated its read-only invariant.'
            }
            $passed = $true
            Write-Host "sen1 authoritative JOIN endpoint: $($result.authoritativeJoinServerUrl)"
            Write-Host "sen2 rancherd .server: $($result.sen2.rancherdServer)"
            Write-Host "sen3 rancherd .server: $($result.sen3.rancherdServer)"
            Write-Host 'Harvester server_url remains diagnostic only; rancherd .server is the exact recovery gate.'
          }
          catch {
            $failure = [string]$_.Exception.Message
            throw
          }
          finally {
            [ordered]@{
              schemaVersion = '1.0'
              verificationReadOnly = $true
              expectedRancherdServerUrl = [string]$request.expectedRancherdServerUrl
              knownDriftedRancherdServerUrl = [string]$request.knownDriftedRancherdServerUrl
              authoritativeJoinServerUrl = if ($null -ne $result) { [string]$result.authoritativeJoinServerUrl } else { $null }
              sen2RancherdServerUrl = if ($null -ne $result) { [string]$result.sen2.rancherdServer } else { $null }
              sen3RancherdServerUrl = if ($null -ne $result) { [string]$result.sen3.rancherdServer } else { $null }
              sen3HarvesterServerUrlDiagnostic = if ($null -ne $result) { [string]$result.sen3.harvesterServerUrl } else { $null }
              sen3RancherdServerExactMatch = (
                $null -ne $result -and
                [string]$result.sen3.rancherdServer -ceq [string]$request.expectedRancherdServerUrl
              )
              sen2EndpointAcceptedForRecovery = (
                $null -ne $result -and (
                  [string]$result.sen2.rancherdServer -ceq [string]$request.expectedRancherdServerUrl -or
                  [string]$result.sen2.rancherdServer -ceq [string]$request.knownDriftedRancherdServerUrl
                )
              )
              authoritativeSourceModified = $false
              nodeConfigurationModified = $false
              servicesModified = $false
              nodeRebooted = $false
              passed = $passed
              failure = $failure
            } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $contractPath -Encoding UTF8
          }

      - name: Correct only exact known sen2 endpoint drift and recover agent services
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $outputRoot = Join-Path $env:EVIDENCE_ROOT 'repair'
          & 'hack/layersentry/invoke-sen2-vip-agent-recovery-continuation-10.ps1' `
            -RequestPath $env:REQUEST_PATH `
            -CredentialPath 'C:\ProgramData\LayerSentry\bootstrap-credentials.json' `
            -OutputDirectory $outputRoot `
            -InitialWaitMinutes 15 `
            -StableSamples 24 `
            -StableIntervalSeconds 30
          $result = Get-Content -LiteralPath (Join-Path $outputRoot 'vip-agent-recovery-result.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if (-not [bool]$result.passed -or
              [string]$result.expectedRancherdServerUrl -cne $env:EXPECTED_RANCHERD_SERVER_URL -or
              -not [bool]$result.exit64RegressionTestsPassed -or
              -not [bool]$result.endpointBackupCreated -or
              -not [bool]$result.rke2ServerDisabled -or
              -not [bool]$result.rke2AgentEnabled -or
              [string]$result.rebootedNode -cne 'sen2' -or
              [int]$result.consecutiveStableSamples -ne 24 -or
              [int]$result.stabilityIntervalSeconds -ne 30) {
            throw "sen2 VIP-agent recovery gate failed: $($result.failure)"
          }
          Write-Host 'LAYERSENTRY SEN2 VIP ENDPOINT AND AGENT SERVICE RECOVERY: PASS'

      - name: Run authenticated Kubernetes KubeVirt and Longhorn validation through VIP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $outputRoot = Join-Path $env:EVIDENCE_ROOT 'runtime'
          & 'hack/layersentry/complete-three-node-runtime-continuation-07.ps1' `
            -ClusterUrl $env:MANAGEMENT_API_URL `
            -PrimaryNode '10.10.10.11' `
            -NodeAddresses @('10.10.10.11', '10.10.10.12', '10.10.10.13') `
            -CredentialPath 'C:\ProgramData\LayerSentry\bootstrap-credentials.json' `
            -BaseRuntimeMaxWaitMinutes 20 `
            -AuthenticatedResourceMaxWaitMinutes 10 `
            -OutputDirectory $outputRoot
          $result = Get-Content -LiteralPath (Join-Path $outputRoot 'runtime-completion.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if (-not [bool]$result.passed -or
              -not [bool]$result.authenticatedKubernetesKubeVirtLonghornValidationPassed -or
              [string]$result.clusterUrl -cne 'https://10.10.10.10') {
            throw "Authenticated runtime gate failed: $($result.failure)"
          }
          Write-Host 'LAYERSENTRY AUTHENTICATED KUBERNETES KUBEVIRT LONGHORN VALIDATION: PASS'

      - name: Build sanitized terminal recovery result
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $root = Join-Path $env:RUNNER_TEMP 'layersentry-sen2-vip-agent-continuation-11'
          New-Item -Path $root -ItemType Directory -Force | Out-Null
          $terminalRoot = Join-Path $root 'terminal'
          New-Item -Path $terminalRoot -ItemType Directory -Force | Out-Null

          function Read-JsonIfPresent {
            param([string]$Path)
            if (Test-Path -LiteralPath $Path -PathType Leaf) {
              try {
                return Get-Content -LiteralPath $Path -Raw -Encoding UTF8 | ConvertFrom-Json
              }
              catch {
                return $null
              }
            }
            return $null
          }

          $validation = Read-JsonIfPresent (Join-Path $root 'validation-result.json')
          $source = Read-JsonIfPresent (Join-Path $root 'source-before\source-verification-result.json')
          $endpoint = Read-JsonIfPresent (Join-Path $root 'endpoint-before\rancherd-endpoint-contract-result.json')
          $repair = Read-JsonIfPresent (Join-Path $root 'repair\vip-agent-recovery-result.json')
          $runtime = Read-JsonIfPresent (Join-Path $root 'runtime\runtime-completion.json')

          $validationPassed = $null -ne $validation -and [bool]$validation.passed
          $sourcePassed = $null -ne $source -and [bool]$source.passed -and -not [bool]$source.mutationAttempted -and [int]$source.mutationsApplied -eq 0 -and -not [bool]$source.rancherObjectsModified
          $endpointPassed = $null -ne $endpoint -and [bool]$endpoint.passed -and [bool]$endpoint.verificationReadOnly -and [bool]$endpoint.sen3RancherdServerExactMatch -and [bool]$endpoint.sen2EndpointAcceptedForRecovery
          $repairPassed = $null -ne $repair -and [bool]$repair.passed -and [bool]$repair.exit64RegressionTestsPassed -and [bool]$repair.endpointBackupCreated -and [bool]$repair.rke2ServerDisabled -and [bool]$repair.rke2AgentEnabled -and [string]$repair.rebootedNode -ceq 'sen2' -and [int]$repair.consecutiveStableSamples -eq 24 -and [int]$repair.stabilityIntervalSeconds -eq 30
          $runtimePassed = $null -ne $runtime -and [bool]$runtime.passed -and [bool]$runtime.authenticatedKubernetesKubeVirtLonghornValidationPassed -and [string]$runtime.clusterUrl -ceq 'https://10.10.10.10'
          $forbiddenMutationAbsent = (
            ($null -eq $repair -or (
              -not [bool]$repair.authoritativeSourceModified -and
              -not [bool]$repair.rke2DataDeleted -and
              -not [bool]$repair.vmDiskWiped -and
              -not [bool]$repair.vmReinstalled -and
              -not [bool]$repair.credentialValuesWrittenToEvidence -and
              -not [bool]$repair.kubeconfigWrittenToEvidence -and
              -not [bool]$repair.eulaAutomaticallyAccepted -and
              -not [bool]$repair.productionReleaseApproved
            )) -and
            ($null -eq $runtime -or (
              -not [bool]$runtime.credentialValuesWrittenToEvidence -and
              -not [bool]$runtime.kubeconfigWrittenToEvidence -and
              -not [bool]$runtime.eulaAutomaticallyAccepted -and
              -not [bool]$runtime.productionReleaseApproved
            ))
          )
          $overall = $validationPassed -and $sourcePassed -and $endpointPassed -and $repairPassed -and $runtimePassed -and $forbiddenMutationAbsent

          $failure = if (-not $validationPassed -and $null -ne $validation) {
            [string]$validation.failure
          } elseif (-not $sourcePassed -and $null -ne $source) {
            [string]$source.failure
          } elseif (-not $endpointPassed -and $null -ne $endpoint) {
            [string]$endpoint.failure
          } elseif (-not $repairPassed -and $null -ne $repair) {
            [string]$repair.failure
          } elseif (-not $runtimePassed -and $null -ne $runtime) {
            [string]$runtime.failure
          } elseif (-not $validationPassed) {
            'Validation evidence is missing.'
          } elseif (-not $sourcePassed) {
            'Authoritative worker-source evidence is missing or failed.'
          } elseif (-not $endpointPassed) {
            'Read-only rancherd endpoint-contract evidence is missing or failed.'
          } elseif (-not $repairPassed) {
            'sen2 recovery evidence is missing or failed.'
          } elseif (-not $runtimePassed) {
            'Authenticated runtime evidence is missing or failed.'
          } elseif (-not $forbiddenMutationAbsent) {
            'A forbidden mutation or evidence-exposure flag was detected.'
          } else {
            $null
          }

          [ordered]@{
            schemaVersion = '1.0'
            sourceCommit = $env:GITHUB_SHA
            workflowRunId = $env:GITHUB_RUN_ID
            completedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            validationPassed = $validationPassed
            authoritativeWorkerSourceReadOnlyPassed = $sourcePassed
            rancherdEndpointContractReadOnlyPassed = $endpointPassed
            sen2RecoveryPassed = $repairPassed
            expectedRancherdServerUrl = if ($null -ne $repair) { [string]$repair.expectedRancherdServerUrl } else { 'https://10.10.10.10:443' }
            observedPreRepairRancherdServerUrl = if ($null -ne $repair) { [string]$repair.observedRancherdServerUrl } else { $null }
            endpointDecision = if ($null -ne $repair) { [string]$repair.endpointDecision } else { $null }
            endpointBackupCreated = if ($null -ne $repair) { [bool]$repair.endpointBackupCreated } else { $false }
            rke2ServerDisabled = if ($null -ne $repair) { [bool]$repair.rke2ServerDisabled } else { $false }
            rke2AgentEnabled = if ($null -ne $repair) { [bool]$repair.rke2AgentEnabled } else { $false }
            rebootedNode = if ($null -ne $repair) { [string]$repair.rebootedNode } else { $null }
            consecutiveStabilitySamples = if ($null -ne $repair) { [int]$repair.consecutiveStableSamples } else { 0 }
            requiredStabilitySamples = 24
            stabilityIntervalSeconds = 30
            authenticatedKubernetesKubeVirtLonghornValidationPassed = $runtimePassed
            managementApiUrl = 'https://10.10.10.10'
            forbiddenMutationAbsent = $forbiddenMutationAbsent
            rke2DataDeleted = $false
            vmDiskWiped = $false
            vmReinstalled = $false
            credentialValuesWrittenToEvidence = $false
            kubeconfigWrittenToEvidence = $false
            eulaAutomaticallyAccepted = $false
            firstRunGuiSetupStillManual = $true
            frontendRebrandingTrackStarted = $false
            productionReleaseApproved = $false
            recoveryGatePassed = $overall
            failure = $failure
          } | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $terminalRoot 'terminal-result.json') -Encoding UTF8

          @"
          # LayerSentry sen2 recovery continuation 11

          - Validation and exit-code-64 regression matrix: **$validationPassed**
          - Authoritative worker source revalidated read only: **$sourcePassed**
          - sen2/sen3 rancherd endpoint contract revalidated read only: **$endpointPassed**
          - sen2 endpoint/service recovery passed: **$repairPassed**
          - sen2 consecutive stability samples: **$(if ($null -ne $repair) { [int]$repair.consecutiveStableSamples } else { 0 }) / 24**
          - Authenticated Kubernetes/KubeVirt/Longhorn validation through VIP: **$runtimePassed**
          - Forbidden mutation absent: **$forbiddenMutationAbsent**
          - EULA automatically accepted: **false**
          - First-run GUI setup remains manual: **true**
          - Frontend rebranding track started: **false**
          - Production release approved: **false**
          - Recovery gate passed: **$overall**
          - Failure: $failure
          "@ | Set-Content -LiteralPath (Join-Path $terminalRoot 'STATUS.md') -Encoding UTF8

          $marker = if ($overall) { 'SUCCESS' } else { 'FAILURE' }
          New-Item -Path (Join-Path $terminalRoot $marker) -ItemType File -Force | Out-Null
          Get-Content -LiteralPath (Join-Path $terminalRoot 'STATUS.md')

      - name: Upload sanitized recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layersentry-sen2-vip-agent-continuation-11-${{ github.run_id }}
          path: ${{ runner.temp }}\layersentry-sen2-vip-agent-continuation-11
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce complete recovery gate
        if: always()
        shell: powershell
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP 'layersentry-sen2-vip-agent-continuation-11\terminal\terminal-result.json'
          if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) {
            throw 'Terminal recovery result is missing.'
          }
          $result = Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if (-not [bool]$result.recoveryGatePassed) {
            throw "LayerSentry sen2 recovery continuation 11 failed: $($result.failure)"
          }
          if ([int]$result.consecutiveStabilitySamples -ne 24 -or [int]$result.stabilityIntervalSeconds -ne 30) {
            throw 'The required 24 consecutive 30-second stability samples were not proven.'
          }
          if ([string]$result.rebootedNode -cne 'sen2') {
            throw 'The terminal gate did not prove that only sen2 was rebooted.'
          }
          if ([bool]$result.eulaAutomaticallyAccepted -or [bool]$result.productionReleaseApproved) {
            throw 'The terminal evidence contains a prohibited EULA or release-approval state.'
          }
          Write-Host 'LAYERSENTRY SEN2 RECOVERY, 24/24 STABILITY, AND AUTHENTICATED RUNTIME GATE: PASS'
