name: LayerSentry Dashboard OIDC Persist Final

on:
  push:
    branches:
      - layersentry-platform
    paths:
      - .github/workflows/layersentry-dashboard-oidc-persist-final.yml
  workflow_dispatch:

concurrency:
  group: layersentry-dashboard-oidc-persist-final
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: powershell

jobs:
  repair-and-certify:
    name: Persist and certify dashboard tenant authentication on TESTSER
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    env:
      KUBECONFIG: C:\hci-state\cozystack-hci-lab\kubeconfig
      KUBECTL: C:\hci-tools\kubectl.exe
      GUI_USERNAME: layersentry-admin
    steps:
      - name: Preflight tenant and persist corrected auth through Helm post-renderer
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Test-Path $env:KUBECTL)){throw "kubectl missing: $env:KUBECTL"}
          if(-not (Test-Path $env:KUBECONFIG)){throw "kubeconfig missing: $env:KUBECONFIG"}

          $tenant=& $env:KUBECTL -n tenant-root get tenant.apps.cozystack.io layersentry -o json | ConvertFrom-Json
          if(-not $tenant){throw 'layersentry tenant missing'}
          $ready=@($tenant.status.conditions | Where-Object {$_.type -eq 'Ready'} | Select-Object -First 1)
          if($ready.status -ne 'True'){throw "layersentry tenant not Ready: $($ready.message)"}
          $phase=(& $env:KUBECTL get namespace tenant-layersentry -o jsonpath='{.status.phase}' | Out-String).Trim()
          if($phase -ne 'Active'){throw "tenant-layersentry namespace is not Active: $phase"}

          $dep=& $env:KUBECTL -n cozy-dashboard get deployment incloud-web-gatekeeper -o json | ConvertFrom-Json
          $containers=@($dep.spec.template.spec.containers)
          $proxy=@($containers | Where-Object {$_.name -eq 'auth-proxy'} | Select-Object -First 1)
          if(-not $proxy){throw 'dashboard auth-proxy container missing'}
          $args=New-Object System.Collections.Generic.List[string]
          $scopeSeen=$false
          foreach($arg in @($proxy.args)){
            $s=[string]$arg
            if($s -like '--scope=*'){
              $args.Add('--scope=openid email profile')
              $scopeSeen=$true
            } else {
              $args.Add($s)
            }
          }
          if(-not $scopeSeen){$args.Add('--scope=openid email profile')}
          if(@($args | Where-Object {$_ -match 'offline_access'}).Count -gt 0){throw 'failed to remove offline_access from desired args'}

          $deploymentPatch=[ordered]@{
            apiVersion='apps/v1'
            kind='Deployment'
            metadata=[ordered]@{name='incloud-web-gatekeeper'}
            spec=[ordered]@{
              template=[ordered]@{
                spec=[ordered]@{
                  containers=@(
                    [ordered]@{name='auth-proxy';args=@($args)}
                  )
                }
              }
            }
          } | ConvertTo-Json -Depth 30

          $keycloakPatch=[ordered]@{
            apiVersion='v1.edp.epam.com/v1'
            kind='KeycloakClient'
            metadata=[ordered]@{name='dashboard-client'}
            spec=[ordered]@{optionalClientScopes=@()}
          } | ConvertTo-Json -Depth 20

          $hr=& $env:KUBECTL -n cozy-dashboard get helmrelease dashboard -o json | ConvertFrom-Json
          if(-not $hr){throw 'cozy-dashboard/dashboard HelmRelease missing'}
          $existing=@()
          if($null -ne $hr.spec.postRenderers){$existing=@($hr.spec.postRenderers)}
          $filtered=New-Object System.Collections.ArrayList
          foreach($renderer in $existing){
            $ours=$false
            if($renderer.kustomize -and $renderer.kustomize.patches){
              foreach($p in @($renderer.kustomize.patches)){
                $kind=[string]$p.target.kind
                $name=[string]$p.target.name
                $text=[string]$p.patch
                if(($kind -eq 'Deployment' -and $name -eq 'incloud-web-gatekeeper' -and $text -match '--scope=openid email profile') -or
                   ($kind -eq 'KeycloakClient' -and $name -eq 'dashboard-client' -and $text -match 'optionalClientScopes')){
                  $ours=$true
                }
              }
            }
            if(-not $ours){[void]$filtered.Add($renderer)}
          }

          $renderer=[ordered]@{
            kustomize=[ordered]@{
              patches=@(
                [ordered]@{
                  target=[ordered]@{group='apps';version='v1';kind='Deployment';name='incloud-web-gatekeeper'}
                  patch=$deploymentPatch
                },
                [ordered]@{
                  target=[ordered]@{group='v1.edp.epam.com';version='v1';kind='KeycloakClient';name='dashboard-client'}
                  patch=$keycloakPatch
                }
              )
            }
          }
          [void]$filtered.Add($renderer)
          $patch=[ordered]@{spec=[ordered]@{postRenderers=@($filtered)}}
          $file=Join-Path $env:RUNNER_TEMP 'dashboard-oidc-persist.json'
          $patch | ConvertTo-Json -Depth 50 | Set-Content -Path $file -Encoding UTF8
          & $env:KUBECTL -n cozy-dashboard patch helmrelease dashboard --type=merge "--patch-file=$file" | Out-Null
          if($LASTEXITCODE -ne 0){throw 'failed to persist dashboard auth postRenderer'}
          Write-Host "OIDC_PERSIST_RENDERER=PASS existingPreserved=$($filtered.Count-1) desiredScope='openid email profile'"

      - name: Force Flux reconcile and prove corrected scope is durable
        run: |
          $ErrorActionPreference='Stop'
          $stamp=[DateTime]::UtcNow.ToString('o')
          & $env:KUBECTL -n cozy-dashboard annotate helmrelease dashboard "reconcile.fluxcd.io/requestedAt=$stamp" --overwrite | Out-Null
          if($LASTEXITCODE -ne 0){throw 'failed to request dashboard reconcile'}

          $deadline=(Get-Date).AddMinutes(6)
          $handled=''
          $ready=$null
          do{
            Start-Sleep -Seconds 5
            $hr=& $env:KUBECTL -n cozy-dashboard get helmrelease dashboard -o json | ConvertFrom-Json
            $handled=[string]$hr.status.lastHandledReconcileAt
            $ready=@($hr.status.conditions | Where-Object {$_.type -eq 'Ready'} | Select-Object -First 1)
            if($handled -eq $stamp -and $ready.status -eq 'True'){break}
          }while((Get-Date) -lt $deadline)
          if($handled -ne $stamp){throw "Flux did not handle reconcile request: requested=$stamp handled=$handled"}
          if($ready.status -ne 'True'){throw "dashboard HelmRelease not Ready after reconcile: $($ready.message)"}

          & $env:KUBECTL -n cozy-dashboard rollout status deployment/incloud-web-gatekeeper --timeout=180s
          if($LASTEXITCODE -ne 0){throw 'dashboard gatekeeper rollout not Ready'}
          $dep=& $env:KUBECTL -n cozy-dashboard get deployment incloud-web-gatekeeper -o json | ConvertFrom-Json
          $proxy=@($dep.spec.template.spec.containers | Where-Object {$_.name -eq 'auth-proxy'} | Select-Object -First 1)
          $scope=@($proxy.args | Where-Object {$_ -like '--scope=*'})
          if($scope.Count -ne 1 -or $scope[0] -ne '--scope=openid email profile'){
            throw "dashboard scope reverted after Helm reconcile: $($scope -join ',')"
          }
          if(($proxy.args -join ' ') -match 'offline_access'){throw 'offline_access still present after Helm reconcile'}

          $kcExists=(& $env:KUBECTL api-resources --api-group=v1.edp.epam.com -o name 2>$null | Select-String -Pattern '^keycloakclients' -Quiet)
          if($kcExists){
            $kc=& $env:KUBECTL -n cozy-dashboard get keycloakclient dashboard-client -o json 2>$null | ConvertFrom-Json
            if($kc -and @($kc.spec.optionalClientScopes) -contains 'offline_access'){
              throw 'Keycloak dashboard client still exposes offline_access after reconcile'
            }
          }
          Write-Host "HELM_DURABILITY=PASS scope=$($scope[0]) offlineAccess=false"

      - name: Invalidate stale dashboard sessions and restart gatekeeper
        run: |
          $ErrorActionPreference='Stop'
          $rng=[Security.Cryptography.RandomNumberGenerator]::Create()
          $bytes=New-Object byte[] 16
          $rng.GetBytes($bytes)
          $alphabet='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789'
          $sb=New-Object Text.StringBuilder
          foreach($x in $bytes){[void]$sb.Append($alphabet[$x % $alphabet.Length])}
          $cookie=$sb.ToString()
          Write-Output "::add-mask::$cookie"
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($cookie))
          Write-Output "::add-mask::$b64"
          $hashBefore=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($cookie))).ToLowerInvariant()
          $secretPatch=[ordered]@{data=[ordered]@{cookieSecret=$b64}}
          $file=Join-Path $env:RUNNER_TEMP 'dashboard-cookie-rotate.json'
          $secretPatch | ConvertTo-Json -Compress -Depth 5 | Set-Content -Path $file -Encoding ASCII
          & $env:KUBECTL -n cozy-dashboard patch secret dashboard-auth-config --type=merge "--patch-file=$file" | Out-Null
          if($LASTEXITCODE -ne 0){throw 'dashboard cookie rotation failed'}
          & $env:KUBECTL -n cozy-dashboard rollout restart deployment/incloud-web-gatekeeper | Out-Null
          & $env:KUBECTL -n cozy-dashboard rollout status deployment/incloud-web-gatekeeper --timeout=180s
          if($LASTEXITCODE -ne 0){throw 'gatekeeper restart failed'}
          "COOKIE_HASH=$hashBefore" | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'cookie-hash.txt') -Encoding ASCII
          Write-Host 'STALE_SESSION_INVALIDATION=PASS'

      - name: Reconcile again and prove the repair survives
        run: |
          $ErrorActionPreference='Stop'
          $stamp=[DateTime]::UtcNow.ToString('o')
          & $env:KUBECTL -n cozy-dashboard annotate helmrelease dashboard "reconcile.fluxcd.io/requestedAt=$stamp" --overwrite | Out-Null
          if($LASTEXITCODE -ne 0){throw 'failed to request second dashboard reconcile'}
          $deadline=(Get-Date).AddMinutes(6)
          do{
            Start-Sleep -Seconds 5
            $hr=& $env:KUBECTL -n cozy-dashboard get helmrelease dashboard -o json | ConvertFrom-Json
            $handled=[string]$hr.status.lastHandledReconcileAt
            $ready=@($hr.status.conditions | Where-Object {$_.type -eq 'Ready'} | Select-Object -First 1)
            if($handled -eq $stamp -and $ready.status -eq 'True'){break}
          }while((Get-Date) -lt $deadline)
          if($handled -ne $stamp -or $ready.status -ne 'True'){throw 'second Helm reconcile did not complete Ready'}
          & $env:KUBECTL -n cozy-dashboard rollout status deployment/incloud-web-gatekeeper --timeout=180s
          if($LASTEXITCODE -ne 0){throw 'gatekeeper not Ready after second reconcile'}

          $dep=& $env:KUBECTL -n cozy-dashboard get deployment incloud-web-gatekeeper -o json | ConvertFrom-Json
          $proxy=@($dep.spec.template.spec.containers | Where-Object {$_.name -eq 'auth-proxy'} | Select-Object -First 1)
          $scope=@($proxy.args | Where-Object {$_ -like '--scope=*'})
          if($scope.Count -ne 1 -or $scope[0] -ne '--scope=openid email profile'){throw "scope reverted on second reconcile: $($scope -join ',')"}

          $cookieB64=(& $env:KUBECTL -n cozy-dashboard get secret dashboard-auth-config -o jsonpath='{.data.cookieSecret}' | Out-String).Trim()
          Write-Output "::add-mask::$cookieB64"
          $cookie=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($cookieB64))
          Write-Output "::add-mask::$cookie"
          $actualHash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($cookie))).ToLowerInvariant()
          $expected=((Get-Content (Join-Path $env:RUNNER_TEMP 'cookie-hash.txt') -Raw).Trim() -split '=')[1]
          if($actualHash -ne $expected){throw 'dashboard cookie secret reverted during Helm reconcile'}
          Write-Host 'SECOND_RECONCILE_DURABILITY=PASS'

      - name: Prove real browser OAuth session returns HTTP 200 for tenant and Plan APIs
        run: |
          $ErrorActionPreference='Stop'
          $pwdB64=(& $env:KUBECTL -n cozy-system get secret layersentry-gui-admin-password -o jsonpath='{.data.password}' | Out-String).Trim()
          if(-not $pwdB64){throw 'layersentry GUI admin password secret is empty'}
          Write-Output "::add-mask::$pwdB64"
          $password=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($pwdB64))
          Write-Output "::add-mask::$password"

          $dashboardHost=(& $env:KUBECTL -n cozy-dashboard get ingress -o json | ConvertFrom-Json).items | ForEach-Object {$_.spec.rules[0].host} | Where-Object {$_ -like 'dashboard.*'} | Select-Object -First 1
          if(-not $dashboardHost){throw 'dashboard ingress host not found'}
          $startUrl="https://$dashboardHost/marketplace/tenant"
          $jar=Join-Path $env:RUNNER_TEMP 'dashboard-browser.cookies'

          $h1=Join-Path $env:RUNNER_TEMP 'dashboard-start.headers'
          & curl.exe -k -sS -c $jar -b $jar -D $h1 -o NUL --max-time 30 $startUrl
          if($LASTEXITCODE -ne 0){throw 'initial dashboard request failed'}
          $headers1=Get-Content $h1 -Raw
          $status1=[regex]::Match($headers1,'HTTP/\S+\s+(\d{3})').Groups[1].Value
          $location1=([regex]::Match($headers1,'(?im)^location:\s*(.+)$')).Groups[1].Value.Trim()
          if($status1 -notin @('302','303') -or $location1 -notmatch '/realms/cozy/protocol/openid-connect/auth'){
            throw "dashboard did not start OIDC login: HTTP=$status1 location=$location1"
          }

          $h2=Join-Path $env:RUNNER_TEMP 'dashboard-login.headers'
          $b2=Join-Path $env:RUNNER_TEMP 'dashboard-login.html'
          & curl.exe -k -sS -c $jar -b $jar -D $h2 -o $b2 --max-time 30 $location1
          if($LASTEXITCODE -ne 0){throw 'Keycloak login page request failed'}
          $html=Get-Content $b2 -Raw
          $m=[regex]::Match($html,'<form[^>]*id="kc-form-login"[^>]*action="([^"]+)"',[Text.RegularExpressions.RegexOptions]::IgnoreCase)
          if(-not $m.Success){$m=[regex]::Match($html,'<form[^>]*action="([^"]+)"',[Text.RegularExpressions.RegexOptions]::IgnoreCase)}
          if(-not $m.Success){throw 'Keycloak login form not found'}
          $action=[Net.WebUtility]::HtmlDecode($m.Groups[1].Value)

          $h3=Join-Path $env:RUNNER_TEMP 'dashboard-submit.headers'
          & curl.exe -k -sS -c $jar -b $jar -D $h3 -o NUL --max-time 30 -X POST $action --data-urlencode "username=$env:GUI_USERNAME" --data-urlencode "password=$password" --data-urlencode 'credentialId='
          if($LASTEXITCODE -ne 0){throw 'Keycloak credential submit failed'}
          $headers3=Get-Content $h3 -Raw
          $status3=[regex]::Match($headers3,'HTTP/\S+\s+(\d{3})').Groups[1].Value
          $location3=([regex]::Match($headers3,'(?im)^location:\s*(.+)$')).Groups[1].Value.Trim()
          if($status3 -notin @('302','303') -or $location3 -notlike "https://$dashboardHost/oauth2/callback*"){
            throw "credentials did not reach dashboard OAuth callback: HTTP=$status3 location=$location3"
          }

          $h4=Join-Path $env:RUNNER_TEMP 'dashboard-callback.headers'
          & curl.exe -k -sS -c $jar -b $jar -D $h4 -o NUL --max-time 30 $location3
          if($LASTEXITCODE -ne 0){throw 'dashboard OAuth callback failed'}
          $headers4=Get-Content $h4 -Raw
          $status4=[regex]::Match($headers4,'HTTP/\S+\s+(\d{3})').Groups[1].Value
          $location4=([regex]::Match($headers4,'(?im)^location:\s*(.+)$')).Groups[1].Value.Trim()
          if($status4 -notin @('302','303')){throw "dashboard OAuth callback returned HTTP $status4"}
          if((Get-Content $jar -Raw) -notmatch "`tkc-access`t"){throw 'authenticated dashboard session cookie missing'}

          if(-not $location4){$location4='/marketplace/tenant'}
          if($location4.StartsWith('/')){$finalUrl="https://$dashboardHost$location4"}else{$finalUrl=$location4}
          $h5=Join-Path $env:RUNNER_TEMP 'dashboard-final.headers'
          $b5=Join-Path $env:RUNNER_TEMP 'dashboard-final.html'
          & curl.exe -k -sS -c $jar -b $jar -D $h5 -o $b5 --max-time 30 $finalUrl
          if($LASTEXITCODE -ne 0){throw 'authenticated dashboard page request failed'}
          $status5=[regex]::Match((Get-Content $h5 -Raw),'HTTP/\S+\s+(\d{3})').Groups[1].Value
          if($status5 -ne '200'){throw "authenticated dashboard page returned HTTP $status5"}

          function Get-DashboardApi([string]$path,[string]$label){
            $headers=Join-Path $env:RUNNER_TEMP ($label + '.headers')
            $body=Join-Path $env:RUNNER_TEMP ($label + '.json')
            $code=(& curl.exe -k -sS -c $jar -b $jar -D $headers -o $body -w '%{http_code}' --max-time 30 "https://$dashboardHost$path" | Out-String).Trim()
            if($LASTEXITCODE -ne 0){throw "$label request failed at curl transport"}
            if($code -ne '200'){
              $safeBody=(Get-Content $body -Raw -ErrorAction SilentlyContinue)
              throw "$label expected HTTP 200, got $code body=$safeBody"
            }
            return (Get-Content $body -Raw)
          }

          $tenantRaw=Get-DashboardApi '/apis/core.cozystack.io/v1alpha1/tenantnamespaces' 'tenantnamespaces'
          $tenantObj=$tenantRaw | ConvertFrom-Json
          $tenantNames=@($tenantObj.items | ForEach-Object {$_.metadata.name})
          if('tenant-layersentry' -notin $tenantNames){throw "tenant-layersentry missing from browser TenantNamespaces response: $($tenantNames -join ',')"}

          $planRaw=Get-DashboardApi '/apis/apiextensions.k8s.io/v1/customresourcedefinitions/plans.backups.cozystack.io' 'plan-crd'
          $plan=$planRaw | ConvertFrom-Json
          $storage=@($plan.spec.versions | Where-Object {$_.storage -eq $true} | Select-Object -First 1)
          if(-not $storage.schema.openAPIV3Schema.properties.spec){throw 'Plan CRD browser response still lacks spec schema'}

          [void](Get-DashboardApi '/apis/cozystack.io/v1alpha1/applicationdefinitions' 'applicationdefinitions')
          Write-Host "BROWSER_DASHBOARD_PAGE=PASS http=200 url=$finalUrl"
          Write-Host "BROWSER_TENANTNAMESPACES_API=PASS http=200 contains=tenant-layersentry"
          Write-Host 'BROWSER_PLAN_CRD_API=PASS http=200 specSchema=true'
          Write-Host 'BROWSER_APPLICATIONDEFINITIONS_API=PASS http=200'
          Write-Host 'LAYERSENTRY_DASHBOARD_TENANT_AUTH_REPAIR=PASS'
