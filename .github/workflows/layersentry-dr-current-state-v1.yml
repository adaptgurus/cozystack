name: LayerSentry DR Current State v1

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - hack/layersentry/dr-current-state-v1-requests/*.json

permissions:
  contents: read

concurrency:
  group: layersentry-live-environment
  cancel-in-progress: false

jobs:
  inventory:
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 15
    env:
      DR_HOST: ${{ secrets.LAYERSENTRY_DR_ROCKY_HOST }}
      DR_USER: ${{ secrets.LAYERSENTRY_DR_ROCKY_USER }}
      DR_KEY: ${{ secrets.LAYERSENTRY_DR_SSH_PRIVATE_KEY }}
    steps:
      - name: Check out exact request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Capture DR state read-only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          Import-Module Hyper-V -ErrorAction Stop
          $expectedVm = 'layersentry-dr-rocky9'
          $expectedHost = '10.10.10.20'
          $expectedUser = 'root'
          $expectedDc = '10.10.10.14'
          if ($env:DR_HOST -cne $expectedHost -or $env:DR_USER -cne $expectedUser -or [string]::IsNullOrWhiteSpace($env:DR_KEY)) { throw 'DR SSH secret binding mismatch.' }

          [string[]]$changed = @(
            @(git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA -- 'hack/layersentry/dr-current-state-v1-requests/*.json') |
              ForEach-Object { [string]$_ } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )
          if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 1) { throw 'Expected exactly one DR current-state request.' }
          $request = Get-Content -LiteralPath $changed[0].Trim() -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$request.operation -cne 'INVENTORY_LAYERSENTRY_DR_CURRENT_STATE_V1' -or [string]$request.authorization -cne 'USER_AUTHORIZED_READ_ONLY_DR_CURRENT_STATE') { throw 'DR current-state authorization mismatch.' }
          if ([string]$request.vmName -cne $expectedVm -or [string]$request.host -cne $expectedHost -or [string]$request.dcManagement -cne $expectedDc) { throw 'DR current-state target mismatch.' }

          $evidence = Join-Path $env:RUNNER_TEMP "layersentry-dr-current-state-v1-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $evidence) { Remove-Item -LiteralPath $evidence -Recurse -Force }
          New-Item -Path $evidence -ItemType Directory -Force | Out-Null

          $vm = @(Get-VM -Name $expectedVm -ErrorAction SilentlyContinue)
          if ($vm.Count -ne 1) { throw "Expected exactly one Hyper-V VM named $expectedVm; found $($vm.Count)." }
          $processor = Get-VMProcessor -VMName $expectedVm -ErrorAction Stop
          $memory = Get-VMMemory -VMName $expectedVm -ErrorAction Stop
          $disks = @(
            Get-VMHardDiskDrive -VMName $expectedVm -ErrorAction Stop | ForEach-Object {
              $vhd = if ($_.Path) { Get-VHD -Path $_.Path -ErrorAction Stop } else { $null }
              [pscustomobject]@{
                ControllerType = [string]$_.ControllerType
                ControllerNumber = $_.ControllerNumber
                ControllerLocation = $_.ControllerLocation
                Path = $_.Path
                VirtualSizeGiB = if ($vhd) { [math]::Round([double]$vhd.Size / 1GB, 2) } else { $null }
                FileSizeGiB = if ($vhd) { [math]::Round([double]$vhd.FileSize / 1GB, 2) } else { $null }
                VhdFormat = if ($vhd) { [string]$vhd.VhdFormat } else { $null }
                VhdType = if ($vhd) { [string]$vhd.VhdType } else { $null }
              }
            }
          )
          [pscustomobject]@{
            Name = $vm[0].Name
            Id = [string]$vm[0].Id
            State = [string]$vm[0].State
            Generation = [int]$vm[0].Generation
            ProcessorCount = $processor.Count
            ExposeVirtualizationExtensions = [bool]$processor.ExposeVirtualizationExtensions
            StartupMemoryGiB = [math]::Round([double]$memory.Startup / 1GB, 2)
            Disks = $disks
            NetworkAdapters = @(Get-VMNetworkAdapter -VMName $expectedVm -ErrorAction Stop | Select-Object Name, SwitchName, Status, MacAddress, MacAddressSpoofing, IPAddresses)
            CheckpointCount = @(Get-VMSnapshot -VMName $expectedVm -ErrorAction SilentlyContinue).Count
          } | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $evidence 'hyperv-vm.json') -Encoding UTF8
          if ([string]$vm[0].State -cne 'Running') { throw 'Exact DR Hyper-V VM is not Running.' }
          if (-not [bool]$processor.ExposeVirtualizationExtensions) { throw 'Nested virtualization is not exposed to the DR VM.' }

          $key = Join-Path $env:RUNNER_TEMP "layersentry-dr-current-$env:GITHUB_RUN_ID.key"
          $known = Join-Path $env:RUNNER_TEMP "layersentry-dr-current-$env:GITHUB_RUN_ID.known_hosts"
          [IO.File]::WriteAllText($key, $env:DR_KEY.Replace("`r", '') + "`n", [Text.UTF8Encoding]::new($false))
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          & icacls $key /inheritance:r /grant:r "${identity}:(R)" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'SSH private-key ACL failed.' }

          $commands = @(
            'printf "DR_HOSTNAME=%s\n" "$(hostname)"',
            'if [ -r /etc/os-release ]; then . /etc/os-release; printf "DR_OS_ID=%s\nDR_OS_VERSION_ID=%s\nDR_OS_PRETTY=%s\n" "${ID:-}" "${VERSION_ID:-}" "${PRETTY_NAME:-}"; fi',
            'printf "DR_KERNEL=%s\n" "$(uname -r)"',
            'printf "DR_ARCH=%s\n" "$(uname -m)"',
            'if [ -c /dev/kvm ]; then echo KVM_DEVICE=present; else echo KVM_DEVICE=absent; fi',
            'printf "LIBVIRT_SERVICE=%s\n" "$(systemctl is-active libvirtd 2>/dev/null || true)"',
            'printf "VIRTQEMUD_SERVICE=%s\n" "$(systemctl is-active virtqemud 2>/dev/null || true)"',
            'printf "CLOUDSTACK_AGENT_SERVICE=%s\n" "$(systemctl is-active cloudstack-agent 2>/dev/null || true)"',
            'printf "CLOUDSTACK_MANAGEMENT_SERVICE=%s\n" "$(systemctl is-active cloudstack-management 2>/dev/null || true)"',
            'printf "FIREWALLD_SERVICE=%s\n" "$(systemctl is-active firewalld 2>/dev/null || true)"',
            'printf "SELINUX=%s\n" "$(getenforce 2>/dev/null || echo unknown)"',
            'printf "PKG_QEMU_KVM=%s\n" "$(rpm -q qemu-kvm 2>/dev/null || echo not-installed)"',
            'printf "PKG_LIBVIRT_DAEMON_KVM=%s\n" "$(rpm -q libvirt-daemon-kvm 2>/dev/null || echo not-installed)"',
            'printf "PKG_CLOUDSTACK_AGENT=%s\n" "$(rpm -q cloudstack-agent 2>/dev/null || echo not-installed)"',
            'printf "PKG_CLOUDSTACK_MANAGEMENT=%s\n" "$(rpm -q cloudstack-management 2>/dev/null || echo not-installed)"',
            'if [ -f /etc/cloudstack/management/db.properties ]; then echo MANAGEMENT_DB_CONFIG_PRESENT=true; else echo MANAGEMENT_DB_CONFIG_PRESENT=false; fi',
            'if [ -f /etc/cloudstack/agent/agent.properties ]; then echo AGENT_CONFIG_PRESENT=true; host=$(grep -m1 ''^host='' /etc/cloudstack/agent/agent.properties 2>/dev/null | cut -d= -f2-); printf "AGENT_HOST=%s\n" "$host"; else echo AGENT_CONFIG_PRESENT=false; echo AGENT_HOST=; fi',
            'if timeout 4 bash -c "</dev/tcp/10.10.10.14/8080" 2>/dev/null; then echo DC_8080_REACHABLE=true; else echo DC_8080_REACHABLE=false; fi',
            'if timeout 4 bash -c "</dev/tcp/10.10.10.14/8250" 2>/dev/null; then echo DC_8250_REACHABLE=true; else echo DC_8250_REACHABLE=false; fi',
            'echo ---ADDRESSES---; ip -br addr || true',
            'echo ---ROUTES---; ip route || true',
            'echo ---BRIDGES---; bridge link 2>/dev/null || true; ip -d link show type bridge 2>/dev/null || true',
            'echo ---STORAGE---; lsblk -b -o NAME,TYPE,SIZE,FSTYPE,MOUNTPOINTS,MODEL || true; df -hT || true',
            'echo ---LIBVIRT---; virsh list --all 2>/dev/null || true; virsh net-list --all 2>/dev/null || true',
            'echo ---FIREWALL---; firewall-cmd --state 2>/dev/null || true; firewall-cmd --list-all 2>/dev/null || true',
            'echo ---LISTENERS---; ss -lnt 2>/dev/null || true'
          )
          $remote = $commands -join '; '
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($remote))
          try {
            $old = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            $result = & ssh.exe -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=$known" -o LogLevel=ERROR -i $key "$expectedUser@$expectedHost" "printf '%s' '$encoded' | base64 -d | bash" 2>&1
            $rc = $LASTEXITCODE
            $ErrorActionPreference = $old
            $result | Set-Content -LiteralPath (Join-Path $evidence 'rocky-current-state.txt') -Encoding UTF8
            if ($rc -ne 0) { throw "Read-only DR SSH inventory exited $rc." }
          }
          finally {
            Remove-Item -LiteralPath $key -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $known -Force -ErrorAction SilentlyContinue
          }

          $text = Get-Content -LiteralPath (Join-Path $evidence 'rocky-current-state.txt') -Raw -Encoding UTF8
          function Get-Value([string]$name) {
            $match = [regex]::Match($text, "(?m)^$([regex]::Escape($name))=(.*)$")
            if ($match.Success) { return $match.Groups[1].Value.Trim() }
            return ''
          }
          $agentService = Get-Value 'CLOUDSTACK_AGENT_SERVICE'
          $managementService = Get-Value 'CLOUDSTACK_MANAGEMENT_SERVICE'
          $agentHost = Get-Value 'AGENT_HOST'
          $controlConflict = ($managementService -ceq 'active') -or ($agentService -ceq 'active' -and -not [string]::IsNullOrWhiteSpace($agentHost) -and $agentHost -cne $expectedDc)
          @(
            'LAYERSENTRY_DR_CURRENT_STATE_V1_COMPLETE',
            "RUN_ID=$env:GITHUB_RUN_ID",
            "COMMIT=$env:GITHUB_SHA",
            'MUTATION=false',
            "VM=$expectedVm",
            "HOST=$expectedHost",
            "KVM_DEVICE=$(Get-Value 'KVM_DEVICE')",
            "CLOUDSTACK_AGENT_SERVICE=$agentService",
            "AGENT_HOST=$agentHost",
            "CLOUDSTACK_MANAGEMENT_SERVICE=$managementService",
            "DC_8250_REACHABLE=$(Get-Value 'DC_8250_REACHABLE')",
            "POSSIBLE_CONTROL_CONFLICT=$($controlConflict.ToString().ToLowerInvariant())"
          ) | Set-Content -LiteralPath (Join-Path $evidence 'summary.txt') -Encoding UTF8

      - name: Upload DR current-state evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layersentry-dr-current-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\layersentry-dr-current-state-v1-${{ github.run_id }}-${{ github.run_attempt }}\**
          if-no-files-found: error
          retention-days: 30
