name: LayerSentry DC Console Begin Login

on:
  workflow_dispatch:
  push:
    branches: [ops/layersentry-hyperv-inventory]
    paths: [.github/workflows/layersentry-dc-console-begin-login.yml]

permissions:
  contents: read

concurrency:
  group: layersentry-live-environment
  cancel-in-progress: false

jobs:
  begin-login:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Checkout bounded username step
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Send root username only at verified DC login prompt
        shell: powershell
        run: ./hack/layersentry/invoke-dc-console-begin-login.ps1
      - name: Upload before and after console evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layersentry-dc-console-begin-login-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/layersentry-dc-begin-login-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 7
