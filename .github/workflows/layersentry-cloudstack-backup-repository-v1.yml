name: LayerSentry CloudStack Backup Repository v1

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - hack/layersentry/cloudstack-backup-repository-v1-requests/*.json

permissions:
  contents: read

concurrency:
  group: layersentry-live-environment
  cancel-in-progress: false

jobs:
  register-repository:
    name: Register exact native NAS backup repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    env:
      CLOUDSTACK_API_ENDPOINT: http://10.10.10.14:8080/client/api
      CLOUDSTACK_API_KEY: ${{ secrets.LAYERSENTRY_CLOUDSTACK_API_KEY }}
      CLOUDSTACK_SECRET_KEY: ${{ secrets.LAYERSENTRY_CLOUDSTACK_SECRET_KEY }}

    steps:
      - name: Check out exact request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Register and reconcile exact backup repository
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $expectedZoneId='929d1f2c-d629-41ed-96b4-6c48a288d056'
          $expectedZoneName='dc'
          $expectedHostId='3abb80a8-bc4a-48de-bc99-dedc5ac91bf9'
          $expectedName='layersentry-dc-backup-r0'
          $expectedAddress='10.10.10.14:/export/backup'
          $expectedType='nfs'
          $expectedProvider='nas'
          $expectedMountOpts='vers=4.2'
          $endpoint=[Uri]$env:CLOUDSTACK_API_ENDPOINT
          if([string]::IsNullOrWhiteSpace($env:CLOUDSTACK_API_KEY) -or [string]::IsNullOrWhiteSpace($env:CLOUDSTACK_SECRET_KEY)){throw 'Scoped CloudStack API credentials are unavailable.'}
          if($endpoint.AbsoluteUri -cne 'http://10.10.10.14:8080/client/api'){throw 'CloudStack endpoint binding mismatch.'}

          $evidence=Join-Path $env:RUNNER_TEMP "layersentry-backup-repository-v1-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if(Test-Path -LiteralPath $evidence){Remove-Item -LiteralPath $evidence -Recurse -Force}
          New-Item -Path $evidence -ItemType Directory -Force|Out-Null
          @('LAYERSENTRY_BACKUP_REPOSITORY_V1_STARTED',"RUN_ID=$env:GITHUB_RUN_ID","COMMIT=$env:GITHUB_SHA","ZONE_ID=$expectedZoneId","NAME=$expectedName","ADDRESS=$expectedAddress")|Set-Content -LiteralPath (Join-Path $evidence 'started.txt') -Encoding UTF8

          [string[]]$changed=@(@(git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA -- 'hack/layersentry/cloudstack-backup-repository-v1-requests/*.json')|ForEach-Object{[string]$_}|Where-Object{-not [string]::IsNullOrWhiteSpace($_)})
          if($LASTEXITCODE -ne 0 -or $changed.Count -ne 1){throw 'Expected exactly one backup repository request.'}
          $request=Get-Content -LiteralPath $changed[0].Trim() -Raw -Encoding UTF8|ConvertFrom-Json
          if([string]$request.operation -cne 'REGISTER_LAYERSENTRY_NAS_BACKUP_REPOSITORY_V1' -or [string]$request.authorization -cne 'USER_AUTHORIZED_DISPOSABLE_LAB_BACKUP_REPOSITORY'){throw 'Backup repository request authorization mismatch.'}
          if([string]$request.zoneId -cne $expectedZoneId -or [string]$request.name -cne $expectedName -or [string]$request.address -cne $expectedAddress -or [string]$request.type -cne $expectedType -or [string]$request.provider -cne $expectedProvider -or [string]$request.mountopts -cne $expectedMountOpts -or [bool]$request.crossZoneInstanceCreation){throw 'Backup repository request binding mismatch.'}

          function Enc([string]$v){return [Uri]::EscapeDataString($v).Replace('%7E','~')}
          function Invoke-CS([string]$command,[hashtable]$parameters=@{}){
            $allowed=@('listZones','listHosts','listConfigurations','listBackupProviders','listBackupRepositories','addBackupRepository')
            if($command -notin $allowed){throw "Command not allow-listed: $command"}
            $q=[ordered]@{apikey=$env:CLOUDSTACK_API_KEY;command=$command;response='json'}
            foreach($n in $parameters.Keys){$q[[string]$n]=[string]$parameters[$n]}
            $pairs=@($q.GetEnumerator()|Sort-Object{([string]$_.Key).ToLowerInvariant()}|ForEach-Object{'{0}={1}' -f (Enc([string]$_.Key)),(Enc([string]$_.Value))})
            $canonical=(($pairs -join '&').ToLowerInvariant())
            $h=New-Object System.Security.Cryptography.HMACSHA1
            try{$h.Key=[Text.Encoding]::UTF8.GetBytes($env:CLOUDSTACK_SECRET_KEY);$sig=[Convert]::ToBase64String($h.ComputeHash([Text.Encoding]::UTF8.GetBytes($canonical)))}finally{$h.Dispose()}
            $uri='{0}?{1}&signature={2}' -f $endpoint.AbsoluteUri,($pairs -join '&'),(Enc $sig)
            return Invoke-RestMethod -Uri $uri -Method Get -TimeoutSec 45 -MaximumRedirection 0 -ErrorAction Stop
          }
          function Payload([object]$r,[string]$c){$n="$($c.ToLowerInvariant())response";$p=$r.PSObject.Properties[$n];if($null -eq $p){throw "Missing response payload $n"};return $p.Value}
          function Rows([object]$p,[string]$n){$x=$p.PSObject.Properties[$n];if($null -eq $x -or $null -eq $x.Value){return @()};return @($x.Value|Where-Object{$null -ne $_})}
          function Config([string]$name,[string]$zone=''){$a=@{name=$name;listall='true'};if($zone){$a.zoneid=$zone};$r=@(Rows (Payload (Invoke-CS 'listConfigurations' $a) 'listConfigurations') 'configuration'|Where-Object{[string]$_.name -ceq $name});if($r.Count -ne 1){throw "Configuration $name not unique"};return [string]$r[0].value}
          function Get-Repositories(){return @(Rows (Payload (Invoke-CS 'listBackupRepositories' @{zoneid=$expectedZoneId;page='1';pagesize='100'}) 'listBackupRepositories') 'backuprepository'|Where-Object{$null -ne $_ -and $null -ne $_.PSObject.Properties['id'] -and $null -ne $_.PSObject.Properties['name']})}
          function Find-Exact([object[]]$rows){return @($rows|Where-Object{$null -ne $_ -and $null -ne $_.PSObject.Properties['name'] -and $null -ne $_.PSObject.Properties['address'] -and $null -ne $_.PSObject.Properties['zoneid'] -and [string]$_.name -ceq $expectedName -and [string]$_.address -ceq $expectedAddress -and [string]$_.zoneid -ceq $expectedZoneId})}

          $zones=@(Rows (Payload (Invoke-CS 'listZones' @{id=$expectedZoneId;listall='true'}) 'listZones') 'zone')
          if($zones.Count -ne 1 -or [string]$zones[0].name -cne $expectedZoneName -or [string]$zones[0].allocationstate -cne 'Enabled'){throw 'Exact DC Zone is not Enabled.'}
          $hosts=@(Rows (Payload (Invoke-CS 'listHosts' @{id=$expectedHostId;listall='true'}) 'listHosts') 'host')
          if($hosts.Count -ne 1 -or [string]$hosts[0].state -cne 'Up' -or [string]$hosts[0].resourcestate -cne 'Enabled'){throw 'Exact KVM host is not Up/Enabled.'}
          if((Config 'backup.framework.enabled') -cne 'true' -or (Config 'backup.framework.enabled' $expectedZoneId) -cne 'true' -or (Config 'backup.framework.provider.plugin') -cne 'nas'){throw 'NAS B&R framework is not reconciled.'}
          $providers=@(Rows (Payload (Invoke-CS 'listBackupProviders') 'listBackupProviders') 'providers')
          if(@($providers|Where-Object{[string]$_.name -ceq 'nas'}).Count -ne 1){throw 'NAS backup provider is not uniquely available.'}

          $before=@(Get-Repositories)
          $before|ConvertTo-Json -Depth 8|Set-Content -LiteralPath (Join-Path $evidence 'repositories-pre.json') -Encoding UTF8
          $exact=@(Find-Exact $before)
          $mutationSubmitted=$false
          if($exact.Count -eq 0){
            if($before.Count -gt 0){throw 'A different backup repository already exists in the DC Zone; refusing to create a duplicate/competing repository.'}
            $mutationSubmitted=$true
            try{
              $response=Invoke-CS 'addBackupRepository' @{name=$expectedName;address=$expectedAddress;type=$expectedType;zoneid=$expectedZoneId;provider=$expectedProvider;mountopts=$expectedMountOpts;crosszoneinstancecreation='false'}
              $response|ConvertTo-Json -Depth 10|Set-Content -LiteralPath (Join-Path $evidence 'add-response.json') -Encoding UTF8
            }catch{
              $_.Exception.Message|Set-Content -LiteralPath (Join-Path $evidence 'add-error.txt') -Encoding UTF8
              Start-Sleep -Seconds 2
            }
            $exact=@(Find-Exact @(Get-Repositories))
            if($exact.Count -ne 1){throw 'Backup repository mutation was submitted but exact repository did not reconcile uniquely; do not retry without fresh state reconciliation.'}
          }elseif($exact.Count -ne 1){throw 'Exact backup repository is not unique.'}

          $after=@(Get-Repositories)
          $after|ConvertTo-Json -Depth 8|Set-Content -LiteralPath (Join-Path $evidence 'repositories-post.json') -Encoding UTF8
          $exact=@(Find-Exact $after)
          if($exact.Count -ne 1){throw 'Exact backup repository missing after reconciliation.'}
          $repo=$exact[0]
          if([string]$repo.type -cne $expectedType -or [string]$repo.provider -cne $expectedProvider -or [bool]$repo.crosszoneinstancecreation){throw 'Backup repository properties mismatch after reconciliation.'}
          @('LAYERSENTRY_BACKUP_REPOSITORY_V1_COMPLETE',"RUN_ID=$env:GITHUB_RUN_ID","COMMIT=$env:GITHUB_SHA","MUTATION_SUBMITTED=$mutationSubmitted","REPOSITORY_ID=$($repo.id)","NAME=$($repo.name)","ADDRESS=$($repo.address)","TYPE=$($repo.type)","PROVIDER=$($repo.provider)","ZONE_ID=$($repo.zoneid)","CROSS_ZONE=$($repo.crosszoneinstancecreation)")|Set-Content -LiteralPath (Join-Path $evidence 'summary.txt') -Encoding UTF8

      - name: Upload backup repository evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layersentry-backup-repository-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\layersentry-backup-repository-v1-${{ github.run_id }}-${{ github.run_attempt }}\**
          if-no-files-found: error
          retention-days: 30
