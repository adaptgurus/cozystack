name: One-shot HCI default image read-only probe

on:
  push:
    branches:
      - feat/hci-virtualization-v1.6.2-test
    paths:
      - .github/workflows/hci-default-image-probe-once.yml

permissions:
  contents: read

defaults:
  run:
    shell: powershell

jobs:
  probe:
    name: Probe default image contract on TESTSER
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Capture read-only default image inventory
        run: |
          $ErrorActionPreference = 'Stop'
          $kubectl = 'C:\hci-tools\kubectl.exe'
          $env:KUBECONFIG = 'C:\hci-state\cozystack-hci-lab\kubeconfig'
          if (-not (Test-Path $kubectl)) { throw "kubectl missing: $kubectl" }
          if (-not (Test-Path $env:KUBECONFIG)) { throw "kubeconfig missing: $env:KUBECONFIG" }

          $evidence = Join-Path $env:RUNNER_TEMP 'default-image-probe'
          Remove-Item -Recurse -Force $evidence -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null

          function Invoke-KubectlCaptured {
            param([Parameter(Mandatory=$true)][string[]]$KubectlArgs)
            $previousPreference = $ErrorActionPreference
            try {
              # Native tools may emit diagnostics to stderr while still returning exit code 0.
              # Judge kubectl by its native exit code and preserve combined output for evidence.
              $ErrorActionPreference = 'Continue'
              $output = & $kubectl @KubectlArgs 2>&1
              $code = $LASTEXITCODE
            }
            finally {
              $ErrorActionPreference = $previousPreference
            }
            return [pscustomobject]@{ Output = @($output); ExitCode = $code }
          }

          function Capture {
            param(
              [Parameter(Mandatory=$true)][string]$Name,
              [Parameter(Mandatory=$true)][string[]]$KubectlArgs,
              [switch]$AllowFailure
            )
            $path = Join-Path $evidence $Name
            "# kubectl $($KubectlArgs -join ' ')" | Set-Content -Path $path -Encoding utf8
            $result = Invoke-KubectlCaptured -KubectlArgs $KubectlArgs
            $result.Output | Tee-Object -FilePath $path -Append
            "`n# exit=$($result.ExitCode)" | Add-Content -Path $path -Encoding utf8
            if ($result.ExitCode -ne 0 -and -not $AllowFailure) {
              throw "kubectl $($KubectlArgs -join ' ') failed: $($result.ExitCode)"
            }
            return @($result.Output)
          }

          Capture -Name '00-nodes.txt' -KubectlArgs @('get','nodes','-o','wide') | Out-Null
          Capture -Name '01-namespaces.txt' -KubectlArgs @('get','ns','cozy-public','-o','wide') | Out-Null
          Capture -Name '02-public-pvc.txt' -KubectlArgs @('get','pvc','-n','cozy-public','-o','wide') -AllowFailure | Out-Null
          Capture -Name '03-public-dv.txt' -KubectlArgs @('get','datavolumes.cdi.kubevirt.io','-n','cozy-public','-o','wide') -AllowFailure | Out-Null
          Capture -Name '04-public-pods.txt' -KubectlArgs @('get','pods','-n','cozy-public','-o','wide') -AllowFailure | Out-Null
          Capture -Name '05-public-events.txt' -KubectlArgs @('get','events','-n','cozy-public','--sort-by=.lastTimestamp') -AllowFailure | Out-Null
          Capture -Name '06-helmreleases.txt' -KubectlArgs @('get','helmreleases.helm.toolkit.fluxcd.io','-A','-o','wide') -AllowFailure | Out-Null
          Capture -Name '07-packages.txt' -KubectlArgs @('get','packages.cozystack.io','-A','-o','wide') -AllowFailure | Out-Null
          Capture -Name '08-packagesources.txt' -KubectlArgs @('get','packagesources.cozystack.io','-A','-o','wide') -AllowFailure | Out-Null
          Capture -Name '09-app-api-resources.txt' -KubectlArgs @('api-resources','--api-group=apps.cozystack.io','-o','wide') -AllowFailure | Out-Null
          Capture -Name '10-app-api-discovery.txt' -KubectlArgs @('get','--raw','/apis/apps.cozystack.io/v1alpha1') -AllowFailure | Out-Null
          Capture -Name '11-all-public.txt' -KubectlArgs @('get','all','-n','cozy-public','-o','wide') -AllowFailure | Out-Null

          $apiResult = Invoke-KubectlCaptured -KubectlArgs @('api-resources','--verbs=list','--namespaced=true','-o','name')
          if ($apiResult.ExitCode -ne 0) { throw 'api-resources discovery failed' }
          $candidates = @($apiResult.Output | Where-Object { $_ -match '(?i)(image|disk|virtualmachine|vm)' } | Sort-Object -Unique)
          $candidatePath = Join-Path $evidence '12-image-related-api-resources.txt'
          $candidates | Set-Content $candidatePath -Encoding utf8
          foreach ($resource in $candidates) {
            if ($resource -match '(?i)secret|configmap') { continue }
            $safe = ($resource -replace '[^A-Za-z0-9_.-]','_')
            Capture -Name ("resource-$safe.txt") -KubectlArgs @('get',$resource,'-n','cozy-public','-o','wide') -AllowFailure | Out-Null
          }

          $hrResult = Invoke-KubectlCaptured -KubectlArgs @('get','helmreleases.helm.toolkit.fluxcd.io','-A','-o','custom-columns=NS:.metadata.namespace,NAME:.metadata.name','--no-headers')
          if ($hrResult.ExitCode -ne 0) { throw 'HelmRelease inventory failed' }
          foreach ($line in @($hrResult.Output | Where-Object { $_ -match '(?i)(vm.*image|image.*vm|default.*image)' })) {
            $parts = @($line -split '\s+' | Where-Object { $_ })
            if ($parts.Count -ge 2) {
              Capture -Name ("helmrelease-$($parts[0])-$($parts[1]).txt") -KubectlArgs @('describe','helmrelease.helm.toolkit.fluxcd.io',$parts[1],'-n',$parts[0]) -AllowFailure | Out-Null
            }
          }

          $pkgResult = Invoke-KubectlCaptured -KubectlArgs @('get','packages.cozystack.io','-A','-o','custom-columns=NS:.metadata.namespace,NAME:.metadata.name','--no-headers')
          if ($pkgResult.ExitCode -ne 0) { throw 'Package inventory failed' }
          foreach ($line in @($pkgResult.Output | Where-Object { $_ -match '(?i)(vm.*image|image.*vm|default.*image)' })) {
            $parts = @($line -split '\s+' | Where-Object { $_ })
            if ($parts.Count -ge 2) {
              Capture -Name ("package-$($parts[0])-$($parts[1]).txt") -KubectlArgs @('get','packages.cozystack.io',$parts[1],'-n',$parts[0],'-o','yaml') -AllowFailure | Out-Null
            }
          }

          Write-Host "Read-only default image probe complete. Evidence=$evidence"

      - name: Upload read-only probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: default-image-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\default-image-probe
          if-no-files-found: warn
          retention-days: 30
