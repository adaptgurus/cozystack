name: HCI Linux VM Product Live

on:
  workflow_dispatch:
  push:
    branches:
      - feat/hci-virtualization-v1.6.2-test
    paths:
      - hack/hci-live/test-linux-vm-product-live.ps1
      - .github/workflows/hci-linux-vm-product-live.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: hci-linux-vm-product-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-vm-live:
    name: Linux VM product lifecycle live proof
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Fetch and parse exact current-SHA Linux VM proof
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'adaptgurus/cozystack') { throw "Unexpected repository: $env:GITHUB_REPOSITORY" }
          if ($env:GITHUB_REF_NAME -ne 'feat/hci-virtualization-v1.6.2-test') { throw "Unexpected branch: $env:GITHUB_REF_NAME" }
          if ($env:GITHUB_SHA -notmatch '^[0-9a-f]{40}$') { throw "Invalid SHA: $env:GITHUB_SHA" }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $repoPath = 'hack/hci-live/test-linux-vm-product-live.ps1'
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$repoPath`?ref=$env:GITHUB_SHA"
          $file = Invoke-RestMethod -Headers $headers -Uri $uri
          if ($file.type -ne 'file' -or -not $file.content) { throw "Exact-SHA fetch failed for $repoPath" }
          $bytes = [Convert]::FromBase64String(([string]$file.content -replace '\s',''))
          $scriptPath = Join-Path $env:RUNNER_TEMP "test-linux-vm-product-live-$env:GITHUB_SHA.ps1"
          [IO.File]::WriteAllBytes($scriptPath,$bytes)

          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($scriptPath,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error "$($_.Extent.StartLineNumber):$($_.Extent.StartColumnNumber) $($_.Message)" }
            throw "PowerShell parser found $($errors.Count) error(s)"
          }
          "HCI_LINUX_VM_PROOF=$scriptPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Exact-SHA Linux VM proof parsed: sha256=$((Get-FileHash -Algorithm SHA256 $scriptPath).Hash.ToLowerInvariant())"

      - name: Wait for exact current-SHA HCI gate
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $deadline = (Get-Date).AddMinutes(30)
          do {
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/hci-v1.6.2-gate.yml/runs?branch=$env:GITHUB_REF_NAME&event=push&per_page=50"
            $runs = Invoke-RestMethod -Headers $headers -Uri $uri
            $run = @($runs.workflow_runs | Where-Object { $_.head_sha -eq $env:GITHUB_SHA } | Sort-Object run_number -Descending | Select-Object -First 1)
            if ($run.Count -gt 0) {
              $r = $run[0]
              Write-Host "HCI current-SHA run=$($r.id) status=$($r.status) conclusion=$($r.conclusion)"
              if ($r.name -ne 'HCI v1.6.2 Gate') { throw "Unexpected workflow name: $($r.name)" }
              if ($r.status -eq 'completed') {
                if ($r.conclusion -ne 'success') { throw "HCI gate failed for current SHA: $($r.conclusion)" }
                exit 0
              }
            }
            Start-Sleep -Seconds 10
          } while ((Get-Date) -lt $deadline)
          throw "Timed out waiting for exact current-SHA HCI gate"

      - name: Execute fail-closed Linux VM product lifecycle proof
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $env:HCI_LINUX_VM_PROOF
          if ($LASTEXITCODE -ne 0) { throw "Linux VM product lifecycle proof failed with exit code $LASTEXITCODE" }

      - name: Upload sanitized Linux VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hci-linux-vm-product-${{ github.run_id }}-${{ github.run_attempt }}
          path: C:\hci-diagnostics\linux-vm-product-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
