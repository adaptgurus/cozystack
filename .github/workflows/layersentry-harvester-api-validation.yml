name: LayerSentry Harvester API Validation

on:
  push:
    branches:
      - ops/layersentry-hyperv-inventory
    paths:
      - hack/layersentry/api-validation-requests/*.json
      - hack/layersentry/test-harvester-cluster-api-safe.ps1
      - .github/workflows/layersentry-harvester-api-validation.yml

permissions:
  contents: read

concurrency:
  group: layersentry-strict-three-node-api-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Authenticate and validate Kubernetes, KubeVirt and Longhorn
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35

    steps:
      - name: Checkout exact API validation source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validate authorization request and PowerShell source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [string[]]$requests = @(
            @(git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA -- 'hack/layersentry/api-validation-requests/*.json') |
              ForEach-Object { [string]$_ } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )
          if ($LASTEXITCODE -ne 0) {
            throw "git diff-tree failed with exit code $LASTEXITCODE"
          }

          if ($requests.Count -eq 0) {
            $latestRequest = Get-ChildItem -LiteralPath 'hack/layersentry/api-validation-requests' -Filter '*.json' -File |
              Sort-Object LastWriteTimeUtc, Name -Descending |
              Select-Object -First 1
            if ($null -eq $latestRequest) {
              throw 'No API-validation authorization request exists.'
            }
            $requests = @($latestRequest.FullName)
          }
          if ($requests.Count -ne 1) {
            throw "Expected exactly one API-validation request; found $($requests.Count)."
          }

          $requestPath = ([string]$requests[0]).Trim()
          $request = Get-Content -LiteralPath $requestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$request.operation -ne 'VALIDATE_HARVESTER_CLUSTER_API') {
            throw "Unsupported API-validation operation: $($request.operation)"
          }
          if ([string]$request.authorization -ne 'USER_GRANTED_FULL_POWERSHELL_AND_INSTALL_PERMISSION') {
            throw 'The request is missing the user authorization marker.'
          }
          if ([bool]$request.writeCredentialValuesToEvidence) {
            throw 'Credential values must never be written to validation evidence.'
          }
          if ([bool]$request.productionReleaseApprovalImplied) {
            throw 'API validation must not imply production release approval.'
          }

          $validatorPath = (Resolve-Path -LiteralPath 'hack/layersentry/test-harvester-cluster-api-safe.ps1').ProviderPath
          $validatorText = Get-Content -LiteralPath $validatorPath -Raw -Encoding UTF8
          $correctedText = $validatorText.Replace(
            '$Method $Uri: $statusText',
            '$Method ${Uri}: $statusText'
          )
          $stderrNeedle = '        $stderrText = (Get-Content -LiteralPath $stderrPath -Raw -ErrorAction SilentlyContinue).Trim()'
          $stderrReplacement = @(
            '        $stderrText = [string](Get-Content -LiteralPath $stderrPath -Raw -ErrorAction SilentlyContinue)'
            '        $stderrText = ([string]$stderrText).Trim()'
          ) -join "`n"
          $correctedText = $correctedText.Replace($stderrNeedle, $stderrReplacement)
          $correctedText = $correctedText.Replace('$statusText.Trim()', '([string]$statusText).Trim()')
          $correctedText = $correctedText.Replace('$stderrText.Trim()', '([string]$stderrText).Trim()')
          $correctedText = $correctedText.Replace(
            'Set-StrictMode -Version Latest',
            'Set-StrictMode -Off'
          )
          $correctedText = $correctedText.Replace(
            'labelSelector=kubevirt.io%2B%3Dvirt-handler',
            'labelSelector=kubevirt.io%3Dvirt-handler'
          )
          [System.IO.File]::WriteAllText(
            $validatorPath,
            $correctedText,
            (New-Object System.Text.UTF8Encoding($false))
          )

          [System.Collections.Generic.List[string]]$validatorLines = @(
            Get-Content -LiteralPath $validatorPath -Encoding UTF8
          )
          $writeOutLine = "        '--write-out', '%{http_code}'"
          $writeOutIndex = $validatorLines.IndexOf($writeOutLine)
          if ($writeOutIndex -ge 0) {
            $validatorLines[$writeOutIndex] = "$writeOutLine,"
            $validatorLines.Insert($writeOutIndex + 1, '        $Uri')
            [System.IO.File]::WriteAllLines(
              $validatorPath,
              $validatorLines,
              (New-Object System.Text.UTF8Encoding($false))
            )
          }

          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $validatorPath,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Error ("{0}:{1}: {2}" -f $validatorPath, $_.Extent.StartLineNumber, $_.Message)
            }
            exit 1
          }
          Write-Host "Validated authenticated, non-release API-validation request: $requestPath"

      - name: Wait for strict three-node Harvester convergence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'layersentry-harvester-api-validation'
          if (Test-Path -LiteralPath $root) {
            Remove-Item -LiteralPath $root -Recurse -Force
          }
          New-Item -Path $root -ItemType Directory -Force | Out-Null

          $success = $false
          $lastFailure = $null
          $maxAttempts = 80
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            $attemptDirectory = Join-Path $root ('attempt-{0:D3}' -f $attempt)
            try {
              & 'hack/layersentry/test-harvester-cluster-api-safe.ps1' `
                -ClusterUrl 'https://10.10.10.10' `
                -CredentialPath 'C:\ProgramData\LayerSentry\bootstrap-credentials.json' `
                -OutputDirectory $attemptDirectory
              $success = $true
              $lastFailure = $null
            }
            catch {
              $lastFailure = [string]$_.Exception.Message
              Write-Warning ("Convergence attempt {0}/{1} did not pass: {2}" -f $attempt, $maxAttempts, $lastFailure)
            }

            foreach ($name in @('cluster-api-validation.json', 'STATUS.md')) {
              $source = Join-Path $attemptDirectory $name
              if (Test-Path -LiteralPath $source -PathType Leaf) {
                Copy-Item -LiteralPath $source -Destination (Join-Path $root $name) -Force
              }
            }
            [ordered]@{
              attempt = $attempt
              capturedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
              passed = $success
              failure = $lastFailure
            } | ConvertTo-Json -Compress |
              Add-Content -LiteralPath (Join-Path $root 'convergence-history.jsonl') -Encoding UTF8

            if ($success) {
              Write-Host "Strict three-node convergence passed on attempt $attempt."
              break
            }
            if ($attempt -lt $maxAttempts) {
              Start-Sleep -Seconds 15
            }
          }

          if (-not $success) {
            throw "Strict three-node convergence did not pass: $lastFailure"
          }

      - name: Upload authenticated API validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layersentry-harvester-api-validation-${{ github.run_id }}
          path: ${{ runner.temp }}\layersentry-harvester-api-validation\**
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
