name: LayerSentry Dashboard Password Reset

on:
  workflow_dispatch:
  push:
    branches:
      - layersentry-platform
    paths:
      - .github/workflows/layersentry-dashboard-password-reset.yml

permissions:
  contents: read

defaults:
  run:
    shell: powershell

jobs:
  reset-dashboard-admin:
    name: Reset and validate dashboard administrator
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    env:
      KUBECONFIG: C:\hci-state\cozystack-hci-lab\kubeconfig
      KUBECTL: C:\hci-tools\kubectl.exe
      GUI_USERNAME: layersentry-admin
      GUI_USER_RESOURCE: layersentry-gui-admin
      GUI_PASSWORD_SECRET: layersentry-gui-admin-password
      GUI_USER_NAMESPACE: cozy-system
    steps:
      - name: Rotate LayerSentry admin password
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($hr in @('keycloak-operator','keycloak','keycloak-configure')) {
            & $env:KUBECTL wait --for=condition=Ready "helmrelease/$hr" -n cozy-keycloak --timeout=120s
            if ($LASTEXITCODE -ne 0) { throw "Keycloak HelmRelease $hr is not Ready" }
          }

          $group = (& $env:KUBECTL get keycloakrealmgroups.v1.edp.epam.com cozystack-cluster-admin -n cozy-system -o json | ConvertFrom-Json)
          if ($group.status.value -ne 'OK') { throw "cozystack-cluster-admin group status is $($group.status.value)" }

          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $bytes = New-Object byte[] 24
          $rng.GetBytes($bytes)
          $alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789'
          $builder = New-Object System.Text.StringBuilder
          foreach ($b in $bytes) { [void]$builder.Append($alphabet[$b % $alphabet.Length]) }
          $password = 'Ls9!' + $builder.ToString()
          Write-Output "::add-mask::$password"

          $secretObject = [ordered]@{
            apiVersion = 'v1'
            kind = 'Secret'
            metadata = [ordered]@{
              name = $env:GUI_PASSWORD_SECRET
              namespace = $env:GUI_USER_NAMESPACE
              labels = [ordered]@{
                'app.kubernetes.io/managed-by' = 'layersentry-live-certification'
                'layersentry.io/purpose' = 'dashboard-keycloak-login'
              }
            }
            type = 'Opaque'
            stringData = [ordered]@{ password = $password }
          }
          $secretFile = Join-Path $env:RUNNER_TEMP 'layersentry-dashboard-admin-secret.json'
          $secretObject | ConvertTo-Json -Depth 20 | Set-Content -Path $secretFile -Encoding UTF8
          & $env:KUBECTL apply -f $secretFile | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'failed to rotate dashboard admin Secret' }
          $secretRv = (& $env:KUBECTL get secret $env:GUI_PASSWORD_SECRET -n $env:GUI_USER_NAMESPACE -o jsonpath='{.metadata.resourceVersion}' | Out-String).Trim()

          $userObject = [ordered]@{
            apiVersion = 'v1.edp.epam.com/v1'
            kind = 'KeycloakRealmUser'
            metadata = [ordered]@{
              name = $env:GUI_USER_RESOURCE
              namespace = $env:GUI_USER_NAMESPACE
              labels = [ordered]@{
                'app.kubernetes.io/managed-by' = 'layersentry-live-certification'
                'layersentry.io/purpose' = 'dashboard-keycloak-login'
              }
              annotations = [ordered]@{
                'layersentry.io/password-rotation' = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds().ToString()
              }
            }
            spec = [ordered]@{
              username = $env:GUI_USERNAME
              firstName = 'LayerSentry'
              lastName = 'Administrator'
              email = 'layersentry-admin@example.invalid'
              enabled = $true
              emailVerified = $true
              groups = @('cozystack-cluster-admin')
              realmRef = [ordered]@{ kind = 'ClusterKeycloakRealm'; name = 'keycloakrealm-cozy' }
              passwordSecret = [ordered]@{ name = $env:GUI_PASSWORD_SECRET; key = 'password'; temporary = $false }
              requiredUserActions = @()
            }
          }
          $userFile = Join-Path $env:RUNNER_TEMP 'layersentry-dashboard-admin-user.json'
          $userObject | ConvertTo-Json -Depth 20 | Set-Content -Path $userFile -Encoding UTF8
          & $env:KUBECTL apply -f $userFile | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'failed to apply KeycloakRealmUser' }

          $deadline = (Get-Date).AddMinutes(3)
          do {
            $user = (& $env:KUBECTL get keycloakrealmusers.v1.edp.epam.com $env:GUI_USER_RESOURCE -n $env:GUI_USER_NAMESPACE -o json | ConvertFrom-Json)
            $failures = 0
            if ($null -ne $user.status.failureCount) { $failures = [int]$user.status.failureCount }
            $syncedRv = [string]$user.status.lastSyncedPasswordSecretVersion
            if (($user.status.value -eq 'OK') -and ($failures -eq 0) -and ($syncedRv -eq $secretRv)) { break }
            if ($failures -gt 0) { throw "KeycloakRealmUser operator failureCount=$failures status=$($user.status.value)" }
            Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)
          if (($user.status.value -ne 'OK') -or ([string]$user.status.lastSyncedPasswordSecretVersion -ne $secretRv)) {
            throw "KeycloakRealmUser did not reconcile the new password"
          }

          $passwordB64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($password))
          Write-Output "::add-mask::$passwordB64"
          "GUI_PASSWORD_B64=$passwordB64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PASSWORD_ROTATION=PASS username=$env:GUI_USERNAME realm=cozy group=cozystack-cluster-admin"

      - name: Validate credential against Keycloak
        run: |
          $ErrorActionPreference = 'Stop'
          $password = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:GUI_PASSWORD_B64))
          Write-Output "::add-mask::$password"
          Write-Output "::add-mask::$env:GUI_PASSWORD_B64"

          $clientSecretB64 = (& $env:KUBECTL get secret linstor-gui-client -n cozy-linstor -o jsonpath='{.data.client-secret-key}' | Out-String).Trim()
          if (-not $clientSecretB64) { throw 'linstor-gui client secret key is absent' }
          Write-Output "::add-mask::$clientSecretB64"
          $clientSecret = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($clientSecretB64))
          Write-Output "::add-mask::$clientSecret"

          $keycloakIngress = (& $env:KUBECTL get ingress -n cozy-keycloak -o json | ConvertFrom-Json).items | Where-Object { $_.spec.rules[0].host -like 'keycloak.*' } | Select-Object -First 1
          if (-not $keycloakIngress) { throw 'Keycloak ingress was not found' }
          $tokenUrl = "https://$($keycloakIngress.spec.rules[0].host)/realms/cozy/protocol/openid-connect/token"
          $tokenFile = Join-Path $env:RUNNER_TEMP 'layersentry-dashboard-admin-token.json'
          $httpCode = (& curl.exe -k -sS -o $tokenFile -w '%{http_code}' -X POST $tokenUrl --data-urlencode 'grant_type=password' --data-urlencode 'client_id=linstor-gui' --data-urlencode "client_secret=$clientSecret" --data-urlencode "username=$env:GUI_USERNAME" --data-urlencode "password=$password" | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Keycloak token endpoint request failed' }
          $tokenResponse = Get-Content $tokenFile -Raw | ConvertFrom-Json
          if ($httpCode -ne '200' -or -not $tokenResponse.access_token) {
            throw "Keycloak credential validation failed: HTTP $httpCode error=$($tokenResponse.error) description=$($tokenResponse.error_description)"
          }

          $jwtParts = $tokenResponse.access_token.Split('.')
          $payload = $jwtParts[1].Replace('-','+').Replace('_','/')
          switch ($payload.Length % 4) { 2 { $payload += '==' }; 3 { $payload += '=' } }
          $claims = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($payload)) | ConvertFrom-Json
          if ($claims.preferred_username -ne $env:GUI_USERNAME) { throw 'validated token username mismatch' }
          if ('cozystack-cluster-admin' -notin @($claims.groups)) { throw 'validated token is missing cozystack-cluster-admin group' }
          Write-Host "KEYCLOAK_LOGIN=PASS username=$env:GUI_USERNAME tokenHttp=200 group=cozystack-cluster-admin"

      - name: Return credential encrypted to this session
        if: success()
        run: |
          $ErrorActionPreference = 'Stop'
          $password = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:GUI_PASSWORD_B64))
          Write-Output "::add-mask::$password"
          Write-Output "::add-mask::$env:GUI_PASSWORD_B64"
          $publicKeyXml = '<RSAKeyValue><Modulus></Modulus><Exponent>AQAB</Exponent></RSAKeyValue>'
          $rsa = New-Object System.Security.Cryptography.RSACryptoServiceProvider 2048
          $rsa.FromXmlString($publicKeyXml)
          $cipher = $rsa.Encrypt([Text.Encoding]::UTF8.GetBytes($password), $true)
          $cipherB64 = [Convert]::ToBase64String($cipher)
          Write-Host "LAYERSENTRY_CREDENTIAL_CIPHERTEXT=$cipherB64"
          Write-Host "LAYERSENTRY_CREDENTIAL_METADATA username=$env:GUI_USERNAME realm=cozy group=cozystack-cluster-admin"
